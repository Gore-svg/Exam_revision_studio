om loses two electrons to form Ca²⁺. Two Cl atoms gain one electron each to form two Cl⁻ ions. Electrostatic attraction holds the oppositely charged ions together.", "m": 5, "criteria": [["CaCl₂ formula", "\\bcacl2\\b"], ["Both charges", "(?=.*\\bca\\s*(?:2\\+|\\+2))(?=.*\\bcl\\s*(?:1?-|-1))"], ["Two electrons lost by calcium", "(?:calcium|ca).{0,25}(?:loses|gives|transfers).{0,12}(?:two|2) electron"], ["One electron gained by each chlorine atom", "(?:each|two|2).{0,24}(?:chlorine|cl).{0,30}(?:gain|receive|accept).{0,12}(?:one|1) electron|(?:chlorine|cl).{0,30}(?:gain|receive|accept).{0,12}(?:one|1) electron.{0,8}each"], ["Electrostatic attraction of opposite ions", "electrostatic attraction.{0,50}(?:opposite|positive.{0,12}negative).{0,14}ion"]], "bad": []}, {"q": "A reaction reaches the same final gas volume with and without a catalyst. Explain why it can still be faster with a catalyst.", "a": "A catalyst provides a pathway with lower activation energy, so more successful collisions occur per unit time. The same amount of limiting reactant gives the same total gas volume.", "m": 3, "criteria": [["Lower activation energy pathway", "(?:lower|reduces|decreases).{0,16}activation energy"], ["More successful collisions per time", "more (?:frequent )?successful collisions|more collisions.{0,24}(?:per second|per unit time)"], ["Same limiting reactant determines yield", "(?:same|equal).{0,25}limiting reactant|limiting reactant.{0,35}(?:same|unchanged|yield)"]], "bad": []}]}, {"name": "Mixed formats · Science skills", "questions": [{"q": "Matter and particles\nDefine matter.", "a": "Matter has mass and occupies space.", "m": 1}, {"q": "Symbols and atomic number\nWhat does atomic number count?", "a": "Protons in the nucleus.", "m": 1}, {"q": "Atomic structure\nName the particles found in the atomic nucleus.", "a": "Protons and neutrons, except that the most common hydrogen nucleus has just one proton.", "m": 1}, {"q": "Rearrangement of atoms\nWhat is a reactant?", "a": "A starting substance consumed in a chemical reaction.", "m": 1}, {"q": "Conservation of mass\nWhat is conserved during a chemical reaction in a closed system?", "a": "Total mass.", "m": 1}, {"q": "Ionic bonding\nWhat is an ionic bond?", "a": "Electrostatic attraction between oppositely charged ions.", "m": 1}, {"q": "Ionic names and formulas\nWrite the formula for lithium chloride from Li⁺ and Cl⁻.", "a": "LiCl. The charges cancel in a 1:1 ratio.", "m": 1}, {"q": "Covalent bonding\nWhat is a covalent bond in a dot-and-cross model?", "a": "A shared pair of electrons between two atoms.", "m": 1}, {"q": "Covalent names and formulas\nName CO.", "a": "Carbon monoxide.", "m": 1}, {"q": "Word equations\nPredict the products of complete methane combustion.", "a": "Carbon dioxide and water.", "m": 1}, {"q": "Balanced symbol equations\nBalance H₂ + O₂ → H₂O.", "a": "2H₂ + O₂ → 2H₂O", "m": 1}, {"q": "Reaction particle models\nWhat does a bonded pair of identical spheres represent in a molecular particle model?", "a": "A diatomic molecule of an element.", "m": 1}, {"q": "Signs of chemical change\nWhat is a precipitate?", "a": "An insoluble solid formed in a solution.", "m": 1}, {"q": "Reaction types\nWhat identifies a synthesis reaction?", "a": "Two or more reactants combine to form one product.", "m": 1}, {"q": "pH\nWhat does pH indicate?", "a": "How acidic or alkaline an aqueous solution is.", "m": 1}, {"q": "Neutralisation\nWhat does a universal indicator estimate?", "a": "pH from its colour compared with a reference chart.", "m": 1}, {"q": "Collision theory and rate\nDefine reaction rate.", "a": "Change in amount of reactant or product per unit time.", "m": 1}, {"q": "Rate investigation\nWrite a testable question about concentration and gas-production rate.", "a": "How does acid concentration affect the volume of gas produced in the first 20 seconds?", "m": 1}, {"q": "Early universe\nWhich two elements dominated early-universe nucleosynthesis?", "a": "Hydrogen and helium.", "m": 1}, {"q": "Fission and fusion\nWhat happens to a heavy nucleus in fission?", "a": "It splits into smaller nuclei.", "m": 1}, {"q": "Nuclear stability\nWhat is a radioisotope?", "a": "An isotope with an unstable nucleus that can decay.", "m": 1}, {"q": "Nuclear decay equations\nComplete the school-model alpha equation ²⁴¹₉₅Am → ? + ⁴₂He. Daughter symbol: Np.", "a": "²⁴¹₉₅Am → ²³⁷₉₃Np + ⁴₂He.", "m": 1}, {"q": "Half-life\nA nuclide has half-life 6 h and initial mass 72 mg. How much parent remains at 12 h?", "a": "2 half-lives. 72 ÷ 2^2 = 18 mg.", "m": 1}, {"q": "Radioisotope uses\nWhy use a radioisotope as a tracer?", "a": "Its radiation can reveal where the tracer travels or accumulates.", "m": 1}, {"q": "Nuclear life cycle\nWhat environmental impact can uranium mining cause?", "a": "Land disturbance and mine waste.", "m": 1}, {"q": "Industrial reactions\nWrite the balanced ammonia synthesis equation.", "a": "N₂ + 3H₂ ⇌ 2NH₃.", "m": 1}, {"q": "Wave fundamentals\nWhat travels from source to receiver in a wave?", "a": "Energy and a disturbance.", "m": 1}, {"q": "Transverse and longitudinal waves\nDefine a transverse wave.", "a": "Oscillation is perpendicular to propagation.", "m": 1}, {"q": "Mechanical and electromagnetic waves\nWhat is a mechanical wave?", "a": "A disturbance that requires a material medium.", "m": 1}, {"q": "Wave calculations\nA wave travels 40 cm in one period of 5 ms. Find its speed.", "a": "0.4 m ÷ 0.005 s = 80 m/s.", "m": 1}, {"q": "Ear and hearing\nWhat is the role of the pinna?", "a": "It helps collect and direct sound into the ear canal.", "m": 1}, {"q": "Vestibular system\nWhere is the vestibular apparatus located?", "a": "The inner ear.", "m": 1}, {"q": "Wave features and sound\nDefine amplitude on a transverse displacement graph.", "a": "Maximum displacement from equilibrium.", "m": 1}, {"q": "Doppler effect\nDefine the Doppler effect.", "a": "A change in observed frequency caused by relative motion between source and observer.", "m": 1}, {"q": "Properties of light\nIs visible light electromagnetic?", "a": "Yes.", "m": 1}, {"q": "Eye and vision\nWhat does the cornea do to incoming light?", "a": "It refracts light and provides much of the eye’s focusing power.", "m": 1}, {"q": "Light interactions\nDefine reflection.", "a": "Redirection of a wave back into the original medium at a boundary.", "m": 1}, {"q": "Which observations support a faster reaction? Select all that apply.", "options": ["More gas in the same early interval", "Steeper initial volume–time curve", "Same final plateau by itself", "Longer time to reach the same gas volume"], "m": 1, "multi": [0, 1], "a": "Rate measures how quickly product appears. A plateau measures total yield."}, {"q": "Which changes preserve element identity? Select all that apply.", "options": ["Losing electrons", "Gaining electrons", "Changing neutron count", "Changing proton count"], "m": 1, "multi": [0, 1, 2], "a": "Only proton count determines the element."}, {"q": "Which wave properties can be read directly from a displacement–distance snapshot?", "options": ["Amplitude", "Wavelength", "Period", "Frequency"], "m": 1, "multi": [0, 1], "a": "A spatial snapshot has no time axis."}, {"q": "Which controls matter in a carbonate particle-size experiment?", "options": ["Temperature", "Carbonate mass", "Acid concentration", "Measured gas production rate"], "m": 1, "multi": [0, 1, 2], "a": "Rate is the dependent variable."}, {"q": "Which statements about beta-minus decay are correct?", "options": ["Mass number stays the same", "Atomic number increases by one", "An electron is emitted", "Four nucleons are lost"], "m": 1, "multi": [0, 1, 2], "a": "A neutron becomes a proton and an electron is emitted."}, {"q": "Which processes can redirect light?", "options": ["Reflection", "Refraction at oblique incidence", "Scattering", "Absorption alone"], "m": 1, "multi": [0, 1, 2], "a": "Absorption transfers energy to matter."}, {"q": "In a fair test, the factor changed on purpose is the…", "options": ["dependent variable", "independent variable", "control treatment"], "correct": 1, "a": "The independent variable is deliberately manipulated.", "m": 1, "dropdown": true}, {"q": "In a volume–time graph, reaction rate is represented by the…", "options": ["plateau height", "horizontal intercept", "gradient"], "correct": 2, "a": "Gradient is change in volume divided by change in time.", "m": 1, "dropdown": true}, {"q": "After two half-lives, the fraction of parent remaining is…", "options": ["1/2", "1/4", "1/8"], "correct": 1, "a": "Each half-life halves the amount currently remaining.", "m": 1, "dropdown": true}, {"q": "When a wave enters a new medium and slows, its unchanged property is…", "options": ["wavelength", "speed", "frequency"], "correct": 2, "a": "The source sets the frequency.", "m": 1, "dropdown": true}, {"q": "The signal leaves the retina through the…", "options": ["optic nerve", "pupil", "cornea"], "correct": 0, "a": "The optic nerve carries neural signals to the brain.", "m": 1, "dropdown": true}, {"q": "In calcium chloride, the ratio of calcium to chloride ions is…", "options": ["2:1", "1:1", "1:2"], "correct": 2, "a": "One Ca²⁺ balances two Cl⁻.", "m": 1, "dropdown": true}, {"q": "Sound travels at 340 m/s. Calculate the wavelength for 125 Hz. Enter the value with the unit m.", "a": "λ = v/f = 340/125 ≈ 2.72 m.", "m": 2, "num": 2.72, "unit": "m"}, {"q": "Sound travels at 340 m/s. Calculate the wavelength for 170 Hz. Enter the value with the unit m.", "a": "λ = v/f = 340/170 ≈ 2 m.", "m": 2, "num": 2.0, "unit": "m"}, {"q": "Sound travels at 340 m/s. Calculate the wavelength for 250 Hz. Enter the value with the unit m.", "a": "λ = v/f = 340/250 ≈ 1.36 m.", "m": 2, "num": 1.36, "unit": "m"}, {"q": "Sound travels at 340 m/s. Calculate the wavelength for 425 Hz. Enter the value with the unit m.", "a": "λ = v/f = 340/425 ≈ 0.8 m.", "m": 2, "num": 0.8, "unit": "m"}, {"q": "Sound travels at 340 m/s. Calculate the wavelength for 680 Hz. Enter the value with the unit m.", "a": "λ = v/f = 340/680 ≈ 0.5 m.", "m": 2, "num": 0.5, "unit": "m"}, {"q": "Sound travels at 340 m/s. Calculate the wavelength for 850 Hz. Enter the value with the unit m.", "a": "λ = v/f = 340/850 ≈ 0.4 m.", "m": 2, "num": 0.4, "unit": "m"}, {"q": "Sound travels at 340 m/s. Calculate the wavelength for 1000 Hz. Enter the value with the unit m.", "a": "λ = v/f = 340/1000 ≈ 0.34 m.", "m": 2, "num": 0.34, "unit": "m"}, {"q": "Sound travels at 340 m/s. Calculate the wavelength for 1360 Hz. Enter the value with the unit m.", "a": "λ = v/f = 340/1360 ≈ 0.25 m.", "m": 2, "num": 0.25, "unit": "m"}, {"q": "Sound travels at 340 m/s. Calculate the wavelength for 1700 Hz. Enter the value with the unit m.", "a": "λ = v/f = 340/1700 ≈ 0.2 m.", "m": 2, "num": 0.2, "unit": "m"}, {"q": "Sound travels at 340 m/s. Calculate the wavelength for 3400 Hz. Enter the value with the unit m.", "a": "λ = v/f = 340/3400 ≈ 0.1 m.", "m": 2, "num": 0.1, "unit": "m"}, {"q": "Sound travels at 340 m/s. Calculate the wavelength for 4000 Hz. Enter the value with the unit m.", "a": "λ = v/f = 340/4000 ≈ 0.085 m.", "m": 2, "num": 0.085, "unit": "m"}, {"q": "Sound travels at 340 m/s. Calculate the wavelength for 6800 Hz. Enter the value with the unit m.", "a": "λ = v/f = 340/6800 ≈ 0.05 m.", "m": 2, "num": 0.05, "unit": "m"}]}, {"name": "Targeted Science drills", "questions": [{"q": "A box contains only identical particles, each made of one carbon atom bonded to one oxygen atom. Classify it.", "options": ["Mixture of two elements", "Pure element", "Pure compound"], "correct": 2, "m": 1, "a": "Classify by the particles present. An element has one type of atom, a compound has different atoms bonded in a fixed ratio, and a mixture contains different substances together."}, {"q": "Explain why a gas containing separate O₂ and CO₂ molecules is a mixture.", "m": 1, "a": "It contains two different substances, oxygen and carbon dioxide, present together without bonding to each other."}, {"q": "Which notation represents a single element?", "options": ["Co", "CO", "NaCl"], "correct": 0, "m": 1, "a": "Capital letters start each element symbol. A lowercase letter belongs to the preceding capital, so Co is cobalt and CO contains C and O."}, {"q": "How many different elements are in CaCO₃? Name them.", "m": 1, "a": "Three: calcium, carbon and oxygen."}, {"q": "How many neutrons are in magnesium-25, atomic number 12?", "options": ["12", "25", "13"], "correct": 2, "m": 1, "a": "Atomic number gives protons. Subtract it from mass number to get neutrons. In a neutral atom electrons equal protons. A positive charge indicates missing electrons."}, {"q": "Give the proton, neutron and electron counts for magnesium-25 as Mg²⁺.", "m": 1, "a": "12 protons, 13 neutrons and 10 electrons."}, {"q": "Which change creates a new substance?", "options": ["Water evaporates", "Ice melts", "Iron forms rust"], "correct": 2, "m": 1, "a": "During a chemical reaction atoms are rearranged into different substances. A change of state changes particle spacing or motion while preserving the particles’ chemical identities."}, {"q": "Explain why burning hydrogen is chemical but melting ice is physical.", "m": 1, "a": "Burning hydrogen forms water by rearranging atoms. Melting leaves H₂O molecules intact."}, {"q": "A flask loses 1.8 g when only CO₂ escapes. How much CO₂ escaped?", "options": ["1.8 g", "Cannot infer it even if only CO₂ escaped", "0 g"], "correct": 0, "m": 1, "a": "An open balance reading excludes gas that escapes. In a closed system, gas is still inside the measured system and contributes to total mass."}, {"q": "Predict the change if an expanding airtight collector is weighed as part of the system.", "m": 1, "a": "Approximately zero. The collector retains CO₂ within the weighed system."}, {"q": "What holds Mg²⁺ and O²⁻ together in magnesium oxide?", "options": ["Attraction between two neutral atoms", "Sharing an electron pair", "Electrostatic attraction"], "correct": 2, "m": 1, "a": "An atom losing electrons forms a positive ion. A recipient becomes negative. The bond is the electrostatic attraction between the resulting oppositely charged ions."}, {"q": "Explain why removing electrons leaves a magnesium atom positively charged.", "m": 1, "a": "Its proton count stays the same, so after losing electrons it has more protons than electrons."}, {"q": "Which formula balances Mg²⁺ and N³⁻?", "options": ["Mg₃N₂", "Mg₂N₃", "MgN"], "correct": 0, "m": 1, "a": "Find the smallest whole-number ratio whose total charge is zero. For Al³⁺ and O²⁻, two aluminium ions give +6 and three oxide ions give −6, so Al₂O₃."}, {"q": "Give the formula from Ca²⁺ and P³⁻ and show the charge totals.", "m": 1, "a": "Ca₃P₂. The charges are 3 × (+2) = +6 and 2 × (−3) = −6."}, {"q": "How many shared electron pairs are in O=C=O?", "options": ["4", "8", "2"], "correct": 0, "m": 1, "a": "Each covalent line represents one shared electron pair. Lone pairs stay on one atom. H₂O has two O–H bonds and two lone pairs on O."}, {"q": "How many bonds and lone pairs are on the nitrogen in NH₃?", "m": 1, "a": "Three single bonds and one lone pair."}, {"q": "What is the formula of sulfur trioxide?", "options": ["SO₃", "S₃O₃", "S₃O"], "correct": 0, "m": 1, "a": "Read prefixes as atom counts. The first element normally omits mono-, while the second ends in -ide. Dinitrogen monoxide has two N atoms and one O atom."}, {"q": "Name PCl₃ using molecular prefixes.", "m": 1, "a": "Phosphorus trichloride."}, {"q": "Which gas is produced when hydrochloric acid reacts with sodium carbonate?", "options": ["Hydrogen", "Carbon dioxide", "Oxygen"], "correct": 1, "m": 1, "a": "First identify the reaction family. An acid reacting with a carbonate forms a salt, water and carbon dioxide."}, {"q": "Write the word equation for hydrochloric acid and sodium carbonate.", "m": 1, "a": "Hydrochloric acid + sodium carbonate → sodium chloride + water + carbon dioxide."}, {"q": "How many oxygen atoms does 3CO₂ represent?", "options": ["6", "3", "5"], "correct": 0, "m": 1, "a": "Keep each substance’s formula fixed. A coefficient scales all atoms in that formula. Changing a subscript changes the substance."}, {"q": "Balance Fe + O₂ → Fe₂O₃ using smallest whole numbers.", "m": 1, "a": "4Fe + 3O₂ → 2Fe₂O₃."}, {"q": "Starting with 3 H₂ molecules and 1 O₂ molecule, which reactant is left over?", "options": ["Neither reactant", "One O₂ molecule", "One H₂ molecule"], "correct": 2, "m": 1, "a": "Use the balanced coefficients as packet sizes. A packet of 2H₂ and O₂ produces 2H₂O. Count leftovers separately."}, {"q": "Start with 4 H₂ and 3 O₂ molecules. How many H₂O molecules form, and what remains?", "m": 1, "a": "Four H₂O molecules form. One O₂ molecule remains."}, {"q": "What is the observation in a positive limewater test?", "options": ["Limewater turns cloudy", "Limewater burns", "Hydrogen is produced"], "correct": 0, "m": 1, "a": "An observation is what you detect. Bubbling is evidence of gas formation, but a gas test can support its identification. CO₂ turns limewater cloudy."}, {"q": "Why can bubbles alone fail to establish a chemical reaction?", "m": 1, "a": "Bubbles can form during physical processes such as boiling, so additional evidence of a new substance is needed."}, {"q": "Classify CaCO₃ → CaO + CO₂.", "options": ["Displacement", "Synthesis", "Decomposition"], "correct": 2, "m": 1, "a": "A synthesis combines reactants, a decomposition splits one reactant into multiple products, and a displacement replaces an element in a compound."}, {"q": "Classify Zn + CuSO₄ → ZnSO₄ + Cu and explain what is replaced.", "m": 1, "a": "Single displacement. Zinc replaces copper in copper sulfate."}, {"q": "Which solution is most acidic?", "options": ["pH 2", "pH 7", "pH 11"], "correct": 0, "m": 1, "a": "A lower pH indicates a higher hydrogen ion concentration. Near room temperature, pH 7 is neutral, values below it are acidic, and values above it are alkaline."}, {"q": "Order pH 5, 9 and 2 from most acidic to most alkaline.", "m": 1, "a": "2, then 5, then 9."}, {"q": "After adding too little sodium hydroxide to hydrochloric acid, which reactant is in excess?", "options": ["Sodium hydroxide", "Hydrochloric acid", "Neither"], "correct": 1, "m": 1, "a": "Acid and hydroxide react to form salt and water. Adding some base to acid can leave acid in excess, so a neutralisation reaction can occur without the final pH reaching 7."}, {"q": "Name the products when hydrochloric acid reacts with sodium hydroxide.", "m": 1, "a": "Sodium chloride and water."}, {"q": "What explains why warming usually makes a reaction faster?", "options": ["A larger fraction of collisions have enough energy", "Each particle becomes larger", "Warming lowers the activation energy of the same pathway"], "correct": 0, "m": 1, "a": "Increasing temperature raises particle kinetic energy. A larger fraction of collisions can reach the activation energy. A catalyst instead supplies a route with lower activation energy."}, {"q": "Explain how the mechanism of a catalyst differs from that of warming.", "m": 1, "a": "A catalyst lowers the activation energy by providing an alternative pathway. Warming increases the fraction of particles with enough energy."}, {"q": "A student changes both acid concentration and temperature between trials. What is the main design problem?", "options": ["Two changes make the comparison more valid", "The effects cannot be separated", "The dependent variable must be temperature"], "correct": 1, "m": 1, "a": "Change the independent variable on purpose and measure the dependent variable. Hold other plausible causes constant so you can isolate the effect."}, {"q": "Redesign the test to isolate concentration. Give two controls.", "m": 1, "a": "Vary acid concentration only. Hold temperature and acid volume constant, along with carbonate mass and particle size."}, {"q": "Which pair dominated the early universe’s ordinary elemental matter?", "options": ["Iron and nickel", "Hydrogen and helium", "Carbon and oxygen"], "correct": 1, "m": 1, "a": "Early expansion cooled the universe enough for light nuclei to form. Hydrogen and helium dominate primordial material. Many heavier nuclei formed later in stars."}, {"q": "Why is it misleading to say the early universe made most of its iron at the same time as helium?", "m": 1, "a": "Primordial nucleosynthesis mainly produced light nuclei. Iron was produced later through stellar processes."}, {"q": "Which process powers the Sun?", "options": ["Chemical combustion", "Fusion", "Fission"], "correct": 1, "m": 1, "a": "Fission splits a heavy nucleus. Fusion joins light nuclei. Both can release energy, but fusion requires conditions that bring positively charged nuclei close together."}, {"q": "Classify a heavy nucleus splitting into two smaller nuclei and releasing neutrons.", "m": 1, "a": "Nuclear fission."}, {"q": "Which property differs between two isotopes of carbon?", "options": ["Element symbol", "Neutron number", "Proton number"], "correct": 1, "m": 1, "a": "Isotopes share a proton number but differ in neutron number. Nuclear stability depends on the neutron–proton balance and the size of the nucleus."}, {"q": "Why can carbon-12 and carbon-14 differ in stability while both are carbon?", "m": 1, "a": "Both have six protons, but their different neutron numbers change the neutron–proton balance."}, {"q": "An alpha emitter starts at mass number 222 and atomic number 86. What are the daughter numbers?", "options": ["222 and 84", "218 and 84", "218 and 86"], "correct": 1, "m": 1, "a": "Balance the two numbers independently. Alpha emission removes four nucleons and two protons. In beta-minus decay, a neutron becomes a proton, so atomic number increases by one while mass number stays fixed."}, {"q": "A nucleus of atomic number 15 and mass number 32 emits beta-minus. State the daughter numbers.", "m": 1, "a": "Atomic number 16 and mass number 32."}, {"q": "What fraction remains after four half-lives?", "options": ["1/8", "1/16", "1/4"], "correct": 1, "m": 1, "a": "First divide elapsed time by the half-life. Then halve the remaining quantity once per interval. After three half-lives the remaining fraction is one eighth."}, {"q": "A sample starts at 120 mg and has a half-life of 5 hours. How much remains after 15 hours?", "m": 1, "a": "15 mg. Three half-lives give 120 → 60 → 30 → 15 mg."}, {"q": "Why can an extremely short half-life be unsuitable for a long scan?", "options": ["The isotope necessarily becomes chemically toxic", "The isotope will never decay", "Too little activity may remain before the scan ends"], "correct": 2, "m": 1, "a": "A tracer must remain detectable long enough for the procedure. A shorter half-life reduces how long activity persists, while an excessively short half-life may make the measurement impractical."}, {"q": "Give one trade-off when choosing between a short- and long-lived medical tracer.", "m": 1, "a": "Shorter persistence can reduce exposure time, but enough activity must remain detectable throughout the scan."}, {"q": "Which is a life-cycle impact outside normal electricity generation?", "options": ["Habitat disturbance during uranium mining", "Control rod movement during operation", "Heat transfer in an operating turbine"], "correct": 0, "m": 1, "a": "Distinguish operation from the whole life cycle. Extraction, processing, construction and waste management matter as well as what happens while a plant generates electricity."}, {"q": "Explain why low operational emissions do not imply zero life-cycle emissions.", "m": 1, "a": "Mining, processing, construction and waste management can consume energy and produce emissions."}, {"q": "What is the target product of the Haber process?", "options": ["Hydrogen", "Ammonia", "Sulfuric acid"], "correct": 1, "m": 1, "a": "Identify feedstocks, product and use. The Haber process combines nitrogen and hydrogen to make ammonia, which is used to make fertilisers."}, {"q": "Write the balanced equation for producing ammonia from nitrogen and hydrogen.", "m": 1, "a": "N₂ + 3H₂ ⇌ 2NH₃."}, {"q": "What moves across the rope when a pulse travels along it?", "options": ["The entire rope with the pulse", "The disturbance", "The rope particles permanently along the pulse direction"], "correct": 1, "m": 1, "a": "A wave transfers energy through a disturbance. A rope segment can oscillate locally while the crest propagates along the rope."}, {"q": "Describe what happens to a painted dot on the rope as a single pulse passes.", "m": 1, "a": "It is displaced briefly, then returns approximately to its equilibrium position."}, {"q": "A wave travels east while particles oscillate north–south. What type is it?", "options": ["Transverse", "Both", "Longitudinal"], "correct": 0, "m": 1, "a": "Compare the direction of particle oscillation with wave propagation. Transverse is perpendicular, longitudinal is parallel."}, {"q": "Describe the direction of particle oscillation for sound moving east through air.", "m": 1, "a": "The air particles oscillate east–west, parallel to propagation."}, {"q": "Which can travel through a vacuum?", "options": ["Visible light", "Sound from a speaker", "A compression wave in a spring"], "correct": 0, "m": 1, "a": "Mechanical waves require a medium. Electromagnetic waves can propagate in a vacuum. Sound in air is mechanical and visible light is electromagnetic."}, {"q": "Explain why astronauts can see one another through a window but cannot hear ordinary sound through an intervening vacuum.", "m": 1, "a": "Light travels through a vacuum. Sound requires particles to transmit pressure disturbances."}, {"q": "A wave has frequency 20 Hz and wavelength 30 cm. What is its speed?", "options": ["0.015 m/s", "600 m/s", "6 m/s"], "correct": 2, "m": 1, "a": "Convert cm to m and ms to s. For example, 25 cm = 0.25 m. Then choose v = fλ, f = v/λ or λ = v/f."}, {"q": "Find the wavelength for a wave of speed 12 m/s and frequency 80 Hz. Give m and cm.", "m": 1, "a": "0.15 m, or 15 cm. Use λ = 12/80."}, {"q": "Which structure contains the receptor cells that respond to inner-ear movement for hearing?", "options": ["Ear canal", "Eardrum", "Cochlea"], "correct": 2, "m": 1, "a": "Sound vibrates the eardrum. The ossicles transmit vibration into the inner ear. Cochlear hair cells help convert movement into signals carried by the auditory nerve."}, {"q": "Give the order from eardrum to brain using ossicles, cochlea and auditory nerve.", "m": 1, "a": "Eardrum → ossicles → cochlea → auditory nerve → brain."}, {"q": "Which structure detects changes in rotation?", "options": ["Eardrum", "Pinna", "Semicircular canals"], "correct": 2, "m": 1, "a": "Semicircular canals detect changes in rotational head motion. Fluid movement bends sensory structures and helps the brain coordinate posture and gaze."}, {"q": "Explain why you may briefly feel motion after stopping a spin.", "m": 1, "a": "Fluid continues moving relative to the canals briefly, so the sensory signal persists."}, {"q": "Which changes when a tone’s frequency increases at constant amplitude?", "options": ["Pitch rises", "Pitch stays fixed", "Pitch falls"], "correct": 0, "m": 1, "a": "Frequency chiefly determines pitch. For comparable tones, larger amplitude generally means louder sound. Peak-to-peak displacement is twice the amplitude."}, {"q": "A wave trace extends from −7 mm to +7 mm. What is its amplitude?", "m": 1, "a": "7 mm, measured from equilibrium to a peak."}, {"q": "A cyclist rides toward a stationary bell. What changes for the cyclist?", "options": ["The bell emits a higher frequency", "Wavefronts are encountered more often", "The sound speed in still air increases"], "correct": 1, "m": 1, "a": "A moving source changes wavefront spacing ahead and behind it. A moving observer can instead change the rate of encountering wavefronts without changing their spacing in the medium."}, {"q": "Explain the lower pitch behind a receding ambulance.", "m": 1, "a": "Wavefronts behind the moving source are farther apart, so they reach a stationary listener less frequently."}, {"q": "Light slows entering glass. What remains unchanged?", "options": ["Speed", "Frequency", "Wavelength"], "correct": 1, "m": 1, "a": "At a stationary boundary the source still sets the frequency. If the speed decreases, the wavelength decreases because λ = v/f."}, {"q": "If light speed drops to two-thirds of its original value in glass, what happens to wavelength?", "m": 1, "a": "It drops to two-thirds of its original value because frequency stays the same."}, {"q": "Which structure controls pupil size?", "options": ["Optic nerve", "Iris", "Retina"], "correct": 1, "m": 1, "a": "The iris controls pupil size and light entry. The lens adjusts focus. The retina contains photoreceptors and the optic nerve carries resulting signals to the brain."}, {"q": "A person can change pupil size normally but cannot focus on a near object. Which optical structure should you discuss?", "m": 1, "a": "The lens and its focusing mechanism, because they adjust focus for near objects."}, {"q": "A ray is 35° from a mirror surface. What is its angle of reflection from the normal?", "options": ["55°", "35°", "90°"], "correct": 0, "m": 1, "a": "Draw the normal perpendicular to the surface. Both incidence and reflection angles are measured from it. A ray 20° from the surface is 70° from the normal."}, {"q": "A ray enters glass obliquely from air. Does its angle from the normal increase or decrease?", "m": 1, "a": "It decreases because the ray bends towards the normal."}, {"q": "Which change makes a neutral atom a different isotope of the same element?", "options": ["Removing an electron", "Adding a proton", "Adding a neutron"], "correct": 2, "m": 1, "a": "Isotopes differ in neutrons. Ions differ in electron count compared with their neutral atom. Either can be described without changing the number of protons."}, {"q": "Compare chlorine-35 and chlorine-37 as neutral atoms. What changes?", "m": 1, "a": "The neutron count differs by two. Both have 17 protons and 17 electrons."}, {"q": "How many chlorine atoms are needed for the electrons lost by one Ca atom forming Ca²⁺?", "options": ["1", "3", "2"], "correct": 2, "m": 1, "a": "Track total electrons lost and gained. One Ca loses two electrons, so two Cl atoms each take one."}, {"q": "How many electrons are transferred in the formation of one formula unit of Al₂O₃?", "m": 1, "a": "Six. Two Al atoms lose three each and three O atoms gain two each."}, {"q": "In C₃H₈ + O₂ → CO₂ + H₂O, what coefficient belongs before H₂O?", "options": ["8", "3", "4"], "correct": 2, "m": 1, "a": "In hydrocarbon combustion, balance C, then H, then O. If the O₂ coefficient is fractional, scale every coefficient together."}, {"q": "Finish the propane combustion equation.", "m": 1, "a": "C₃H₈ + 5O₂ → 3CO₂ + 4H₂O."}, {"q": "Curve A rises faster than B but both reach 48 mL. What differs?", "options": ["Final gas volume", "Initial rate", "Both initial rate and final gas volume"], "correct": 1, "m": 1, "a": "Rate is product change per time. A steeper early gas curve means faster reaction. Equal plateau volumes can indicate equal final yields under matching collection conditions."}, {"q": "Explain how crushing an equal mass of limiting carbonate can change rate while leaving final yield unchanged.", "m": 1, "a": "It exposes more surface for collisions. The same amount of limiting carbonate still reacts and determines the total CO₂."}, {"q": "Volume rises from 12 to 30 mL between 4 and 10 s. What is the mean rate?", "options": ["1.8 mL/s", "3 mL/s", "5 mL/s"], "correct": 1, "m": 1, "a": "Subtract the starting volume from the ending volume, then divide by elapsed time for that interval. Use both differences rather than just the endpoint coordinates."}, {"q": "Volume rises from 18 mL at 6 s to 42 mL at 14 s. Find the interval mean rate.", "m": 1, "a": "(42 − 18)/(14 − 6) = 3 mL/s."}, {"q": "Which change is consistent with beta-minus decay?", "options": ["A unchanged, Z increases by one", "A increases by one, Z unchanged", "A falls by four, Z falls by two"], "correct": 0, "m": 1, "a": "For beta-minus, atomic number increases and nucleon number stays constant. Alpha reduces both by 2 and 4 respectively."}, {"q": "Explain why mass number does not change in beta-minus decay.", "m": 1, "a": "A neutron changes into a proton, so the total number of nucleons remains the same."}, {"q": "A sample has 7 mg remaining after three half-lives. What was its initial parent mass?", "options": ["56 mg", "21 mg", "0.875 mg"], "correct": 0, "m": 1, "a": "Reverse each halving by doubling. After two intervals, multiply the observed mass by four to reconstruct the initial mass."}, {"q": "After 18 hours at a half-life of 6 hours, 9 mg remains. Find initial parent mass.", "m": 1, "a": "72 mg. Three half-lives require multiplying 9 by 2³."}, {"q": "What is the frequency for a period of 20 ms?", "options": ["0.05 Hz", "50 Hz", "20 Hz"], "correct": 1, "m": 1, "a": "Period is the time per cycle. Convert to seconds first, then f = 1/T. A 5 ms period is 0.005 s, so the frequency is 200 Hz."}, {"q": "A wave has wavelength 0.40 m and period 8 ms. Find its speed.", "m": 1, "a": "50 m/s. Use 0.40/0.008."}, {"q": "What occurs as a ray enters glass along the normal?", "options": ["It bends towards the surface", "Its frequency falls", "It slows without bending"], "correct": 2, "m": 1, "a": "Reflection returns a ray to its original medium. Refraction involves speed changing at a boundary, often bending the ray. At normal incidence the speed changes without bending."}, {"q": "Explain how a window can produce a reflected image while transmitting light.", "m": 1, "a": "Some incident light is reflected into the original medium and some is transmitted into the glass."}], "bankKey": "targeted"}], "cards": [{"ID": "SCI001", "Front": "Define matter.", "Back": "Matter has mass and occupies space.", "Tags": "Year9Science::ChemicalReactions::MatterAndParticles RXN-LI-01", "Learning_Intent": "RXN-LI-01", "Difficulty": "1", "Source_Category": "Original practice", "Points": ["Matter has mass and occupies space"]}, {"ID": "SCI002", "Front": "What distinguishes a compound from an element?", "Back": "A compound contains atoms of at least two different elements chemically bonded. An element contains only one type of atom.", "Tags": "Year9Science::ChemicalReactions::MatterAndParticles RXN-LI-01", "Learning_Intent": "RXN-LI-01", "Difficulty": "1", "Source_Category": "Original practice", "Points": ["Compound: two or more different elements chemically bonded", "Element: one type of atom"]}, {"ID": "SCI003", "Front": "Is a sample containing only O₂ molecules an element or a compound? Explain.", "Back": "An element. Each molecule contains two atoms of the same element.", "Tags": "Year9Science::ChemicalReactions::MatterAndParticles RXN-LI-01", "Learning_Intent": "RXN-LI-01", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["An element", "Each molecule contains two atoms of the same element"]}, {"ID": "SCI004", "Front": "A box contains separate helium atoms and water molecules. Classify the contents.", "Back": "A mixture. It contains two distinct substances that are not chemically bonded to each other.", "Tags": "Year9Science::ChemicalReactions::MatterAndParticles RXN-LI-01", "Learning_Intent": "RXN-LI-01", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["A mixture", "It contains two distinct substances that are not chemically bonded to each other"]}, {"ID": "SCI005", "Front": "Which is an elemental substance: Cu, CuO or a blend of Cu and CuO?", "Back": "Cu. It contains only copper atoms.", "Tags": "Year9Science::ChemicalReactions::MatterAndParticles RXN-LI-01", "Learning_Intent": "RXN-LI-01", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["Cu", "It contains only copper atoms"]}, {"ID": "SCI006", "Front": "What is a mixture?", "Back": "Two or more substances physically combined, with variable proportions.", "Tags": "Year9Science::ChemicalReactions::MatterAndParticles RXN-LI-01", "Learning_Intent": "RXN-LI-01", "Difficulty": "1", "Source_Category": "Original practice", "Points": ["Two or more substances physically combined, with variable proportions"]}, {"ID": "SCI007", "Front": "A model contains identical particles, each formed from one black and two white spheres joined together. If colours represent different elements, how should the sample be classified?", "Back": "A pure compound. Every particle is the same and contains atoms of two different elements.", "Tags": "Year9Science::ChemicalReactions::MatterAndParticles RXN-LI-01", "Learning_Intent": "RXN-LI-01", "Difficulty": "3", "Source_Category": "Original practice", "Points": ["A pure compound", "Every particle is the same and contains atoms of two different elements"]}, {"ID": "SCI008", "Front": "What does atomic number count?", "Back": "Protons in the nucleus.", "Tags": "Year9Science::ChemicalReactions::SymbolsAndAtomicNumber RXN-LI-02", "Learning_Intent": "RXN-LI-02", "Difficulty": "1", "Source_Category": "Original practice", "Points": ["Protons in the nucleus"]}, {"ID": "SCI009", "Front": "What is the symbol for sodium?", "Back": "Na.", "Tags": "Year9Science::ChemicalReactions::SymbolsAndAtomicNumber RXN-LI-02", "Learning_Intent": "RXN-LI-02", "Difficulty": "1", "Source_Category": "Original practice", "Points": ["Na"]}, {"ID": "SCI010", "Front": "Explain why Co and CO represent different things.", "Back": "Co is the element cobalt. CO is carbon monoxide, containing carbon and oxygen.", "Tags": "Year9Science::ChemicalReactions::SymbolsAndAtomicNumber RXN-LI-02", "Learning_Intent": "RXN-LI-02", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["Co is the element cobalt", "CO is carbon monoxide, containing carbon and oxygen"]}, {"ID": "SCI011", "Front": "Two particles have 17 protons but different electron counts. Why are both chlorine?", "Back": "Element identity is determined by proton number. Chlorine has atomic number 17.", "Tags": "Year9Science::ChemicalReactions::SymbolsAndAtomicNumber RXN-LI-02", "Learning_Intent": "RXN-LI-02", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["Element identity is determined by proton number", "Chlorine has atomic number 17"]}, {"ID": "SCI012", "Front": "What are the horizontal rows of the Periodic Table called?", "Back": "Periods.", "Tags": "Year9Science::ChemicalReactions::SymbolsAndAtomicNumber RXN-LI-02", "Learning_Intent": "RXN-LI-02", "Difficulty": "1", "Source_Category": "Original practice", "Points": ["Periods"]}, {"ID": "SCI013", "Front": "What are the vertical columns of the Periodic Table called?", "Back": "Groups.", "Tags": "Year9Science::ChemicalReactions::SymbolsAndAtomicNumber RXN-LI-02", "Learning_Intent": "RXN-LI-02", "Difficulty": "1", "Source_Category": "Original practice", "Points": ["Groups"]}, {"ID": "SCI014", "Front": "A periodic table entry gives Z = 12 and a relative atomic mass of about 24.3. Which value identifies magnesium?", "Back": "12, the atomic number.", "Tags": "Year9Science::ChemicalReactions::SymbolsAndAtomicNumber RXN-LI-02", "Learning_Intent": "RXN-LI-02", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["12, the atomic number"]}, {"ID": "SCI015", "Front": "How are elements ordered in the modern Periodic Table?", "Back": "By increasing atomic number.", "Tags": "Year9Science::ChemicalReactions::SymbolsAndAtomicNumber RXN-LI-02", "Learning_Intent": "RXN-LI-02", "Difficulty": "1", "Source_Category": "Original practice", "Points": ["By increasing atomic number"]}, {"ID": "SCI016", "Front": "Name the particles found in the atomic nucleus.", "Back": "Protons and neutrons, except that the most common hydrogen nucleus has just one proton.", "Tags": "Year9Science::ChemicalReactions::AtomicStructure RXN-LI-03", "Learning_Intent": "RXN-LI-03", "Difficulty": "1", "Source_Category": "Original practice", "Points": ["Protons and neutrons, except that the most common hydrogen nucleus has just one proton"]}, {"ID": "SCI017", "Front": "What are the relative charges of a proton, neutron and electron?", "Back": "+1, 0 and −1 respectively.", "Tags": "Year9Science::ChemicalReactions::AtomicStructure RXN-LI-03", "Learning_Intent": "RXN-LI-03", "Difficulty": "1", "Source_Category": "Original practice", "Points": ["+1, 0 and −1 respectively"]}, {"ID": "SCI018", "Front": "What does mass number count?", "Back": "The total number of protons and neutrons in a nucleus.", "Tags": "Year9Science::ChemicalReactions::AtomicStructure RXN-LI-03", "Learning_Intent": "RXN-LI-03", "Difficulty": "1", "Source_Category": "Original practice", "Points": ["The total number of protons and neutrons in a nucleus"]}, {"ID": "SCI019", "Front": "An isotope has mass number 37 and atomic number 17. How many neutrons does it have?", "Back": "20, from 37 − 17.", "Tags": "Year9Science::ChemicalReactions::AtomicStructure RXN-LI-03", "Learning_Intent": "RXN-LI-03", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["20, from 37 − 17"]}, {"ID": "SCI020", "Front": "What is the shell arrangement of a neutral sodium atom in the school model?", "Back": "2,8,1.", "Tags": "Year9Science::ChemicalReactions::AtomicStructure RXN-LI-03", "Learning_Intent": "RXN-LI-03", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["2,8,1"]}, {"ID": "SCI021", "Front": "What is the shell arrangement of a neutral chlorine atom in the school model?", "Back": "2,8,7.", "Tags": "Year9Science::ChemicalReactions::AtomicStructure RXN-LI-03", "Learning_Intent": "RXN-LI-03", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["2,8,7"]}, {"ID": "SCI022", "Front": "Define valence electrons for a main-group atom.", "Back": "Electrons in its outermost occupied shell.", "Tags": "Year9Science::ChemicalReactions::AtomicStructure RXN-LI-03", "Learning_Intent": "RXN-LI-03", "Difficulty": "1", "Source_Category": "Original practice", "Points": ["Electrons in its outermost occupied shell"]}, {"ID": "SCI023", "Front": "How many valence electrons does a neutral sulfur atom have if its arrangement is 2,8,6?", "Back": "Six.", "Tags": "Year9Science::ChemicalReactions::AtomicStructure RXN-LI-03", "Learning_Intent": "RXN-LI-03", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["Six"]}, {"ID": "SCI024", "Front": "What distinguishes two isotopes of the same element?", "Back": "They have the same number of protons and different numbers of neutrons.", "Tags": "Year9Science::ChemicalReactions::AtomicStructure RXN-LI-03", "Learning_Intent": "RXN-LI-03", "Difficulty": "1", "Source_Category": "Original practice", "Points": ["They have the same number of protons and different numbers of neutrons"]}, {"ID": "SCI025", "Front": "How many electrons does a neutral atom with atomic number 13 have?", "Back": "13. A neutral atom has equal proton and electron counts.", "Tags": "Year9Science::ChemicalReactions::AtomicStructure RXN-LI-03", "Learning_Intent": "RXN-LI-03", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["13", "A neutral atom has equal proton and electron counts"]}, {"ID": "SCI026", "Front": "A particle has 13 protons and 10 electrons. What is its charge?", "Back": "3+, because there are three more protons than electrons.", "Tags": "Year9Science::ChemicalReactions::AtomicStructure RXN-LI-03", "Learning_Intent": "RXN-LI-03", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["3+, because there are three more protons than electrons"]}, {"ID": "SCI027", "Front": "Why is the mass number of carbon-14 a whole number?", "Back": "It counts discrete nucleons: six protons and eight neutrons.", "Tags": "Year9Science::ChemicalReactions::AtomicStructure RXN-LI-03", "Learning_Intent": "RXN-LI-03", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["It counts discrete nucleons: six protons and eight neutrons"]}, {"ID": "SCI028", "Front": "Give a limitation of drawing electron shells as circular lines around a nucleus.", "Back": "The lines represent energy levels schematically. Electrons do not follow fixed circular paths.", "Tags": "Year9Science::ChemicalReactions::AtomicStructure RXN-LI-03", "Learning_Intent": "RXN-LI-03", "Difficulty": "3", "Source_Category": "Original practice", "Points": ["Rings represent energy levels in this model", "Electrons do not follow fixed circular paths"]}, {"ID": "SCI029", "Front": "What is a reactant?", "Back": "A starting substance consumed in a chemical reaction.", "Tags": "Year9Science::ChemicalReactions::RearrangementOfAtoms RXN-LI-04", "Learning_Intent": "RXN-LI-04", "Difficulty": "1", "Source_Category": "Original practice", "Points": ["A starting substance consumed in a chemical reaction"]}, {"ID": "SCI030", "Front": "What is a product?", "Back": "A substance formed in a chemical reaction.", "Tags": "Year9Science::ChemicalReactions::RearrangementOfAtoms RXN-LI-04", "Learning_Intent": "RXN-LI-04", "Difficulty": "1", "Source_Category": "Original practice", "Points": ["A substance formed in a chemical reaction"]}, {"ID": "SCI031", "Front": "How can a reaction form a new substance using the same atoms?", "Back": "The atoms become joined or arranged differently as bonds change.", "Tags": "Year9Science::ChemicalReactions::RearrangementOfAtoms RXN-LI-04", "Learning_Intent": "RXN-LI-04", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["The atoms become joined or arranged differently as bonds change"]}, {"ID": "SCI032", "Front": "Do oxygen atoms in a metal oxide have to come from a reactant?", "Back": "Yes. Ordinary chemical reactions rearrange existing atoms, so the oxygen must already be present.", "Tags": "Year9Science::ChemicalReactions::RearrangementOfAtoms RXN-LI-04", "Learning_Intent": "RXN-LI-04", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["Yes", "Ordinary chemical reactions rearrange existing atoms, so the oxygen must already be present"]}, {"ID": "SCI033", "Front": "Hydrogen reacts with oxygen. What changes at the particle level when water forms?", "Back": "H–H and O–O bonds are replaced by O–H bonds as the atoms rearrange.", "Tags": "Year9Science::ChemicalReactions::RearrangementOfAtoms RXN-LI-04", "Learning_Intent": "RXN-LI-04", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["H–H and O–O bonds are replaced by O–H bonds as the atoms rearrange"]}, {"ID": "SCI034", "Front": "Why is melting ice a physical change?", "Back": "The molecules remain H₂O. The arrangement and movement of those molecules change.", "Tags": "Year9Science::ChemicalReactions::RearrangementOfAtoms RXN-LI-04", "Learning_Intent": "RXN-LI-04", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["The molecules remain H₂O", "The arrangement and movement of those molecules change"]}, {"ID": "SCI035", "Front": "Someone says product properties must match the reactants because the atoms match. What is wrong with this reasoning?", "Back": "Properties depend on how atoms are bonded and arranged. A new arrangement can give a substance different properties.", "Tags": "Year9Science::ChemicalReactions::RearrangementOfAtoms RXN-LI-04", "Learning_Intent": "RXN-LI-04", "Difficulty": "3", "Source_Category": "Original practice", "Points": ["Bonding and arrangement affect properties", "A new arrangement can give different properties"]}, {"ID": "SCI036", "Front": "What happens to each element’s atom count in an ordinary chemical reaction?", "Back": "It stays the same across the complete set of reactants and products.", "Tags": "Year9Science::ChemicalReactions::RearrangementOfAtoms RXN-LI-04", "Learning_Intent": "RXN-LI-04", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["It stays the same across the complete set of reactants and products"]}, {"ID": "SCI037", "Front": "What is conserved during a chemical reaction in a closed system?", "Back": "Total mass.", "Tags": "Year9Science::ChemicalReactions::ConservationOfMass RXN-LI-05", "Learning_Intent": "RXN-LI-05", "Difficulty": "1", "Source_Category": "Original practice", "Points": ["Total mass"]}, {"ID": "SCI038", "Front": "What makes a system closed for a mass conservation investigation?", "Back": "Matter cannot enter or leave.", "Tags": "Year9Science::ChemicalReactions::ConservationOfMass RXN-LI-05", "Learning_Intent": "RXN-LI-05", "Difficulty": "1", "Source_Category": "Original practice", "Points": ["Matter cannot enter or leave"]}, {"ID": "SCI039", "Front": "Reactants of 14.6 g and 7.9 g react completely in a sealed vessel. What is the total product mass?", "Back": "22.5 g.", "Tags": "Year9Science::ChemicalReactions::ConservationOfMass RXN-LI-05", "Learning_Intent": "RXN-LI-05", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["22.5 g"]}, {"ID": "SCI040", "Front": "An open beaker loses 2.4 g during a reaction. Give a possible explanation consistent with conservation of mass.", "Back": "A gas escaped from the measured system. Its mass is excluded from the final reading.", "Tags": "Year9Science::ChemicalReactions::ConservationOfMass RXN-LI-05", "Learning_Intent": "RXN-LI-05", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["A gas escaped from the measured system", "Its mass is excluded from the final reading"]}, {"ID": "SCI041", "Front": "An iron sample gains mass as it rusts. Where does the added mass come from?", "Back": "Substances from the surroundings, chiefly oxygen incorporated into the corrosion products.", "Tags": "Year9Science::ChemicalReactions::ConservationOfMass RXN-LI-05", "Learning_Intent": "RXN-LI-05", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["Substances from the surroundings, chiefly oxygen incorporated into the corrosion products"]}, {"ID": "SCI042", "Front": "An experiment starts at 52.0 g. It ends at 49.6 g in an open setup. If only carbon dioxide escaped, what mass of carbon dioxide formed?", "Back": "2.4 g, from 52.0 − 49.6.", "Tags": "Year9Science::ChemicalReactions::ConservationOfMass RXN-LI-05", "Learning_Intent": "RXN-LI-05", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["2.4 g, from 52.0 − 49.6"]}, {"ID": "SCI043", "Front": "A sealed flask containing reactants and apparatus has mass 156.3 g before reaction. What mass should the entire flask system have after reaction?", "Back": "156.3 g, within measurement uncertainty.", "Tags": "Year9Science::ChemicalReactions::ConservationOfMass RXN-LI-05", "Learning_Intent": "RXN-LI-05", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["156.3 g, within measurement uncertainty"]}, {"ID": "SCI044", "Front": "Two sealed reactions show differences of +0.01 g and −0.01 g on a balance reading to 0.01 g. Is this strong evidence against conservation of mass?", "Back": "No. The differences are comparable to the balance resolution and could reflect measurement variation.", "Tags": "Year9Science::ChemicalReactions::ConservationOfMass RXN-LI-05", "Learning_Intent": "RXN-LI-05", "Difficulty": "3", "Source_Category": "Original practice", "Points": ["No", "The differences are comparable to the balance resolution and could reflect measurement variation"]}, {"ID": "SCI045", "Front": "Why include the cap in both weighings when testing conservation of mass?", "Back": "To measure the same system before and after, including the apparatus mass in both readings.", "Tags": "Year9Science::ChemicalReactions::ConservationOfMass RXN-LI-05", "Learning_Intent": "RXN-LI-05", "Difficulty": "3", "Source_Category": "Original practice", "Points": ["To measure the same system before and after, including the apparatus mass in both readings"]}, {"ID": "SCI046", "Front": "Why should the gas produced in an acid–carbonate mass test be collected with a flexible gas-tight attachment under teacher supervision?", "Back": "It retains the gas for the mass reading while allowing expansion, avoiding pressure build-up in a rigid sealed flask.", "Tags": "Year9Science::ChemicalReactions::ConservationOfMass RXN-LI-05", "Learning_Intent": "RXN-LI-05", "Difficulty": "3", "Source_Category": "Original practice", "Points": ["Retains the gas so it is included in the mass reading", "Allows expansion and avoids pressure build-up"]}, {"ID": "SCI047", "Front": "A closed vessel contains 15 g of solid and 30 g of liquid before reaction. Afterwards 4 g of gas is present. What is the combined mass of all non-gas contents?", "Back": "41 g, from 45 − 4.", "Tags": "Year9Science::ChemicalReactions::ConservationOfMass RXN-LI-05", "Learning_Intent": "RXN-LI-05", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["41 g, from 45 − 4"]}, {"ID": "SCI048", "Front": "What is an ionic bond?", "Back": "Electrostatic attraction between oppositely charged ions.", "Tags": "Year9Science::ChemicalReactions::IonicBonding RXN-LI-06", "Learning_Intent": "RXN-LI-06", "Difficulty": "1", "Source_Category": "Original practice", "Points": ["Electrostatic attraction between oppositely charged ions"]}, {"ID": "SCI049", "Front": "Define cation.", "Back": "A positively charged ion.", "Tags": "Year9Science::ChemicalReactions::IonicBonding RXN-LI-06", "Learning_Intent": "RXN-LI-06", "Difficulty": "1", "Source_Category": "Original practice", "Points": ["A positively charged ion"]}, {"ID": "SCI050", "Front": "Define anion.", "Back": "A negatively charged ion.", "Tags": "Year9Science::ChemicalReactions::IonicBonding RXN-LI-06", "Learning_Intent": "RXN-LI-06", "Difficulty": "1", "Source_Category": "Original practice", "Points": ["A negatively charged ion"]}, {"ID": "SCI051", "Front": "Why does losing an electron give a neutral atom a positive charge?", "Back": "It leaves one more proton than electron.", "Tags": "Year9Science::ChemicalReactions::IonicBonding RXN-LI-06", "Learning_Intent": "RXN-LI-06", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["It leaves one more proton than electron"]}, {"ID": "SCI052", "Front": "Why does gaining an electron give a neutral atom a negative charge?", "Back": "It leaves one more electron than proton.", "Tags": "Year9Science::ChemicalReactions::IonicBonding RXN-LI-06", "Learning_Intent": "RXN-LI-06", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["It leaves one more electron than proton"]}, {"ID": "SCI053", "Front": "What ion forms when magnesium loses two electrons?", "Back": "Mg²⁺.", "Tags": "Year9Science::ChemicalReactions::IonicBonding RXN-LI-06", "Learning_Intent": "RXN-LI-06", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["Mg²⁺"]}, {"ID": "SCI054", "Front": "What ion forms when oxygen gains two electrons?", "Back": "O²⁻.", "Tags": "Year9Science::ChemicalReactions::IonicBonding RXN-LI-06", "Learning_Intent": "RXN-LI-06", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["O²⁻"]}, {"ID": "SCI055", "Front": "How many electrons does one chlorine atom gain when forming Cl⁻?", "Back": "One.", "Tags": "Year9Science::ChemicalReactions::IonicBonding RXN-LI-06", "Learning_Intent": "RXN-LI-06", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["One"]}, {"ID": "SCI056", "Front": "How many electrons does one aluminium atom lose when forming Al³⁺?", "Back": "Three.", "Tags": "Year9Science::ChemicalReactions::IonicBonding RXN-LI-06", "Learning_Intent": "RXN-LI-06", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["Three"]}, {"ID": "SCI057", "Front": "Which particle transfers in the school model of ionic bonding: a proton, a neutron or an electron?", "Back": "An electron, normally from the outer shell of the donor atom.", "Tags": "Year9Science::ChemicalReactions::IonicBonding RXN-LI-06", "Learning_Intent": "RXN-LI-06", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["An electron, normally from the outer shell of the donor atom"]}, {"ID": "SCI058", "Front": "What happens to sodium’s nucleus when sodium forms Na⁺?", "Back": "Its proton and neutron counts stay the same.", "Tags": "Year9Science::ChemicalReactions::IonicBonding RXN-LI-06", "Learning_Intent": "RXN-LI-06", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["Its proton and neutron counts stay the same"]}, {"ID": "SCI059", "Front": "How should a chloride ion appear in a sodium chloride dot-and-cross diagram?", "Back": "In brackets labelled Cl⁻, with seven original valence electrons and one transferred electron distinguished by symbol.", "Tags": "Year9Science::ChemicalReactions::IonicBonding RXN-LI-06", "Learning_Intent": "RXN-LI-06", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["Enclose Cl⁻ in brackets", "Show seven original valence electrons and one transferred electron", "Use a different symbol for the transferred electron"]}, {"ID": "SCI060", "Front": "In a dot-and-cross diagram, why use two symbols for electrons?", "Back": "They show which atom supplied each electron. The electrons themselves have identical charge.", "Tags": "Year9Science::ChemicalReactions::IonicBonding RXN-LI-06", "Learning_Intent": "RXN-LI-06", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["They show which atom supplied each electron", "The electrons themselves have identical charge"]}, {"ID": "SCI061", "Front": "Explain how magnesium and oxygen form the ions in magnesium oxide.", "Back": "Each Mg atom transfers two electrons to one O atom. Mg²⁺ and O²⁻ form and attract electrostatically.", "Tags": "Year9Science::ChemicalReactions::IonicBonding RXN-LI-06", "Learning_Intent": "RXN-LI-06", "Difficulty": "3", "Source_Category": "Original practice", "Points": ["One Mg atom transfers two electrons to one O atom", "Mg²⁺ and O²⁻ form", "Opposite charges attract"]}, {"ID": "SCI062", "Front": "A student writes “calcium gives two electrons to each chlorine atom”. Correct the transfer count.", "Back": "One calcium atom loses two electrons in total. Two chlorine atoms gain one each.", "Tags": "Year9Science::ChemicalReactions::IonicBonding RXN-LI-06", "Learning_Intent": "RXN-LI-06", "Difficulty": "3", "Source_Category": "Original practice", "Points": ["One calcium atom loses two electrons in total", "Two chlorine atoms gain one each"]}, {"ID": "SCI063", "Front": "What is the shell arrangement of Mg²⁺ formed from Mg with arrangement 2,8,2?", "Back": "2,8.", "Tags": "Year9Science::ChemicalReactions::IonicBonding RXN-LI-06", "Learning_Intent": "RXN-LI-06", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["2,8"]}, {"ID": "SCI064", "Front": "What is the shell arrangement of F⁻ formed from F with arrangement 2,7?", "Back": "2,8.", "Tags": "Year9Science::ChemicalReactions::IonicBonding RXN-LI-06", "Learning_Intent": "RXN-LI-06", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["2,8"]}, {"ID": "SCI065", "Front": "Why are separate NaCl molecules a poor model of solid sodium chloride?", "Back": "Its ions form a repeating lattice. Each ion interacts electrostatically with multiple neighbouring ions.", "Tags": "Year9Science::ChemicalReactions::IonicBonding RXN-LI-06", "Learning_Intent": "RXN-LI-06", "Difficulty": "3", "Source_Category": "Original practice", "Points": ["Sodium and chloride ions form a repeating lattice", "Each ion attracts multiple oppositely charged neighbours"]}, {"ID": "SCI066", "Front": "Why does the same transfer that produces Na⁺ also produce a negative ion when chlorine is the acceptor?", "Back": "The electron lost by sodium is gained by chlorine, so one loses negative charge and the other gains it.", "Tags": "Year9Science::ChemicalReactions::IonicBonding RXN-LI-06", "Learning_Intent": "RXN-LI-06", "Difficulty": "3", "Source_Category": "Original practice", "Points": ["Sodium loses an electron and becomes positive", "Chlorine gains that electron and becomes negative"]}, {"ID": "SCI067", "Front": "An ion diagram shows oxide surrounded by seven outer-shell electrons. What is wrong?", "Back": "Oxide O²⁻ has eight outer-shell electrons: six original and two gained.", "Tags": "Year9Science::ChemicalReactions::IonicBonding RXN-LI-06", "Learning_Intent": "RXN-LI-06", "Difficulty": "3", "Source_Category": "Original practice", "Points": ["Oxide O²⁻ has eight outer-shell electrons: six original and two gained"]}, {"ID": "SCI068", "Front": "A student says “ionic bonding is electron transfer”. What extra point earns the bonding mark?", "Back": "Electrostatic attraction between the oppositely charged ions holds the solid together.", "Tags": "Year9Science::ChemicalReactions::IonicBonding RXN-LI-06", "Learning_Intent": "RXN-LI-06", "Difficulty": "3", "Source_Category": "Original practice", "Points": ["Electrostatic attraction between the oppositely charged ions holds the solid together"]}, {"ID": "SCI069", "Front": "Write the formula for lithium chloride from Li⁺ and Cl⁻.", "Back": "LiCl. The charges cancel in a 1:1 ratio.", "Tags": "Year9Science::ChemicalReactions::IonicNamesAndFormulas RXN-LI-07", "Learning_Intent": "RXN-LI-07", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["LiCl", "The charges cancel in a 1:1 ratio"]}, {"ID": "SCI070", "Front": "Write the formula for sodium oxide from Na⁺ and O²⁻.", "Back": "Na₂O. Two Na⁺ ions balance one O²⁻.", "Tags": "Year9Science::ChemicalReactions::IonicNamesAndFormulas RXN-LI-07", "Learning_Intent": "RXN-LI-07", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["Na₂O", "Two Na⁺ ions balance one O²⁻"]}, {"ID": "SCI071", "Front": "Write the formula for calcium chloride from Ca²⁺ and Cl⁻.", "Back": "CaCl₂. One Ca²⁺ balances two Cl⁻ ions.", "Tags": "Year9Science::ChemicalReactions::IonicNamesAndFormulas RXN-LI-07", "Learning_Intent": "RXN-LI-07", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["CaCl₂", "One Ca²⁺ balances two Cl⁻ ions"]}, {"ID": "SCI072", "Front": "Write the formula for calcium sulfide from Ca²⁺ and S²⁻.", "Back": "CaS. The charges cancel in a 1:1 ratio.", "Tags": "Year9Science::ChemicalReactions::IonicNamesAndFormulas RXN-LI-07", "Learning_Intent": "RXN-LI-07", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["CaS", "The charges cancel in a 1:1 ratio"]}, {"ID": "SCI073", "Front": "Write the formula for magnesium bromide from Mg²⁺ and Br⁻.", "Back": "MgBr₂.", "Tags": "Year9Science::ChemicalReactions::IonicNamesAndFormulas RXN-LI-07", "Learning_Intent": "RXN-LI-07", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["MgBr₂"]}, {"ID": "SCI074", "Front": "Write the formula for lithium nitride from Li⁺ and N³⁻.", "Back": "Li₃N.", "Tags": "Year9Science::ChemicalReactions::IonicNamesAndFormulas RXN-LI-07", "Learning_Intent": "RXN-LI-07", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["Li₃N"]}, {"ID": "SCI075", "Front": "Write the formula for aluminium fluoride from Al³⁺ and F⁻.", "Back": "AlF₃.", "Tags": "Year9Science::ChemicalReactions::IonicNamesAndFormulas RXN-LI-07", "Learning_Intent": "RXN-LI-07", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["AlF₃"]}, {"ID": "SCI076", "Front": "Name MgO.", "Back": "Magnesium oxide.", "Tags": "Year9Science::ChemicalReactions::IonicNamesAndFormulas RXN-LI-07", "Learning_Intent": "RXN-LI-07", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["Magnesium oxide"]}, {"ID": "SCI077", "Front": "Name K₂S.", "Back": "Potassium sulfide.", "Tags": "Year9Science::ChemicalReactions::IonicNamesAndFormulas RXN-LI-07", "Learning_Intent": "RXN-LI-07", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["Potassium sulfide"]}, {"ID": "SCI078", "Front": "Name Na₃N.", "Back": "Sodium nitride.", "Tags": "Year9Science::ChemicalReactions::IonicNamesAndFormulas RXN-LI-07", "Learning_Intent": "RXN-LI-07", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["Sodium nitride"]}, {"ID": "SCI079", "Front": "Name AlCl₃.", "Back": "Aluminium chloride.", "Tags": "Year9Science::ChemicalReactions::IonicNamesAndFormulas RXN-LI-07", "Learning_Intent": "RXN-LI-07", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["Aluminium chloride"]}, {"ID": "SCI080", "Front": "Why does Cl in calcium chloride use the ending “-ide”?", "Back": "Chlorine forms a monatomic anion called chloride.", "Tags": "Year9Science::ChemicalReactions::IonicNamesAndFormulas RXN-LI-07", "Learning_Intent": "RXN-LI-07", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["Chlorine forms a monatomic anion called chloride"]}, {"ID": "SCI081", "Front": "What ratio of potassium to oxygen ions is shown by K₂O?", "Back": "2:1.", "Tags": "Year9Science::ChemicalReactions::IonicNamesAndFormulas RXN-LI-07", "Learning_Intent": "RXN-LI-07", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["2:1"]}, {"ID": "SCI082", "Front": "A student writes Mg₂O₂ using Mg²⁺ and O²⁻. What formula should they write?", "Back": "MgO. An ionic formula gives the simplest whole-number ratio.", "Tags": "Year9Science::ChemicalReactions::IonicNamesAndFormulas RXN-LI-07", "Learning_Intent": "RXN-LI-07", "Difficulty": "3", "Source_Category": "Original practice", "Points": ["MgO", "An ionic formula gives the simplest whole-number ratio"]}, {"ID": "SCI083", "Front": "From Al³⁺ and S²⁻, derive the formula of aluminium sulfide.", "Back": "Al₂S₃. Two Al³⁺ ions give +6 and three S²⁻ ions give −6.", "Tags": "Year9Science::ChemicalReactions::IonicNamesAndFormulas RXN-LI-07", "Learning_Intent": "RXN-LI-07", "Difficulty": "3", "Source_Category": "Original practice", "Points": ["Al₂S₃", "Two Al³⁺ ions give +6 and three S²⁻ ions give −6"]}, {"ID": "SCI084", "Front": "Write the formula for calcium nitride using Ca²⁺ and N³⁻.", "Back": "Ca₃N₂. The total charges are +6 and −6.", "Tags": "Year9Science::ChemicalReactions::IonicNamesAndFormulas RXN-LI-07", "Learning_Intent": "RXN-LI-07", "Difficulty": "3", "Source_Category": "Origin
