<script id="content" type="application/json">{"exams": [{"name": "Mock 1 · Baseline", "questions": [{"q": "Which sample is a pure compound?", "options": ["O₂", "Air", "CO₂", "Helium"], "correct": 2, "a": "CO₂ has two elements chemically bonded in one pure substance.", "m": 1}, {"q": "An atom has 15 protons and 16 neutrons. What is its mass number?", "options": ["1", "15", "16", "31"], "correct": 3, "a": "Mass number is 15 + 16 = 31.", "m": 1}, {"q": "Which pair describes a magnesium ion and a chloride ion?", "options": ["Mg⁺ and Cl⁻", "Mg²⁺ and Cl⁻", "Mg²⁻ and Cl⁺", "Mg²⁺ and Cl²⁻"], "correct": 1, "a": "Mg loses two electrons and chlorine gains one.", "m": 1}, {"q": "How many lone pairs are on nitrogen in ammonia, NH₃?", "options": ["One", "Two", "Three", "Four"], "correct": 0, "a": "Nitrogen makes three single bonds and retains one lone pair.", "m": 1}, {"q": "Which coefficient goes before H₂O in the lowest whole-number equation for complete combustion of CH₄?", "options": ["1", "2", "3", "4"], "correct": 1, "a": "CH₄ + 2O₂ → CO₂ + 2H₂O conserves all atoms.", "m": 1}, {"q": "Which gas turns limewater cloudy?", "options": ["Hydrogen", "Oxygen", "Nitrogen", "Carbon dioxide"], "correct": 3, "a": "Carbon dioxide forms insoluble calcium carbonate in limewater.", "m": 1}, {"q": "What type of reaction is 2H₂O₂ → 2H₂O + O₂?", "options": ["Decomposition", "Neutralisation", "Displacement", "Synthesis"], "correct": 0, "a": "One reactant breaks down into multiple products.", "m": 1}, {"q": "At room temperature, which pH value is most acidic?", "options": ["2", "5", "7", "11"], "correct": 0, "a": "The lowest pH has the greatest acidity.", "m": 1}, {"q": "A catalyst increases the rate of a reaction primarily by providing what?", "options": ["Extra product", "A higher activation energy pathway", "A lower activation energy pathway", "A higher temperature"], "correct": 2, "a": "An alternative pathway with lower activation energy enables more successful reactions.", "m": 1}, {"q": "What best explains the higher reaction rate of a powder compared with a single lump of equal mass?", "options": ["Powder particles contain more atoms overall", "The powder provides more exposed surface", "The powder always forms more product", "The lump has a higher concentration"], "correct": 1, "a": "More exposed surface allows more frequent collisions at the interface.", "m": 1}, {"q": "Which event describes nuclear fusion?", "options": ["A large nucleus splits", "A nucleus emits an alpha particle", "An atom gains an electron", "Light nuclei combine into a heavier nucleus"], "correct": 3, "a": "Fusion combines light nuclei.", "m": 1}, {"q": "In beta-minus decay, how do the daughter nucleus’s mass number and atomic number change?", "options": ["A unchanged, Z increases by 1", "A falls by 4, Z falls by 2", "A unchanged, Z decreases by 1", "A increases by 1, Z unchanged"], "correct": 0, "a": "A neutron becomes a proton. Nucleon number remains constant.", "m": 1}, {"q": "Which example requires a medium to propagate?", "options": ["Visible light", "Radio signal", "Sound", "X-rays"], "correct": 2, "a": "Sound is a mechanical wave.", "m": 1}, {"q": "Which separation is one wavelength in a longitudinal wave?", "options": ["Compression to adjacent rarefaction", "Compression to next compression", "Maximum particle displacement", "Wavefront to normal"], "correct": 1, "a": "Successive compressions are points at the same phase.", "m": 1}, {"q": "What is the period of a 250 Hz vibration?", "options": ["0.004 s", "0.25 s", "4 s", "250 s"], "correct": 0, "a": "T = 1/250 = 0.004 s.", "m": 1}, {"q": "Which ear structure contains the sensory hair cells responsible for hearing?", "options": ["Pinna", "Eardrum", "Ear canal", "Cochlea"], "correct": 3, "a": "Hair cells in the cochlea convert mechanical motion into signals.", "m": 1}, {"q": "Which structure detects rotational acceleration of the head?", "options": ["Retina", "Eardrum", "Semicircular canals", "Optic nerve"], "correct": 2, "a": "Fluid motion in the semicircular canals helps detect head rotation.", "m": 1}, {"q": "A siren moves away from a stationary observer in still air. How does the heard frequency compare with the emitted frequency?", "options": ["Higher", "Lower", "Identical", "Zero"], "correct": 1, "a": "Wavefronts behind the source are farther apart, so fewer arrive per second.", "m": 1}, {"q": "What does the iris regulate?", "options": ["Focusing by changing its own curvature", "Neural signals in the optic nerve", "Sound transmission", "Amount of light entering through the pupil"], "correct": 3, "a": "The iris changes pupil size and controls light entry.", "m": 1}, {"q": "What angle does a ray reflected from a flat mirror make with the normal if the incident ray is 30° from the surface?", "options": ["60°", "30°", "90°", "15°"], "correct": 0, "a": "The incident angle is 90° − 30° = 60° from the normal and equals the reflected angle.", "m": 1}, {"q": "Explain how magnesium and chlorine form magnesium chloride. State its formula, ion charges, number of electrons transferred per magnesium atom and the attraction that holds the ions together.", "a": "MgCl₂ [1]. Mg²⁺ and Cl⁻ [1]. One Mg loses two electrons and two Cl atoms gain one each [1]. Electrostatic attraction between opposite ions holds the solid together [1]. MgCl loses the formula mark. “Atoms attract” does not specify oppositely charged ions.", "m": 4}, {"q": "Write the word equation for hydrochloric acid reacting with calcium carbonate.", "a": "Hydrochloric acid + calcium carbonate [1] → calcium chloride + carbon dioxide + water [1]. Omitting water loses the product mark.", "m": 2}, {"q": "Balance CaCO₃ + HCl → CaCl₂ + CO₂ + H₂O and show how the hydrogen count matches.", "a": "CaCO₃ + 2HCl → CaCl₂ + CO₂ + H₂O [1]. Two H atoms on each side [1]. Changing a subscript alters a substance.", "m": 2}, {"q": "A beaker and contents have a mass of 96.8 g before the reaction and 95.7 g after. Only carbon dioxide leaves. Calculate its mass and explain conservation of mass in this case.", "a": "96.8 − 95.7 = 1.1 g [1]. The gas still has mass, but it left the measured system [1]. “Mass was destroyed” loses the explanation mark.", "m": 2}, {"q": "Plot the simulated results in the table on the grid. Draw a smooth curve for each trial and label which curve is which.\nTime (s): 0, 10, 20, 30, 40, 50, 60\nPowder (mL): 0, 22, 34, 39, 40, 40, 40\nChips (mL): 0, 11, 20, 27, 33, 37, 40", "a": "Time on horizontal axis and volume on vertical axis, with units [1]. Suitable linear scales [1]. All values plotted correctly [1]. Both curves smooth and distinguished [1]. Swapping axes or omitting units loses the axis mark.", "m": 4}, {"q": "Calculate the mean rate over the first 20 seconds for each trial.\nTime (s): 0, 10, 20, 30, 40, 50, 60\nPowder (mL): 0, 22, 34, 39, 40, 40, 40\nChips (mL): 0, 11, 20, 27, 33, 37, 40", "a": "Powder: (34 − 0)/20 = 1.7 mL/s [1]. Chips: (20 − 0)/20 = 1.0 mL/s [1]. Reporting the volume at 20 s alone does not give a rate.", "m": 2}, {"q": "Explain why the powder gives a steeper initial curve but the same final volume. The acid is in excess and the masses of pure calcium carbonate are equal.\nTime (s): 0, 10, 20, 30, 40, 50, 60\nPowder (mL): 0, 22, 34, 39, 40, 40, 40\nChips (mL): 0, 11, 20, 27, 33, 37, 40", "a": "More exposed surface gives more successful collisions per second [1]. Equal amounts of limiting calcium carbonate yield equal final amounts of carbon dioxide [1]. A faster rate alone does not imply greater yield.", "m": 2}, {"q": "One student uses warm acid for the powder and room-temperature acid for the chips. Identify the problem and suggest a specific fix.\nTime (s): 0, 10, 20, 30, 40, 50, 60\nPowder (mL): 0, 22, 34, 39, 40, 40, 40\nChips (mL): 0, 11, 20, 27, 33, 37, 40", "a": "Temperature is a confounding variable that can alter the reaction rate [1]. Equilibrate both samples to the same measured temperature, for example using the same controlled water bath [1]. Repeating the flawed setup does not isolate surface area.", "m": 2}, {"q": "Uranium-238 (Z = 92) undergoes alpha decay. Write the balanced nuclear equation. The element with Z = 90 is thorium (Th).", "a": "²³⁸₉₂U → ²³⁴₉₀Th + ⁴₂He. Award [1] for alpha notation, [1] for daughter mass number 234, and [1] for Th with atomic number 90. Mass number falls by four and atomic number by two.", "m": 3}, {"q": "A sample initially contains 64 mg of iodine-131, whose half-life is 8 days. Calculate the mass of iodine-131 remaining after 24 days.", "a": "24/8 = 3 half-lives [1]. 64 × (1/2)³ [1] = 8 mg [1]. Subtracting a fixed mass each time misrepresents decay.", "m": 3}, {"q": "A tone in air has wavelength 85 cm. Use a sound speed of 340 m/s to calculate its frequency.", "a": "85 cm = 0.85 m [1]. f = v/λ = 340/0.85 [1] = 400 Hz [1]. Using 85 in the division skips the unit conversion.", "m": 3}, {"q": "A microphone trace for a second tone has the same period but twice the amplitude. For tones played in the same setup, compare their pitch and perceived loudness.", "a": "Same pitch because the frequency is the same [1]. The second tone is louder because the amplitude is greater [1]. Twice the amplitude does not establish twice the perceived loudness.", "m": 2}, {"q": "Describe two steps from eardrum vibration to the production of neural signals.", "a": "Ossicles transmit vibrations from the eardrum to the inner ear [1]. The resulting motion in the cochlea stimulates hair cells, leading to neural signals [1]. The auditory nerve carries neural signals rather than vibrations.", "m": 2}, {"q": "Draw a ray passing obliquely from air into glass. Label the boundary and normal, show the direction and draw the refracted ray.", "a": "Boundary and perpendicular normal labelled [1]. Incident ray travels from air to boundary at an oblique angle [1]. Ray continues into glass at a smaller angle to the normal, with direction shown [1]. Measure angles from the normal.", "m": 3}, {"q": "Describe how light entering the eye leads to a visual perception. Include the cornea, lens, retina and optic nerve.", "a": "Cornea refracts incoming light [1]. Lens adjusts focus to form an image on the retina [1]. Retinal photoreceptors respond to light and initiate neural signalling [1]. Optic nerve carries signals to the brain for processing [1]. The lens does not send signals to the brain.", "m": 4}]}, {"name": "Mock 2 · Application and reasoning", "questions": [{"q": "A transverse wave has an amplitude of 3 cm. What is its crest-to-trough height?", "options": ["6 cm", "1.5 cm", "3 cm", "9 cm"], "correct": 0, "a": "The crest and trough are each one amplitude from equilibrium.", "m": 1}, {"q": "How many oxygen atoms are represented by 2CO₂?", "options": ["6", "2", "4", "3"], "correct": 2, "a": "Each molecule has two oxygen atoms.", "m": 1}, {"q": "What carries signals from retinal processing to the brain?", "options": ["Iris", "Lens", "Cornea", "Optic nerve"], "correct": 3, "a": "Retinal ganglion cell axons form the optic nerve.", "m": 1}, {"q": "An isotope starts at 64 mg and undergoes 2 half-lives. What parent mass remains?", "options": ["16 mg", "8 mg", "64 mg", "32 mg"], "correct": 0, "a": "Divide by 2^2.", "m": 1}, {"q": "What daughter mass number follows alpha decay of a parent with mass number 222?", "options": ["226", "218", "222", "220"], "correct": 1, "a": "The alpha particle carries four nucleons.", "m": 1}, {"q": "A vibration completes 20 cycles in 2 s. Find its frequency.", "options": ["20 Hz", "2 Hz", "40 Hz", "10 Hz"], "correct": 3, "a": "Frequency is number of cycles divided by elapsed time.", "m": 1}, {"q": "A neutral atom with 10 protons loses two electrons. How many electrons remain?", "options": ["8", "10", "9", "12"], "correct": 0, "a": "It starts with 10 electrons and loses two.", "m": 1}, {"q": "Which component detects angular acceleration of the head?", "options": ["Semicircular canals", "Optic nerve", "Eardrum", "Retina"], "correct": 0, "a": "The semicircular canals detect changes in rotational motion.", "m": 1}, {"q": "An isotope has mass number 24 and atomic number 10. How many neutrons are present?", "options": ["14", "24", "10", "34"], "correct": 0, "a": "N = A − Z = 24 − 10 = 14.", "m": 1}, {"q": "Two successive compressions are at 1 cm and 9 cm. What is the wavelength?", "options": ["8 cm", "10 cm", "9 cm", "1 cm"], "correct": 0, "a": "Subtract positions of adjacent compressions.", "m": 1}, {"q": "A 80 Hz wave travels at 320 m/s. Find its wavelength.", "options": ["4 m", "0.25 m", "25600 m", "80 m"], "correct": 0, "a": "λ = v/f.", "m": 1}, {"q": "Which pH is most alkaline among these solutions at room temperature?", "options": ["8", "7", "1", "9"], "correct": 3, "a": "The greatest pH is most alkaline.", "m": 1}, {"q": "Which formula is charge-balanced and in the simplest ratio for K⁺ and S²⁻?", "options": ["K₂S", "K₂S₂", "KS", "KS₂"], "correct": 0, "a": "The smallest ion ratio makes the net charge zero.", "m": 1}, {"q": "Which change raises the rate by lowering activation energy?", "options": ["Increasing concentration", "Increasing temperature", "Grinding a solid", "Adding a catalyst"], "correct": 3, "a": "A catalyst changes the pathway.", "m": 1}, {"q": "A sealed apparatus has mass 95.0 g initially. What total mass should it have after a chemical reaction?", "options": ["95.0 g", "94.0 g", "93.0 g", "96.0 g"], "correct": 0, "a": "Matter remains in the closed apparatus.", "m": 1}, {"q": "A ray hits a mirror at 20° to the normal. What is its reflection angle from the normal?", "options": ["20°", "90°", "27°", "70°"], "correct": 0, "a": "The angles of incidence and reflection are equal.", "m": 1}, {"q": "Gas rises from 2 to 26 mL in 4 s. What is the average rate?", "options": ["7 mL/s", "5 mL/s", "6 mL/s", "24 mL/s"], "correct": 2, "a": "Rate = (26 − 2)/4.", "m": 1}, {"q": "Why does a sanded metal surface return light in many directions?", "options": ["Light frequency becomes zero", "Every local surface is parallel", "Surface orientations vary locally", "The metal transmits all light"], "correct": 2, "a": "Different orientations redirect reflected rays.", "m": 1}, {"q": "What causes the pitch shift when a listener runs towards a stationary bell?", "options": ["The bell’s frequency rises", "The sound travels faster through still air", "Wavefront spacing from the bell changes", "The listener meets wavefronts more frequently"], "correct": 3, "a": "Listener motion changes wavefront encounter rate.", "m": 1}, {"q": "A signal completes one cycle in 3 ms. Which period is correct in seconds?", "options": ["0.003 s", "0.3 s", "0.03 s", "3 s"], "correct": 0, "a": "Divide milliseconds by 1000.", "m": 1}, {"q": "Use Al³⁺ and O²⁻ to deduce the formula of the ionic compound. Account for the donor and acceptor atom counts, total electrons transferred and bonding force.", "a": "Al₂O₃ [1]. Correct donor count [1] and acceptor count [1]: 2 Al atoms each lose three electrons and 3 O atoms each gain two. Total electrons transferred: 6 [1]. Electrostatic attraction between opposite ions [1].", "m": 5}, {"q": "Draw the Lewis structure of CO₂. Identify bonding and lone pairs and contrast the bond model with the ionic model in Question 21.", "a": "O=C=O, with two lone pairs on each oxygen. Award correct connectivity [1], correct bond orders [1], correct lone pairs [1], electron sharing identified [1], and contrast with ionic attraction between oppositely charged ions formed by electron transfer [1].", "m": 5}, {"q": "Balance Al + O₂ → Al₂O₃. Show how atom counts match for two elements. Explain why changing a subscript is invalid.", "a": "4Al + 3O₂ → 2Al₂O₃ [2 for all coefficients, or 1 for a consistent non-minimal balanced multiple]. Give the matching count for any two distinct elements [1 each]. Subscripts change chemical identities [1].", "m": 5}, {"q": "²⁴¹₉₅Am emits an alpha particle. Give the equation using daughter symbol Np and explain how you found both daughter numbers.", "a": "²⁴¹₉₅Am → t parent mass remains?", "options": ["192 mg", "12 mg", "24 mg", "48 mg"], "correct": 2, "a": "Divide by 2^3.", "m": 1}, {"q": "An isotope has mass number 36 and atomic number 14. How many neutrons are present?", "options": ["22", "36", "50", "14"], "correct": 0, "a": "N = A − Z = 36 − 14 = 22.", "m": 1}, {"q": "A transverse wave has an amplitude of 7 cm. What is its crest-to-trough height?", "options": ["3.5 cm", "14 cm", "7 cm", "21 cm"], "correct": 1, "a": "The crest and trough are each one amplitude from equilibrium.", "m": 1}, {"q": "Which example can indicate that total product yield is equal?", "options": ["Two gas curves plateau at the same volume under the same collection conditions", "They use different labels", "They start at the same time", "They have different initial gradients"], "correct": 0, "a": "The plateau shows final collected gas volume.", "m": 1}, {"q": "A signal completes one cycle in 7 ms. Which period is correct in seconds?", "options": ["0.07 s", "0.007 s", "7 s", "0.7 s"], "correct": 1, "a": "Divide milliseconds by 1000.", "m": 1}, {"q": "Use Al³⁺ and S²⁻ to deduce the formula of the ionic compound. Account for the donor and acceptor atom counts, total electrons transferred and bonding force.", "a": "Al₂S₃ [1]. Correct donor count [1] and acceptor count [1]: 2 Al atoms each lose three electrons and 3 S atoms each gain two. Total electrons transferred: 6 [1]. Electrostatic attraction between opposite ions [1].", "m": 5}, {"q": "Draw the Lewis structure of CH₄. Identify bonding and lone pairs and contrast the bond model with the ionic model in Question 21.", "a": "Four single C–H bonds and no lone pairs. Award correct connectivity [1], correct bond orders [1], correct lone pairs [1], electron sharing identified [1], and contrast with ionic attraction between oppositely charged ions formed by electron transfer [1].", "m": 5}, {"q": "Balance C₂H₆ + O₂ → CO₂ + H₂O. Show how atom counts match for two elements. Explain why changing a subscript is invalid.", "a": "2C₂H₆ + 7O₂ → 4CO₂ + 6H₂O [2 for all coefficients, or 1 for a consistent non-minimal balanced multiple]. Give the matching count for any two distinct elements [1 each]. Subscripts change chemical identities [1].", "m": 5}, {"q": "²¹²₈₄Po emits an alpha particle. Give the equation using daughter symbol Pb and explain how you found both daughter numbers.", "a": "²¹²₈₄Po → ²⁰⁸₈₂Pb + ⁴₂He. Award correct alpha notation [1], correct daughter mass number [1], correct daughter atomic number and symbol [1], conservation A: 212 − 4 [1], conservation Z: 84 − 2 [1].", "m": 5}, {"q": "After 21 h, a sample of a nuclide with a 7 h half-life has 48 mg of parent left. Calculate the initial parent mass and the percentage remaining.", "a": "21/7 = 3 half-lives [1]. Initial = 48 × 2^3 [1] = 384 mg [1]. Remaining = 100/2^3 = 12.5% [1].", "m": 4}, {"q": "A wave has wavelength 84 cm and period 7 ms. Find its speed and predict how its wavelength changes if frequency doubles while speed stays constant.", "a": "λ = 0.84 m [1]. T = 0.007 s [1]. v = λ/T = 120 m/s [1]. λ halves because λ = v/f [1].", "m": 4}, {"q": "Explain why a mirror gives a clear reflected image but rough paper is visible from many positions. Include the law of reflection.", "a": "Mirror is smooth [1]. Its local normals are similar so rays are reflected in ordered directions [1]. Paper has varied local normals and redirects rays in many directions [1]. At each point incidence and reflection angles are equal from the normal [1].", "m": 4}, {"q": "The simulated data compare runs A and B in an investigation of concentration. Plot both curves. Calculate the first-interval mean rates. Explain why the data alone cannot establish that concentration caused the difference, and propose a controlled follow-up.\nTime (s) | A (mL) | B (mL)\n0 | 0 | 0\n9 | 14 | 9\n18 | 28 | 20\n27 | 40 | 40\n36 | 40 | 40", "a": "Time and volume axes with units and linear scales [1]. Correct points and separately labelled curves [2]. Rate A = 14/9 = 1.56 mL/s [1]. Rate B = 9/9 = 1 mL/s [1]. The results give no controlled method or specified treatment values [1]. Change only concentration and make controls specific: Hold temperature, solid surface area and acid volume constant. [1]. Repeat each treatment and compare mean initial rates [1]. Expected mechanism if applicable: More reactant particles per unit volume increase successful collision frequency..", "m": 8}]}], "banks": [{"name": "Mixed warm-up", "questions": [{"q": "An atom of silicon has 14 protons and 15 neutrons. Give its mass number and neutral electron count.", "a": "29 and 14. Mass number is 14 + 15 and a neutral atom has one electron per proton.", "m": 1}, {"q": "Identify the particles that differ between carbon-12 and carbon-13.", "a": "Neutrons. Carbon-12 has six and carbon-13 has seven.", "m": 1}, {"q": "Name the ions present in potassium bromide and give their charges.", "a": "K⁺ and Br⁻. Potassium loses one electron and bromine gains one.", "m": 1}, {"q": "Using Ca²⁺ and N³⁻, deduce the formula of calcium nitride and account for the total electrons transferred per formula ratio.", "a": "Ca₃N₂. Three Ca atoms lose two electrons each. Two N atoms gain three each. Six electrons are transferred.", "m": 1}, {"q": "Draw a dot-and-cross diagram for lithium fluoride, showing only outer-shell electrons on fluorine. Identify the transferred electron.", "a": "Show [Li]⁺ and [F]⁻. Place eight electrons around F, seven of one symbol and one of another. The distinct symbol represents the electron originally on Li.", "m": 1}, {"q": "Draw the Lewis structure of methane and count its shared and lone pairs.", "a": "Draw carbon in the centre with four single C–H bonds. There are four shared pairs and no lone pairs.", "m": 1}, {"q": "Balance C₂H₅OH + O₂ → CO₂ + H₂O for complete combustion.", "a": "C₂H₅OH + 3O₂ → 2CO₂ + 3H₂O. Each side has 2 C, 6 H and 7 O atoms.", "m": 1}, {"q": "Predict the products when zinc metal reacts with dilute hydrochloric acid and balance the equation.", "a": "Zn + 2HCl → ZnCl₂ + H₂. The products are zinc chloride and hydrogen.", "m": 1}, {"q": "Write the word equation for nitric acid reacting with potassium hydroxide.", "a": "Nitric acid + potassium hydroxide → potassium nitrate + water. The salt takes its cation from the base and anion from the acid.", "m": 1}, {"q": "Iron wool increases in mass when heated in air. Give a particle-level explanation and identify the system boundary responsible for the apparent change.", "a": "Oxygen from the air bonds with iron to form iron oxide. The initial weighing measured the iron wool only, so the oxygen incorporated from outside the measured system raises its mass.", "m": 1}, {"q": "A student says any bubbles prove a chemical reaction. Give one counterexample and an observation that would better support formation of hydrogen.", "a": "Boiling water forms vapour bubbles without changing chemical identity. A small sample of hydrogen makes a squeaky pop in the standard teacher-supervised gas test.", "m": 1}, {"q": "Which metal corrosion is specifically called rusting? State two substances usually needed for it.", "a": "Iron or steel corrosion. Both oxygen and water are needed for ordinary rusting.", "m": 1}, {"q": "Two equal masses of calcium carbonate powder react with equal volumes of acid in excess, but one acid is more concentrated. Predict the initial rate and final carbon dioxide amount.", "a": "Higher concentration produces more frequent successful collisions and a faster initial rate. The same amount of limiting calcium carbonate gives the same final amount of carbon dioxide.", "m": 1}, {"q": "Explain why raising temperature can make a reaction faster even if reactant concentration is controlled.", "a": "Particles move faster and a larger fraction of collisions have enough energy to overcome activation energy, so successful collisions occur more often.", "m": 1}, {"q": "Outline the main difference between early-universe nucleosynthesis and later stellar nucleosynthesis.", "a": "The early universe formed mainly hydrogen and helium nuclei with traces of light elements. Stars subsequently made heavier nuclei through nuclear reactions.", "m": 1}, {"q": "Strontium-90 (Z = 38) decays by beta-minus emission. Write the nuclear equation using Y for yttrium (Z = 39).", "a": "⁹⁰₃₈Sr → ⁹⁰₃₉Y + ⁰₋₁e in the school model. The nucleon totals are 90 and the charge numbers total 38 on each side. Full notation also includes an electron antineutrino.", "m": 1}, {"q": "A carbon-14 sample has 25% of its original carbon-14 remaining. Using a half-life of 5730 years, estimate elapsed time.", "a": "Two half-lives because 1/2 × 1/2 = 1/4. Elapsed time is 2 × 5730 = 11 460 years.", "m": 1}, {"q": "A tracer with a half-life of four hours is used in a simulated study. Give one advantage and one logistical drawback relative to a similar tracer with a four-day half-life.", "a": "Activity drops faster after use, reducing how long the source stays active. It must be produced, transported and measured on a tighter schedule before activity becomes too low.", "m": 1}, {"q": "Explain why a nuclear plant can have low operational greenhouse emissions and still have environmental impacts.", "a": "Fuel extraction and processing use resources and can disturb habitats. Construction, cooling water and long-term radioactive waste management also affect the life cycle.", "m": 1}, {"q": "Ammonia is produced by reacting nitrogen with hydrogen. Balance N₂ + H₂ → NH₃ and state one use.", "a": "N₂ + 3H₂ → 2NH₃. Ammonia is used to make nitrogen fertilisers.", "m": 1}, {"q": "A disturbance travels east and the particles oscillate north–south. Classify the wave and explain.", "a": "Transverse, because the oscillation is perpendicular to the direction of travel.", "m": 1}, {"q": "A rope trace has a crest 9 cm above equilibrium and a trough 9 cm below. Two adjacent crests are 0.45 m apart. Give amplitude and wavelength.", "a": "Amplitude 9 cm (0.09 m). Wavelength 0.45 m. Amplitude is measured from equilibrium.", "m": 1}, {"q": "A wave has wavelength 12 cm and period 8.0 ms. Calculate its speed.", "a": "0.12 m ÷ 0.0080 s = 15 m/s.", "m": 1}, {"q": "A radio signal has frequency 75 MHz. Using 3.0 × 10⁸ m/s in a vacuum, calculate its wavelength.", "a": "75 MHz = 75 × 10⁶ Hz. λ = v/f = 4.0 m.", "m": 1}, {"q": "A cyclist rides towards a stationary buzzer. Explain why the observed pitch increases even though the buzzer’s frequency is fixed.", "a": "The cyclist meets successive wavefronts more frequently while moving towards the source. Higher observed frequency gives higher pitch. The source continues emitting at its original frequency.", "m": 1}, {"q": "Explain why a ray can reflect from a mirror and scatter from rough white paper even though both redirect light.", "a": "A smooth mirror reflects parallel rays in a common direction. The rough paper redirects rays in many directions because its surface orientations vary.", "m": 1}, {"q": "A beam enters glass from air along the normal. Compare its direction and speed on either side.", "a": "Its direction is unchanged because the incidence angle is zero. Its speed decreases in glass.", "m": 1}, {"q": "At 20 °C, reaction times are 48, 49 and 48 s. At 35 °C, they are 31, 32 and 67 s. Identify an anomaly and explain how to handle it.", "a": "67 s is inconsistent with the other 35 °C repeats. Check timing and method records, repeat at 35 °C, and report any exclusion and its justification.", "m": 1}, {"q": "A student tests the effect of hydrochloric acid concentration on magnesium reaction rate. They use 10 mL for dilute acid and 30 mL for concentrated acid. Evaluate the method.", "a": "Volume varies alongside concentration, so the effect cannot be isolated. Use equal volumes, the same magnesium strip dimensions, controlled temperature and the same rate measure.", "m": 1}, {"q": "A graph of gas volume against time gives 8 mL at 5 s and 32 mL at 20 s. Calculate the mean rate over that interval and explain what it represents.", "a": "(32 − 8)/(20 − 5) = 1.6 mL/s. It is the average change per second from 5 to 20 s, not necessarily the instantaneous rate at either endpoint.", "m": 1}]}, {"name": "Learning intentions", "questions": [{"q": "Matter and particles. (a) Define matter. (b) A model contains identical particles, each formed from one black and two white spheres joined together. If colours represent different elements, how should the sample be classified?", "a": "(a) Matter has mass and occupies space. (b) A pure compound. Every particle is the same and contains atoms of two different elements.", "m": 1}, {"q": "Matter and particles. (a) What distinguishes a compound from an element? (b) What is a mixture?", "a": "(a) A compound contains atoms of at least two different elements chemically bonded. An element contains only one type of atom. (b) Two or more substances physically combined, with variable proportions.", "m": 1}, {"q": "Matter and particles. (a) Is a sample containing only O₂ molecules an element or a compound? Explain. (b) Which is an elemental substance: Cu, CuO or a blend of Cu and CuO?", "a": "(a) An element. Each molecule contains two atoms of the same element. (b) Cu. It contains only copper atoms.", "m": 1}, {"q": "Symbols and atomic number. (a) What does atomic number count? (b) How are elements ordered in the modern Periodic Table?", "a": "(a) Protons in the nucleus. (b) By increasing atomic number.", "m": 1}, {"q": "Symbols and atomic number. (a) What is the symbol for sodium? (b) A periodic table entry gives Z = 12 and a relative atomic mass of about 24.3. Which value identifies magnesium?", "a": "(a) Na. (b) 12, the atomic number.", "m": 1}, {"q": "Symbols and atomic number. (a) Explain why Co and CO represent different things. (b) What are the vertical columns of the Periodic Table called?", "a": "(a) Co is the element cobalt. CO is carbon monoxide, containing carbon and oxygen. (b) Groups.", "m": 1}, {"q": "Atomic structure. (a) Name the particles found in the atomic nucleus. (b) Give a limitation of drawing electron shells as circular lines around a nucleus.", "a": "(a) Protons and neutrons, except that the most common hydrogen nucleus has just one proton. (b) The lines represent energy levels schematically. Electrons do not follow fixed circular paths.", "m": 1}, {"q": "Atomic structure. (a) What are the relative charges of a proton, neutron and electron? (b) Why is the mass number of carbon-14 a whole number?", "a": "(a) +1, 0 and −1 respectively. (b) It counts discrete nucleons: six protons and eight neutrons.", "m": 1}, {"q": "Atomic structure. (a) What does mass number count? (b) A particle has 13 protons and 10 electrons. What is its charge?", "a": "(a) The total number of protons and neutrons in a nucleus. (b) 3+, because there are three more protons than electrons.", "m": 1}, {"q": "Rearrangement of atoms. (a) What is a reactant? (b) What happens to each element’s atom count in an ordinary chemical reaction?", "a": "(a) A starting substance consumed in a chemical reaction. (b) It stays the same across the complete set of reactants and products.", "m": 1}, {"q": "Rearrangement of atoms. (a) What is a product? (b) Someone says product properties must match the reactants because the atoms match. What is wrong with this reasoning?", "a": "(a) A substance formed in a chemical reaction. (b) Properties depend on how atoms are bonded and arranged. A new arrangement can give a substance different properties.", "m": 1}, {"q": "Rearrangement of atoms. (a) How can a reaction form a new substance using the same atoms? (b) Why is melting ice a physical change?", "a": "(a) The atoms become joined or arranged differently as bonds change. (b) The molecules remain H₂O. The arrangement and movement of those molecules change.", "m": 1}, {"q": "Conservation of mass. (a) What is conserved during a chemical reaction in a closed system? (b) A closed vessel contains 15 g of solid and 30 g of liquid before reaction. Afterwards 4 g of gas is present. What is the combined mass of all non-gas contents?", "a": "(a) Total mass. (b) 41 g, from 45 − 4.", "m": 1}, {"q": "Conservation of mass. (a) What makes a system closed for a mass conservation investigation? (b) Why should the gas produced in an acid–carbonate mass test be collected with a flexible gas-tight attachment under teacher supervision?", "a": "(a) Matter cannot enter or leave. (b) It retains the gas for the mass reading while allowing expansion, avoiding pressure build-up in a rigid sealed flask.", "m": 1}, {"q": "Conservation of mass. (a) Reactants of 14.6 g and 7.9 g react completely in a sealed vessel. What is the total product mass? (b) Why include the cap in both weighings when testing conservation of mass?", "a": "(a) 22.5 g. (b) To measure the same system before and after, including the apparatus mass in both readings.", "m": 1}, {"q": "Ionic bonding. (a) What is an ionic bond? (b) A student says “ionic bonding is electron transfer”. What extra point earns the bonding mark?", "a": "(a) Electrostatic attraction between oppositely charged ions. (b) Electrostatic attraction between the oppositely charged ions holds the solid together.", "m": 1}, {"q": "Ionic bonding. (a) Define cation. (b) An ion diagram shows oxide surrounded by seven outer-shell electrons. What is wrong?", "a": "(a) A positively charged ion. (b) Oxide O²⁻ has eight outer-shell electrons: six original and two gained.", "m": 1}, {"q": "Ionic bonding. (a) Define anion. (b) Why does the same transfer that produces Na⁺ also produce a negative ion when chlorine is the acceptor?", "a": "(a) A negatively charged ion. (b) The electron lost by sodium is gained by chlorine, so one loses negative charge and the other gains it.", "m": 1}, {"q": "Ionic names and formulas. (a) Write the formula for lithium chloride from Li⁺ and Cl⁻. (b) Do coefficients or subscripts indicate the ion ratio inside a formula unit?", "a": "(a) LiCl. The charges cancel in a 1:1 ratio. (b) Subscripts. A coefficient multiplies the entire formula unit.", "m": 1}, {"q": "Ionic names and formulas. (a) Write the formula for sodium oxide from Na⁺ and O²⁻. (b) What is the total positive charge in one formula ratio of Al₂O₃?", "a": "(a) Na₂O. Two Na⁺ ions balance one O²⁻. (b) +6, contributed by two Al³⁺ ions.", "m": 1}, {"q": "Ionic names and formulas. (a) Write the formula for calcium chloride from Ca²⁺ and Cl⁻. (b) An ionic compound has formula M₂S with S²⁻. What charge does one M ion carry?", "a": "(a) CaCl₂. One Ca²⁺ balances two Cl⁻ ions. (b) 1+. Two M ions together supply +2.", "m": 1}, {"q": "Covalent bonding. (a) What is a covalent bond in a dot-and-cross model? (b) What does a dot-and-cross diagram show that a line-only bond diagram omits?", "a": "(a) A shared pair of electrons between two atoms. (b) Which atom supplied each valence electron, and any displayed lone pairs.", "m": 1}, {"q": "Covalent bonding. (a) What is a lone pair? (b) How many lone pairs are on each oxygen in O=C=O?", "a": "(a) A pair of valence electrons on one atom that is not shared in a bond. (b) Two.", "m": 1}, {"q": "Covalent bonding. (a) How many shared pairs connect the atoms in H₂? (b) How many shared pairs connect nitrogen atoms in N₂?", "a": "(a) One shared pair. (b) Three.", "m": 1}, {"q": "Covalent names and formulas. (a) Name CO. (b) Why is CO₂ not called monocarbon dioxide?", "a": "(a) Carbon monoxide. (b) Mono- is conventionally omitted on the first element.", "m": 1}, {"q": "Covalent names and formulas. (a) Name N₂O. (b) Give the formula of ammonia.", "a": "(a) Dinitrogen monoxide. (b) NH₃.", "m": 1}, {"q": "Covalent names and formulas. (a) Give the formula for sulfur dioxide. (b) Give the formula of methane.", "a": "(a) SO₂. (b) CH₄.", "m": 1}, {"q": "Word equations. (a) Predict the products of complete methane combustion. (b) What does the arrow in a word equation indicate?", "a": "(a) Carbon dioxide and water. (b) The reactants on the left form the products on the right.", "m": 1}, {"q": "Word equations. (a) Write the word equation for magnesium burning in oxygen. (b) Why does copper fail to displace magnesium from magnesium sulfate?", "a": "(a) Magnesium + oxygen → magnesium oxide. (b) Copper is less reactive than magnesium.", "m": 1}, {"q": "Word equations. (a) Name the salt from nitric acid and sodium hydroxide. (b) Write the word equation when zinc displaces copper from copper sulfate.", "a": "(a) Sodium nitrate. (b) Zinc + copper sulfate → zinc sulfate + copper.", "m": 1}, {"q": "Balanced symbol equations. (a) Balance H₂ + O₂ → H₂O. (b) Balance C₂H₆ + O₂ → CO₂ + H₂O.", "a": "(a) 2H₂ + O₂ → 2H₂O (b) 2C₂H₆ + 7O₂ → 4CO₂ + 6H₂O", "m": 1}, {"q": "Balanced symbol equations. (a) Balance N₂ + H₂ → NH₃. (b) Balance BaCl₂ + Na₂SO₄ → BaSO₄ + NaCl.", "a": "(a) N₂ + 3H₂ → 2NH₃ (b) BaCl₂ + Na₂SO₄ → BaSO₄ + 2NaCl", "m": 1}, {"q": "Balanced symbol equations. (a) Balance Al + O₂ → Al₂O₃. (b) Balance Al + CuCl₂ → AlCl₃ + Cu.", "a": "(a) 4Al + 3O₂ → 2Al₂O₃ (b) 2Al + 3CuCl₂ → 2AlCl₃ + 3Cu", "m": 1}, {"q": "Reaction particle models. (a) What does a bonded pair of identical spheres represent in a molecular particle model? (b) Why can the total number of molecules change even if atom counts are conserved?", "a": "(a) A diatomic molecule of an element. (b) Atoms can regroup into molecules containing different numbers of atoms.", "m": 1}, {"q": "Reaction particle models. (a) What does a bonded pair of differently coloured spheres represent if colours identify elements? (b) What does a line between spheres usually show?", "a": "(a) A diatomic molecule containing two elements. (b) A chemical bond.", "m": 1}, {"q": "Reaction particle models. (a) How many O atoms are represented by 3CO₂? (b) Why might a particle model show unchanged solvent molecules on both sides?", "a": "(a) Six. (b) A solvent can be present without being consumed.", "m": 1}, {"q": "Signs of chemical change. (a) What is a precipitate? (b) Is “a yellow solid formed” an observation or inference?", "a": "(a) An insoluble solid formed in a solution. (b) An observation.", "m": 1}, {"q": "Signs of chemical change. (a) Why does bubbling alone not prove a reaction? (b) In an insulated cup, temperature rises after mixing. What observation supports an exothermic reaction?", "a": "(a) A physical process such as boiling can produce bubbles. (b) The measured temperature rose without external heating.", "m": 1}, {"q": "Signs of chemical change. (a) What does a glowing splint relighting indicate in a standard gas test? (b) What observation indicates a positive carbon dioxide limewater test?", "a": "(a) Oxygen. (b) Limewater turns cloudy.", "m": 1}, {"q": "Reaction types. (a) What identifies a synthesis reaction? (b) Which product shows reduction of copper ions in Fe + CuSO₄ → FeSO₄ + Cu?", "a": "(a) Two or more reactants combine to form one product. (b) Copper metal, formed when copper ions gain electrons.", "m": 1}, {"q": "Reaction types. (a) What identifies a decomposition reaction? (b) Identify the reaction pattern in Fe + CuSO₄ → FeSO₄ + Cu.", "a": "(a) One reactant breaks down into multiple products. (b) Single displacement.", "m": 1}, {"q": "Reaction types. (a) What identifies single displacement? (b) Which salt forms when CuCO₃ reacts with HCl?", "a": "(a) An element replaces another element in a compound. (b) Copper(II) chloride.", "m": 1}, {"q": "pH. (a) What does pH indicate? (b) Can pH alone establish that a solution is safe to touch?", "a": "(a) How acidic or alkaline an aqueous solution is. (b) No. Other hazards and concentration matter.", "m": 1}, {"q": "pH. (a) What is the approximate pH of pure water at room temperature? (b) How does pH typically change when an alkaline solution is diluted with pure water?", "a": "(a) 7. (b) It falls towards 7.", "m": 1}, {"q": "pH. (a) Which is more acidic, pH 2 or pH 5? (b) How does pH typically change when an acidic solution is diluted with pure water?", "a": "(a) pH 2. (b) It rises towards 7.", "m": 1}, {"q": "Neutralisation. (a) What does a universal indicator estimate? (b) Which is more precise for small pH differences, a colour chart or calibrated meter?", "a": "(a) pH from its colour compared with a reference chart. (b) A calibrated pH meter.", "m": 1}, {"q": "Neutralisation. (a) What instrument gives a numerical pH reading? (b) Why can universal indicator be difficult to use with a dark sample?", "a": "(a) A calibrated pH meter. (b) The sample colour masks the indicator colour.", "m": 1}, {"q": "Neutralisation. (a) Why rinse a pH probe between samples? (b) Why can adding equal volumes of acid and base fail to reach pH 7?", "a": "(a) To reduce cross-contamination. (b) The solutions may have unequal concentrations or different reaction ratios.", "m": 1}, {"q": "Collision theory and rate. (a) Define reaction rate. (b) Does higher temperature lower the activation energy of a fixed pathway?", "a": "(a) Change in amount of reactant or product per unit time. (b) No. It changes particle energies.", "m": 1}, {"q": "Collision theory and rate. (a) What is activation energy? (b) Why can a cold catalyst-containing reaction still be slower than a hot uncatalysed one?", "a": "(a) The energy barrier for a reaction pathway. (b) The net rate depends on both temperature and pathway, so the outcome needs evidence.", "m": 1}, {"q": "Collision theory and rate. (a) What must colliding particles generally have for a successful collision? (b) What does halving time to collect a fixed gas volume do to the average rate over that interval?", "a": "(a) Sufficient energy and suitable orientation. (b) It doubles the average rate.", "m": 1}, {"q": "Rate investigation. (a) Write a testable question about concentration and gas-production rate. (b) Why use a gas syringe instead of counting bubbles?", "a": "(a) How does acid concentration affect the volume of gas produced in the first 20 seconds? (b) It measures gas volume even when bubble sizes vary.", "m": 1}, {"q": "Rate investigation. (a) Identify the independent variable in a temperature investigation. (b) What is a confounding variable?", "a": "(a) The temperature deliberately changed. (b) A factor that changes with the independent variable and could affect the result.", "m": 1}, {"q": "Rate investigation. (a) Identify a measurable dependent variable in a carbonate-rate experiment. (b) What should a conclusion include besides the stated trend?", "a": "(a) Gas volume collected over a fixed time, or time to reach a fixed volume. (b) Evidence with relevant values and any limits of the tested range.", "m": 1}, {"q": "Early universe. (a) Which two elements dominated early-universe nucleosynthesis? (b) Where did most primordial hydrogen nuclei come from?", "a": "(a) Hydrogen and helium. (b) Protons left uncombined after early nucleosynthesis.", "m": 1}, {"q": "Early universe. (a) Were early light nuclei and neutral atoms formed at the same stage? (b) What is stellar nucleosynthesis?", "a": "(a) No. Nuclei formed first and electrons joined nuclei later. (b) Formation of nuclei through processes in stars.", "m": 1}, {"q": "Early universe. (a) Why could light nuclei form as the universe expanded? (b) Why is early nucleosynthesis a nuclear rather than chemical process?", "a": "(a) Expansion cooled it enough for nuclei to survive. (b) It forms and changes nuclei.", "m": 1}, {"q": "Fission and fusion. (a) What happens to a heavy nucleus in fission? (b) What is one common feature of fission and fusion?", "a": "(a) It splits into smaller nuclei. (b) Both change nuclei and can release energy.", "m": 1}, {"q": "Fission and fusion. (a) What happens to light nuclei in fusion? (b) What quantity accounts for released nuclear energy in the mass-energy model?", "a": "(a) They combine into a heavier nucleus. (b) A decrease in total rest mass of the products compared with the starting system.", "m": 1}, {"q": "Fission and fusion. (a) Which process mainly powers the Sun? (b) How is fission energy converted into electricity in a typical plant?", "a": "(a) Fusion. (b) Heat makes steam, which turns a turbine driving a generator.", "m": 1}, {"q": "Nuclear stability. (a) What is a radioisotope? (b) Why do radioactive samples have predictable half-lives despite random individual decay?", "a": "(a) An isotope with an unstable nucleus that can decay. (b) Large populations follow a statistical pattern.", "m": 1}, {"q": "Nuclear stability. (a) What is radioactive decay? (b) What does beta-minus decay do to the neutron-to-proton ratio?", "a": "(a) Spontaneous transformation of an unstable nucleus. (b) It decreases it because a neutron becomes a proton.", "m": 1}, {"q": "Nuclear stability. (a) Can two isotopes of the same element have different stability? (b) Can the decay time of one particular nucleus be predicted exactly?", "a": "(a) Yes, because they have different neutron counts. (b) No. Individual decay is random.", "m": 1}, {"q": "Nuclear decay equations. (a) Complete the school-model alpha equation ²⁴¹₉₅Am → ? + ⁴₂He. Daughter symbol: Np. (b) Identify the missing particle in ⁹⁹₄₂Mo → ⁹⁹₄₃Tc + ?.", "a": "(a) ²⁴¹₉₅Am → ²³⁷₉₃Np + ⁴₂He. (b) ⁹⁹₄₂Mo → ⁹⁹₄₃Tc + ⁰₋₁e. Full notation includes an electron antineutrino.", "m": 1}, {"q": "Nuclear decay equations. (a) Identify the missing particle in ²²⁶₈₈Ra → ²²²₈₆Rn + ?. (b) Complete the school-model beta-minus equation ⁹⁰₃₉Y → ? + ⁰₋₁e. Daughter symbol: Zr.", "a": "(a) ²²⁶₈₈Ra → ²²²₈₆Rn + ⁴₂He. (b) ⁹⁰₃₉Y → ⁹⁰₄₀Zr + ⁰₋₁e. Full notation includes an electron antineutrino.", "m": 1}, {"q": "Nuclear decay equations. (a) Complete the parent numbers in Po(A=?, Z=?) → ²⁰⁶₈₂Pb + ⁴₂He. (b) Complete the parent numbers in Co(A=?, Z=?) → ⁶⁰₂₈Ni + ⁰₋₁e.", "a": "(a) ²¹⁰₈₄Po → ²⁰⁶₈₂Pb + ⁴₂He. (b) ⁶⁰₂₇Co → ⁶⁰₂₈Ni + ⁰₋₁e. Full notation includes an electron antineutrino.", "m": 1}, {"q": "Half-life. (a) A nuclide has half-life 6 h and initial mass 72 mg. How much parent remains at 12 h? (b) A sample falls from 100 mg to 25 mg in 36 h. Find the half-life.", "a": "(a) 2 half-lives. 72 ÷ 2^2 = 18 mg. (b) The ratio is 1/4, so 2 half-lives elapsed. 36 ÷ 2 = 18 h.", "m": 1}, {"q": "Half-life. (a) A sample falls from 96 mg to 12 mg in 12 h. Find the half-life. (b) A nuclide has half-life 17 h and initial mass 56 mg. How much parent remains at 51 h?", "a": "(a) The ratio is 1/8, so 3 half-lives elapsed. 12 ÷ 3 = 4 h. (b) 3 half-lives. 56 ÷ 2^3 = 7 mg.", "m": 1}, {"q": "Half-life. (a) After 20 h, 7.5 mg of a nuclide with half-life 5 h remains. Find the initial mass. (b) After 80 h, 20 mg of a nuclide with half-life 16 h remains. Find the initial mass.", "a": "(a) 4 half-lives elapsed. 7.5 × 2^4 = 120 mg. (b) 5 half-lives elapsed. 20 × 2^5 = 640 mg.", "m": 1}, {"q": "Radioisotope uses. (a) Why use a radioisotope as a tracer? (b) Why does using more activity than needed create a drawback?", "a": "(a) Its radiation can reveal where the tracer travels or accumulates. (b) It can increase radiation dose without improving the measurement enough to justify it.", "m": 1}, {"q": "Radioisotope uses. (a) Why might a short half-life suit medical imaging? (b) What two properties matter when selecting a tracer for detection outside a body?", "a": "(a) Activity falls relatively quickly after imaging. (b) Radiation must be detectable externally and half-life must suit the measurement.", "m": 1}, {"q": "Radioisotope uses. (a) What is a drawback of a very short-lived tracer? (b) Why use a tracer to study water movement?", "a": "(a) It may lose too much activity during production and transport. (b) Detectors can measure its arrival or spread.", "m": 1}, {"q": "Nuclear life cycle. (a) What environmental impact can uranium mining cause? (b) Why is water use site-dependent for power plants?", "a": "(a) Land disturbance and mine waste. (b) Cooling technology and local water availability vary.", "m": 1}, {"q": "Nuclear life cycle. (a) Why does fuel processing contribute to life-cycle impacts? (b) What lifecycle stage follows closure of a nuclear facility?", "a": "(a) It consumes energy and materials and can produce waste. (b) Decommissioning and management of contaminated material.", "m": 1}, {"q": "Nuclear life cycle. (a) What environmental issue can arise from discharge of warm cooling water? (b) How can a repository reduce environmental exposure to waste?", "a": "(a) Thermal pollution can alter aquatic conditions. (b) Engineered barriers and stable geology limit radionuclide movement.", "m": 1}, {"q": "Industrial reactions. (a) Write the balanced ammonia synthesis equation. (b) Why recycle unreacted gases in industrial ammonia synthesis?", "a": "(a) N₂ + 3H₂ ⇌ 2NH₃. (b) It increases overall feedstock conversion.", "m": 1}, {"q": "Industrial reactions. (a) Give one major use of ammonia. (b) What starting acid is commonly used to make aspirin in industry or teaching models?", "a": "(a) Manufacture of nitrogen fertilisers. (b) Salicylic acid, acetylated with acetic anhydride.", "m": 1}, {"q": "Industrial reactions. (a) What catalyst is commonly used in the Haber process? (b) Which reaction converts sulfur dioxide to sulfur trioxide in sulfuric acid production?", "a": "(a) An iron-based catalyst. (b) 2SO₂ + O₂ ⇌ 2SO₃.", "m": 1}, {"q": "Wave fundamentals. (a) What travels from source to receiver in a wave? (b) How could a rope model distinguish propagation from oscillation?", "a": "(a) Energy and a disturbance. (b) Track the pulse along the rope and a marked point moving about its own position.", "m": 1}, {"q": "Wave fundamentals. (a) What is oscillation? (b) Give a wave that transfers energy through a solid.", "a": "(a) Repeated motion about an equilibrium position. (b) A vibration travelling along a stretched string.", "m": 1}, {"q": "Wave fundamentals. (a) What is wave propagation? (b) Give a wave that can transfer energy across empty space.", "a": "(a) Travel of a disturbance through space or a medium. (b) Light, or any electromagnetic wave.", "m": 1}, {"q": "Transverse and longitudinal waves. (a) Define a transverse wave. (b) Can a solid transmit transverse mechanical waves?", "a": "(a) Oscillation is perpendicular to propagation. (b) Yes. A solid can resist sideways deformation.", "m": 1}, {"q": "Transverse and longitudinal waves. (a) Define a longitudinal wave. (b) Why can a longitudinal pressure graph look sinusoidal?", "a": "(a) Oscillation is parallel to propagation. (b) Its vertical axis is pressure, not the actual direction of particle motion.", "m": 1}, {"q": "Transverse and longitudinal waves. (a) Classify a pulse travelling east while rope particles move vertically. (b) How should particle-motion arrows be drawn for a transverse rope wave travelling right?", "a": "(a) Transverse. (b) Perpendicular to propagation, for example up and down.", "m": 1}, {"q": "Mechanical and electromagnetic waves. (a) What is a mechanical wave? (b) How can a bell jar demonstrate the difference between sound and visible light?", "a": "(a) A disturbance that requires a material medium. (b) As air is pumped out, sound weakens while the bell remains visible.", "m": 1}, {"q": "Mechanical and electromagnetic waves. (a) What oscillates in an electromagnetic wave? (b) Is “transverse” interchangeable with “electromagnetic”?", "a": "(a) Electric and magnetic fields. (b) No. Mechanical rope waves can also be transverse.", "m": 1}, {"q": "Mechanical and electromagnetic waves. (a) Why does an astronaut need radio rather than relying on unaided sound across a vacuum? (b) Why is a medium necessary for sound?", "a": "(a) Radio travels through vacuum, whereas sound requires matter. (b) Interactions between particles pass along the pressure disturbance.", "m": 1}, {"q": "Wave calculations. (a) A wave travels 40 cm in one period of 5 ms. Find its speed. (b) A wave moves at 50 m/s and has a period of 14 ms. Calculate wavelength.", "a": "(a) 0.4 m ÷ 0.005 s = 80 m/s. (b) λ = vT = 50 × 0.014 = 0.7 m.", "m": 1}, {"q": "Wave calculations. (a) A wave moves at 300 m/s and has a period of 3 ms. Calculate wavelength. (b) A wave travels 48 cm in one period of 6 ms. Find its speed.", "a": "(a) λ = vT = 300 × 0.003 = 0.9 m. (b) 0.48 m ÷ 0.006 s = 80 m/s.", "m": 1}, {"q": "Wave calculations. (a) A wavelength of 24 cm travels at 30 m/s. Calculate frequency. (b) A wave moves at 70 m/s with wavelength 84 cm. Calculate its period in milliseconds.", "a": "(a) f = v/λ = 30/0.24 ≈ 125 Hz. (b) T = λ/v = 0.84/70 = 0.012 s = 12 ms.", "m": 1}, {"q": "Ear and hearing. (a) What is the role of the pinna? (b) Order eardrum, cochlea, ear canal and ossicles in the hearing pathway.", "a": "(a) It helps collect and direct sound into the ear canal. (b) Ear canal → eardrum → ossicles → cochlea.", "m": 1}, {"q": "Ear and hearing. (a) What does the ear canal do? (b) Why might damaged cochlear hair cells impair hearing with a normal eardrum?", "a": "(a) It guides sound to the eardrum. (b) Mechanical motion may reach the cochlea, but sensory conversion is impaired.", "m": 1}, {"q": "Ear and hearing. (a) What causes the eardrum to vibrate? (b) What happens if ossicles cannot move freely?", "a": "(a) Variations in air pressure from sound waves. (b) Vibrations reach the inner ear less effectively.", "m": 1}, {"q": "Vestibular system. (a) Where is the vestibular apparatus located? (b) Why can conflicting vestibular and visual signals cause discomfort?", "a": "(a) The inner ear. (b) They provide inconsistent information about movement.", "m": 1}, {"q": "Vestibular system. (a) Which vestibular structures detect angular acceleration? (b) What other inputs can the brain combine with vestibular signals?", "a": "(a) The semicircular canals. (b) Vision and information from muscles and joints.", "m": 1}, {"q": "Vestibular system. (a) What do the utricle and saccule detect? (b) What do vestibular signals help stabilise during head movement?", "a": "(a) Linear acceleration and head orientation relative to gravity. (b) Posture and gaze.", "m": 1}, {"q": "Wave features and sound. (a) Define amplitude on a transverse displacement graph. (b) Why is loudness not determined solely by amplitude?", "a": "(a) Maximum displacement from equilibrium. (b) Human sensitivity depends on frequency and other listening conditions.", "m": 1}, {"q": "Wave features and sound. (a) Define wavelength. (b) Does doubling amplitude double frequency?", "a": "(a) Distance between adjacent points in the same phase. (b) No. Amplitude and frequency describe different properties.", "m": 1}, {"q": "Wave features and sound. (a) What is a crest? (b) Can peak spacing on a time trace give wavelength directly?", "a": "(a) A point of maximum positive displacement on a transverse wave. (b) No. It gives period. Wavelength can then be found if wave speed is known.", "m": 1}, {"q": "Doppler effect. (a) Define the Doppler effect. (b) A train and cyclist move towards each other. What direction is the siren’s pitch shift?", "a": "(a) A change in observed frequency caused by relative motion between source and observer. (b) Higher than the emitted pitch.", "m": 1}, {"q": "Doppler effect. (a) What happens to wavefront spacing ahead of a moving sound source? (b) What does blue shift indicate for an approaching light source in the simple Doppler model?", "a": "(a) It decreases. (b) A shift to higher observed frequency and shorter wavelength.", "m": 1}, {"q": "Doppler effect. (a) What happens to wavefront spacing behind a moving sound source? (b) What happens to observed frequency when source and observer are stationary in the same still medium?", "a": "(a) It increases. (b) It equals the emitted frequency.", "m": 1}, {"q": "Properties of light. (a) Is visible light electromagnetic? (b) Why can an opaque object cast a shadow?", "a": "(a) Yes. (b) It blocks much of the light travelling towards the region behind it.", "m": 1}, {"q": "Properties of light. (a) What speed is usually used for light in a vacuum? (b) What changes when light slows at a stationary boundary while frequency stays fixed?", "a": "(a) Approximately 3.0 × 10⁸ m/s. (b) Its wavelength becomes shorter.", "m": 1}, {"q": "Properties of light. (a) Which has greater visible-light frequency, red or violet? (b) Why can a prism separate white light?", "a": "(a) Violet. (b) Different wavelengths refract by different amounts.", "m": 1}, {"q": "Eye and vision. (a) What does the cornea do to incoming light? (b) What does the brain contribute to vision?", "a": "(a) It refracts light and provides much of the eye’s focusing power. (b) It interprets signals from the eyes to produce visual perception.", "m": 1}, {"q": "Eye and vision. (a) What is the pupil? (b) What travels in the optic nerve?", "a": "(a) The opening through which light enters behind the cornea. (b) Neural signals from the retina to the brain.", "m": 1}, {"q": "Eye and vision. (a) What changes pupil diameter? (b) Which photoreceptors are more sensitive in dim light?", "a": "(a) Muscles in the iris. (b) Rods.", "m": 1}, {"q": "Light interactions. (a) Define reflection. (b) What interaction produces a bright patch when a mirror redirects sunlight onto a wall?", "a": "(a) Redirection of a wave back into the original medium at a boundary. (b) Specular reflection at the mirror, then diffuse reflection at the wall.", "m": 1}, {"q": "Light interactions. (a) Define refraction. (b) Why can a rough surface be visible from many directions?", "a": "(a) A change in wave speed at a boundary, usually with a change in direction for oblique incidence. (b) Its surface reflects light in many directions.", "m": 1}, {"q": "Light interactions. (a) Define absorption of light. (b) Why does a pencil partly in water look bent?", "a": "(a) Transfer of light energy to a material. (b) Light changes direction at the water–air boundary before reaching the eye.", "m": 1}]}, {"name": "Wave calculations", "questions": [{"q": "A video shows 3 complete rope wavelengths spanning 12 cm. A marker completes 3 cycles in 2 s. Find wavelength, frequency and propagation speed.", "a": "λ = 12/100/3 = 0.04 m. f = 3/2 = 1.5 Hz. v = λf = 0.06 m/s using unrounded values.", "m": 1}, {"q": "A video shows 4 complete rope wavelengths spanning 15 cm. A marker completes 4 cycles in 3 s. Find wavelength, frequency and propagation speed.", "a": "λ = 15/100/4 = 0.0375 m. f = 4/3 = 1.333 Hz. v = λf = 0.05 m/s using unrounded values.", "m": 1}, {"q": "A video shows 5 complete rope wavelengths spanning 18 cm. A marker completes 5 cycles in 4 s. Find wavelength, frequency and propagation speed.", "a": "λ = 18/100/5 = 0.036 m. f = 5/4 = 1.25 Hz. v = λf = 0.045 m/s using unrounded values.", "m": 1}, {"q": "A video shows 6 complete rope wavelengths spanning 21 cm. A marker completes 6 cycles in 5 s. Find wavelength, frequency and propagation speed.", "a": "λ = 21/100/6 = 0.035 m. f = 6/5 = 1.2 Hz. v = λf = 0.042 m/s using unrounded values.", "m": 1}, {"q": "A video shows 7 complete rope wavelengths spanning 24 cm. A marker completes 7 cycles in 2 s. Find wavelength, frequency and propagation speed.", "a": "λ = 24/100/7 = 0.03429 m. f = 7/2 = 3.5 Hz. v = λf = 0.12 m/s using unrounded values.", "m": 1}, {"q": "A video shows 3 complete rope wavelengths spanning 27 cm. A marker completes 3 cycles in 3 s. Find wavelength, frequency and propagation speed.", "a": "λ = 27/100/3 = 0.09 m. f = 3/3 = 1 Hz. v = λf = 0.09 m/s using unrounded values.", "m": 1}, {"q": "A video shows 4 complete rope wavelengths spanning 30 cm. A marker completes 4 cycles in 4 s. Find wavelength, frequency and propagation speed.", "a": "λ = 30/100/4 = 0.075 m. f = 4/4 = 1 Hz. v = λf = 0.075 m/s using unrounded values.", "m": 1}, {"q": "A video shows 5 complete rope wavelengths spanning 33 cm. A marker completes 5 cycles in 5 s. Find wavelength, frequency and propagation speed.", "a": "λ = 33/100/5 = 0.066 m. f = 5/5 = 1 Hz. v = λf = 0.066 m/s using unrounded values.", "m": 1}, {"q": "A video shows 6 complete rope wavelengths spanning 36 cm. A marker completes 6 cycles in 2 s. Find wavelength, frequency and propagation speed.", "a": "λ = 36/100/6 = 0.06 m. f = 6/2 = 3 Hz. v = λf = 0.18 m/s using unrounded values.", "m": 1}, {"q": "A video shows 7 complete rope wavelengths spanning 39 cm. A marker completes 7 cycles in 3 s. Find wavelength, frequency and propagation speed.", "a": "λ = 39/100/7 = 0.05571 m. f = 7/3 = 2.333 Hz. v = λf = 0.13 m/s using unrounded values.", "m": 1}, {"q": "A video shows 3 complete rope wavelengths spanning 42 cm. A marker completes 3 cycles in 4 s. Find wavelength, frequency and propagation speed.", "a": "λ = 42/100/3 = 0.14 m. f = 3/4 = 0.75 Hz. v = λf = 0.105 m/s using unrounded values.", "m": 1}, {"q": "A video shows 4 complete rope wavelengths spanning 45 cm. A marker completes 4 cycles in 5 s. Find wavelength, frequency and propagation speed.", "a": "λ = 45/100/4 = 0.1125 m. f = 4/5 = 0.8 Hz. v = λf = 0.09 m/s using unrounded values.", "m": 1}, {"q": "A video shows 5 complete rope wavelengths spanning 48 cm. A marker completes 5 cycles in 2 s. Find wavelength, frequency and propagation speed.", "a": "λ = 48/100/5 = 0.096 m. f = 5/2 = 2.5 Hz. v = λf = 0.24 m/s using unrounded values.", "m": 1}, {"q": "A video shows 6 complete rope wavelengths spanning 51 cm. A marker completes 6 cycles in 3 s. Find wavelength, frequency and propagation speed.", "a": "λ = 51/100/6 = 0.085 m. f = 6/3 = 2 Hz. v = λf = 0.17 m/s using unrounded values.", "m": 1}, {"q": "A video shows 7 complete rope wavelengths spanning 54 cm. A marker completes 7 cycles in 4 s. Find wavelength, frequency and propagation speed.", "a": "λ = 54/100/7 = 0.07714 m. f = 7/4 = 1.75 Hz. v = λf = 0.135 m/s using unrounded values.", "m": 1}, {"q": "A video shows 3 complete rope wavelengths spanning 57 cm. A marker completes 3 cycles in 5 s. Find wavelength, frequency and propagation speed.", "a": "λ = 57/100/3 = 0.19 m. f = 3/5 = 0.6 Hz. v = λf = 0.114 m/s using unrounded values.", "m": 1}, {"q": "A video shows 4 complete rope wavelengths spanning 60 cm. A marker completes 4 cycles in 2 s. Find wavelength, frequency and propagation speed.", "a": "λ = 60/100/4 = 0.15 m. f = 4/2 = 2 Hz. v = λf = 0.3 m/s using unrounded values.", "m": 1}, {"q": "A video shows 5 complete rope wavelengths spanning 63 cm. A marker completes 5 cycles in 3 s. Find wavelength, frequency and propagation speed.", "a": "λ = 63/100/5 = 0.126 m. f = 5/3 = 1.667 Hz. v = λf = 0.21 m/s using unrounded values.", "m": 1}, {"q": "A video shows 6 complete rope wavelengths spanning 66 cm. A marker completes 6 cycles in 4 s. Find wavelength, frequency and propagation speed.", "a": "λ = 66/100/6 = 0.11 m. f = 6/4 = 1.5 Hz. v = λf = 0.165 m/s using unrounded values.", "m": 1}, {"q": "A video shows 7 complete rope wavelengths spanning 69 cm. A marker completes 7 cycles in 5 s. Find wavelength, frequency and propagation speed.", "a": "λ = 69/100/7 = 0.09857 m. f = 7/5 = 1.4 Hz. v = λf = 0.138 m/s using unrounded values.", "m": 1}]}, {"name": "Half-life calculations", "questions": [{"q": "At 8 days a sample contains 10 mg of its original isotope. Its half-life is 4 days. Find how much parent has decayed and the fraction left after another half-life.", "a": "8/4 = 2 half-lives. Initial mass = 10 × 2^2 = 40 mg. Decayed mass = 30 mg. Another half-life gives 1/8 of the original.", "m": 1}, {"q": "At 15 days a sample contains 15 mg of its original isotope. Its half-life is 5 days. Find how much parent has decayed and the fraction left after another half-life.", "a": "15/5 = 3 half-lives. Initial mass = 15 × 2^3 = 120 mg. Decayed mass = 105 mg. Another half-life gives 1/16 of the original.", "m": 1}, {"q": "At 24 days a sample contains 20 mg of its original isotope. Its half-life is 6 days. Find how much parent has decayed and the fraction left after another half-life.", "a": "24/6 = 4 half-lives. Initial mass = 20 × 2^4 = 320 mg. Decayed mass = 300 mg. Another half-life gives 1/32 of the original.", "m": 1}, {"q": "At 35 days a sample contains 25 mg of its original isotope. Its half-life is 7 days.
