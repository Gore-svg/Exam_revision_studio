// Bulk import uses a staged review. No study data changes until the valid
// packs have been saved together.
const ImportLimits = Object.freeze({
 maxFiles: 100,
 maxFileBytes: 2 * 1024 * 1024,
 maxBatchBytes: 15 * 1024 * 1024,
 maxPacks: 100,
 maxQuestionsPerPack: 1000,
 maxQuestionsPerBatch: 5000,
 maxTextLength: 12000,
});
const importReview = {packs: [], errors: [], pasted: '', textKind: 'bank', pending: false};

function requireImportText(value, label, maxLength=ImportLimits.maxTextLength) {
 if (typeof value !== 'string' || !value.trim()) throw new Error(label + ' must contain text.');
 const result=value.trim();
 if (result.length > maxLength) throw new Error(label + ' is too long.');
 return result;
}

function normaliseImportQuestion(raw, index, kind) {
 const label='Question '+(index+1);
 if (!raw || typeof raw !== 'object' || Array.isArray(raw)) throw new Error(label+' must be an object.');
 if (['pairs','blanks','matches','matching'].some(field=>raw[field]!==undefined)) throw new Error(label+' uses an unsupported interactive format. Use multiple-choice or a self-marked written question.');
 if(raw.type!==undefined){
  if(typeof raw.type!=='string')throw new Error(label+' type must be text.');
  const typeName=raw.type.toLowerCase().replace(/[ _-]/g,'');
  const allowed=['mc','mcq','multiplechoice','multichoice','written','short','shortanswer','numeric','numerical','multiselect','dropdown'];
  if(!allowed.includes(typeName))throw new Error(label+' has an unsupported type: '+raw.type+'.');
  if(['mc','mcq','multiplechoice','multichoice','multiselect','dropdown'].includes(typeName)&&!Array.isArray(raw.options))throw new Error(label+' type needs choices.');
  if(typeName==='multiselect'&&!Array.isArray(raw.multi))throw new Error(label+' multi-select needs a list of correct choice indexes.');
  if(typeName==='dropdown'&&raw.dropdown!==true)throw new Error(label+' dropdown needs dropdown: true.');
  if(['numeric','numerical'].includes(typeName)&&raw.num===undefined)throw new Error(label+' numerical type needs a numeric answer.');
  if(['written','short','shortanswer'].includes(typeName)&&(raw.options!==undefined||raw.num!==undefined))throw new Error(label+' written type cannot contain automatic-answer fields.');
 }
 const question={
  q:requireImportText(raw.q,label+' question'),
  a:requireImportText(raw.a,label+' answer or explanation'),
  m:raw.m===undefined ? 1 : raw.m,
 };
 if (!Number.isInteger(question.m) || question.m<1 || question.m>100) throw new Error(label+' marks must be an integer between 1 and 100.');
 if (raw.criteria!==undefined || raw.bad!==undefined) {
  throw new Error(label+' contains custom regular-expression marking rules. Use phraseCriteria or a model answer for self-marking.');
 }
 if(raw.phraseCriteria!==undefined){
  if(raw.options!==undefined||raw.num!==undefined||!Array.isArray(raw.phraseCriteria)||!raw.phraseCriteria.length||raw.phraseCriteria.length>10)throw new Error(label+' phraseCriteria must contain 1 to 10 written-answer criteria.');
  if(raw.phraseCriteria.length!==question.m)throw new Error(label+' needs one mark per phrase criterion.');
  question.phraseCriteria=raw.phraseCriteria.map((rule,i)=>{
   if(!rule||typeof rule!=='object'||Array.isArray(rule))throw new Error(label+' criterion '+(i+1)+' must be an object.');
   const ruleLabel=requireImportText(rule.label,label+' criterion label',200);
   const alternatives=(key)=>{
    if(rule[key]===undefined)return [];
    if(!Array.isArray(rule[key])||rule[key].length>10)throw new Error(label+' criterion '+key+' must contain at most 10 phrases.');
    return rule[key].map(phrase=>requireImportText(phrase,label+' criterion phrase',200));
   };
   const anyOf=alternatives('anyOf'), allOf=alternatives('allOf');
   if(!anyOf.length&&!allOf.length)throw new Error(label+' criterion needs anyOf or allOf phrases.');
   return {label:ruleLabel,anyOf,allOf};
  });
 }
 if (raw.options!==undefined) {
  if (!Array.isArray(raw.options) || raw.options.length<2 || raw.options.length>12) throw new Error(label+' needs 2 to 12 choices.');
  question.options=raw.options.map((option,i)=>requireImportText(option,label+' choice '+(i+1),1000));
  if (new Set(question.options.map(option=>option.toLocaleLowerCase())).size!==question.options.length) throw new Error(label+' contains duplicate choices.');
  if (raw.multi!==undefined) {
   if (kind==='exam') throw new Error(label+' uses multi-select. Exams currently support single-choice and self-marked written questions.');
   if (!Array.isArray(raw.multi) || raw.multi.length===0 || raw.multi.some(i=>!Number.isInteger(i)||i<0||i>=question.options.length) || new Set(raw.multi).size!==raw.multi.length) throw new Error(label+' needs a list of distinct, valid correct choice indexes.');
   if (question.m!==1) throw new Error(label+' multi-select questions are worth one mark.');
   question.multi=[...raw.multi];
  } else {
   if (!Number.isInteger(raw.correct) || raw.correct<0 || raw.correct>=question.options.length) throw new Error(label+' needs a valid zero-based correct choice index.');
   question.correct=raw.correct;
   if (raw.dropdown!==undefined) {
    if (typeof raw.dropdown!=='boolean') throw new Error(label+' dropdown must be true or false.');
    if (raw.dropdown && kind==='exam') throw new Error(label+' uses a dropdown. Exams currently support single-choice and self-marked written questions.');
    question.dropdown=raw.dropdown;
   }
  }
 } else if (raw.multi!==undefined || raw.correct!==undefined || raw.dropdown!==undefined) {
  throw new Error(label+' has an answer index but no choices.');
 }
 if (raw.num!==undefined) {
  if (raw.options!==undefined || !Number.isFinite(raw.num)) throw new Error(label+' numeric answer must be a finite number without choices.');
  if (kind==='exam') throw new Error(label+' uses automatic numerical marking. Import it as a self-marked written exam question.');
  if (question.m!==2) throw new Error(label+' numerical questions need two marks, one for the value and one for its unit.');
  question.num=raw.num;
  question.unit=requireImportText(raw.unit,label+' unit',40);
 }
 return question;
}

function normaliseImportPack(raw) {
 if (!raw || typeof raw!=='object' || Array.isArray(raw)) throw new Error('Each bank or exam must be an object.');
 if (!['bank','exam'].includes(raw.kind)) throw new Error('Set kind to "bank" or "exam".');
 const name=requireImportText(raw.name,'Name',200);
 if (!Array.isArray(raw.questions) || !raw.questions.length) throw new Error('Add at least one question.');
 if (raw.questions.length>ImportLimits.maxQuestionsPerPack) throw new Error('A single bank or exam cannot exceed '+ImportLimits.maxQuestionsPerPack+' questions.');
 const pack={kind:raw.kind,name,questions:raw.questions.map((question,index)=>normaliseImportQuestion(question,index,raw.kind))};
 if(raw.durationMinutes!==undefined){
  if(raw.kind!=='exam'||!Number.isInteger(raw.durationMinutes)||raw.durationMinutes<1||raw.durationMinutes>300)throw new Error('Exam durationMinutes must be an integer between 1 and 300.');
  pack.durationMinutes=raw.durationMinutes;
 }
 if(raw.duration!==undefined||raw.timeLimit!==undefined)throw new Error('Use durationMinutes for an exam time limit.');
 return pack;
}

function parsePlainQuestions(text, sourceName, defaultKind) {
 let title=sourceName.replace(/\.(txt|json)$/i,'');
 let kind=defaultKind;
 let durationMinutes;
 let current=null;
 let activeField='';
 const questions=[];
 function finishQuestion() {
  if (!current) return;
  const prompt=requireImportText(current.q,'Question '+(questions.length+1)+' question');
  const answer=requireImportText(current.answer,'Question '+(questions.length+1)+' Answer');
  const marks=current.marks ? Number(current.marks) : 1;
  const question={q:prompt,a:current.explanation||answer,m:marks};
  if (current.choices.length) {
   const labels=current.choices.map(choice=>choice.label);
   if (labels.some((label,index)=>label!==String.fromCharCode(65+index))) throw new Error('Question '+(questions.length+1)+' choices must start at A and be consecutive.');
   const byLetter=/^[A-Za-z]$/.test(answer) ? answer.toUpperCase().charCodeAt(0)-65 : -1;
   const byText=current.choices.findIndex(choice=>choice.text.toLocaleLowerCase()===answer.toLocaleLowerCase());
   question.options=current.choices.map(choice=>choice.text);
   question.correct=byLetter>=0&&byLetter<question.options.length ? byLetter : byText;
   if (question.correct<0) throw new Error('Question '+(questions.length+1)+' Answer must match a choice letter or choice text.');
   if (!current.explanation) question.a='Correct answer: '+question.options[question.correct]+'.';
  }
  questions.push(question);
 }
 const lines=text.replace(/^\uFEFF/,'').split(/\r?\n/);
 for (const line of lines) {
  const trimmed=line.trim();
  if (!trimmed || trimmed==='---') continue;
  let match=trimmed.match(/^(?:Q(?:uestion)?)(?:\s*\d+)?\s*[:.)-]\s*(.*)$/i);
  if (match) {
   finishQuestion();current={q:match[1],answer:'',explanation:'',marks:'',choices:[]};activeField='q';continue;
  }
  if (!current) {
   match=trimmed.match(/^(title|name|kind|minutes)\s*:\s*(.+)$/i);
   if (!match) throw new Error('Start with Title: and Kind:, then Q: for each question.');
   if (match[1].toLowerCase()==='kind') {
    kind=match[2].trim().toLowerCase();
    if (!['bank','exam'].includes(kind)) throw new Error('Kind must be bank or exam.');
   } else if (match[1].toLowerCase()==='minutes') durationMinutes=Number(match[2]);
   else title=match[2].trim();
   continue;
  }
  match=trimmed.match(/^([A-L])[).]\s+(.+)$/i);
  if (match) {
   current.choices.push({label:match[1].toUpperCase(),text:match[2]});activeField='';continue;
  }
  match=trimmed.match(/^(answer|explanation|marks)\s*:\s*(.*)$/i);
  if (match) { activeField=match[1].toLowerCase();current[activeField]=match[2];continue; }
  if (!activeField || activeField==='marks') throw new Error('Unrecognised line near question '+(questions.length+1)+': '+trimmed.slice(0,90));
  current[activeField]+=(current[activeField]?'\n':'')+trimmed;
 }
 finishQuestion();
 return normaliseImportPack({kind,name:title||'Pasted questions',questions,...(durationMinutes===undefined?{}:{durationMinutes})});
}

function parseImportSource(text, sourceName, defaultKind) {
 if (typeof text!=='string' || !text.trim()) throw new Error('This file or text is empty.');
 if (text.length>ImportLimits.maxFileBytes) throw new Error('This text is larger than the 2 MB limit.');
 const trimmed=text.replace(/^\uFEFF/,'').trim();
 let raw;
 if (/^[\[{]/.test(trimmed)) {
  try {raw=JSON.parse(trimmed);} catch {throw new Error('Invalid JSON. Check commas, quotation marks and brackets.');}
  if (raw && raw.kind==='at426-science-backup') throw new Error('This is a backup. Use Restore a backup below.');
  const list=Array.isArray(raw)?raw:[raw];
  if (!list.length || list.length>ImportLimits.maxPacks) throw new Error('A JSON list must contain 1 to '+ImportLimits.maxPacks+' banks or exams.');
  return list.map(normaliseImportPack);
 }
 return [parsePlainQuestions(trimmed,sourceName,defaultKind)];
}

function canonicalImportPack(pack) {
 return JSON.stringify(pack);
}

function existingImportFingerprints() {
 const fingerprints=new Set();
 for (const pack of state.imports) {
  try {fingerprints.add(canonicalImportPack(normaliseImportPack(pack)));}
  catch { /* Older imports remain usable even if they use an earlier format. */ }
 }
 return fingerprints;
}

function addSourceToReview(text, sourceName) {
 try {
  const parsed=parseImportSource(text,sourceName,importReview.textKind);
  const known=existingImportFingerprints();
  for (const row of importReview.packs) known.add(canonicalImportPack(row.pack));
  const additions=[];
  const duplicates=[];
  for (const pack of parsed) {
   const fingerprint=canonicalImportPack(pack);
   if (known.has(fingerprint)) {duplicates.push(pack.name);continue;}
   known.add(fingerprint);additions.push({source:sourceName,pack});
  }
  const proposed=[...importReview.packs,...additions];
  const questionCount=proposed.reduce((sum,row)=>sum+row.pack.questions.length,0);
  if (proposed.length>ImportLimits.maxPacks || questionCount>ImportLimits.maxQuestionsPerBatch) throw new Error('This selection exceeds the review limit of '+ImportLimits.maxPacks+' banks or exams and '+ImportLimits.maxQuestionsPerBatch+' questions.');
  importReview.packs=proposed;
  for (const name of duplicates) importReview.errors.push({source:sourceName,message:'Already added or previously imported: '+name});
 } catch (error) {
  importReview.errors.push({source:sourceName,message:error.message || 'Could not read this item.'});
 }
}

async function stageImportFiles(files) {
 if (importReview.pending || !files.length) return;
 if (files.length>ImportLimits.maxFiles) {
  importReview.errors.push({source:'Selection',message:'Choose at most '+ImportLimits.maxFiles+' files at a time.'});
  render();return;
 }
 if (files.reduce((sum,file)=>sum+file.size,0)>ImportLimits.maxBatchBytes) {
  importReview.errors.push({source:'Selection',message:'The selection exceeds the 15 MB limit.'});
  render();return;
 }
 importReview.pending=true;render();
 try {
  for (const file of files) {
   const source=file.webkitRelativePath || file.name;
   if (!/\.(json|txt)$/i.test(file.name)) {
    importReview.errors.push({source,message:'Unsupported file. Choose JSON or TXT questions.'});
    continue;
   }
   if (!file.size || file.size>ImportLimits.maxFileBytes) {
    importReview.errors.push({source,message:!file.size?'This file is empty.':'This file exceeds the 2 MB limit.'});
    continue;
   }
   try {addSourceToReview(await file.text(),source);}
   catch {importReview.errors.push({source,message:'The browser could not read this file. Try selecting it again.'});}
  }
 } finally {
  importReview.pending=false;
  if (tab==='Import & backup') render();
 }
}

function commitImportReview() {
 if (importReview.pending || !importReview.packs.length) return;
 const existing=existingImportFingerprints();
 const additions=[];
 for (const row of importReview.packs) {
  const fingerprint=canonicalImportPack(row.pack);
  if (!existing.has(fingerprint)) {
   existing.add(fingerprint);
   additions.push(row.pack);
  }
 }
 if (!additions.length) {
  warning='These banks and exams are already imported.';
  importReview.packs=[];render();return;
 }
 const nextState={...state,imports:[...state.imports,...additions]};
 try {
  // Detect changes from another tab before replacing the stored state.
  if(localStorage.getItem(key)!==lastSavedSnapshot){
   warning='Your saved work changed in another tab. Reload this page, then review your files again.';
   render();return;
  }
  const snapshot=JSON.stringify(nextState);
  localStorage.setItem(key,snapshot);
  lastSavedSnapshot=snapshot;
 } catch {
  warning='Could not save the import. Your existing data and review list are unchanged. Export a backup or free browser storage, then retry.';
  render();return;
 }
 state=nextState;
 const bankCount=additions.filter(pack=>pack.kind==='bank').length;
 const examCount=additions.length-bankCount;
 const count=additions.reduce((sum,pack)=>sum+pack.questions.length,0);
 importReview.packs=[];
 warning='Imported '+bankCount+' question bank(s), '+examCount+' exam(s), and '+count+' questions. Open Practice or Exams to use them.';
 render();
}

function importView() {
 const expected=importKind==='exam'?'exam':importKind==='bank'?'bank':importReview.textKind;
 const count=importReview.packs.reduce((sum,row)=>sum+row.pack.questions.length,0);
 const packRows=importReview.packs.map((row,index)=>`<li class="import-row"><div><strong>${esc(row.pack.name)}</strong><span>${row.pack.kind==='exam'?'Exam':'Practice bank'} · ${row.pack.questions.length} questions · ${esc(row.source)}</span></div><button type="button" data-action="removeImport:${index}" aria-label="Remove ${esc(row.pack.name)} from review">Remove</button></li>`).join('');
 const errorRows=importReview.errors.map((error,index)=>`<li class="import-error"><div><strong>${esc(error.source)}</strong><span>${esc(error.message)}</span></div><button type="button" data-action="removeImportError:${index}" aria-label="Dismiss message for ${esc(error.source)}">Dismiss</button></li>`).join('');
 return `<h2>Import &amp; backup</h2><p class="muted">Add exams and practice banks from several files, a folder, or pasted text. Review the results before saving.</p>
 <section class="panel import-panel"><h3>1. Add content</h3><div class="import-pickers">
 <label class="import-picker"><strong>Choose files</strong><span>Select one or more JSON or TXT files.</span><input id="importFiles" type="file" multiple accept=".json,.txt,application/json,text/plain" ${importReview.pending?'disabled':''}></label>
 <label class="import-picker"><strong>Choose a folder</strong><span>Includes files in subfolders. If folder selection is unavailable, use Choose files.</span><input id="importFolder" type="file" webkitdirectory directory multiple ${importReview.pending?'disabled':''}></label></div>
 <p class="muted">Supported: Science Studio JSON, a JSON array of banks and exams, or TXT questions in the format below. Each file can be up to 2 MB. PDF, Word and ZIP files need conversion to JSON or TXT first.</p>
 <div class="import-paste"><label for="pasteKind"><strong>Paste questions</strong></label><p class="muted">Paste JSON, or use Q:, Answer: and optional A), B), Explanation: and Marks: lines.</p><label>For pasted plain text, create a <select id="pasteKind">${options([['bank','Practice bank'],['exam','Exam']],expected)}</select></label><label for="importPaste" class="sr-only">Pasted question content</label><textarea id="importPaste" spellcheck="false" placeholder="Title: My practice&#10;Q: What is a proton?&#10;Answer: A positively charged particle in the nucleus.">${esc(importReview.pasted)}</textarea><button type="button" class="primary" data-action="stagePaste" ${importReview.pending?'disabled':''}>Review pasted text</button></div>
 <details><summary>See examples and import templates</summary><p>Use a separate Q: and Answer: for each item. For multiple choice, use A), B) and so on, then write Answer: followed by the correct letter. Use Explanation: to explain the answer and Marks: for its value.</p><pre>${esc('Title: Waves practice\nKind: bank\nQ: What is the unit of frequency?\nA) Hertz\nB) Metres\nAnswer: A\nExplanation: Frequency measures cycles per second.\n\nQ: Give the wave-speed formula.\nAnswer: v = fλ.\nMarks: 1')}</pre><p class="row">${btn('Download bank JSON template','template:bank')}${btn('Download exam JSON template','template:exam')}</p><p>JSON accepts the existing format. Correct choice indexes start at zero. Written questions use a model answer and are self-marked unless a practice item supplies phraseCriteria. Phrase-based results are estimates. Exam written answers are self-marked. Imported exams default to 60 minutes. Set durationMinutes in JSON or Minutes: in plain text to choose another length.</p></details></section>
 <section class="panel" aria-live="polite"><h3>2. Review and import</h3>${importReview.pending?'<p>Reading files…</p>':''}
 <p>${importReview.packs.length} ready · ${count} questions${importReview.errors.length?' · '+importReview.errors.length+' need attention':''}</p>
 ${packRows?'<ul class="import-list">'+packRows+'</ul>':'<p class="muted">No banks or exams ready yet.</p>'}
 ${errorRows?'<h4>Items needing attention</h4><ul class="import-list">'+errorRows+'</ul>':''}
 <div class="row"><button type="button" class="primary" data-action="commitImports" ${!importReview.packs.length||importReview.pending?'disabled':''}>Import ready items</button><button type="button" data-action="clearImports" ${importReview.pending?'disabled':''}>Clear review</button>${btn('Open Practice','practice')}${btn('Open Exams','exams')}</div></section>
 <section class="panel"><h3>Backup</h3><p>Export your saved work, or restore a previous Science Studio backup.</p><div class="row">${btn('Export progress backup','backup',true)}<label>Restore a backup <input type="file" id="restoreBackup" accept=".json,application/json"></label></div></section>`;
}


// Older backups may contain question packs accepted by earlier versions.
function validPack(p){return p&&['bank','exam'].includes(p.kind)&&typeof p.name==='string'&&p.name.trim()&&Array.isArray(p.questions)&&p.questions.length&&p.questions.every(q=>q&&typeof q.q==='string'&&q.q.trim()&&typeof q.a==='string'&&q.a.trim()&&Number.isInteger(q.m)&&q.m>=1&&q.m<=100&&(!('options'in q)||(Array.isArray(q.options)&&q.options.length>=2&&q.options.every(o=>typeof o==='string')&&Number.isInteger(q.correct)&&q.correct>=0&&q.correct<q.options.length)))}
function canRestorePack(pack){
 try {normaliseImportPack(pack);return true;}
 catch {
  // Previously imported packs may contain older marking rules.
  return Boolean(validPack(pack)&&pack.questions.every(question=>question.phraseCriteria===undefined));
 }
}
function importData(payload){
 if(!payload||payload.kind!=='at426-science-backup')throw new Error('Select a Science Studio progress backup.');
 const saved=payload.state;
 const object=value=>value&&typeof value==='object'&&!Array.isArray(value);
 if(!object(saved)||!Array.isArray(saved.imports)||!saved.imports.every(canRestorePack)||!Array.isArray(saved.history)||!['attempts','mistakes','ratings'].every(name=>object(saved[name]))||saved.exam&&(!object(saved.exam)||!object(saved.exam.answers)||!object(saved.exam.marks)||!Number.isInteger(saved.exam.index)||saved.exam.index<0||saved.exam.index>=data.exams.length+saved.imports.filter(item=>item.kind==='exam').length))throw new Error('This backup has invalid studio data.');
 if(!confirm('Replace your current Science Studio progress with this backup?'))return;
 try {
  const snapshot=JSON.stringify(saved);
  localStorage.setItem(key,snapshot);
  lastSavedSnapshot=snapshot;
 } catch {throw new Error('The browser could not save the backup. Current progress is unchanged.');}
 state=saved;
 importReview.packs=[];importReview.errors=[];importReview.pasted='';
 warning='Backup restored.';
}

render();setInterval(updateTimer,1000);
</script></html>
