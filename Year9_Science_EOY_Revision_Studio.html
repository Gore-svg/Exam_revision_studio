ginal practice", "Points": ["A fluid-filled inner-ear structure involved in hearing"]}, {"ID": "SCI382", "Front": "What converts cochlear mechanical motion into changes in electrical signalling?", "Back": "Sensory hair cells.", "Tags": "Year9Science::Waves::EarAndHearing WAM-LI-05", "Learning_Intent": "WAM-LI-05", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["Sensory hair cells"]}, {"ID": "SCI383", "Front": "What carries hearing signals to the brain?", "Back": "The auditory nerve.", "Tags": "Year9Science::Waves::EarAndHearing WAM-LI-05", "Learning_Intent": "WAM-LI-05", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["The auditory nerve"]}, {"ID": "SCI384", "Front": "What happens if ossicles cannot move freely?", "Back": "Vibrations reach the inner ear less effectively.", "Tags": "Year9Science::Waves::EarAndHearing WAM-LI-05", "Learning_Intent": "WAM-LI-05", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["Vibrations reach the inner ear less effectively"]}, {"ID": "SCI385", "Front": "Why might damaged cochlear hair cells impair hearing with a normal eardrum?", "Back": "Mechanical motion may reach the cochlea, but sensory conversion is impaired.", "Tags": "Year9Science::Waves::EarAndHearing WAM-LI-05", "Learning_Intent": "WAM-LI-05", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["Mechanical motion may reach the cochlea, but sensory conversion is impaired"]}, {"ID": "SCI386", "Front": "Order eardrum, cochlea, ear canal and ossicles in the hearing pathway.", "Back": "Ear canal → eardrum → ossicles → cochlea.", "Tags": "Year9Science::Waves::EarAndHearing WAM-LI-05", "Learning_Intent": "WAM-LI-05", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["Ear canal → eardrum → ossicles → cochlea"]}, {"ID": "SCI387", "Front": "Where is the vestibular apparatus located?", "Back": "The inner ear.", "Tags": "Year9Science::Waves::VestibularSystem WAM-LI-06", "Learning_Intent": "WAM-LI-06", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["The inner ear"]}, {"ID": "SCI388", "Front": "Which vestibular structures detect angular acceleration?", "Back": "The semicircular canals.", "Tags": "Year9Science::Waves::VestibularSystem WAM-LI-06", "Learning_Intent": "WAM-LI-06", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["The semicircular canals"]}, {"ID": "SCI389", "Front": "What do the utricle and saccule detect?", "Back": "Linear acceleration and head orientation relative to gravity.", "Tags": "Year9Science::Waves::VestibularSystem WAM-LI-06", "Learning_Intent": "WAM-LI-06", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["Linear acceleration and head orientation relative to gravity"]}, {"ID": "SCI390", "Front": "What moves in a semicircular canal when head rotation changes?", "Back": "Fluid moves relative to the canal and deflects sensory structures.", "Tags": "Year9Science::Waves::VestibularSystem WAM-LI-06", "Learning_Intent": "WAM-LI-06", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["Fluid moves relative to the canal and deflects sensory structures"]}, {"ID": "SCI391", "Front": "Why are semicircular canals arranged in different planes?", "Back": "To detect rotation about different axes.", "Tags": "Year9Science::Waves::VestibularSystem WAM-LI-06", "Learning_Intent": "WAM-LI-06", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["To detect rotation about different axes"]}, {"ID": "SCI392", "Front": "How can vestibular damage affect standing?", "Back": "It can impair balance and increase swaying.", "Tags": "Year9Science::Waves::VestibularSystem WAM-LI-06", "Learning_Intent": "WAM-LI-06", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["It can impair balance and increase swaying"]}, {"ID": "SCI393", "Front": "Why can an individual feel motion briefly after stopping a spin?", "Back": "Fluid continues moving briefly relative to the canals.", "Tags": "Year9Science::Waves::VestibularSystem WAM-LI-06", "Learning_Intent": "WAM-LI-06", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["Fluid continues moving briefly relative to the canals"]}, {"ID": "SCI394", "Front": "What do vestibular signals help stabilise during head movement?", "Back": "Posture and gaze.", "Tags": "Year9Science::Waves::VestibularSystem WAM-LI-06", "Learning_Intent": "WAM-LI-06", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["Posture and gaze"]}, {"ID": "SCI395", "Front": "What other inputs can the brain combine with vestibular signals?", "Back": "Vision and information from muscles and joints.", "Tags": "Year9Science::Waves::VestibularSystem WAM-LI-06", "Learning_Intent": "WAM-LI-06", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["Vision and information from muscles and joints"]}, {"ID": "SCI396", "Front": "Why can conflicting vestibular and visual signals cause discomfort?", "Back": "They provide inconsistent information about movement.", "Tags": "Year9Science::Waves::VestibularSystem WAM-LI-06", "Learning_Intent": "WAM-LI-06", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["They provide inconsistent information about movement"]}, {"ID": "SCI397", "Front": "Define amplitude on a transverse displacement graph.", "Back": "Maximum displacement from equilibrium.", "Tags": "Year9Science::Waves::WaveFeaturesAndSound WAM-LI-07", "Learning_Intent": "WAM-LI-07", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["Maximum displacement from equilibrium"]}, {"ID": "SCI398", "Front": "Define wavelength.", "Back": "Distance between adjacent points in the same phase.", "Tags": "Year9Science::Waves::WaveFeaturesAndSound WAM-LI-07", "Learning_Intent": "WAM-LI-07", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["Distance between adjacent points in the same phase"]}, {"ID": "SCI399", "Front": "What is a crest?", "Back": "A point of maximum positive displacement on a transverse wave.", "Tags": "Year9Science::Waves::WaveFeaturesAndSound WAM-LI-07", "Learning_Intent": "WAM-LI-07", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["A point of maximum positive displacement on a transverse wave"]}, {"ID": "SCI400", "Front": "What is a trough?", "Back": "A point of maximum negative displacement on a transverse wave.", "Tags": "Year9Science::Waves::WaveFeaturesAndSound WAM-LI-07", "Learning_Intent": "WAM-LI-07", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["A point of maximum negative displacement on a transverse wave"]}, {"ID": "SCI401", "Front": "What distance on a longitudinal wave represents one wavelength?", "Back": "Distance from one compression to the next compression.", "Tags": "Year9Science::Waves::WaveFeaturesAndSound WAM-LI-07", "Learning_Intent": "WAM-LI-07", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["Distance from one compression to the next compression"]}, {"ID": "SCI402", "Front": "How far apart are a crest and the next trough on a sinusoidal wave?", "Back": "Half a wavelength.", "Tags": "Year9Science::Waves::WaveFeaturesAndSound WAM-LI-07", "Learning_Intent": "WAM-LI-07", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["Half a wavelength"]}, {"ID": "SCI403", "Front": "If peak-to-peak displacement is 14 mm, what is amplitude?", "Back": "7 mm.", "Tags": "Year9Science::Waves::WaveFeaturesAndSound WAM-LI-07", "Learning_Intent": "WAM-LI-07", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["7 mm"]}, {"ID": "SCI404", "Front": "What property chiefly determines the pitch of a pure sound tone?", "Back": "Frequency.", "Tags": "Year9Science::Waves::WaveFeaturesAndSound WAM-LI-07", "Learning_Intent": "WAM-LI-07", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["Frequency"]}, {"ID": "SCI405", "Front": "Which of 230 Hz and 410 Hz has higher pitch?", "Back": "410 Hz.", "Tags": "Year9Science::Waves::WaveFeaturesAndSound WAM-LI-07", "Learning_Intent": "WAM-LI-07", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["410 Hz"]}, {"ID": "SCI406", "Front": "How does greater pressure amplitude usually affect loudness at the same frequency?", "Back": "It is generally heard as louder.", "Tags": "Year9Science::Waves::WaveFeaturesAndSound WAM-LI-07", "Learning_Intent": "WAM-LI-07", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["It is generally heard as louder"]}, {"ID": "SCI407", "Front": "Can two waves have the same frequency but different amplitudes?", "Back": "Yes. Their cycles can take the same time while their maximum displacements differ.", "Tags": "Year9Science::Waves::WaveFeaturesAndSound WAM-LI-07", "Learning_Intent": "WAM-LI-07", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["Yes", "Their cycles can take the same time while their maximum displacements differ"]}, {"ID": "SCI408", "Front": "Which graph axis lets you measure wavelength directly?", "Back": "A horizontal distance or position axis on a spatial snapshot.", "Tags": "Year9Science::Waves::WaveFeaturesAndSound WAM-LI-07", "Learning_Intent": "WAM-LI-07", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["A horizontal distance or position axis on a spatial snapshot"]}, {"ID": "SCI409", "Front": "Which graph axis lets you measure period directly?", "Back": "A time axis on a trace measured at one location.", "Tags": "Year9Science::Waves::WaveFeaturesAndSound WAM-LI-07", "Learning_Intent": "WAM-LI-07", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["A time axis on a trace measured at one location"]}, {"ID": "SCI410", "Front": "Can peak spacing on a time trace give wavelength directly?", "Back": "No. It gives period. Wavelength can then be found if wave speed is known.", "Tags": "Year9Science::Waves::WaveFeaturesAndSound WAM-LI-07", "Learning_Intent": "WAM-LI-07", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["No", "It gives period", "Wavelength can then be found if wave speed is known"]}, {"ID": "SCI411", "Front": "Does doubling amplitude double frequency?", "Back": "No. Amplitude and frequency describe different properties.", "Tags": "Year9Science::Waves::WaveFeaturesAndSound WAM-LI-07", "Learning_Intent": "WAM-LI-07", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["No", "Amplitude and frequency describe different properties"]}, {"ID": "SCI412", "Front": "Why is loudness not determined solely by amplitude?", "Back": "Human sensitivity depends on frequency and other listening conditions.", "Tags": "Year9Science::Waves::WaveFeaturesAndSound WAM-LI-07", "Learning_Intent": "WAM-LI-07", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["Human sensitivity depends on frequency and other listening conditions"]}, {"ID": "SCI413", "Front": "Define the Doppler effect.", "Back": "A change in observed frequency caused by relative motion between source and observer.", "Tags": "Year9Science::Waves::DopplerEffect WAM-LI-08", "Learning_Intent": "WAM-LI-08", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["A change in observed frequency caused by relative motion between source and observer"]}, {"ID": "SCI414", "Front": "What happens to wavefront spacing ahead of a moving sound source?", "Back": "It decreases.", "Tags": "Year9Science::Waves::DopplerEffect WAM-LI-08", "Learning_Intent": "WAM-LI-08", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["It decreases"]}, {"ID": "SCI415", "Front": "What happens to wavefront spacing behind a moving sound source?", "Back": "It increases.", "Tags": "Year9Science::Waves::DopplerEffect WAM-LI-08", "Learning_Intent": "WAM-LI-08", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["It increases"]}, {"ID": "SCI416", "Front": "How does an approaching source sound compared with its emitted frequency?", "Back": "The observed frequency is higher.", "Tags": "Year9Science::Waves::DopplerEffect WAM-LI-08", "Learning_Intent": "WAM-LI-08", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["The observed frequency is higher"]}, {"ID": "SCI417", "Front": "How does a receding source sound compared with its emitted frequency?", "Back": "The observed frequency is lower.", "Tags": "Year9Science::Waves::DopplerEffect WAM-LI-08", "Learning_Intent": "WAM-LI-08", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["The observed frequency is lower"]}, {"ID": "SCI418", "Front": "Why does a moving observer hear a higher pitch when approaching a stationary source?", "Back": "The observer encounters wavefronts more often.", "Tags": "Year9Science::Waves::DopplerEffect WAM-LI-08", "Learning_Intent": "WAM-LI-08", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["The observer encounters wavefronts more often"]}, {"ID": "SCI419", "Front": "Does a stationary source change the spacing of its wavefronts just because the observer moves?", "Back": "No. The observer changes the encounter rate.", "Tags": "Year9Science::Waves::DopplerEffect WAM-LI-08", "Learning_Intent": "WAM-LI-08", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["No", "The observer changes the encounter rate"]}, {"ID": "SCI420", "Front": "Why does a siren seem to drop in pitch as it passes?", "Back": "It changes from approaching to receding relative to the listener.", "Tags": "Year9Science::Waves::DopplerEffect WAM-LI-08", "Learning_Intent": "WAM-LI-08", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["It changes from approaching to receding relative to the listener"]}, {"ID": "SCI421", "Front": "Does a moving source change sound speed relative to still air?", "Back": "No. The medium determines that speed.", "Tags": "Year9Science::Waves::DopplerEffect WAM-LI-08", "Learning_Intent": "WAM-LI-08", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["No", "The medium determines that speed"]}, {"ID": "SCI422", "Front": "Does a moving source have to change its emitted frequency for Doppler shift to occur?", "Back": "No. The shift can occur at constant emission frequency.", "Tags": "Year9Science::Waves::DopplerEffect WAM-LI-08", "Learning_Intent": "WAM-LI-08", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["No", "The shift can occur at constant emission frequency"]}, {"ID": "SCI423", "Front": "What happens to observed frequency when source and observer are stationary in the same still medium?", "Back": "It equals the emitted frequency.", "Tags": "Year9Science::Waves::DopplerEffect WAM-LI-08", "Learning_Intent": "WAM-LI-08", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["It equals the emitted frequency"]}, {"ID": "SCI424", "Front": "What does blue shift indicate for an approaching light source in the simple Doppler model?", "Back": "A shift to higher observed frequency and shorter wavelength.", "Tags": "Year9Science::Waves::DopplerEffect WAM-LI-08", "Learning_Intent": "WAM-LI-08", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["A shift to higher observed frequency and shorter wavelength"]}, {"ID": "SCI425", "Front": "A train and cyclist move towards each other. What direction is the siren’s pitch shift?", "Back": "Higher than the emitted pitch.", "Tags": "Year9Science::Waves::DopplerEffect WAM-LI-08", "Learning_Intent": "WAM-LI-08", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["Higher than the emitted pitch"]}, {"ID": "SCI426", "Front": "Is visible light electromagnetic?", "Back": "Yes.", "Tags": "Year9Science::Waves::PropertiesOfLight WAM-LI-09", "Learning_Intent": "WAM-LI-09", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["Yes"]}, {"ID": "SCI427", "Front": "What speed is usually used for light in a vacuum?", "Back": "Approximately 3.0 × 10⁸ m/s.", "Tags": "Year9Science::Waves::PropertiesOfLight WAM-LI-09", "Learning_Intent": "WAM-LI-09", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["Approximately 3.0 × 10⁸ m/s"]}, {"ID": "SCI428", "Front": "Which has greater visible-light frequency, red or violet?", "Back": "Violet.", "Tags": "Year9Science::Waves::PropertiesOfLight WAM-LI-09", "Learning_Intent": "WAM-LI-09", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["Violet"]}, {"ID": "SCI429", "Front": "Which has greater visible-light wavelength in vacuum, red or violet?", "Back": "Red.", "Tags": "Year9Science::Waves::PropertiesOfLight WAM-LI-09", "Learning_Intent": "WAM-LI-09", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["Red"]}, {"ID": "SCI430", "Front": "Does light carry energy?", "Back": "Yes.", "Tags": "Year9Science::Waves::PropertiesOfLight WAM-LI-09", "Learning_Intent": "WAM-LI-09", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["Yes"]}, {"ID": "SCI431", "Front": "How does a light ray normally travel in a uniform medium?", "Back": "In a straight line.", "Tags": "Year9Science::Waves::PropertiesOfLight WAM-LI-09", "Learning_Intent": "WAM-LI-09", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["In a straight line"]}, {"ID": "SCI432", "Front": "What is white light in a basic colour model?", "Back": "A mixture of visible wavelengths.", "Tags": "Year9Science::Waves::PropertiesOfLight WAM-LI-09", "Learning_Intent": "WAM-LI-09", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["A mixture of visible wavelengths"]}, {"ID": "SCI433", "Front": "Why can a prism separate white light?", "Back": "Different wavelengths refract by different amounts.", "Tags": "Year9Science::Waves::PropertiesOfLight WAM-LI-09", "Learning_Intent": "WAM-LI-09", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["Different wavelengths refract by different amounts"]}, {"ID": "SCI434", "Front": "What changes when light slows at a stationary boundary while frequency stays fixed?", "Back": "Its wavelength becomes shorter.", "Tags": "Year9Science::Waves::PropertiesOfLight WAM-LI-09", "Learning_Intent": "WAM-LI-09", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["Its wavelength becomes shorter"]}, {"ID": "SCI435", "Front": "Why can an opaque object cast a shadow?", "Back": "It blocks much of the light travelling towards the region behind it.", "Tags": "Year9Science::Waves::PropertiesOfLight WAM-LI-09", "Learning_Intent": "WAM-LI-09", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["It blocks much of the light travelling towards the region behind it"]}, {"ID": "SCI436", "Front": "What does the cornea do to incoming light?", "Back": "It refracts light and provides much of the eye’s focusing power.", "Tags": "Year9Science::Waves::EyeAndVision WAM-LI-10", "Learning_Intent": "WAM-LI-10", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["It refracts light and provides much of the eye’s focusing power"]}, {"ID": "SCI437", "Front": "What is the pupil?", "Back": "The opening through which light enters behind the cornea.", "Tags": "Year9Science::Waves::EyeAndVision WAM-LI-10", "Learning_Intent": "WAM-LI-10", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["The opening through which light enters behind the cornea"]}, {"ID": "SCI438", "Front": "What changes pupil diameter?", "Back": "Muscles in the iris.", "Tags": "Year9Science::Waves::EyeAndVision WAM-LI-10", "Learning_Intent": "WAM-LI-10", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["Muscles in the iris"]}, {"ID": "SCI439", "Front": "How does the pupil normally respond to bright light?", "Back": "It becomes smaller, reducing light entry.", "Tags": "Year9Science::Waves::EyeAndVision WAM-LI-10", "Learning_Intent": "WAM-LI-10", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["It becomes smaller, reducing light entry"]}, {"ID": "SCI440", "Front": "What does the lens do?", "Back": "It adjusts focus so an image can form on the retina.", "Tags": "Year9Science::Waves::EyeAndVision WAM-LI-10", "Learning_Intent": "WAM-LI-10", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["It adjusts focus so an image can form on the retina"]}, {"ID": "SCI441", "Front": "What is the retina?", "Back": "A layer containing light-sensitive cells and associated neural tissue.", "Tags": "Year9Science::Waves::EyeAndVision WAM-LI-10", "Learning_Intent": "WAM-LI-10", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["A layer containing light-sensitive cells and associated neural tissue"]}, {"ID": "SCI442", "Front": "What are rods and cones?", "Back": "Retinal photoreceptors.", "Tags": "Year9Science::Waves::EyeAndVision WAM-LI-10", "Learning_Intent": "WAM-LI-10", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["Retinal photoreceptors"]}, {"ID": "SCI443", "Front": "Which photoreceptors support colour vision?", "Back": "Cones.", "Tags": "Year9Science::Waves::EyeAndVision WAM-LI-10", "Learning_Intent": "WAM-LI-10", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["Cones"]}, {"ID": "SCI444", "Front": "Which photoreceptors are more sensitive in dim light?", "Back": "Rods.", "Tags": "Year9Science::Waves::EyeAndVision WAM-LI-10", "Learning_Intent": "WAM-LI-10", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["Rods"]}, {"ID": "SCI445", "Front": "What travels in the optic nerve?", "Back": "Neural signals from the retina to the brain.", "Tags": "Year9Science::Waves::EyeAndVision WAM-LI-10", "Learning_Intent": "WAM-LI-10", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["Neural signals from the retina to the brain"]}, {"ID": "SCI446", "Front": "What does the brain contribute to vision?", "Back": "It interprets signals from the eyes to produce visual perception.", "Tags": "Year9Science::Waves::EyeAndVision WAM-LI-10", "Learning_Intent": "WAM-LI-10", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["It interprets signals from the eyes to produce visual perception"]}, {"ID": "SCI447", "Front": "Define reflection.", "Back": "Redirection of a wave back into the original medium at a boundary.", "Tags": "Year9Science::Waves::LightInteractions WAM-LI-11", "Learning_Intent": "WAM-LI-11", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["Redirection of a wave back into the original medium at a boundary"]}, {"ID": "SCI448", "Front": "Define refraction.", "Back": "A change in wave speed at a boundary, usually with a change in direction for oblique incidence.", "Tags": "Year9Science::Waves::LightInteractions WAM-LI-11", "Learning_Intent": "WAM-LI-11", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["A change in wave speed at a boundary, usually with a change in direction for oblique incidence"]}, {"ID": "SCI449", "Front": "Define absorption of light.", "Back": "Transfer of light energy to a material.", "Tags": "Year9Science::Waves::LightInteractions WAM-LI-11", "Learning_Intent": "WAM-LI-11", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["Transfer of light energy to a material"]}, {"ID": "SCI450", "Front": "Define scattering of light.", "Back": "Redirection of light into different directions by particles or material irregularities.", "Tags": "Year9Science::Waves::LightInteractions WAM-LI-11", "Learning_Intent": "WAM-LI-11", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["Redirection of light into different directions by particles or material irregularities"]}, {"ID": "SCI451", "Front": "What is the normal in a ray diagram?", "Back": "A line perpendicular to the boundary at the point of incidence.", "Tags": "Year9Science::Waves::LightInteractions WAM-LI-11", "Learning_Intent": "WAM-LI-11", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["A line perpendicular to the boundary at the point of incidence"]}, {"ID": "SCI452", "Front": "State the law of reflection.", "Back": "Angle of incidence equals angle of reflection, both measured from the normal.", "Tags": "Year9Science::Waves::LightInteractions WAM-LI-11", "Learning_Intent": "WAM-LI-11", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["Angle of incidence equals angle of reflection, both measured from the normal"]}, {"ID": "SCI453", "Front": "A ray hits a mirror at 20° to the surface. What angle does the reflected ray make with the normal?", "Back": "70°.", "Tags": "Year9Science::Waves::LightInteractions WAM-LI-11", "Learning_Intent": "WAM-LI-11", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["70°"]}, {"ID": "SCI454", "Front": "Does a ray entering glass obliquely from air bend towards or away from the normal?", "Back": "Towards the normal.", "Tags": "Year9Science::Waves::LightInteractions WAM-LI-11", "Learning_Intent": "WAM-LI-11", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["Towards the normal"]}, {"ID": "SCI455", "Front": "Does a ray exiting glass obliquely into air bend towards or away from the normal when transmitted?", "Back": "Away from the normal.", "Tags": "Year9Science::Waves::LightInteractions WAM-LI-11", "Learning_Intent": "WAM-LI-11", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["Away from the normal"]}, {"ID": "SCI456", "Front": "Why is there no directional bending at normal incidence?", "Back": "The ray is aligned with the normal on both sides.", "Tags": "Year9Science::Waves::LightInteractions WAM-LI-11", "Learning_Intent": "WAM-LI-11", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["The ray is aligned with the normal on both sides"]}, {"ID": "SCI457", "Front": "Why does a black shirt often heat more in sunlight than a white shirt of comparable material?", "Back": "It typically absorbs a greater fraction of visible light.", "Tags": "Year9Science::Waves::LightInteractions WAM-LI-11", "Learning_Intent": "WAM-LI-11", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["It typically absorbs a greater fraction of visible light"]}, {"ID": "SCI458", "Front": "Why does a pencil partly in water look bent?", "Back": "Light changes direction at the water–air boundary before reaching the eye.", "Tags": "Year9Science::Waves::LightInteractions WAM-LI-11", "Learning_Intent": "WAM-LI-11", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["Light changes direction at the water–air boundary before reaching the eye"]}, {"ID": "SCI459", "Front": "Why can a rough surface be visible from many directions?", "Back": "Its surface reflects light in many directions.", "Tags": "Year9Science::Waves::LightInteractions WAM-LI-11", "Learning_Intent": "WAM-LI-11", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["Its surface reflects light in many directions"]}, {"ID": "SCI460", "Front": "What interaction produces a bright patch when a mirror redirects sunlight onto a wall?", "Back": "Specular reflection at the mirror, then diffuse reflection at the wall.", "Tags": "Year9Science::Waves::LightInteractions WAM-LI-11", "Learning_Intent": "WAM-LI-11", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["Specular reflection at the mirror, then diffuse reflection at the wall"]}, {"ID": "SCI461", "Front": "What makes a hypothesis measurable?", "Back": "It predicts how an identified variable changes an outcome that can be measured.", "Tags": "Year9Science::WorkingScientifically::RateInvestigation RXN-LI-18", "Learning_Intent": "RXN-LI-18", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["It predicts how an identified variable changes an outcome that can be measured"]}, {"ID": "SCI462", "Front": "Write a directional hypothesis for carbonate particle size and  "Place them in the column heading, for example Time (s).", "Tags": "Year9Science::WorkingScientifically::RateInvestigation RXN-LI-18", "Learning_Intent": "RXN-LI-18", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["Place them in the column heading, for example Time (s)"]}, {"ID": "SCI472", "Front": "What graph suits average gas volume for three different catalyst materials?", "Back": "A column graph if catalyst material is categorical.", "Tags": "Year9Science::WorkingScientifically::RateInvestigation RXN-LI-18", "Learning_Intent": "RXN-LI-18", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["A column graph if catalyst material is categorical"]}, {"ID": "SCI473", "Front": "What graph suits reaction rate versus concentration?", "Back": "A scatter plot with a suitable line or curve of best fit.", "Tags": "Year9Science::WorkingScientifically::RateInvestigation RXN-LI-18", "Learning_Intent": "RXN-LI-18", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["A scatter plot with a suitable line or curve of best fit"]}, {"ID": "SCI474", "Front": "Why should a line of best fit not automatically connect each point?", "Back": "A fit represents the underlying trend and allows for scatter.", "Tags": "Year9Science::WorkingScientifically::RateInvestigation RXN-LI-18", "Learning_Intent": "RXN-LI-18", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["A fit represents the underlying trend and allows for scatter"]}, {"ID": "SCI475", "Front": "Why use points far apart on a straight best-fit line to calculate gradient?", "Back": "It reduces the relative impact of small reading errors.", "Tags": "Year9Science::WorkingScientifically::RateInvestigation RXN-LI-18", "Learning_Intent": "RXN-LI-18", "Difficulty": "2", "Source_Category": "Original practice", "Points": ["It reduces the relative impact of small reading errors"]}, {"ID": "SCI476", "Front": "How do you find the gradient of a curve at a point?", "Bac le, beta-minus particle, daughter nucleus, nucleon number", "Conserve A and charge number and identify the daughter from Z", "Find the missing isotope or particle in a decay equation", "Beta-minus decay lowers atomic number"]}, {"code": "RXN-LI-23", "name": "Half-life", "notes": ["Half-life, remaining fraction, decay curve", "Read graphs and calculate remaining amounts or elapsed time", "Determine original mass from remaining parent mass", "A constant mass decays each half-life"]}, {"code": "RXN-LI-24", "name": "Radioisotope uses", "notes": ["Tracer, exposure, penetration, half-life", "Weigh benefits and limitations against suitability criteria", "Evaluate short-lived tracers versus long-lived sources", "A longer half-life is always preferable"]}, {"code": "RXN-LI-25", "name": "Nuclear life cycle", "notes": ["Extraction, processing, operation, waste management", "Evaluate impacts at different stages", "Compare operational emissions with mining and disposal impacts", "Low operational emissions mean zero life-cycle impacts"]}, {"code": "RXN-LI-26", "name": "Industrial reactions", "notes": ["Feedstock, catalyst, industrial product", "Link reaction, conditions, use and environmental trade-offs", "Explain how ammonia production supports fertiliser manufacture", "Industrial significance means environmental impacts can be ignored"]}, {"code": "WAM-LI-01", "name": "Wave fundamentals", "notes": ["Oscillation, propagation, energy transfer", "Track disturbance direction versus local particle motion", "Explain how a floating marker moves as a wave passes", "Particles travel with the wave across the medium"]}, {"code": "WAM-LI-02", "name": "Transverse and longitudinal waves", "notes": ["Perpendicular, parallel, compression, rarefaction", "Draw direction arrows on a displacement or particle model", "Classify waves from motion of marked particles", "Any wave drawn as a sine curve is transverse"]}, {"code": "WAM-LI-03", "name": "Mechanical and electromagnetic waves", "notes": ["Medium, vacuum, electromagnetic wave", "Classify examples and compare how they propagate", "Explain why radio signals cross a vacuum but sound does not", "All waves require air"]}, {"code": "WAM-LI-04", "name": "Wave calculations", "notes": ["Frequency f, wavelength λ, speed v, period T", "Rearrange v = fλ and T = 1/f, convert units and show working", "Calculate speed from wavelength in cm and period in ms", "Use milliseconds directly as seconds"]}, {"code": "WAM-LI-05", "name": "Ear and hearing", "notes": ["Eardrum, ossicles, cochlea, hair cells, auditory nerve", "Sequence mechanical transmission and conversion to neural signals", "Predict how damage to a structure interrupts hearing", "Sound waves travel along the auditory nerve"]}, {"code": "WAM-LI-06", "name": "Vestibular system", "notes": ["Semicircular canals, otolith organs, angular and linear acceleration", "Connect motion detection to balance and orientation", "Explain instability after vestibular damage", "Semicircular canals mainly detect sound or steady straight-line motion"]}, {"code": "WAM-LI-07", "name": "Wave features and sound", "notes": ["Crest, trough, amplitude, wavelength, pitch, loudness", "Measure wave features and interpret changes in sound", "Compare two traces with matched frequency and different amplitude", "Crest-to-trough height equals amplitude"]}, {"code": "WAM-LI-08", "name": "Doppler effect", "notes": ["Observed frequency, relative motion, wavefront spacing", "Interpret approaching and receding source diagrams and moving observers", "Explain siren pitch changes without a change in emitted frequency", "The moving source changes the speed of sound in stationary air"]}, {"code": "WAM-LI-09", "name": "Properties of light", "notes": ["Visible electromagnetic radiation, vacuum, spectrum", "Identify properties and relate speed, frequency and wavelength", "Distinguish light propagation from sound propagation", "Light needs a medium"]}, {"code": "WAM-LI-10", "name": "Eye and vision", "notes": ["Cornea, iris, pupil, lens, retina, photoreceptor, optic nerve", "Trace optical and neural pathways", "Explain how iris, lens and retina perform different functions", "The pupil actively contracts itself or the optic nerve carries light"]}, {"code": "WAM-LI-11", "name": "Light interactions", "notes": ["Absorption, reflection, refraction, scattering, normal", "Draw rays and compare direction and energy transfer", "Interpret a ray entering glass obliquely and distinguish scattering from absorption", "Measure angles from the surface or say refraction always bends toward the normal"]}], "tutor": [{"topic": "RXN-LI-01", "name": "Element, compound or mixture", "lesson": "Classify by the particles present. An element has one type of atom, a compound has different atoms bonded in a fixed ratio, and a mixture contains different substances together.", "items": [{"q": "A box contains only identical particles, each made of one carbon atom bonded to one oxygen atom. Classify it.", "options": ["Mixture of two elements", "Pure element", "Pure compound"], "correct": 2, "m": 1, "a": "Classify by the particles present. An element has one type of atom, a compound has different atoms bonded in a fixed ratio, and a mixture contains different substances together."}, {"q": "Explain why a gas containing separate O₂ and CO₂ molecules is a mixture.", "m": 1, "a": "It contains two different substances, oxygen and carbon dioxide, present together without bonding to each other."}]}, {"topic": "RXN-LI-02", "name": "Reading element symbols", "lesson": "Capital letters start each element symbol. A lowercase letter belongs to the preceding capital, so Co is cobalt and CO contains C and O.", "items": [{"q": "Which notation represents a single element?", "options": ["Co", "CO", "NaCl"], "correct": 0, "m": 1, "a": "Capital letters start each element symbol. A lowercase letter belongs to the preceding capital, so Co is cobalt and CO contains C and O."}, {"q": "How many different elements are in CaCO₃? Name them.", "m": 1, "a": "Three: calcium, carbon and oxygen."}]}, {"topic": "RXN-LI-03", "name": "Protons, neutrons and electrons", "lesson": "Atomic number gives protons. Subtract it from mass number to get neutrons. In a neutral atom electrons equal protons. A positive charge indicates missing electrons.", "items": [{"q": "How many neutrons are in magnesium-25, atomic number 12?", "options": ["12", "25", "13"], "correct": 2, "m": 1, "a": "Atomic number gives protons. Subtract it from mass number to get neutrons. In a neutral atom electrons equal protons. A positive charge indicates missing electrons."}, {"q": "Give the proton, neutron and electron counts for magnesium-25 as Mg²⁺.", "m": 1, "a": "12 protons, 13 neutrons and 10 electrons."}]}, {"topic": "RXN-LI-04", "name": "Chemical versus physical change", "lesson": "During a chemical reaction atoms are rearranged into different substances. A change of state changes particle spacing or motion while preserving the particles’ chemical identities.", "items": [{"q": "Which change creates a new substance?", "options": ["Water evaporates", "Ice melts", "Iron forms rust"], "correct": 2, "m": 1, "a": "During a chemical reaction atoms are rearranged into different substances. A change of state changes particle spacing or motion while preserving the particles’ chemical identities."}, {"q": "Explain why burning hydrogen is chemical but melting ice is physical.", "m": 1, "a": "Burning hydrogen forms water by rearranging atoms. Melting leaves H₂O molecules intact."}]}, {"topic": "RXN-LI-05", "name": "Gas escaping and mass conservation", "lesson": "An open balance reading excludes gas that escapes. In a closed system, gas is still inside the measured system and contributes to total mass.", "items": [{"q": "A flask loses 1.8 g when only CO₂ escapes. How much CO₂ escaped?", "options": ["1.8 g", "Cannot infer it even if only CO₂ escaped", "0 g"], "correct": 0, "m": 1, "a": "An open balance reading excludes gas that escapes. In a closed system, gas is still inside the measured system and contributes to total mass."}, {"q": "Predict the change if an expanding airtight collector is weighed as part of the system.", "m": 1, "a": "Approximately zero. The collector retains CO₂ within the weighed system."}]}, {"topic": "RXN-LI-06", "name": "Why ions attract", "lesson": "An atom losing electrons forms a positive ion. A recipient becomes negative. The bond is the electrostatic attraction between the resulting oppositely charged ions.", "items": [{"q": "What holds Mg²⁺ and O²⁻ together in magnesium oxide?", "options": ["Attraction between two neutral atoms", "Sharing an electron pair", "Electrostatic attraction"], "correct": 2, "m": 1, "a": "An atom losing electrons forms a positive ion. A recipient becomes negative. The bond is the electrostatic attraction between the resulting oppositely charged ions."}, {"q": "Explain why removing electrons leaves a magnesium atom positively charged.", "m": 1, "a": "Its proton count stays the same, so after losing electrons it has more protons than electrons."}]}, {"topic": "RXN-LI-07", "name": "Balancing ionic charges", "lesson": "Find the smallest whole-number ratio whose total charge is zero. For Al³⁺ and O²⁻, two aluminium ions give +6 and three oxide ions give −6, so Al₂O₃.", "items": [{"q": "Which formula balances Mg²⁺ and N³⁻?", "options": ["Mg₃N₂", "Mg₂N₃", "MgN"], "correct": 0, "m": 1, "a": "Find the smallest whole-number ratio whose total charge is zero. For Al³⁺ and O²⁻, two aluminium ions give +6 and three oxide ions give −6, so Al₂O₃."}, {"q": "Give the formula from Ca²⁺ and P³⁻ and show the charge totals.", "m": 1, "a": "Ca₃P₂. The charges are 3 × (+2) = +6 and 2 × (−3) = −6."}]}, {"topic": "RXN-LI-08", "name": "Shared pairs and lone pairs", "lesson": "Each covalent line represents one shared electron pair. Lone pairs stay on one atom. H₂O has two O–H bonds and two lone pairs on O.", "items": [{"q": "How many shared electron pairs are in O=C=O?", "options": ["4", "8", "2"], "correct": 0, "m": 1, "a": "Each covalent line represents one shared electron pair. Lone pairs stay on one atom. H₂O has two O–H bonds and two lone pairs on O."}, {"q": "How many bonds and lone pairs are on the nitrogen in NH₃?", "m": 1, "a": "Three single bonds and one lone pair."}]}, {"topic": "RXN-LI-09", "name": "Decoding covalent prefixes", "lesson": "Read prefixes as atom counts. The first element normally omits mono-, while the second ends in -ide. Dinitrogen monoxide has two N atoms and one O atom.", "items": [{"q": "What is the formula of sulfur trioxide?", "options": ["SO₃", "S₃O₃", "S₃O"], "correct": 0, "m": 1, "a": "Read prefixes as atom counts. The first element normally omits mono-, while the second ends in -ide. Dinitrogen monoxide has two N atoms and one O atom."}, {"q": "Name PCl₃ using molecular prefixes.", "m": 1, "a": "Phosphorus trichloride."}]}, {"topic": "RXN-LI-10", "name": "Predicting reaction products", "lesson": "First identify the reaction family. An acid reacting with a carbonate forms a salt, water and carbon dioxide.", "items": [{"q": "Which gas is produced when hydrochloric acid reacts with sodium carbonate?", "options": ["Hydrogen", "Carbon dioxide", "Oxygen"], "correct": 1, "m": 1, "a": "First identify the reaction family. An acid reacting with a carbonate forms a salt, water and carbon dioxide."}, {"q": "Write the word equation for hydrochloric acid and sodium carbonate.", "m": 1, "a": "Hydrochloric acid + sodium carbonate → sodium chloride + water + carbon dioxide."}]}, {"topic": "RXN-LI-11", "name": "Coefficients versus subscripts", "lesson": "Keep each substance’s formula fixed. A coefficient scales all atoms in that formula. Changing a subscript changes the substance.", "items": [{"q": "How many oxygen atoms does 3CO₂ represent?", "options": ["6", "3", "5"], "correct": 0, "m": 1, "a": "Keep each substance’s formula fixed. A coefficient scales all atoms in that formula. Changing a subscript changes the substance."}, {"q": "Balance Fe + O₂ → Fe₂O₃ using smallest whole numbers.", "m": 1, "a": "4Fe + 3O₂ → 2Fe₂O₃."}]}, {"topic": "RXN-LI-12", "name": "Leftover particles in a model", "lesson": "Use the balanced coefficients as packet sizes. A packet of 2H₂ and O₂ produces 2H₂O. Count leftovers separately.", "items": [{"q": "Starting with 3 H₂ molecules and 1 O₂ molecule, which reactant is left over?", "options": ["Neither reactant", "One O₂ molecule", "One H₂ molecule"], "correct": 2, "m": 1, "a": "Use the balanced coefficients as packet sizes. A packet of 2H₂ and O₂ produces 2H₂O. Count leftovers separately."}, {"q": "Start with 4 H₂ and 3 O₂ molecules. How many H₂O molecules form, and what remains?", "m": 1, "a": "Four H₂O molecules form. One O₂ molecule remains."}]}, {"topic": "RXN-LI-13", "name": "Observations and gas tests", "lesson": "An observation is what you detect. Bubbling is evidence of gas formation, but a gas test can support its identification. CO₂ turns limewater cloudy.", "items": [{"q": "What is the observation in a positive limewater test?", "options": ["Limewater turns cloudy", "Limewater burns", "Hydrogen is produced"], "correct": 0, "m": 1, "a": "An observation is what you detect. Bubbling is evidence of gas formation, but a gas test can support its identification. CO₂ turns limewater cloudy."}, {"q": "Why can bubbles alone fail to establish a chemical reaction?", "m": 1, "a": "Bubbles can form during physical processes such as boiling, so additional evidence of a new substance is needed."}]}, {"topic": "RXN-LI-14", "name": "Classifying reactions by pattern", "lesson": "A synthesis combines reactants, a decomposition splits one reactant into multiple products, and a displacement replaces an element in a compound.", "items": [{"q": "Classify CaCO₃ → CaO + CO₂.", "options": ["Displacement", "Synthesis", "Decomposition"], "correct": 2, "m": 1, "a": "A synthesis combines reactants, a decomposition splits one reactant into multiple products, and a displacement replaces an element in a compound."}, {"q": "Classify Zn + CuSO₄ → ZnSO₄ + Cu and explain what is replaced.", "m": 1, "a": "Single displacement. Zinc replaces copper in copper sulfate."}]}, {"topic": "RXN-LI-15", "name": "Reading pH correctly", "lesson": "A lower pH indicates a higher hydrogen ion concentration. Near room temperature, pH 7 is neutral, values below it are acidic, and values above it are alkaline.", "items": [{"q": "Which solution is most acidic?", "options": ["pH 2", "pH 7", "pH 11"], "correct": 0, "m": 1, "a": "A lower pH indicates a higher hydrogen ion concentration. Near room temperature, pH 7 is neutral, values below it are acidic, and values above it are alkaline."}, {"q": "Order pH 5, 9 and 2 from most acidic to most alkaline.", "m": 1, "a": "2, then 5, then 9."}]}, {"topic": "RXN-LI-16", "name": "Products and excess reactants", "lesson": "Acid and hydroxide react to form salt and water. Adding some base to acid can leave acid in excess, so a neutralisation reaction can occur without the final pH reaching 7.", "items": [{"q": "After adding too little sodium hydroxide to hydrochloric acid, which reactant is in excess?", "options": ["Sodium hydroxide", "Hydrochloric acid", "Neither"], "correct": 1, "m": 1, "a": "Acid and hydroxide react to form salt and water. Adding some base to acid can leave acid in excess, so a neutralisation reaction can occur without the final pH reaching 7."}, {"q": "Name the products when hydrochloric acid reacts with sodium hydroxide.", "m": 1, "a": "Sodium chloride and water."}]}, {"topic": "RXN-LI-17", "name": "Temperature and activation energy", "lesson": "Increasing temperature raises particle kinetic energy. A larger fraction of collisions can reach the activation energy. A catalyst instead supplies a route with lower activation energy.", "items": [{"q": "What explains why warming usually makes a reaction faster?", "options": ["A larger fraction of collisions have enough energy", "Each particle becomes larger", "Warming lowers the activation energy of the same pathway"], "correct": 0, "m": 1, "a": "Increasing temperature raises particle kinetic energy. A larger fraction of collisions can reach the activation energy. A catalyst instead supplies a route with lower activation energy."}, {"q": "Explain how the mechanism of a catalyst differs from that of warming.", "m": 1, "a": "A catalyst lowers the activation energy by providing an alternative pathway. Warming increases the fraction of particles with enough energy."}]}, {"topic": "RXN-LI-18", "name": "Confounding variables", "lesson": "Change the independent variable on purpose and measure the dependent variable. Hold other plausible causes constant so you can isolate the effect.", "items": [{"q": "A student changes both acid concentration and temperature between trials. What is the main design problem?", "options": ["Two changes make the comparison more valid", "The effects cannot be separated", "The dependent variable must be temperature"], "correct": 1, "m": 1, "a": "Change the independent variable on purpose and measure the dependent variable. Hold other plausible causes constant so you can isolate the effect."}, {"q": "Redesign the test to isolate concentration. Give two controls.", "m": 1, "a": "Vary acid concentration only. Hold temperature and acid volume constant, along with carbonate mass and particle size."}]}, {"topic": "RXN-LI-19", "name": "Early elements versus stellar elements", "lesson": "Early expansion cooled the universe enough for light nuclei to form. Hydrogen and helium dominate primordial material. Many heavier nuclei formed later in stars.", "items": [{"q": "Which pair dominated the early universe’s ordinary elemental matter?", "options": ["Iron and nickel", "Hydrogen and helium", "Carbon and oxygen"], "correct": 1, "m": 1, "a": "Early expansion cooled the universe enough for light nuclei to form. Hydrogen and helium dominate primordial material. Many heavier nuclei formed later in stars."}, {"q": "Why is it misleading to say the early universe made most of its iron at the same time as helium?", "m": 1, "a": "Primordial nucleosynthesis mainly produced light nuclei. Iron was produced later through stellar processes."}]}, {"topic": "RXN-LI-20", "name": "Splitting versus combining nuclei", "lesson": "Fission splits a heavy nucleus. Fusion joins light nuclei. Both can release energy, but fusion requires conditions that bring positively charged nuclei close together.", "items": [{"q": "Which process powers the Sun?", "options": ["Chemical combustion", "Fusion", "Fission"], "correct": 1, "m": 1, "a": "Fission splits a heavy nucleus. Fusion joins light nuclei. Both can release energy, but fusion requires conditions that bring positively charged nuclei close together."}, {"q": "Classify a heavy nucleus splitting into two smaller nuclei and releasing neutrons.", "m": 1, "a": "Nuclear fission."}]}, {"topic": "RXN-LI-21", "name": "Why isotopes differ in stability", "lesson": "Isotopes share a proton number but differ in neutron number. Nuclear stability depends on the neutron–proton balance and the size of the nucleus.", "items": [{"q": "Which property differs between two isotopes of carbon?", "options": ["Element symbol", "Neutron number", "Proton number"], "correct": 1, "m": 1, "a": "Isotopes share a proton number but differ in neutron number. Nuclear stability depends on the neutron–proton balance and the size of the nucleus."}, {"q": "Why can carbon-12 and carbon-14 differ in stability while both are carbon?", "m": 1, "a": "Both have six protons, but their different neutron numbers change the neutron–proton balance."}]}, {"topic": "RXN-LI-22", "name": "Keeping mass and atomic numbers separate", "lesson": "Balance the two numbers independently. Alpha emission removes four nucleons and two protons. In beta-minus decay, a neutron becomes a proton, so atomic number increases by one while mass number stays fixed.", "items": [{"q": "An alpha emitter starts at mass number 222 and atomic number 86. What are the daughter numbers?", "options": ["222 and 84", "218 and 84", "218 and 86"], "correct": 1, "m": 1, "a": "Balance the two numbers independently. Alpha emission removes four nucleons and two protons. In beta-minus decay, a neutron becomes a proton, so atomic number increases by one while mass number stays fixed."}, {"q": "A nucleus of atomic number 15 and mass number 32 emits beta-minus. State the daughter numbers.", "m": 1, "a": "Atomic number 16 and mass number 32."}]}, {"topic": "RXN-LI-23", "name": "Counting half-life intervals", "lesson": "First divide elapsed time by the half-life. Then halve the remaining quantity once per interval. After three half-lives the remaining fraction is one eighth.", "items": [{"q": "What fraction remains after four half-lives?", "options": ["1/8", "1/16", "1/4"], "correct": 1, "m": 1, "a": "First divide elapsed time by the half-life. Then halve the remaining quantity once per interval. After three half-lives the remaining fraction is one eighth."}, {"q": "A sample starts at 120 mg and has a half-life of 5 hours. How much remains after 15 hours?", "m": 1, "a": "15 mg. Three half-lives give 120 → 60 → 30 → 15 mg."}]}, {"topic": "RXN-LI-24", "name": "Choosing a tracer half-life", "lesson": "A tracer must remain detectable long enough for the procedure. A shorter half-life reduces how long activity persists, while an excessively short half-life may make the measurement impractical.", "items": [{"q": "Why can an extremely short half-life be unsuitable for a long scan?", "options": ["The isotope necessarily becomes chemically toxic", "The isotope will never decay", "Too little activity may remain before the scan ends"], "correct": 2, "m": 1, "a": "A tracer must remain detectable long enough for the procedure. A shorter half-life reduces how long activity persists, while an excessively short half-life may make the measurement impractical."}, {"q": "Give one trade-off when choosing between a short- and long-lived medical tracer.", "m": 1, "a": "Shorter persistence can reduce exposure time, but enough activity must remain detectable throughout the scan."}]}, {"topic": "RXN-LI-25", "name": "Comparing life-cycle impacts", "lesson": "Distinguish operation from the whole life cycle. Extraction, processing, construction and waste management matter as well as what happens while a plant generates electricity.", "items": [{"q": "Which is a life-cycle impact outside normal electricity generation?", "options": ["Habitat disturbance during uranium mining", "Control rod movement during operation", "Heat transfer in an operating turbine"], "correct": 0, "m": 1, "a": "Distinguish operation from the whole life cycle. Extraction, processing, construction and waste management matter as well as what happens while a plant generates electricity."}, {"q": "Explain why low operational emissions do not imply zero life-cycle emissions.", "m": 1, "a": "Mining, processing, construction and waste management can consume energy and produce emissions."}]}, {"topic": "RXN-LI-26", "name": "Following industrial material flows", "lesson": "Identify feedstocks, product and use. The Haber process combines nitrogen and hydrogen to make ammonia, which is used to make fertilisers.", "items": [{"q": "What is the target product of the Haber process?", "options": ["Hydrogen", "Ammonia", "Sulfuric acid"], "correct": 1, "m": 1, "a": "Identify feedstocks, product and use. The Haber process combines nitrogen and hydrogen to make ammonia, which is used to make fertilisers."}, {"q": "Write the balanced equation for producing ammonia from nitrogen and hydrogen.", "m": 1, "a": "N₂ + 3H₂ ⇌ 2NH₃."}]}, {"topic": "WAM-LI-01", "name": "What actually travels in a wave", "lesson": "A wave transfers energy through a disturbance. A rope segment can oscillate locally while the crest propagates along the rope.", "items": [{"q": "What moves across the rope when a pulse travels along it?", "options": ["The entire rope with the pulse", "The disturbance", "The rope particles permanently along the pulse direction"], "correct": 1, "m": 1, "a": "A wave transfers energy through a disturbance. A rope segment can oscillate locally while the crest propagates along the rope."}, {"q": "Describe what happens to a painted dot on the rope as a single pulse passes.", "m": 1, "a": "It is displaced briefly, then returns approximately to its equilibrium position."}]}, {"topic": "WAM-LI-02", "name": "Parallel versus perpendicular motion", "lesson": "Compare the direction of particle oscillation with wave propagation. Transverse is perpendicular, longitudinal is parallel.", "items": [{"q": "A wave travels east while particles oscillate north–south. What type is it?", "options": ["Transverse", "Both", "Longitudinal"], "correct": 0, "m": 1, "a": "Compare the direction of particle oscillation with wave propagation. Transverse is perpendicular, longitudinal is parallel."}, {"q": "Describe the direction of particle oscillation for sound moving east through air.", "m": 1, "a": "The air particles oscillate east–west, parallel to propagation."}]}, {"topic": "WAM-LI-03", "name": "Deciding whether a medium is needed", "lesson": "Mechanical waves require a medium. Electromagnetic waves can propagate in a vacuum. Sound in air is mechanical and visible light is electromagnetic.", "items": [{"q": "Which can travel through a vacuum?", "options": ["Visible light", "Sound from a speaker", "A compression wave in a spring"], "correct": 0, "m": 1, "a": "Mechanical waves require a medium. Electromagnetic waves can propagate in a vacuum. Sound in air is mechanical and visible light is electromagnetic."}, {"q": "Explain why astronauts can see one another through a window but cannot hear ordinary sound through an intervening vacuum.", "m": 1, "a": "Light travels through a vacuum. Sound requires particles to transmit pressure disturbances."}]}, {"topic": "WAM-LI-04", "name": "Converting units before using v = fλ", "lesson": "Convert cm to m and ms to s. For example, 25 cm = 0.25 m. Then choose v = fλ, f = v/λ or λ = v/f.", "items": [{"q": "A wave has frequency 20 Hz and wavelength 30 cm. What is its speed?", "options": ["0.015 m/s", "600 m/s", "6 m/s"], "correct": 2, "m": 1, "a": "Convert cm to m and ms to s. For example, 25 cm = 0.25 m. Then choose v = fλ, f = v/λ or λ = v/f."}, {"q": "Find the wavelength for a wave of speed 12 m/s and frequency 80 Hz. Give m and cm.", "m": 1, "a": "0.15 m, or 15 cm. Use λ = 12/80."}]}, {"topic": "WAM-LI-05", "name": "From vibration to nerve signal", "lesson": "Sound vibrates the eardrum. The ossicles transmit vibration into the inner ear. Cochlear hair cells help convert movement into signals carried by the auditory nerve.", "items": [{"q": "Which structure contains the receptor cells that respond to inner-ear movement for hearing?", "options": ["Ear canal", "Eardrum", "Cochlea"], "correct": 2, "m": 1, "a": "Sound vibrates the eardrum. The ossicles transmit vibration into the inner ear. Cochlear hair cells help convert movement into signals carried by the auditory nerve."}, {"q": "Give the order from eardrum to brain using ossicles, cochlea and auditory nerve.", "m": 1, "a": "Eardrum → ossicles → cochlea → auditory nerve → brain."}]}, {"topic": "WAM-LI-06", "name": "Balance versus hearing structures", "lesson": "Semicircular canals detect changes in rotational head motion. Fluid movement bends sensory structures and helps the brain coordinate posture and gaze.", "items": [{"q": "Which structure detects changes in rotation?", "options": ["Eardrum", "Pinna", "Semicircular canals"], "correct": 2, "m": 1, "a": "Semicircular canals detect changes in rotational head motion. Fluid movement bends sensory structures and helps the brain coordinate posture and gaze."}, {"q": "Explain why you may briefly feel motion after stopping a spin.", "m": 1, "a": "Fluid continues moving relative to the canals briefly, so the sensory signal persists."}]}, {"topic": "WAM-LI-07", "name": "Pitch versus loudness", "lesson": "Frequency chiefly determines pitch. For comparable tones, larger amplitude generally means louder sound. Peak-to-peak displacement is twice the amplitude.", "items": [{"q": "Which changes when a tone’s frequency increases at constant amplitude?", "options": ["Pitch rises", "Pitch stays fixed", "Pitch falls"], "correct": 0, "m": 1, "a": "Frequency chiefly determines pitch. For comparable tones, larger amplitude generally means louder sound. Peak-to-peak displacement is twice the amplitude."}, {"q": "A wave trace extends from −7 mm to +7 mm. What is its amplitude?", "m": 1, "a": "7 mm, measured from equilibrium to a peak."}]}, {"topic": "WAM-LI-08", "name": "Moving source versus moving observer", "lesson": "A moving source changes wavefront spacing ahead and behind it. A moving observer can instead change the rate of encountering wavefronts without changing their spacing in the medium.", "items": [{"q": "A cyclist rides toward a stationary bell. What changes for the cyclist?", "options": ["The bell emits a higher frequency", "Wavefronts are encountered more often", "The sound speed in still air increases"], "correct": 1, "m": 1, "a": "A moving source changes wavefront spacing ahead and behind it. A moving observer can instead change the rate of encountering wavefronts without changing their spacing in the medium."}, {"q": "Explain the lower pitch behind a receding ambulance.", "m": 1, "a": "Wavefronts behind the moving source are farther apart, so they reach a stationary listener less frequently."}]}, {"topic": "WAM-LI-09", "name": "Frequency at a light boundary", "lesson": "At a stationary boundary the source still sets the frequency. If the speed decreases, the wavelength decreases because λ = v/f.", "items": [{"q": "Light slows entering glass. What remains unchanged?", "options": ["Speed", "Frequency", "Wavelength"], "correct": 1, "m": 1, "a": "At a stationary boundary the source still sets the frequency. If the speed decrea
