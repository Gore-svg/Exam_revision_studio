{id:'map',m:'MAP',title:'Read topographic maps and legends',status:'confirmed',objective:'Interpret map conventions and use evidence from a map to describe a place.',definitions:[['Legend','The key that explains the symbols and colours used on a map.'],['Area reference','A reference used to locate a larger grid square, read across then up.'],['Grid reference','A more precise location within a grid square; read eastings first, then northings.'],['Relief','The difference between the highest and lowest point in an area.'],['Aspect','The direction a slope faces; use contour lines to work out which way is downhill.']],method:'Read the map title, scale, north direction and legend first. Locate features using eastings before northings. Use contour spacing and height values to describe relief and slope.',worked:'If a map grid location is requested, move along the eastings first and then northwards. For a slope, closely spaced contour lines indicate a steeper slope than widely spaced lines.',trap:'Reversing the order of a grid reference, or confusing aspect (slope direction) with bearing (direction between two points).',check:'What does a cluster of closely spaced contour lines suggest?',answer:'A steep slope. Closely spaced contours show that elevation changes over a shorter horizontal distance.',cues:['How do you read a grid reference?','What does relief measure?','How can contour spacing show steepness?'],samples:['Read eastings first, then northings.','Relief is highest elevation minus lowest elevation.','Closely spaced contours indicate a steep slope.'],source:'1.5 Revision Module'},
{id:'bearing',m:'MAP',title:'Calculate direction and bearing',status:'confirmed',objective:'Describe direction and express a direction as a three-figure bearing.',definitions:[['Bearing','The direction from one point to another expressed in degrees clockwise from north.'],['North','0° or 360°.'],['South','180°.']],method:'Stand at the starting point and look towards the destination. Bearings are measured clockwise from north and written using three figures (for example, 045°).',worked:'A direction due east is a bearing of 090°. Due south is 180°. Due west is 270°.',trap:'Measuring from the destination, or measuring anticlockwise. Always identify where you are standing.',check:'What is the bearing due west?',answer:'270°.',cues:['From which point is a bearing measured?','Which direction is 180°?','How is a bearing written?'],samples:['From the starting point to the destination.','South.','As a three-figure clockwise angle from north.'],source:'1.5 Revision Module'},
{id:'gradient',m:'MAP',title:'Calculate gradient',status:'confirmed',objective:'Calculate slope gradient as a ratio using consistent units.',definitions:[['Gradient','A measure of how steep a slope is, expressed as a ratio such as 1:20.'],['Height difference','The difference in elevation between two points.']],method:'Find the difference in height and the horizontal distance between the points. Convert both to the same unit. Divide distance by height difference. Express the result as 1:X.',worked:'If two points differ by 40 m in height and are 800 m apart, 800 ÷ 40 = 20, so the gradient is 1:20.',trap:'Using kilometres for distance and metres for height without converting, or reversing the ratio.',check:'A route is 600 m long and rises 30 m. What is its gradient?',answer:'1:20, because 600 ÷ 30 = 20.',cues:['What two measurements are needed?','Why must units match?','What does 1:20 mean?'],samples:['Distance and height difference.','So the ratio compares like units.','For each 1 unit of vertical rise, there are 20 units of horizontal distance.'],source:'1.5 Revision Module'},
{id:'pqea',m:'MAP',title:'Interpret data using PQEA',status:'confirmed',objective:'Use evidence, quantities and explanations to describe spatial patterns and outliers.',definitions:[['PQEA','Pattern, Quantify, Explain, Analyse.'],['Pattern','The overall trend or spatial arrangement in the data.'],['Outlier','A value that is noticeably different from the overall pattern.']],method:'Pattern: identify the trend. Quantify: support it with figures. Explain: give reasons. Analyse: discuss significance or an outlier.',worked:'“Density is highest in the central district (about 8,000 people/km²) and falls towards the outer districts. This may reflect greater access to jobs and services in the centre.”',trap:'Describing a pattern without numbers, or giving a cause without linking it to the data.',check:'Which PQEA step requires figures?',answer:'Quantify.',cues:['What does each PQEA letter stand for?','Why quantify?','What is an outlier?'],samples:['Pattern, Quantify, Explain, Analyse.','Figures make a description precise and evidence-based.','A value noticeably different from the overall pattern.'],source:'1.5 Revision Module; PQEA Population density'},
{id:'biome-distribution',m:'BIO',title:'Explain the distribution of biomes',status:'confirmed',objective:'Describe global biome distribution and explain how climate and physical factors shape it.',definitions:[['Biome','A large ecological region characterised by climate, vegetation and animal life.'],['Latitude','Angular distance north or south of the Equator; it influences solar energy and temperature.'],['Ocean current','A large movement of seawater that can transfer heat and influence coastal climate.'],['Mountain barrier','High relief that can force air to rise, cool and lose moisture, creating different conditions on either side.']],method:'Describe where a biome occurs, then connect its location to temperature, rainfall and physical influences. Latitude affects incoming solar energy; ocean currents can warm or cool adjacent coasts; mountains can create rain-shadow effects.',worked:'A mountain range can force moist air upwards. The air cools and may produce rain on the windward side, while the leeward side can be drier.',trap:'Listing latitude, currents and mountains without explaining how each changes climate.',check:'Why can two places at similar latitude have different rainfall?',answer:'Ocean currents, prevailing winds, relief and mountain barriers can alter moisture and rainfall.',cues:['How does latitude affect climate?','How can a mountain range affect rainfall?','How can an ocean current affect a coastal biome?'],samples:['Latitude influences the angle and intensity of incoming solar energy and therefore temperature.','Rising air cools and may produce rain on the windward side, leaving a drier rain-shadow area.','Warm or cold currents transfer heat and influence coastal temperature and moisture conditions.'],source:'1.1 The World’s Biomes; AT4 notification'},
{id:'biome-characteristics',m:'BIO',title:'Compare biome characteristics',status:'confirmed',objective:'Compare the climate, vegetation and animal life of different biomes.',definitions:[['Vegetation','Plant life in an area.'],['Climate','Long-term patterns of temperature and precipitation.'],['Adaptation','A feature or behaviour that helps an organism survive in its environment.']],method:'Compare temperature, rainfall, seasonal variation, vegetation structure and animal adaptations. Support comparisons with specific characteristics rather than general labels.',worked:'A tropical rainforest is generally warm and wet with dense layered vegetation; a polar biome has very low temperatures, a short growing season and limited vegetation.',trap:'Assuming all biomes at the same latitude are identical or confusing climate with daily weather.',check:'Name two characteristics you could use to compare biomes.',answer:'Any two relevant characteristics such as temperature, rainfall, vegetation or animal adaptations.',cues:['What is a biome?','Which climate variables should be compared?','How do organisms suit their biome?'],samples:['A large ecological region with characteristic climate, vegetation and animal life.','Temperature and precipitation, including seasonal variation.','They have structural or behavioural adaptations to local conditions.'],source:'1.1 The World’s Biomes; rainforest, grassland and polar case studies'},
{id:'biome-change',m:'BIO',title:'Explain changing biomes and human impacts',status:'confirmed',objective:'Explain how natural processes and human activity can change biome conditions.',definitions:[['Land degradation','A decline in the quality or productive capacity of land.'],['Deforestation','Removal of forest cover.'],['Desertification','Land degradation in dry areas, often involving loss of vegetation and soil productivity.']],method:'Identify the pressure, explain the process that changes soil, water or vegetation, then describe ecological and human consequences. Distinguish natural variability from human-caused pressures.',worked:'Removing vegetation can expose soil to erosion. Loss of fertile topsoil can reduce plant growth and agricultural productivity.',trap:'Saying that a biome “disappears” without explaining the process or consequences.',check:'How can clearing vegetation contribute to soil degradation?',answer:'It exposes soil to wind and water erosion and can reduce soil structure and fertility.',cues:['How does deforestation alter a biome?','What is land degradation?','How can erosion affect food production?'],samples:['It removes habitat and changes water, soil and carbon cycles.','A decline in the quality or productive capacity of land.','Loss of fertile topsoil can reduce yields and make land less productive.'],source:'1.2 Changing Biomes; case studies'},
{id:'food-production',m:'FOOD',title:'Explain how biomes produce food',status:'confirmed',objective:'Explain why food production is concentrated in places with suitable environmental conditions.',definitions:[['Food production','Growing crops and raising animals for food.'],['Growing season','The period when conditions allow crops to grow.'],['Irrigation','Artificial supply of water to crops.']],method:'Relate sunlight, water, suitable temperature, soil, landform and length of growing season to the type and amount of food that can be produced.',worked:'The course material describes a pattern in Australia from well-watered coastal areas towards the arid interior. Much of inland Australia receives less than 250 mm of rainfall, so extensive cattle and sheep grazing is common there. Wheat farming is associated with mid-latitude temperate conditions, warm summers, cool winters and about 500 mm annual rainfall.',trap:'Assuming all land in a biome is equally productive; local soil, relief and water access matter.',check:'Name three environmental requirements for crop production.',answer:'Sunlight, water, suitable temperatures, adequate soil and suitable land are relevant examples.',cues:['What does food production need?','How can climate limit crops?','Why does soil matter?'],samples:['Sunlight, water, land area, good soil and suitable climate.','Temperature and rainfall affect crop growth and growing-season length.','Soil provides nutrients, water storage and physical support.'],source:'1.3 Biomes Produce Food'},
{id:'food-challenges',m:'FOOD',title:'Analyse challenges to food production',status:'confirmed',objective:'Explain environmental and human challenges to food production and assess their effects.',definitions:[['Water scarcity','Insufficient available water to meet demand.'],['Soil salinity','Accumulation of salts in soil that can limit plant growth.'],['Competing land use','Different activities competing for the same land, such as agriculture, urban expansion or biofuel production.'],['Land degradation','Declining land quality and productive capacity.']],method:'Name the challenge, explain how it changes water/soil/land or growing conditions, then connect this to crop yields and food supply. Consider scale and whether effects are short- or long-term.',worked:'Water scarcity limits irrigation and plant growth, potentially reducing yields. Pollution can make water unsafe or unsuitable for irrigation.',trap:'Confusing challenges to producing food with unequal access to food; they are connected but not identical.',check:'How can urban expansion challenge food production?',answer:'It can convert agricultural land to housing, roads and other urban uses, reducing land available for farming.',cues:['How does water scarcity affect yields?','What is competing land use?','How can climate change affect production?'],samples:['It limits water available to crops and livestock and may reduce yields.','Different activities compete for a finite area of land.','Changing temperature, rainfall and extreme events can alter growing seasons and damage crops.'],source:'2.2 Challenges to Food Production'},
{id:'food-security',m:'FOOD',title:'Explain food security and food insecurity',status:'confirmed',objective:'Define food security and distinguish food production from access to sufficient nutritious food.',definitions:[['Food security','Exists when all people, at all times, have physical and economic access to enough safe and nutritious food to meet dietary needs and food preferences for an active and healthy lifestyle.'],['Food insecurity','A situation where people do not have reliable access to sufficient safe and nutritious food.'],['Physical access','Whether food is available and can be reached.'],['Economic access','Whether people can afford food.']],method:'Use the four linked ideas in the course definition: all people, at all times, physical and economic access, enough safe and nutritious food. Your course’s Global Food Security Index (2018) map draws on a range of 12 indicators, including affordability, accessibility, nutritional value, food safety and nutritional/health status. High-rated countries may produce a surplus for export or afford to import food needs (Singapore is the class example). Describe the map pattern and compare countries only with evidence visible in the supplied map.',worked:'A country can produce enough food overall yet still experience food insecurity if some households cannot afford it or cannot physically access it. The class material explains that food availability at national level is not enough if food produced in one region is not accessible to people elsewhere.',trap:'Equating food security with total national production alone.',check:'Can food insecurity occur when food exists in a country?',answer:'Yes. People may lack economic or physical access even when food is available nationally.',cues:['State the course definition of food security.','How is availability different from access?','Why is food security more than total production?'],samples:['All people, at all times, have physical and economic access to enough safe and nutritious food for an active and healthy lifestyle.','Availability concerns whether food exists; access concerns whether people can obtain it.','Distribution, affordability, safety and nutrition also matter.'],source:'2.3 Food Security; FAO definition reproduced in class material'},
{id:'food-solutions',m:'FOOD',title:'Assess strategies for future food production',status:'inferred',objective:'Compare ways to improve food security while considering sustainability and trade-offs.',definitions:[['Sustainable production','Producing food while limiting long-term environmental damage and maintaining productive capacity.'],['Food waste','Food intended for consumption that is lost or discarded.']],method:'Compare the strategy with the problem it addresses. The supplied materials include regenerative farming (crop rotation, soil restoration and reduced chemical use), vertical farming, seawater rice in China, Sundrop Farms at Port Augusta and the Svalbard Global Seed Vault. Explain how the innovation may improve yields, resource efficiency or resilience, then assess cost, scale, access and environmental trade-offs.',worked:'Sundrop Farms at Port Augusta uses sunlight and seawater in a hot, arid region. Mirrors concentrate solar energy; the collected heat supports electricity and greenhouse systems and desalination. The course material states it can produce up to 1 million litres of fresh water a day for irrigation. Vertical farming uses stacked indoor systems; seawater rice in China is presented as an innovation for salty and degraded soils.',trap:'Calling a strategy sustainable without explaining why or identifying a limitation.',check:'Give one reason reducing food waste could improve food security.',answer:'It can increase the amount of edible food available and reduce pressure on land, water and other resources.',cues:['How can technology change food production?','Why reduce food waste?','What makes a strategy sustainable?'],samples:['Technology can improve yields or allow food to be grown under different conditions, but costs and access matter.','Less edible food is lost, improving effective supply and reducing wasted resources.','It meets needs while protecting environmental resources and productive capacity over time.'],source:'2.4 Future of Food Production; Seawater Rice material'},
{id:'urbanisation',m:'URB',title:'Explain urbanisation and rural–urban differences',status:'confirmed',objective:'Define urbanisation and compare urban and rural settlement characteristics.',definitions:[['Urbanisation','An increase in the proportion of a population living in urban areas.'],['Urban area','A built-up settlement with relatively high population concentration and services.'],['Rural area','An area outside major urban settlements, often with lower population density and more land-based activities.'],['Population density','The number of people living per unit of area.'],['Population distribution','The way people are spread across a place.']],method:'Distinguish urbanisation (a changing proportion) from urban growth (an increase in the number or size of urban residents/areas). Compare density, services, land use and employment.',worked:'If the urban share rises from 50% to 60%, urbanisation has occurred even if the total population has also changed.',trap:'Defining urbanisation as simply “cities getting bigger”.',check:'What does population density measure?',answer:'The number of people per unit of area, often people per square kilometre.',cues:['Define urbanisation.','How are density and distribution different?','Give two urban–rural differences.'],samples:['An increase in the proportion of a population living in urban areas.','Density is people per area; distribution is where people are located.','Urban areas generally have higher density and more concentrated services and built infrastructure.'],source:'AT3 Urbanisation In-Class Essay and Study Notes'},
{id:'urban-impacts',m:'URB',title:'Analyse impacts of urbanisation',status:'confirmed',objective:'Explain positive and negative social, economic and environmental impacts of urbanisation.',definitions:[['Infrastructure','Basic physical and organisational structures needed for a settlement, such as transport, water and energy systems.'],['Informal settlement / slum','A settlement where residents may experience insecure housing, inadequate services and overcrowding; definitions vary by context.']],method:'Organise impacts into social, economic and environmental categories. Explain the cause-and-effect link and consider who experiences the impact. Use a named city only where you have reliable evidence.',worked:'Rapid population growth can increase demand for housing and transport. If services do not expand at the same rate, congestion and pressure on infrastructure may increase.',trap:'Listing problems without explaining why they occur, or assuming every urban resident experiences the same effects.',check:'Explain one way urbanisation can create pressure on infrastructure.',answer:'Population growth can increase demand for water, transport, housing and waste services faster than infrastructure capacity expands.',cues:['Give one positive and one negative urban impact.','How can rapid growth create informal settlements?','Why do impacts vary between groups?'],samples:['Positive: access to jobs and services; negative: congestion, pollution or housing pressure.','If affordable formal housing and services do not keep pace with population growth, informal housing may expand.','Income, location, planning, infrastructure and access to services differ.'],source:'AT3 Urbanisation In-Class Essay and Study Notes'},
{id:'megacities',m:'URB',title:'Describe megacities and locational patterns',status:'inferred',objective:'Describe megacities and explain factors influencing their location and growth.',definitions:[['Megacity','A city with a population of 10 million or more (common international threshold).'],['Locational pattern','The spatial arrangement of places or features.']],method:'Identify where megacities are concentrated and link location/growth to employment, transport, trade, services, migration and natural increase. Check the definition used by the question or source.',worked:'A city can grow as people move for work and education while natural increase also adds to its population.',trap:'Treating every large city as a megacity; use the population threshold stated by the source.',check:'What population threshold is commonly used for a megacity?',answer:'10 million or more people.',cues:['What is a megacity?','What can attract people to a city?','How could you describe a locational pattern?'],samples:['A city with 10 million or more residents.','Employment, education, healthcare, transport, trade and services.','State where the cities cluster and support the pattern with examples or data.'],source:'AT3 study notes; definition labelled as a general study convention'},
{id:'migration-types',m:'MIG',title:'Define migration and distinguish types',status:'confirmed',objective:'Define migration and distinguish internal/international, voluntary/forced and relevant migrant categories.',definitions:[['Migration','Movement of people from one place of usual residence to another, often with an intention to stay for a period of time.'],['International migration','Movement across an international border to live in another country.'],['Voluntary migration','Migration where people make a choice to move, although choices may be constrained.'],['Forced migration','Movement in which people are compelled to leave because of threats or serious pressures.'],['Refugee','A person who meets the applicable legal definition of needing protection because of persecution or serious threats.'],['Asylum seeker','A person seeking international protection whose claim has not yet been finally determined.']],method:'Classify the movement by border crossed, reason and degree of choice. Avoid treating refugees and asylum seekers as interchangeable.',worked:'A person moving from one Australian state to another is an internal migrant. A person moving from one country to another is an international migrant.',trap:'Assuming every person who crosses a border is a refugee, or that an asylum seeker has already been recognised as a refugee.',check:'What is the key difference between a refugee and an asylum seeker?',answer:'An asylum seeker has requested protection and is awaiting determination; a refugee has been recognised as meeting the applicable protection definition.',cues:['Define international migration.','Distinguish voluntary and forced migration.','Distinguish refugee and asylum seeker.'],samples:['Movement across an international border to live in another country.','Voluntary movement involves choice; forced movement is compelled by threats or serious pressures.','An asylum seeker is awaiting assessment of a protection claim; a refugee meets the relevant protection definition.'],source:'AT4 notification; detailed migration guide absent from archive'},
{id:'migration-causes',m:'MIG',title:'Explain push and pull factors',status:'inferred',objective:'Explain why people migrate by linking push and pull factors to decisions and circumstances.',definitions:[['Push factor','A condition that encourages or compels people to leave a place.'],['Pull factor','A condition that attracts people to a destination.'],['Skilled migration','Migration involving people selected or recruited for particular qualifications, occupations or experience.']],method:'Identify a factor, classify it as push or pull, then explain how it influences a decision. Factors can be economic, social, political, environmental or related to safety.',worked:'Limited employment may push a person to leave, while access to work and education may pull them towards another country.',trap:'Listing a factor without explaining how it affects migration, or assuming all people have the same ability to move.',check:'Is access to a job in the destination generally a push or pull factor?',answer:'A pull factor.',cues:['What is a push factor?','What is a pull factor?','Give one economic and one safety-related factor.'],samples:['A condition that encourages or compels people to leave.','A condition that attracts people to a destination.','Economic: employment opportunities. Safety: conflict or persecution may push people to leave.'],source:'AT4 notification; explanatory detail inferred because migration guide was absent'},
{id:'migration-impacts',m:'MIG',title:'Assess impacts on host and origin countries',status:'confirmed',objective:'Compare positive and negative social, economic and demographic effects in origin and host countries.',definitions:[['Origin country','The country from which a migrant leaves.'],['Host country','The country to which a migrant moves.'],['Brain drain','Loss of skilled or educated people from an origin country.'],['Remittances','Money migrants send to people in their origin country.']],method:'Separate origin and host country effects. Consider labour supply, skills, services, population structure, remittances, family separation and cultural change. Acknowledge that effects depend on context and policy.',worked:'Skilled migration can fill labour shortages in a host country. The origin country may benefit from remittances but lose trained workers if many leave.',trap:'Saying migration is entirely positive or negative; assess both sides and identify who benefits or loses.',check:'What is one possible benefit and one possible cost for an origin country?',answer:'Benefit: remittances or reduced unemployment pressure. Cost: loss of skilled workers or family separation.',cues:['Give a host-country benefit.','Give an origin-country cost.','How can remittances affect origin countries?'],samples:['It can fill skill shortages, support the workforce and add to cultural diversity.','It can lose trained workers, experience family separation or lose working-age population.','They can support household income, education and local spending.'],source:'AT4 notification; effects elaborated as study explanations'},
{id:'migration-australia',m:'MIG',title:'Explain skilled migration and Australia’s points-based system',status:'confirmed',objective:'Explain the general purpose of skilled migration selection and the points-based approach identified in the task notification.',definitions:[['Skilled migration','Movement of workers selected for qualifications, experience or skills sought by a destination country.'],['Points-based selection','A system that assigns points to specified applicant characteristics to help assess eligibility or rank applicants for certain visa pathways.']],method:'Explain the policy purpose, then describe the kinds of applicant characteristics that may be assessed. Use the exact factors and thresholds supplied by your teacher or current official materials; they can change.',worked:'A points-based approach is intended to identify applicants whose skills and characteristics align with labour-market or migration priorities.',trap:'Memorising an outdated points threshold or claiming every Australian visa uses the same points test.',check:'Why might a destination country use skilled migration?',answer:'To address skill shortages, support economic activity and attract workers with needed qualifications or experience.',cues:['What is skilled migration?','What is the purpose of a points-based approach?','Why should thresholds be checked against current material?'],samples:['Migration of people selected for needed skills, qualifications or experience.','It provides a structured way to assess specified characteristics for certain pathways.','Visa rules and points criteria can change and do not apply identically to every visa.'],source:'AT4 notification; detailed Australia migration guide missing'},
{id:'population-pyramids',m:'MIG',title:'Interpret population pyramids and migration',status:'confirmed',objective:'Compare population pyramid shapes and explain how migration can change population structure.',definitions:[['Population pyramid','A graph showing the age and sex structure of a population.'],['Dependency ratio','A measure comparing age groups commonly considered dependent with working-age groups; exact age bands depend on the source.']],method:'Read axes and age bands, compare base/middle/top, identify bulges or gaps, and connect the shape to birth rates, life expectancy, mortality and migration. Migration can affect working-age and other age groups.',worked:'Many LEDCs are commonly represented by a broader base and younger population, often associated with higher birth rates. Many MEDCs are commonly represented by a narrower base and relatively older age groups, often associated with lower birth rates and longer life expectancy. An influx of working-age migrants may widen the working-age bands. These are broad generalisations, not rules for every country.',trap:'Assuming every wide base means the same thing as a wide middle; describe the actual age bands.',check:'How could an influx of working-age migrants change a population pyramid?',answer:'It may widen the age bands where those migrants are represented, often in the working-age middle.',cues:['What does the base of a pyramid show?','How might LEDC and MEDC pyramids differ?','How can migration alter shape?'],samples:['The youngest age groups and recent birth patterns.','Many LEDCs have a broader base and younger structure; many MEDCs have a narrower base and relatively older population, as a general pattern.','It can add people to particular age and sex bands, changing the pyramid’s shape.'],source:'AT4 notification; detailed pyramid examples not present in archive'}
];

mc('bio08','BIO','Which is an example of a human pressure that can change a biome?', ['Deforestation','Latitude','Earth’s rotation','Longitude'],0,'Deforestation removes vegetation and changes habitat and ecosystem processes.'),
wr('bio09','BIO','Explain how latitude and ocean currents can influence biome distribution.',3,['Explains latitude’s relationship to solar energy/temperature.','Explains warm or cold current heat transfer.','Links climate differences to biome distribution.'],'Latitude influences incoming solar energy and temperature. Warm and cold ocean currents transfer heat and can alter coastal conditions. These climate differences influence which vegetation and biome can occur.'),
wr('bio10','BIO','Explain how a mountain barrier can produce different conditions on its windward and leeward sides.',3,['Moist air is forced to rise.','Air cools and precipitation may occur windward.','Leeward air is drier / rain shadow explained.'],'Moist air is forced upwards on the windward side. It cools and may produce rain. Air descending on the leeward side is drier, creating a rain-shadow effect.'),
wr('bio11','BIO','Compare the climate and vegetation of a tropical rainforest and a polar biome.',3,['Accurate rainforest climate.','Accurate polar climate.','Clear vegetation comparison.'],'Tropical rainforests are generally warm and wet with dense, layered vegetation. Polar biomes are very cold with a short growing season and sparse, low-growing vegetation.'),
wr('bio12','BIO','Explain one way human activity can change a biome and one resulting consequence.',2,['Identifies a human activity and explains the process.','Explains an environmental/ecological consequence.'],'Deforestation removes vegetation and habitat. It can expose soil to erosion and reduce biodiversity.'),
// Food production and security
mc('food01','FOOD','Which set contains basic requirements for food production?', ['Sunlight, water, land and suitable soil','High-rise buildings, roads and airports','Only fertiliser','Only cold temperatures'],0,'The course material identifies sunlight, water, land area, good soil and human input.'),
mc('food02','FOOD','Water scarcity can reduce food production because it:', ['Limits water available to crops and livestock','Always increases soil fertility','Creates more arable land','Removes competing land use'],0,'Insufficient water can limit plant growth and livestock needs.'),
mc('food03','FOOD','Which is an example of competing land use?', ['Urban expansion replacing farmland','Measuring rainfall','Planting a windbreak','Changing a map legend'],0,'Urban expansion and biofuel production are identified as competing land uses in the course material.'),
mc('food04','FOOD','Food security exists when:', ['A country exports more food than it imports','All people at all times have physical and economic access to enough safe, nutritious food','Food is produced in one region only','All households grow their own food'],1,'This reproduces the FAO definition included in the class material.'),
mc('food05','FOOD','Which statement best distinguishes food production from food security?', ['They mean exactly the same thing','Production concerns growing food; security also includes reliable access to enough safe and nutritious food','Security concerns maps only','Production concerns money only'],1,'Food security extends beyond total production to access, safety and nutrition.'),
mc('food06','FOOD','Soil erosion can reduce food production because it:', ['Removes fertile topsoil','Increases soil depth in every case','Creates rainfall','Improves all crop yields'],0,'Loss of fertile topsoil can reduce soil productivity.'),
mc('food07','FOOD','Which is an economic barrier to food security?', ['A household cannot afford available food','A crop has sufficient rainfall','A farm has fertile soil','A road map uses a legend'],0,'Economic access includes affordability.'),
mc('food08','FOOD','Why can a country have adequate national food supplies but still have food insecurity?', ['Food may be unevenly distributed or unaffordable','Food security is only measured by exports','All food is always wasted','Population density cannot vary'],0,'People may lack physical or economic access despite national availability.'),
mc('food09','FOOD','Climate change may affect production through:', ['Changes to temperature, rainfall and extreme weather','Changing map symbols','Changing international borders automatically','Reducing all food demand'],0,'Changing climate and weather patterns can affect growing conditions and crop damage.'),
mc('food10','FOOD','Which measure could improve the amount of food reaching consumers without increasing farmland?', ['Reduce food loss and waste','Increase urban sprawl','Pollute irrigation water','Remove fertile topsoil'],0,'Reducing food waste improves effective food availability and avoids wasting resources.'),
wr('food11','FOOD','Explain two environmental challenges to food production and their effects on yields.',4,['Challenge 1 accurately described and linked to yield.','Challenge 2 accurately described and linked to yield.','Clear cause-and-effect explanation.','Uses relevant geographical vocabulary.'],'Water scarcity can limit irrigation and plant growth, reducing yields. Soil degradation or erosion removes fertile topsoil and nutrients, making land less productive.'),
wr('food12','FOOD','Explain why food security is more than simply producing enough food nationally.',4,['Uses the class food-security definition or its key elements.','Explains economic access.','Explains physical access/distribution.','Mentions safety/nutrition/reliability over time.'],'Food security exists when all people, at all times, have physical and economic access to enough safe and nutritious food. National production does not guarantee that households can afford food, reach markets or obtain a balanced diet reliably.'),
wr('food13','FOOD','Explain how urban expansion can challenge food production.',2,['Identifies competition for land.','Links conversion of farmland to reduced production capacity.'],'Urban expansion can convert agricultural land into housing, roads and services. This reduces the area available for farming and can increase pressure on remaining land.'),
wr('food14','FOOD','Use the Timor-Leste case-study materials to explain one dimension of food insecurity. Include a specific statistic or example only if it is in your class notes.',3,['Identifies a food-security dimension.','Explains a cause or barrier.','Links the issue to people’s access or nutrition.'],'Self-mark using your class Timor-Leste report: identify the documented issue, explain its cause, and connect it to availability, access, utilisation or stability. The ZIP includes a Canvas assignment record but not the underlying report attachment; do not invent figures.'),
// Urbanisation
mc('urb01','URB','Urbanisation is:', ['An increase in the proportion of people living in urban areas','Any increase in a country’s total population','The movement of people only between rural towns','A decrease in urban population density'],0,'Urbanisation concerns the proportion of the population living in urban areas.'),
mc('urb02','URB','Population density measures:', ['Where people are located','People per unit area','The number of cities','Annual rainfall'],1,'Density is the number of people per unit of area.'),
mc('urb03','URB','Population distribution describes:', ['The way people are spread across a place','The number of births per year','Only the size of a city','The number of roads'],0,'Distribution refers to the spatial arrangement of population.'),
mc('urb04','URB','Which may be a positive impact of urbanisation?', ['Greater access to jobs and services','Automatic elimination of inequality','No pressure on infrastructure','No environmental impacts'],0,'Urban areas can concentrate employment, education and services.'),
mc('urb05','URB','Rapid urban population growth can increase pressure on:', ['Housing, transport, water and waste services','Map bearings only','Ocean currents','Latitude'],0,'Infrastructure demand can grow faster than capacity.'),
mc('urb06','URB','Which city was included in the AT3 city-choice list?', ['Lagos','Reykjavik','Wellington','Zurich'],0,'Lagos was one of the cities listed for the AT3 urbanisation research task.'),
mc('urb07','URB','Which statement distinguishes urbanisation from urban growth?', ['Urbanisation is the rising urban share; urban growth is an increase in urban population or built-up area','They are always identical','Urbanisation refers only to rural population decline','Urban growth is a climate process'],0,'The concepts are related but not identical.'),
mc('urb08','URB','A common threshold used to describe a megacity is:', ['1 million people','5 million people','10 million people','50 million people'],2,'The studio uses the common 10-million threshold; follow the definition in the question/source if different.'),
wr('urb09','URB','Explain the difference between population density and population distribution.',2,['Defines density as people per area.','Defines distribution as spatial spread/pattern.'],'Population density is the number of people per unit area. Population distribution describes how people are spread across a place.'),
wr('urb10','URB','Analyse one positive and one negative impact of urbanisation.',4,['Positive impact identified.','Explains why/how positive impact occurs.','Negative impact identified.','Explains why/how negative impact occurs.'],'Urbanisation can improve access to employment, education and healthcare because services and businesses are concentrated. However, rapid growth can increase housing demand and traffic, causing overcrowding or congestion where infrastructure does not keep pace.'),
wr('urb11','URB','Explain how rapid urbanisation can contribute to the growth of informal settlements.',3,['Rapid population growth/demand explained.','Limited affordable formal housing or services explained.','Links conditions to informal settlement growth.'],'If people move into a city faster than affordable formal housing and services can be provided, some households may settle in informal housing. These areas can experience insecure tenure, overcrowding and inadequate services.'),
wr('urb12','URB','Choose one city from the AT3 list and explain two factors that may influence its urban growth. Use only details from your approved fact sheet or class notes.',4,['Names a listed city.','Factor 1 explained.','Factor 2 explained.','Uses relevant local evidence or acknowledges source limitation.'],'Use the city research/fact sheet you prepared for AT3. Explain two locally supported drivers (for example, employment, transport, services, migration or natural increase). The supplied ZIP contains the task and city list but not individual fact sheets.'),
// Migration
mc('mig01','MIG','International migration involves:', ['Movement within one suburb','Movement across an international border to live in another country','Daily commuting','Tourism only'],1,'International migration crosses an international border.'),
mc('mig02','MIG','A push factor is:', ['A feature attracting people to a destination','A condition encouraging or compelling people to leave a place','A border checkpoint','A population pyramid'],1,'A push factor encourages or compels people to leave.'),
mc('mig03','MIG','Which is generally a pull factor?', ['Conflict in the origin country','Persecution','Access to employment in the destination','A natural hazard forcing people to leave'],2,'Employment opportunities in the destination can attract migrants.'),
mc('mig04','MIG','An asylum seeker is best described as:', ['A person whose protection claim is awaiting determination','A person who has automatically become a citizen','A tourist','A person moving between suburbs'],0,'An asylum seeker has requested protection but their claim has not been finally determined.'),
mc('mig05','MIG','Which term describes money migrants send to people in their origin country?', ['Gradient','Remittances','Relief','Aspect'],1,'Remittances are transfers of money to the origin country.'),
mc('mig06','MIG','Brain drain refers to:', ['Loss of skilled or educated people from an origin country','Increase in rainfall','Movement into a city centre','An increase in birth rates'],0,'Brain drain can occur when skilled workers leave an origin country.'),
mc('mig07','MIG','A likely host-country benefit of skilled migration is:', ['Filling a skill shortage','Automatic removal of all housing pressure','Loss of all cultural diversity','An end to population ageing'],0,'Skilled migration can add workers with needed qualifications or experience.'),
mc('mig08','MIG','A population pyramid shows:', ['Population age and sex structure','Only annual migration totals','A country’s land area','The distribution of biomes'],0,'Population pyramids display age groups and usually separate males and females.'),
mc('mig09','MIG','An influx of working-age migrants may:', ['Widen the working-age bands of a population pyramid','Always widen only the base','Remove the oldest age groups','Have no possible effect on structure'],0,'The age profile of migrants can change the size of the corresponding age bands.'),
mc('mig10','MIG','Which statement about a points-based migration system is safest?', ['Every visa uses the same points test','Points criteria and thresholds should be checked against the relevant current pathway','Points never change','Points only measure wealth'],1,'The assessment requires the Australian points-based system, but the supplied ZIP lacks its revision guide. Avoid treating one test as universal.'),
wr('mig11','MIG','Distinguish voluntary and forced international migration, giving one example of each.',3,['Explains voluntary migration.','Explains forced migration.','Provides relevant examples.'],'Voluntary migration involves a degree of choice, such as moving for employment or study. Forced migration occurs when people are compelled to leave due to conflict, persecution or serious threats.'),
wr('mig12','MIG','Explain one positive and one negative impact of migration on an origin country.',4,['Identifies a positive impact.','Explains the positive impact.','Identifies a negative impact.','Explains the negative impact.'],'Remittances can increase household income and support education or spending. However, the origin country may lose skilled workers through brain drain and families may be separated.'),
wr('mig13','MIG','Explain one positive and one negative impact of migration on a host country.',4,['Identifies a positive impact.','Explains the positive impact.','Identifies a negative impact.','Explains the negative impact.'],'Migrants can fill labour shortages and contribute skills, businesses and cultural diversity. Rapid population growth can also increase demand for housing, services and infrastructure if planning does not keep pace.'),
wr('mig14','MIG','Explain the general purpose of Australia’s skilled migration and points-based approach. Do not use an unverified points threshold.',3,['Explains skilled migration.','Explains why a points approach may be used.','Links policy to skills/labour needs and notes pathways differ.'],'Skilled migration seeks workers with qualifications or experience that meet identified needs. A points-based approach assesses specified characteristics for certain visa pathways. Not every visa uses the same points test; current criteria must be checked against the relevant pathway.'),
wr('mig15','MIG','A population pyramid has a relatively narrow base and a wide middle. Describe what this may suggest and explain one way migration could affect the pattern.',4,['Describes narrow base / relatively smaller younger group.','Describes wide working-age middle.','Explains one plausible demographic implication.','Explains how migration can change age bands.'],'A narrow base can indicate comparatively low recent birth rates, while a wide middle suggests a large working-age population. An influx of working-age migrants may widen those middle age bands further.'),
wr('mig16','MIG','Write a structured response comparing positive and negative effects of international migration on both origin and host countries.',8,['Addresses origin-country positive effect.','Addresses origin-country negative effect.','Addresses host-country positive effect.','Addresses host-country negative effect.','Explains cause and effect, not just lists.','Uses relevant migration terminology.','Makes a balanced comparison.','Includes a supported example or qualifies evidence.'],'International migration can benefit origin countries through remittances and reduced pressure on some labour markets, but the departure of trained workers can contribute to brain drain and family separation. Host countries may gain workers, skills, businesses and cultural diversity, although rapid population growth can increase demand for housing, transport and services. The scale of each effect depends on who migrates, the skills and age profile of migrants, and how governments plan for population change. Add a named example only where supported by your class sources.')
);

{id:'mock-a',title:'Mock 1 · Core knowledge and skills',description:'Balanced paper with mapping, biomes, food security, urbanisation and migration.',minutes:60,reading:5,questions:[
E('a01','mc','A map scale is 1:25,000. A route measures 4 cm. What is the ground distance?',1,{opts:['100 m','500 m','1 km','10 km'],ans:1,why:'4 × 25,000 cm = 100,000 cm = 1,000 m. Correct option: 1 km.'}),
E('a02','mc','Which direction is represented by a bearing of 045°?',1,{opts:['North-east','South-east','South-west','North-west'],ans:0,why:'045° is halfway between north (000°) and east (090°).'}),
E('a03','mc','Which factor most directly affects the amount of solar energy received at different latitudes?',1,{opts:['Latitude','Population density','Road access','Currency'],ans:0,why:'Latitude changes the angle and intensity of incoming solar energy.'}),
E('a04','mc','Which statement best describes food security?',1,{opts:['A country grows one staple crop','All people at all times have physical and economic access to sufficient safe, nutritious food','A country exports more food than it imports','Food is available only in cities'],ans:1,why:'This follows the FAO definition in your class material.'}),
E('a05','mc','Which is a challenge to food production identified in the course?',1,{opts:['Competing land use','Three-figure bearings','Population pyramids','Cultural diversity'],ans:0,why:'Urban expansion and biofuel production are examples of competing land use.'}),
E('a06','mc','An increase in the proportion of people living in urban areas is called:',1,{opts:['Urbanisation','Relief','Migration balance','Desertification'],ans:0,why:'Urbanisation is a rising urban share of the population.'}),
E('a07','mc','Which measure describes people per square kilometre?',1,{opts:['Population distribution','Population density','Birth rate','Bearing'],ans:1,why:'Population density is population per unit area.'}),

E('a09','mc','What is one possible effect of skilled migration on an origin country?',1,{opts:['Brain drain','A guaranteed increase in rainfall','Removal of all unemployment','No population change'],ans:0,why:'The departure of trained workers can contribute to brain drain.'}),
E('a10','mc','Which part of a population pyramid represents the youngest age groups?',1,{opts:['Base','Middle','Top','Horizontal axis label only'],ans:0,why:'The base represents the youngest age bands.'}),
E('a11','wr','Define aspect and explain how a topographic map can help identify it.',2,{criteria:['Defines aspect as the direction a slope faces.','Explains using contour lines/elevation to identify downhill direction.'],model:'Aspect is the direction a slope faces. Contours show elevation, so the direction downhill indicates the slope’s aspect.'}),
E('a12','wr','Explain how a mountain barrier can influence rainfall and biome conditions.',2,{criteria:['Explains rising moist air and cooling/precipitation on windward side.','Explains drier leeward/rain-shadow conditions.'],model:'Moist air is forced upwards on the windward side, cools and may produce rain. Descending air on the leeward side is drier, creating a rain shadow.'}),
E('a13','wr','Explain two ways water scarcity or land degradation can challenge food production.',3,{criteria:['Identifies a relevant challenge.','Explains its effect on soil/water/crop growth.','Links to reduced yield or productive capacity.'],model:'Water scarcity can restrict irrigation and plant growth. Land degradation can remove fertile topsoil or damage soil structure. Both can reduce yields and the amount of food produced.'}),
E('a14','wr','Explain one positive and one negative impact of urbanisation.',3,{criteria:['Identifies a positive impact.','Explains a negative impact.','Links both impacts to people/services/environment.'],model:'Urbanisation can improve access to jobs and services because these are concentrated in cities. It can also increase housing and transport demand, causing overcrowding or congestion if infrastructure does not keep pace.'}),
E('a15','wr','Distinguish a refugee from an asylum seeker.',4,{criteria:['Defines asylum seeker accurately.','Defines refugee accurately.','Explains that the claim/status differs.','Avoids treating terms as interchangeable.'],model:'An asylum seeker is someone who has requested international protection and whose claim has not yet been finally determined. A refugee is a person who meets the applicable protection definition. The distinction is whether the protection claim has been determined/recognised.'}),
E('a16','wr','Explain two ways migration can affect a host country.',6,{criteria:['First effect identified.','First effect explained.','Second effect identified.','Second effect explained.','Considers conditions/planning or who benefits.','Uses appropriate migration terminology.'],model:'Migration can fill labour shortages and add skills, workers and businesses, supporting economic activity. It can also increase demand for housing, transport, schools and health services if population growth is faster than infrastructure and planning. Impacts depend on the migrants’ skills, age profile and local capacity.'}),
E('a17','er','Extended response (15 marks): Assess the positive and negative impacts of international migration on origin and host countries. Refer to voluntary and forced migration and use a relevant example from your course materials where available.',15,{criteria:['Explains impacts on origin countries with positive and negative effects (4).','Explains impacts on host countries with positive and negative effects (4).','Distinguishes forced and voluntary migration and relates to impacts (2).','Uses relevant evidence/example accurately (2).','Provides a balanced judgement/conclusion (2).','Clear structured geographical communication (1).'],model:'A strong response defines international migration, distinguishes voluntary and forced movement, then compares effects for origin and host countries. Origin countries may receive remittances and experience reduced pressure in some labour markets, but can lose skilled workers and experience family separation. Host countries may fill skill and labour shortages and gain cultural and economic contributions, but can face pressure on housing, transport and services if planning does not keep pace. Forced migration can require protection and resettlement support, while voluntary skilled migration may be shaped by employment and policy settings. A balanced judgement recognises that impacts vary by the migrants’ circumstances, scale of movement and government planning. Add a named example and specific evidence from your class revision guide/fact sheets.'})
]},
{id:'mock-b',title:'Mock 2 · Application and stimulus interpretation',description:'More application-focused questions and geographical reasoning.',minutes:60,reading:5,questions:[

E('b02','mc','A bearing is measured clockwise from:',1,{opts:['North at the starting point','South at the destination','East at the destination','The nearest contour line'],ans:0,why:'Bearings are measured clockwise from north at the point you are standing.'}),
E('b03','mc','A cold ocean current may influence nearby coastal conditions by:',1,{opts:['Transferring less heat than a warm current','Changing the scale of maps','Increasing population density directly','Removing all seasonal variation'],ans:0,why:'Ocean currents transfer heat and can cool or warm adjacent coastal regions.'}),
E('b04','mc','Which factor could reduce agricultural land available for food production?',1,{opts:['Urban expansion','A larger legend','A higher bearing','A wider population pyramid'],ans:0,why:'Urban expansion can convert farmland into built-up land.'}),
E('b05','mc','A household has food available in local shops but cannot afford it. This is primarily a problem of:',1,{opts:['Economic access','Latitude','Relief','Aspect'],ans:0,why:'Economic access includes the ability to afford food.'}),
E('b06','mc','Which is the best PQEA response practice?',1,{opts:['State a trend and support it with figures','List numbers without describing them','Give an opinion without evidence','Explain a cause without identifying the pattern'],ans:0,why:'PQEA requires pattern, quantification, explanation and analysis.'}),
E('b07','mc','Which is an example of a pull factor?',1,{opts:['Employment opportunities in a destination','Conflict in an origin country','A threat of persecution','A severe hazard forcing departure'],ans:0,why:'Jobs in a destination can attract migrants.'}),
E('b08','mc','A wide middle in a population pyramid commonly indicates:',1,{opts:['A relatively large working-age population','No migration ever occurred','Only a high birth rate','A low land area'],ans:0,why:'The middle represents working-age cohorts, depending on the age bands shown.'}),
E('b09','mc','A city has 12 million residents. Under the common threshold used in this studio, it is a:',1,{opts:['Megacity','Rural village','Biome','Grid reference'],ans:0,why:'The common megacity threshold is 10 million people or more.'}),
E('b10','mc','Which term describes money sent by migrants to family in their origin country?',1,{opts:['Remittances','Relief','Gradient','Urbanisation'],ans:0,why:'These transfers are remittances.'}),
E('b11','wr','A map shows contour lines very close together on the eastern side of a ridge and widely spaced on the western side. Compare the slopes.',2,{criteria:['Identifies eastern side as steeper.','Identifies western side as gentler.'],model:'The eastern slope is steeper because contours are closer together. The western slope is gentler because contours are more widely spaced.'}),
E('b12','wr','Explain how latitude and rainfall help determine the distribution of biomes.',2,{criteria:['Links latitude to solar energy/temperature.','Links rainfall to vegetation/biome distribution.'],model:'Latitude influences solar energy and temperature. Rainfall affects water availability and the vegetation that can grow, helping determine biome distribution.'}),
E('b13','wr','Explain why a country may experience food insecurity even when national food production is high.',3,{criteria:['Mentions physical or economic access.','Explains distribution/affordability.','Mentions safe/nutritious/reliable access.'],model:'Some households may not be able to afford food or physically reach it. Food may be unevenly distributed, unsafe or not sufficiently nutritious. Food security concerns access for all people over time, not simply national production.'}),
E('b14','wr','A city’s population rises quickly. Explain one social and one environmental pressure this may create.',3,{criteria:['Identifies social pressure and explains it.','Identifies environmental pressure and explains it.','Links to rapid population growth.'],model:'Rapid growth can increase demand for affordable housing and services, potentially creating overcrowding. It can also increase waste, traffic and air pollution if infrastructure does not keep pace.'}),
E('b15','wr','Explain how skilled migration can create both benefits and challenges for origin and host countries.',4,{criteria:['Host benefit explained.','Host challenge or planning pressure explained.','Origin benefit explained.','Origin challenge explained.'],model:'Host countries can fill skill shortages but may need to expand housing and services. Origin countries may receive remittances, but can lose trained workers through brain drain.'}),
E('b16','wr','Explain how migration can change the age structure shown in a population pyramid.',6,{criteria:['Explains age/sex bands on pyramid.','Identifies that migrants have particular age profiles.','Explains effect on working-age bands or other cohorts.','Mentions possible change to origin structure.','Uses a clear cause-effect link.','Avoids assuming all migrants have same profile.'],model:'A population pyramid shows age and sex structure. If many migrants are working-age adults, the destination may have wider working-age bands. The origin country may lose people in those same age groups. The effect depends on the age and sex profile of the migrants and the scale of movement.'}),
E('b17','er','Extended response (15 marks): “International migration creates opportunities but also challenges.” Discuss this statement with reference to Australia and at least one other international migration context studied in class.',15,{criteria:['Explains an Australian migration context accurately (3).','Explains another international context accurately (3).','Compares positive impacts (2).','Compares negative impacts (2).','Addresses forced/voluntary and/or skilled migration (2).','Provides a balanced judgement (2).','Structure and geographical terminology (1).'],model:'A strong response should discuss Australia’s approach to skilled migration using the specific points-based information supplied by the teacher, while distinguishing the pathway from other visa categories. It should then compare a second migration context from class materials, identify positive and negative effects, and make a supported judgement. The migration attachments referenced in the ZIP did not include the underlying case-study reports, so use the original class evidence for named examples and statistics.'})
]},

E('c04','mc','Which is a basic condition for successful crop production?',1,{opts:['Suitable water and soil','A high urban density','A large number of contour lines','A particular currency'],ans:0,why:'The class module identifies sunlight, water, land, good soil and human input.'}),

E('c06','mc','Which is a likely consequence of rapid urban growth when housing supply is inadequate?',1,{opts:['Greater housing pressure','A guaranteed fall in population','A change in ocean currents','A steeper gradient'],ans:0,why:'Demand can outpace affordable housing provision.'}),

E('c09','mc','Which population-pyramid feature shows the oldest age cohorts?',1,{opts:['Top','Base','Left axis title','Legend'],ans:0,why:'Older cohorts are represented at the top.'}),

E('c11','wr','Explain the difference between relief and aspect.',2,{criteria:['Defines relief accurately.','Defines aspect accurately.'],model:'Relief is the difference between the highest and lowest point in an area. Aspect is the direction a slope faces.'}),

E('c13','wr','Explain how climate change could affect the capacity of a country to increase food production.',3,{criteria:['Identifies a climate-related change.','Explains an impact on crops/livestock/water.','Links to yields or production capacity.'],model:'Changes to rainfall and temperature can alter growing seasons and water availability. More frequent extreme events can damage crops or livestock, limiting a country’s ability to increase production.'}),
E('c14','wr','Explain how megacities can experience both advantages and challenges as they grow.',3,{criteria:['Identifies an advantage.','Identifies a challenge.','Explains how growth contributes to both.'],model:'Megacities can concentrate jobs, trade, transport and services. However, rapid growth may place pressure on housing, transport, water and waste infrastructure.'}),

function startExam(id){const p=allExams().find(x=>x.id===id);if(!p)return;if(state.exam&&!confirm('Replace the current in-progress examination? Export a backup first if you need to preserve it.'))return;state.exam={paperId:id,phase:'reading',started:Date.now(),deadline:Date.now()+5*60*1000,index:0,answers:{},flags:{},grades:{}};persist();setPage('exams');}
function submitExam(expired=false){if(!state.exam||state.exam.phase==='submitted')return;const p=allExams().find(x=>x.id===state.exam.paperId);if(!p)return;const unanswered=p.questions.filter(q=>state.exam.answers[q.id]===undefined||state.exam.answers[q.id]==='').length;if(!expired&&!confirm(`Submit this paper? ${unanswered} question(s) are unanswered. You can review answers before submitting by choosing Cancel.`))return;state.exam.phase='submitted';p.questions.filter(q=>q.type==='mc').forEach(q=>state.exam.grades[q.id]={score:Number(state.exam.answers[q.id])===q.ans?q.marks:0});saveExamResult(p);persist();render();}

function saveWrittenExamGrades(){if(!state.exam)return;const p=allExams().find(x=>x.id===state.exam.paperId);if(!p)return;let invalid=[];p.questions.filter(q=>q.type!=='mc').forEach(q=>{const el=document.querySelector(`[data-exam-grade="${q.id}"]`);if(!el||el.value==='')return;const n=Number(el.value);if(!Number.isInteger(n)||n<0||n>q.marks)invalid.push(q.id);else state.exam.grades[q.id]={...(state.exam.grades[q.id]||{}),score:n};});if(invalid.length){state.message='One or more written marks are invalid. Enter whole numbers within each question’s mark range.';render();return;}saveExamResult(p);persist();render();}
function tickExam(){if(!state.exam||state.exam.phase==='submitted')return;const now=Date.now();if(now>=state.exam.deadline){if(state.exam.phase==='reading'){state.exam.phase='writing';state.exam.deadline=now+60*60*1000;state.message='Reading time has ended. The 60-minute writing period has started.';persist();render();}else{submitExam(true);state.message='Time expired. Your responses have been submitted for review.';persist();render();}return;}const el=document.getElementById('examTimer');if(el){const s=Math.max(0,Math.ceil((state.exam.deadline-now)/1000));el.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}}
function markPractice(id){const q=qby(id);if(!q)return;const attempt=latestAttempt(id);if(attempt&&!state.practice.retrying?.[id])return;let answer;if(q.type==='mc'){const sel=document.querySelector('input[name="practiceAnswer"]:checked');if(!sel){state.message='Choose an answer before marking.';render();return;}answer=Number(sel.value);const score=answer===q.ans?q.marks:0;const rec={answer,score,max:q.marks,pending:false,at:Date.now()};(state.attempts[id]??=[]).push(rec);state.practice.retrying[id]=false;if(score===0)state.corrections[id]={status:'open',score,max:q.marks,at:Date.now(),reason:q.why};else if(state.corrections[id])state.corrections[id].status='corrected';}else{answer=document.getElementById('practiceResponse')?.value||'';if(!answer.trim()){state.message='Write a response before revealing the checking guide.';render();return;}state.practice.drafts[id]=answer;state.practice.retrying[id]=false;const rec={answer,score:0,max:q.marks,pending:true,checked:[],at:Date.now()};(state.attempts[id]??=[]).push(rec);}persist();render();}
function savePracticeMark(){const arr=filteredQuestions(),q=arr[state.practice.index];if(!q||q.type!=='wr')return;const rec=latestAttempt(q.id);if(!rec?.pending)return;const checked=[...document.querySelectorAll('[data-practice-criterion]:checked')].map(x=>Number(x.dataset.practiceCriterion));const score=Math.min(q.marks,checked.length);rec.checked=checked;rec.score=score;rec.pending=false;rec.markedAt=Date.now();if(score<Math.ceil(q.marks*.6))state.corrections[q.id]={status:'open',score,max:q.marks,at:Date.now(),reason:'Some response criteria were not demonstrated. Review the missing criteria and model answer.'};else if(state.corrections[q.id])state.corrections[q.id].status='corrected';persist();render();}

function parseJSONText(txt){let s=String(txt||'').trim();const fence=s.match(/^```(?:json)?\s*([\s\S]*?)\s*```$/i);if(fence)s=fence[1];return JSON.parse(s);}
function validatePack(raw){
if(!raw||typeof raw!=='object'||Array.isArray(raw))throw Error('Each pack must be a JSON object.');
const format=raw.format;if(!['geo-at4-bank-v1','geo-at4-exam-v1'].includes(format))throw Error('Unsupported format. Use geo-at4-bank-v1 or geo-at4-exam-v1.');
if(typeof raw.title!=='string'||!raw.title.trim()||raw.title.length>120)throw Error('Pack title must be 1–120 characters.');
if(!Array.isArray(raw.questions)||raw.questions.length<1||raw.questions.length>250)throw Error('Questions must be an array containing 1–250 items.');
const rawStimuli=raw.stimuli??{};if(!rawStimuli||typeof rawStimuli!=='object'||Array.isArray(rawStimuli))throw Error('Stimuli must be an object keyed by stimulus ID.');
const stimulusKeys=Object.keys(rawStimuli);if(stimulusKeys.length>20)throw Error('A pack may contain no more than 20 stimuli.');
const stimuli={};
for(const [key,value] of Object.entries(rawStimuli)){
 if(!/^[-a-zA-Z0-9_]{1,64}$/.test(key)||!value||typeof value!=='object'||Array.isArray(value))throw Error('A stimulus entry is invalid.');
 const title=String(value.title||'').trim(),text=String(value.text||'');if(!title||title.length>160||text.length>4000)throw Error(`Stimulus ${key}: title or text is invalid.`);
 let image=null;if(value.image!==undefined&&value.image!==null){const im=value.image;if(!im||typeof im!=='object'||typeof im.dataUrl!=='string'||im.dataUrl.length>500000||!/^data:image\/png;base64,[A-Za-z0-9+/]+={0,2}$/.test(im.dataUrl))throw Error(`Stimulus ${key}: image must be an embedded PNG under 500 KB.`);image={dataUrl:im.dataUrl,alt:String(im.alt||'').slice(0,500),caption:String(im.caption||'').slice(0,500)};}
 let table=null;if(value.table!==undefined&&value.table!==null){const t=value.table;if(!t||typeof t!=='object'||!Array.isArray(t.headers)||!Array.isArray(t.rows)||t.headers.length<1||t.headers.length>8||t.rows.length>30||t.headers.some(x=>typeof x!=='string'||x.length>120)||t.rows.some(row=>!Array.isArray(row)||row.length!==t.headers.length||row.some(cell=>String(cell).length>300)))throw Error(`Stimulus ${key}: table structure is invalid.`);table={headers:t.headers.map(String),rows:t.rows.map(row=>row.map(x=>String(x)))};}
 if(!image&&!table&&!text)throw Error(`Stimulus ${key}: add readable text, an image or a table.`);
 stimuli[key]={title,text,image,table};
}
const seen=new Set();
const questions=raw.questions.map((q,i)=>{
 if(!q||typeof q!=='object'||Array.isArray(q))throw Error(`Question ${i+1} is invalid.`);
 if(typeof q.id!=='string'||!/^[-a-zA-Z0-9_]{1,64}$/.test(q.id)||seen.has(q.id))throw Error(`Question ${i+1} has a missing or duplicate ID.`);seen.add(q.id);
 if(typeof q.stem!=='string'||!q.stem.trim()||q.stem.length>3000)throw Error(`Question ${q.id}: stem must be 1–3000 characters.`);
 const moduleId=q.module||q.m||'MAP';if(!MODULES.some(m=>m.id===moduleId))throw Error(`Question ${q.id}: unknown module ${moduleId}.`);
 if(q.intent&&q.intent!=='All'&&!LI.some(li=>li.id===q.intent))throw Error(`Question ${q.id}: unknown learning intention ${q.intent}.`);
 const marks=Number(q.marks);if(!Number.isInteger(marks)||marks<1||marks>20)throw Error(`Question ${q.id}: marks must be a whole number from 1 to 20.`);
 if(!['mc','wr','er'].includes(q.type))throw Error(`Question ${q.id}: type must be mc or wr (or er in an exam).`);
 if(format==='geo-at4-bank-v1'&&q.type==='er')throw Error('Bank questions use mc or wr types.');
 let stimulus=null;if(q.stimulus!==undefined&&q.stimulus!==null){if(typeof q.stimulus!=='string'||!stimuli[q.stimulus])throw Error(`Question ${q.id}: stimulus reference is missing or invalid.`);stimulus=stimuli[q.stimulus];}
 if(q.type==='mc'){
  const opts=q.options||q.opts;if(!Array.isArray(opts)||opts.length<2||opts.length>8||opts.some(x=>typeof x!=='string'||x.length>500))throw Error(`Question ${q.id}: MCQ options are invalid.`);
  const ans=q.answer??q.ans;if(!Number.isInteger(ans)||ans<0||ans>=opts.length)throw Error(`Question ${q.id}: answer index is invalid.`);
  return{id:q.id,m:moduleId,bank:'imported',intent:q.intent||'All',type:'mc',stem:q.stem,opts,ans,why:String(q.explanation||q.why||''),marks,diff:'Imported',stimulus};
 }
 const criteria=q.criteria;if(!Array.isArray(criteria)||criteria.length<1||criteria.length>20||criteria.some(c=>typeof c!=='string'||!c.trim()||c.length>500))throw Error(`Question ${q.id}: written criteria are invalid.`);
 const model=q.model;if(typeof model!=='string'||model.length>6000)throw Error(`Question ${q.id}: model response is required and must be under 6000 characters.`);
 return{id:q.id,m:moduleId,bank:'imported',intent:q.intent||'All',type:q.type,stem:q.stem,marks,criteria,model,diff:'Imported',stimulus};
});
if(format==='geo-at4-exam-v1'){
 const total=questions.reduce((s,q)=>s+q.marks,0);if(total!==45)throw Error(`Mock paper must total 45 marks; this one totals ${total}.`);
 const mcQuestions=questions.filter(q=>q.type==='mc');const mc=mcQuestions.reduce((s,q)=>s+q.marks,0);if(mcQuestions.length!==10||mcQuestions.some(q=>q.marks!==1))throw Error('Exam must have exactly ten one-mark multiple-choice questions.');
 if(mc!==10)throw Error(`Exam MCQ section must total 10 marks; this one totals ${mc}.`);
 const er=questions.filter(q=>q.type==='er').reduce((s,q)=>s+q.marks,0);const short=questions.filter(q=>q.type==='wr').reduce((s,q)=>s+q.marks,0);if(er!==15||short!==20)throw Error(`Exam must contain 20 marks of short answer and 15 marks of extended response; found ${short} and ${er}.`);
 const id='import-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7);
 return{kind:'exam',key:format+':'+hashString(JSON.stringify(raw)),sourceTitle:raw.title,paper:{id,title:raw.title,description:String(raw.description||'Imported paper with visual stimuli.'),minutes:Math.max(1,Math.min(240,Number(raw.minutes)||60)),reading:Math.max(0,Math.min(30,Number(raw.reading)||5)),questions:questions.map(q=>({...q,id:id+'-'+q.id}))}};
}
const id='bank-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7);return{kind:'bank',key:format+':'+hashString(JSON.stringify(raw)),sourceTitle:raw.title,questions:questions.map(q=>({...q,id:id+'-'+q.id}))};
}
function validateAndPreview(){const files=[...(document.getElementById('importFiles')?.files||[]),...(document.getElementById('importFolder')?.files||[])];const paste=document.getElementById('importPaste')?.value||'';const sources=[...new Map(files.map(f=>[f.name+'-'+f.size,f])).values()];const batches=[];let errors=[];let totalBytes=0;for(const f of sources){if(!/\.(json|txt)$/i.test(f.name)){errors.push(`${f.name}: unsupported file extension.`);continue;}if(!f.size){errors.push(`${f.name}: empty file.`);continue;}if(f.size>2*1024*1024){errors.push(`${f.name}: exceeds 2 MiB.`);continue;}totalBytes+=f.size;if(totalBytes>8*1024*1024){errors.push(`${f.name}: batch exceeds 8 MiB.`);continue;}batches.push(f.text().then(t=>({name:f.name,text:t})).catch(()=>({name:f.name,error:'Could not read file.'})));}const pasteTrim=paste.trim();if(pasteTrim&&new Blob([pasteTrim]).size>2*1024*1024){errors.push('Pasted text: exceeds 2 MiB.');}else if(pasteTrim)batches.push(Promise.resolve({name:'Pasted text',text:pasteTrim}));Promise.all(batches).then(async values=>{const accepted=[];for(const v of values){if(v.error){errors.push(`${v.name}: ${v.error}`);continue;}try{const raw=parseJSONText(v.text);const packs=Array.isArray(raw)?raw:[raw];for(const pack of packs){try{const item=validatePack(pack);if(state.imports.some(x=>x.key===item.key)||accepted.some(x=>x.key===item.key))throw Error('Duplicate pack already imported or selected.');accepted.push({...item,source:v.name});}catch(e){errors.push(`${v.name}: ${e.message}`);}}}catch(e){errors.push(`${v.name}: invalid JSON (${e.message}).`);}}state.importPreview={accepted,errors};persist();render();});}

rs and temperature line</text></svg><div class="footnote">The graph uses the values stated in this practice question; it is not a teacher-supplied case-study climate graph.</div></div>`;}

function hashString(text){let h=2166136261;for(let i=0;i<text.length;i++){h^=text.charCodeAt(i);h=Math.imul(h,16777619);}return(h>>>0).toString(16);}


function inferIntent(q){if(q.intent)return q.intent;const id=q.id; if(q.m==='MAP'){if(/map0[67]|map07|map08/.test(id))return 'bearing';if(/map09|map11/.test(id))return 'gradient';if(/map10|map13/.test(id))return 'pqea';if(/map1[4567]|map18/.test(id))return 'climate-graphs';return 'map';}if(q.m==='BIO'){if(/bio08|bio12/.test(id))return 'biome-change';if(/bio03|bio04|bio06|bio11/.test(id))return 'biome-characteristics';return 'biome-distribution';}if(q.m==='FOOD'){if(/food01/.test(id))return 'food-production';if(/food10/.test(id))return 'food-solutions';if(/food04|food05|food07|food08|food12|food14|food16|food17/.test(id))return 'food-security';return 'food-challenges';}if(q.m==='URB'){if(/urb06|urb08|urb13/.test(id))return 'megacities';if(/urb04|urb05|urb10|urb11|urb14|urb15/.test(id))return 'urban-impacts';return 'urbanisation';}if(q.m==='MIG'){if(/mig08|mig09|mig15|mig17|mig18/.test(id))return 'population-pyramids';if(/mig05|mig06|mig07|mig12|mig13|mig16|mig20/.test(id))return 'migration-impacts';if(/mig10|mig14/.test(id))return 'migration-australia';if(/mig02|mig03|mig19/.test(id))return 'migration-causes';return 'migration-types';}return LI.find(x=>x.m===q.m)?.id||'map';}
Q.forEach(q=>{q.intent=inferIntent(q);q.bank='builtin';q.diff=q.diff||((q.type==='wr'&&q.marks>=4)?'Challenge':'Core');});

function assertInvariants(){const ids=new Set();for(const q of Q){if(ids.has(q.id))throw Error('Duplicate practice ID '+q.id);ids.add(q.id);if(!Number.isInteger(q.marks)||q.marks<1)throw Error('Invalid practice marks '+q.id);}for(const p of EXAMS){const total=p.questions.reduce((s,q)=>s+q.marks,0),mc=p.questions.filter(q=>q.type==='mc').reduce((s,q)=>s+q.marks,0);if(total!==45||mc!==10)throw Error(`${p.id} totals ${total}; MCQ ${mc}`);}if(LI.length!==20)throw Error('Learning intention count changed unexpectedly');}
assertInvariants();render();
