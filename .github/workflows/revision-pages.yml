name: Publish revision studios

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: revision-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 build_catalog.py --output "$RUNNER_TEMP/revision-site"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/revision-site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

