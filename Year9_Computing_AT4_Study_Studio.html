,"does not match","will not match","cannot be reused"],["school","account","password"]]},{"label":"Impact","why":"Explains reduced cross-account compromise.","evidenceGroups":[["reuse","sign into","login","log in","access","compromise"],["stolen","leaked","credential","password","school"]]}],"unit":"Networks"},{"id":"at4-120","module":"Vulnerabilities Practical","type":"mc","stem":"The school publishes a network map with default administrator passwords on it. Which action addresses the exposed access risk most directly?","marks":1,"difficulty":"Exam","evidence":"Canvas lesson • supporting AT4 topic","options":["Change those credentials and restrict the document","Change the colour of the map","Move every switch to another room","Compress the map into a smaller image"],"answer":0,"explanation":"Remove public access to the map and rotate exposed credentials because copies may already exist.","unit":"Networks"},{"id":"at4-121","module":"Graph Theory","type":"short","stem":"In an undirected graph with edges AB, BC, CD, DA and AC, identify the degree of A and the shortest distance from B to D. Show one shortest path.","marks":3,"difficulty":"Exam","evidence":"Canvas lesson • supporting AT4 topic","model":"A has degree 3, using AB, DA and AC. The shortest distance from B to D is two edges, for example B–A–D or B–C–D.","criteria":[{"label":"Degree","why":"A has degree 3.","evidenceGroups":[["degree 3","degree is 3","degree of 3","a has degree 3","a 3"]]},{"label":"Distance","why":"B to D is two edges.","evidenceGroups":[["two edges","2 edges","two hops","2 hops","distance is 2","distance 2"]]},{"label":"Path","why":"Gives either B–A–D or B–C–D.","evidenceGroups":[["b a d","b c d"]]}],"unit":"Networks"},{"id":"at4-122","module":"Graph Theory","type":"mc","stem":"A network A–B–C has a new node D attached only to C. What happens to the longest shortest-path distance?","marks":1,"difficulty":"Exam","evidence":"Canvas lesson • supporting AT4 topic","options":["It falls from 2 to 1","It remains 2","It increases from 2 to 3","It is undefined because the network is disconnected"],"answer":2,"explanation":"The new endpoints A and D are three edges apart. Adding a node can increase path distances.","unit":"Networks"},{"id":"at4-123","module":"Social Networks","type":"mc","stem":"One student has two contacts, but both are in different groups and have no other path to each other. Which claim can be justified?","marks":1,"difficulty":"Exam","evidence":"Canvas lesson • supporting AT4 topic","options":["The student must have highest degree","The student connects the two groups in this model","Every member knows the student directly","The network has no edges"],"answer":1,"explanation":"The student is a bridge between the groups in the stated network. A bridging role can differ from degree.","unit":"Networks"},{"id":"at4-124","module":"Producing and Implementing","type":"short","stem":"A guest tablet joins Wi-Fi. Describe a two-part test that proves it can access the internet and is blocked from a known internal staff service.","marks":2,"difficulty":"Exam","evidence":"Canvas lesson • supporting AT4 topic","model":"From the guest tablet load a known public site and verify the page loads. Then attempt to reach a known reachable staff service from the same tablet and verify access is denied.","criteria":[{"label":"Allowed path","why":"Tests a public service and expects success.","evidenceGroups":[["public","internet","website","external"],["loads","success","accessible","reaches","allowed"]]},{"label":"Blocked path","why":"Tests a staff service from the guest device and expects denial.","evidenceGroups":[["guest"],["staff","internal"],["denied","blocked","fails","cannot access","unreachable"]]}],"unit":"Networks"},{"id":"at4-125","module":"Social and Ethical","type":"short","stem":"A class group forwards a dramatic claim without checking it. Explain one harm and one concrete verification step before resharing.","marks":2,"difficulty":"Exam","evidence":"AT4 study guide","model":"An inaccurate claim could harm someone’s reputation or lead to poor decisions. Check the original source and compare the claim with a reliable independent source before sharing.","criteria":[{"label":"Harm","why":"States a concrete impact from false information.","evidenceGroups":[["reputation","mislead","misleads","poor decisions","panic","harm","bullying","damage"]]},{"label":"Verification","why":"Checks original evidence or independent reliable reporting.","evidenceGroups":[["check","verify","compare","cross check","confirm"],["source","evidence","independent","official"]]}],"unit":"Networks"},{"id":"at4-126","module":"Mechatronic Systems","type":"mc","stem":"Which system best illustrates mechatronics?","marks":1,"difficulty":"Exam","evidence":"AT4 study guide","options":["A metal hinge that opens by hand","An automatic gate that senses a vehicle and drives a motor using a programmed board","A printed paper checklist","A loose wire connected to nothing"],"answer":1,"explanation":"The gate combines a mechanical mechanism, electronic sensing and actuation, and programmed control.","unit":"Mechatronics"},{"id":"at4-127","module":"Components","type":"blank","stem":"A robot needs to measure distance, rotate a gripper to a target angle and decide when to close it. For distance use a _____. For rotation use a _____. For decisions use a _____.","marks":3,"difficulty":"Exam","evidence":"AT4 study guide","parts":[{"prompt":"Distance","options":["servo","controller","distance sensor","gear"],"answer":2},{"prompt":"Rotation","options":["distance sensor","servo","microcontroller","light sensor"],"answer":1},{"prompt":"Decision","options":["servo","wheel","gear","controller"],"answer":3}],"explanation":"A sensor measures, a servo produces controlled movement and a controller follows program rules.","unit":"Mechatronics"},{"id":"at4-128","module":"Automation","type":"short","stem":"A conveyor runs the motor for 4 s on every cycle. A redesigned version checks a sensor and stops as soon as the parcel reaches the target. Explain the difference in control and one benefit.","marks":3,"difficulty":"Exam","evidence":"AT4 study guide","model":"The original runs for a fixed time without checking the parcel’s position. The redesign uses position feedback to stop when the target is reached. It can stop at the target even if travel time varies.","criteria":[{"label":"Timer","why":"Fixed time without checking the result.","evidenceGroups":[["timer","time","4 s","four seconds"],["fixed","without checking","does not check","independent","every cycle"]]},{"label":"Feedback","why":"Uses position sensing to stop at the target.","evidenceGroups":[["feedback","sensor","position"],["target","parcel"],["stop","stops"]]},{"label":"Benefit","why":"Adapts to a plausible change such as speed or travel time.","evidenceGroups":[["varies","vary","different","change","changes","adjusts","adapt","consistent"],["time","speed","travel","position","target"]]}],"unit":"Mechatronics"},{"id":"at4-129","module":"Algorithms Robotics","type":"mc","stem":"A distance sensor fails and reports no reading. Which rule gives the safest default for the robot approaching a person?","marks":1,"difficulty":"Exam","evidence":"AT4 study guide","options":["Assume the path is clear and accelerate","Repeat the last command forever","Stop, flag the missing reading and require a valid reading before moving again","Treat the missing value as unlimited distance"],"answer":2,"explanation":"A missing reading gives no evidence that the path is safe. A safe default stops movement and reports the fault.","unit":"Mechatronics"},{"id":"at4-130","module":"Algorithms Robotics","type":"short","stem":"A robot should align with a ball before driving forward. Its camera detects the ball to the right of centre. Explain the next two decisions before it reaches the ball.","marks":2,"difficulty":"Exam","evidence":"Canvas lesson • supporting AT4 topic","model":"Turn right to reduce the centre error, then read the camera again. Drive forward only once the ball is aligned and a valid distance reading is above the stopping threshold.","criteria":[{"label":"Alignment","why":"Turns right and checks position again.","evidenceGroups":[["right"],["check","read","sample","detect","measure"],["again","repeat","recheck"]]},{"label":"Move condition","why":"Requires alignment and valid distance beyond the stopping threshold.","evidenceGroups":[["aligned","centre","center"],["valid","distance"],["above","greater","beyond",">"],["threshold","stop","55"]]}],"unit":"Mechatronics"},{"id":"at4-131","module":"Practical - Robot Movement","type":"mc","stem":"A turning robot overshoots 90° repeatedly. Which test most directly shows whether reducing turn speed improves accuracy?","marks":1,"difficulty":"Exam","evidence":"Canvas lesson • supporting AT4 topic","options":["Change speed and surface together","Run several trials at each speed on the same surface and measure turn angles","Only test the new speed once without measurement","Increase drive distance and leave turning unchanged"],"answer":1,"explanation":"Control other variables and measure repeat trials at both speeds.","unit":"Mechatronics"},{"id":"at4-132","module":"Requirements","type":"short","stem":"For a school delivery robot, turn “it should stop safely” into one measurable requirement and give an acceptance test with an expected result.","marks":2,"difficulty":"Exam","evidence":"Canvas lesson • supporting AT4 topic","model":"The robot must stop within 0.5 seconds of detecting an obstacle under the stated test conditions. Place a test target in its path, time detection to full stop and accept a result of 0.5 seconds or less.","criteria":[{"label":"Requirement","why":"Sets an observable stop criterion with a measurable limit.","evidenceGroups":[["stop"],["within","maximum","less than","at most","no more than"],["seconds","second","ms","cm","mm","m"]]},{"label":"Acceptance test","why":"Measures actual behaviour and compares it with the requirement.","evidenceGroups":[["test","target","obstacle"],["measure","time","record"],["accept","expected","or less","no more than","compare"]]}],"unit":"Mechatronics"},{"id":"at4-133","module":"Social Ethical","type":"short","stem":"A factory wants to introduce automated inspection. Explain one quality benefit and one ethical responsibility toward workers affected by the change.","marks":2,"difficulty":"Exam","evidence":"AT4 study guide","model":"Consistent inspection can reduce missed defects. Explain changes to affected workers and provide training for new duties rather than leaving them without support.","criteria":[{"label":"Quality","why":"Connects a consistent or improved inspection process to defect detection.","evidenceGroups":[["consistent","consistency","reduce","reduces","reliable","accurate"],["defect","defects","quality","inspection"]]},{"label":"Responsibility","why":"Proposes a practical step for workers affected.","evidenceGroups":[["training","train","retrain","consult","consultation","redeploy","support"],["workers","staff","duties","job","roles"]]}],"unit":"Mechatronics"},{"id":"at4-134","module":"Automation","type":"mc","stem":"Which industry scenario makes the strongest case for automatic control?","marks":1,"difficulty":"Exam","evidence":"AT4 study guide","options":["A one-off choice of a team colour","A repetitive packing operation needing consistent timing and placement","A vote on the class excursion","An open-ended conversation about design goals"],"answer":1,"explanation":"A repeatable operation with measurable conditions is suited to programmed rules. Evaluate failures and worker impacts too.","unit":"Mechatronics"},{"id":"at4-135","module":"Social Ethical","type":"short","stem":"An operator proposes bypassing a robot’s guard because it slows production. Explain the safety concern and give a safer response that can still address delays.","marks":2,"difficulty":"Exam","evidence":"AT4 study guide","model":"Removing the guard exposes workers to the moving mechanism. Keep the guard active and investigate process layout or cycle timing with a safety review before making a change.","criteria":[{"label":"Concern","why":"Connects guard removal to contact with moving machinery.","evidenceGroups":[["guard","bypass"],["contact","injury","hit","struck","exposes","expose"],["moving","mechanism","robot","arm"]]},{"label":"Response","why":"Retains the safety control and addresses delays with a review or safer design change.","evidenceGroups":[["keep","retain","maintain","leave"],["guard","interlock"],["review","layout","timing","redesign","investigate"]]}],"unit":"Mechatronics"},{"id":"at4-136","module":"Computer Networks","type":"short","stem":"A client and a file server share a network. Describe what the client sends and what the server does when the student opens a stored file.","marks":2,"difficulty":"Exam","evidence":"Canvas lesson • supporting AT4 topic","model":"The client requests the file. The server receives the request, checks the client’s access and sends the requested file if permitted.","criteria":[{"label":"Client","why":"Sends a request for the file.","evidenceGroups":[["client"],["request","requests","asks"],["file"]]},{"label":"Server","why":"Checks or processes the request and serves the file.","evidenceGroups":[["server"],["checks","check","processes","receives"],["sends","serves","returns","delivers"]]}],"unit":"Networks"},{"id":"at4-137","module":"Identifying and Defining","type":"mc","stem":"Which statement is a functional requirement for the guest Wi-Fi service?","marks":1,"difficulty":"Exam","evidence":"Canvas lesson • supporting AT4 topic","options":["The login page must load within 3 seconds","Guests must be able to sign in using a temporary code","Monthly downtime must stay under 10 minutes","The site must support 50 simultaneous sign-ins"],"answer":1,"explanation":"Being able to sign in describes what the service must do. Speed, uptime and capacity constrain how well it does it.","unit":"Networks"},{"id":"at4-138","module":"Producing and Implementing","type":"mc","stem":"Which observation best verifies that student VLAN devices are blocked from a restricted server?","marks":1,"difficulty":"Exam","evidence":"Canvas lesson • supporting AT4 topic","options":["An authorised staff device can reach it, and the same request from a student VLAN device is denied","The student’s Wi-Fi icon appears","The server cable is plugged in","Both devices fail to reach any site"],"answer":0,"explanation":"Use a working baseline to distinguish policy denial from a general failure.","unit":"Networks"},{"id":"at4-139","module":"Basic Programming Concepts","type":"blank","stem":"In `def fee(age): return age + 1`, age is a _____. In `value = fee(8)`, 8 is an _____. The final value is _____.","marks":3,"difficulty":"Exam","evidence":"AT4 study guide","parts":[{"prompt":"age","options":["argument","parameter","operator","list"],"answer":1},{"prompt":"8","options":["parameter","operator","argument","string"],"answer":2},{"prompt":"value","options":["8","9","10","None"],"answer":1}],"explanation":"The definition receives the argument in a parameter. The function returns 9, which the assignment stores.","unit":"Programming"},{"id":"at4-140","module":"Practical - Robot Movement","type":"short","stem":"A robot drives straight in one trial and veers on another. What should you hold constant, what should you measure and how would you decide whether the veer is repeatable?","marks":3,"difficulty":"Exam","evidence":"Canvas lesson • supporting AT4 topic","model":"Keep the same surface, starting orientation and commanded distance. Measure the lateral offset at the end of each of several trials. Compare whether the offset repeatedly occurs in the same direction and is similar in size.","criteria":[{"label":"Control","why":"Holds relevant conditions constant.","evidenceGroups":[["same","constant","control","keep"],["surface","start","orientation","distance"]]},{"label":"Measure","why":"Records sideways movement or angle.","evidenceGroups":[["offset","deviation","lateral","angle","sideways"],["measure","record","distance"]]},{"label":"Decision","why":"Repeats and compares direction or size across trials.","evidenceGroups":[["trials","repeat","repeats","several"],["compare","same direction","similar","consistent","repeatable"]]}],"unit":"Mechatronics"},{"id":"at4-141","module":"Social Networks","type":"short","stem":"A sociogram shows who follows whom. Explain why a directed edge from A to B does not imply that B follows A, and what extra evidence would show reciprocity.","marks":2,"difficulty":"Exam","evidence":"Canvas lesson • supporting AT4 topic","model":"A directed edge represents the direction of the relationship: A follows B. To show mutual following, observe a separate edge from B to A as well.","criteria":[{"label":"Direction","why":"Explains that A → B is A following B.","evidenceGroups":[["directed","direction","arrow"],["a to b","a b","a follows b"]]},{"label":"Reciprocity","why":"Requires the reverse edge B → A.","evidenceGroups":[["reverse","separate","second","other"],["b to a","b a","b follows a"]]}],"unit":"Networks"},{"id":"at4-142","module":"Data Types","type":"match","stem":"Match the situation to the most suitable Python representation.","marks":4,"difficulty":"Exam","evidence":"AT4 study guide","left":["Locker code with leading zeroes","Number of completed laps","Room temperature with decimals","Whether a door is open"],"right":["Integer","Boolean","String","Float"],"keys":[2,0,3,1],"explanation":"Choose a data type based on the meaning of the value and the operations needed.","unit":"Programming"},{"id":"at4-143","module":"Automation","type":"match","stem":"Match each automation test to the best expected response.","marks":4,"difficulty":"Exam","evidence":"AT4 study guide","left":["Fresh moisture reading is below the watering threshold","Fresh reading reaches the moisture threshold","Sensor reports invalid data","Watering is commanded but the flow sensor reports none"],"right":["Stop watering","Investigate actuator or water supply failure","Start or continue watering","Enter the specified safe state and report a fault"],"keys":[2,0,3,1],"explanation":"Test normal, boundary, missing input and failed actuation separately.","unit":"Mechatronics"},{"id":"at4-144","module":"Graph Theory","type":"short","stem":"Two routes lead from A to D. A–B–D costs 5 + 4 seconds and A–C–D costs 2 + 3 seconds. Explain why the minimum-hop rule is insufficient and choose the faster route.","marks":2,"difficulty":"Beyond","evidence":"Extension • optional weighted-path practice","model":"Both routes have two hops. A–B–D takes 9 seconds. A–C–D takes 5 seconds, so choose A–C–D based on total time.","criteria":[{"label":"Equal hops","why":"Both routes use two edges.","evidenceGroups":[["two hops","2 hops","two edges","2 edges"],["both","each","same","equal"]]},{"label":"Weighted choice","why":"Chooses A–C–D and compares 5 seconds with 9 seconds.","evidenceGroups":[["a c d"],["5 seconds","5 s"],["9 seconds","9 s"]]}],"unit":"Networks"},{"id":"at4-145","module":"Practical - AI Vision Sensor","type":"mc","stem":"A robot sees the ball intermittently under changing lighting. Which design is most robust?","marks":1,"difficulty":"Beyond","evidence":"Canvas practical context • optional sensor detail","options":["Continue driving at full speed when a frame has no detection","Verify a current detection before correcting position or moving forward","Use the oldest camera result for every loop","Assume a missing detection means the ball is centred"],"answer":1,"explanation":"A current detection reduces the chance of acting on stale information. Handle a missing target explicitly.","unit":"Mechatronics"},{"id":"at4-146","module":"Mechatronic Systems","type":"short","stem":"A controller commands a motor to open a gate, but the gate jams. Explain which additional input could let the controller detect the fault and what safe response it could take.","marks":2,"difficulty":"Exam","evidence":"AT4 study guide","model":"An end-position limit switch can report whether the gate reaches the open position. If the switch does not trigger within the time limit, stop the motor and report a fault.","criteria":[{"label":"Detection","why":"Adds position feedback and checks the expected gate state.","evidenceGroups":[["limit switch","position sensor","position feedback"],["open","position","reach","trigger"]]},{"label":"Response","why":"Stops or disables motion and reports a fault.","evidenceGroups":[["stop","disable","cut off","turn off"],["fault","alert","warning","report"]]}],"unit":"Mechatronics"},{"id":"at4-147","module":"Sequence","type":"short","stem":"A robot must find a part, grip it, then lift it. Explain why lifting before confirming the grip is a sequencing fault and add a useful check.","marks":2,"difficulty":"Exam","evidence":"AT4 study guide","model":"If the part is unsecured, lifting can leave it behind or drop it. Check a grip sensor or another verified signal before lifting, and stop or retry if the check fails.","criteria":[{"label":"Failure","why":"Connects early lifting to unsecured or dropped load.","evidenceGroups":[["grip","unsecured","not held"],["drop","drops","left behind","leave","fall"]]},{"label":"Check","why":"Checks the grip before lift and handles a failed check.","evidenceGroups":[["check","verify","confirm"],["grip","sensor"],["before","prior"],["stop","retry","fails","fault"]]}],"unit":"Programming"}],"exams":[{"id":"at4-paper-a","title":"Mock A · Balanced AT4 practice","minutes":40,"marks":35,"builtin":true,"description":"Trace Python, construct classroom pseudocode and explain VLANs, compression and automated control.","questions":["at4-001","at4-002","at4-003","at4-004","at4-005","at4-006","at4-007","at4-008","at4-009","at4-010","at4-011","at4-012","at4-013"]},{"id":"at4-paper-b","title":"Mock B · Knowledge in context","minutes":40,"marks":36,"builtin":true,"description":"Apply course terms to flowcharts, network media, security, sensor roles and a workplace safety scenario.","questions":["at4-014","at4-015","at4-016","at4-017","at4-018","at4-019","at4-020","at4-021","at4-022","at4-023","at4-024","at4-025","at4-026","at4-027"]},{"id":"at4-paper-c","title":"Mock C · Programming and problem solving","minutes":40,"marks":35,"builtin":true,"description":"Write and debug code, trace network paths and check robot behaviour at a threshold.","questions":["at4-028","at4-029","at4-030","at4-031","at4-032","at4-033","at4-034","at4-035","at4-036","at4-037","at4-038","at4-039","at4-070"]},{"id":"at4-paper-d","title":"Mock D · Applied challenge","minutes":45,"marks":35,"builtin":true,"description":"Construct a post-test algorithm and apply network, privacy and automation concepts to unfamiliar problems.","questions":["at4-040","at4-041","at4-042","at4-043","at4-044","at4-045","at4-046","at4-047","at4-048","at4-049","at4-050","at4-071"]},{"id":"at4-paper-e","title":"Mock E · Mixed-format paper","minutes":45,"marks":36,"builtin":true,"description":"Match code lines and network roles, write and test Python, and explain control systems and exam scenarios.","questions":["at4-079","at4-080","at4-086","at4-092","at4-098","at4-101","at4-104","at4-107","at4-113","at4-118","at4-125","at4-128","at4-129"]}],"archiveQuestions":[{"type":"mc","module":"LAN, WAN, WLAN, VLAN, VPN — Essential Networking","unit":"Networks","difficulty":"Exam","marks":1,"stem":"A school separates student and administration devices into two logical broadcast domains on the same managed switches. Which technology is being used?","options":["VLANs","A single unmanaged hub","A wider-area leased circuit","One shared subnet with no segmentation"],"answer":0,"explanation":"A VLAN is a logical Layer-2 broadcast domain; managed switches can place ports into separate VLANs.","id":"core-0001","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"LAN, WAN, WLAN, VLAN, VPN — Essential Networking","unit":"Networks","difficulty":"Exam","marks":1,"stem":"Two devices are in separate VLANs and must exchange IP traffic. What is normally required?","options":["A passive patch panel","A router or Layer-3 switch that routes between VLANs","A repeater connecting the same segment","A second DNS resolver"],"answer":1,"explanation":"Different VLANs are separate Layer-2 domains; routing between their subnets requires Layer-3 functionality.","id":"core-0002","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"LAN, WAN, WLAN, VLAN, VPN — Essential Networking","unit":"Networks","difficulty":"Exam","marks":1,"stem":"On a switch, an 802.1Q trunk is most useful for which situation?","options":["Assigning one untagged access VLAN to a PC","Encrypting traffic between remote sites","Carrying frames for multiple VLANs over one physical link","Allocating DHCP addresses"],"answer":2,"explanation":"An 802.1Q trunk tags frames to distinguish VLAN membership across a shared link.","id":"core-0003","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"LAN, WAN, WLAN, VLAN, VPN — Essential Networking","unit":"Networks","difficulty":"Exam","marks":1,"stem":"Which option best explains the difference between a LAN and a WAN?","options":["A LAN requires fibre while a WAN requires Wi-Fi","A WAN always has fewer devices than a LAN","A LAN cannot communicate with the internet","A LAN spans a limited local area; a WAN links sites across larger distances"],"answer":3,"explanation":"Scope is the key distinction. A WAN can connect several geographically separated LANs.","id":"core-0004","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"LAN, WAN, WLAN, VLAN, VPN — Essential Networking","unit":"Networks","difficulty":"Exam","marks":1,"stem":"A laptop successfully joins Wi-Fi but cannot reach devices in another subnet; it can reach its own subnet. Which missing setting is most relevant?","options":["A correct default gateway","A longer Ethernet cable","A different SSID colour","A larger SSD"],"answer":0,"explanation":"The default gateway sends packets from the local subnet to other networks.","id":"core-0005","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"LAN, WAN, WLAN, VLAN, VPN — Essential Networking","unit":"Networks","difficulty":"Exam","marks":1,"stem":"A user types a website domain instead of a numeric IP address. What service typically resolves the name?","options":["DHCP","DNS","ARP alone","NAT alone"],"answer":1,"explanation":"DNS maps domain names to resource records such as IP addresses.","id":"core-0006","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"LAN, WAN, WLAN, VLAN, VPN — Essential Networking","unit":"Networks","difficulty":"Exam","marks":1,"stem":"Which device most directly assigns IP configurations automatically on a typical school network?","options":["A DNS-only cache","An unmanaged switch","A DHCP server","An access-point antenna"],"answer":2,"explanation":"DHCP supplies a client with network configuration such as an IP address, mask and gateway.","id":"core-0007","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"Computer Networks","unit":"Networks","difficulty":"Exam","marks":1,"stem":"In a client–server model, which statement is most accurate?","options":["A server supplies services or resources requested by clients","Every client must provide identical resources to every other","A switch performs all application processing","Client devices can never communicate directly"],"answer":0,"explanation":"Clients request services, while servers respond; peer-to-peer communication is a different architecture.","id":"core-0008","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"Computer Networks","unit":"Networks","difficulty":"Exam","marks":1,"stem":"A switch learns which device is on each port primarily by examining which address?","options":["Source web URL","Source MAC address","Destination DNS name","User account password"],"answer":1,"explanation":"Ethernet switches build MAC address tables from the source MAC addresses of received frames.","id":"core-0009","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"Computer Networks","unit":"Networks","difficulty":"Exam","marks":1,"stem":"A single network cable is cut on a star topology connecting one PC to a central switch. Which is the usual direct impact?","options":["All connected PCs necessarily lose power","The topology automatically becomes a ring","That PC loses its connection, while other links may keep working","Every router must stop forwarding"],"answer":2,"explanation":"Separate spoke links mean one failed host cable normally affects that host, not all others.","id":"core-0010","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"Computer Networks","unit":"Networks","difficulty":"Exam","marks":1,"stem":"What does a handshake generally establish before or during network communication?","options":["A permanent physical cable route","A VLAN on every switch automatically","An internet account password reset","An agreed communication state or connection parameters"],"answer":3,"explanation":"Handshakes coordinate communication and may negotiate or establish connection/security state.","id":"core-0011","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"Data Processing and Transmission","unit":"Networks","difficulty":"Exam","marks":1,"stem":"Which protocol is designed to provide reliable, ordered delivery of a byte stream over IP?","options":["TCP","UDP by itself","DNS","ARP"],"answer":0,"explanation":"TCP uses sequencing, acknowledgements and retransmission to provide reliable ordered delivery.","id":"core-0012","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"Data Processing and Transmission","unit":"Networks","difficulty":"Exam","marks":1,"stem":"Which statement about packet switching is most accurate?","options":["A dedicated end-to-end electrical circuit is reserved for every message","Data is split into packets that can be independently forwarded through a network","No addressing information is required","Every packet must always use the same path"],"answer":1,"explanation":"Packet headers carry routing information, and networks may forward packets through varying routes.","id":"core-0013","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"Data Processing and Transmission","unit":"Networks","difficulty":"Exam","marks":1,"stem":"A photo is compressed with JPEG at a low-quality setting. Why may fine detail be lost?","options":["JPEG is always a lossless archive","Fibre optic links remove pixels","JPEG commonly uses lossy compression","DNS drops the image resolution"],"answer":2,"explanation":"Lossy encoding discards some information to reduce the number of bits needed.","id":"core-0014","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"Data Processing and Transmission","unit":"Networks","difficulty":"Intermediate","marks":1,"stem":"An MP4 file plays video encoded with H.264. What is the most accurate description?","options":["H.264 is a network cable type","MP4 is a router protocol","A codec is always the file extension","MP4 is a container; H.264 is a video codec"],"answer":3,"explanation":"A container packages streams and metadata; a codec describes media encoding and decoding.","id":"core-0015","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"Network Hardware","unit":"Networks","difficulty":"Exam","marks":1,"stem":"Which medium uses pulses of light rather than electrical signals to carry data?","options":["Optical fibre","Twisted-pair copper","Coaxial cable","USB copper wiring"],"answer":0,"explanation":"Fibre transmits optical signals through glass or plastic, often over long distances.","id":"core-0016","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"Network Hardware","unit":"Networks","difficulty":"Exam","marks":1,"stem":"In an enterprise WLAN, which device connects wireless stations onto the wired distribution network?","options":["Patch panel","Wireless access point","Unmanaged splitter","Network interface driver only"],"answer":1,"explanation":"An access point provides a wireless connection into a local network.","id":"core-0017","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"Vulnerabilities Intro","unit":"Networks","difficulty":"Exam","marks":1,"stem":"Which is the clearest example of phishing?","options":["A switch forwards a frame","A host receives a DHCP lease","A fraudulent message tricks a user into disclosing login details","A fibre cable transmits light"],"answer":2,"explanation":"Phishing relies on social engineering to obtain sensitive data or induce unsafe action.","id":"core-0018","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"Vulnerabilities Intro","unit":"Networks","difficulty":"Exam","marks":1,"stem":"Which control most reduces harm from a stolen password?","options":["Disabling backup copies","Sharing the same password with teammates","Turning off device updates","Multi-factor authentication"],"answer":3,"explanation":"MFA requires another factor beyond the compromised password.","id":"core-0019","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"Vulnerabilities Practical","unit":"Networks","difficulty":"Exam","marks":1,"stem":"A school allows guest internet access but wants to prevent guests from accessing student file servers. What is the best design?","options":["Guest VLAN and firewall/access rules restricting internal access","Guests use the same unrestricted subnet as servers","Disable all DNS resolution for staff","Give guest devices switch administrator rights"],"answer":0,"explanation":"Segment guest traffic and apply access-control rules, allowing required internet access but denying internal systems.","id":"core-0020","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"Social and Ethical","unit":"Networks","difficulty":"Exam","marks":1,"stem":"Which action is most consistent with privacy-by-design?","options":["Keep all data forever without explanation","Collect only data necessary for the stated purpose","Give everyone unrestricted read access","Publish identifiable logs by default"],"answer":1,"explanation":"Data minimisation limits exposure and reduces unnecessary retention.","id":"core-0021","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"Graph Theory","unit":"Networks","difficulty":"Exam","marks":1,"stem":"In a graph of school-network devices, what is the degree of a vertex in an undirected graph?","options":["The total number of vertices in the graph","The number of shortest routes in the network","The number of edges incident to that vertex","The sum of all packet sizes"],"answer":2,"explanation":"Degree counts the edges directly connected to a vertex in an undirected graph.","id":"core-0022","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"Graph Theory","unit":"Networks","difficulty":"Exam","marks":1,"stem":"A graph has vertices A, B, C, D and edges AB, BC and CD. How many edges are on the shortest path from A to D?","options":["2","4","1","3"],"answer":3,"explanation":"The unique route is A–B–C–D, which uses three edges.","id":"core-0023","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"Social Networks","unit":"Networks","difficulty":"Exam","marks":1,"stem":"What does a directed edge A→B represent in a follower network?","options":["A follows B, without implying B follows A","A and B necessarily follow one another","A is a server and B is a router","A and B must have the same degree"],"answer":0,"explanation":"A directed connection records the direction of the relationship; the reverse edge is not implied.","id":"core-0024","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"Algorithms","unit":"Programming","difficulty":"Exam","marks":1,"stem":"Which property is essential for an algorithm intended to terminate?","options":["A graphical flowchart only","A finite sequence of executable steps for its stated task","A global variable on every line","A network address"],"answer":1,"explanation":"An algorithm is an ordered set of unambiguous instructions; termination is required for a terminating algorithm.","id":"core-0025","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"Input, Process, Output","unit":"Programming","difficulty":"Exam","marks":1,"stem":"An app reads a temperature, compares it with a threshold and activates a fan. What is the comparison step?","options":["Input acquisition","Output action","Processing","Persistent storage"],"answer":2,"explanation":"The comparison transforms or evaluates data, so it is part of processing.","id":"core-0026","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"Flowcharts","unit":"Programming","difficulty":"Exam","marks":1,"stem":"Which standard flowchart shape is used for a decision?","options":["Rectangle","Parallelogram","Oval","Diamond"],"answer":3,"explanation":"A diamond represents a condition and branches (such as Yes/No).","id":"core-0027","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"Pseudocode","unit":"Programming","difficulty":"Exam","marks":1,"stem":"Why is pseudocode useful before writing Python?","options":["It expresses logic without requiring exact programming-language syntax","It automatically executes on every computer","It proves all tests will pass","It replaces user requirements"],"answer":0,"explanation":"Pseudocode helps plan control flow before implementation in a specific language.","id":"core-0028","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"Selection","unit":"Programming","difficulty":"Exam","marks":1,"stem":"What does `elif` do in Python?","options":["Runs every branch regardless of condition","Tests another condition if the earlier if/elif conditions were false","Repeats the first branch until true","Declares a new function"],"answer":1,"explanation":"An elif branch is considered if preceding conditions in the same chain did not match.","id":"core-0029","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"Repetition","unit":"Programming","difficulty":"Exam","marks":1,"stem":"What is printed by `for n in range(2, 7, 2): print(n)`?","options":["2, 4, 6, 8","2, 3, 4, 5, 6","2, 4, 6","4, 6, 8"],"answer":2,"explanation":"range(2,7,2) begins at 2, increases by 2, and excludes 7.","id":"core-0030","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"Repetition","unit":"Programming","difficulty":"Exam","marks":1,"stem":"A `while` loop should stop when `count` reaches 5. Which change prevents an endless loop?","options":["Remove the condition entirely","Set count to 0 on every iteration","Change print to input","Update `count` within the loop toward its stopping condition"],"answer":3,"explanation":"A loop needs state changes or other events that can eventually make the condition false.","id":"core-0031","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"Data Types","unit":"Programming","difficulty":"Exam","marks":1,"stem":"What is the value and type of `3 / 2` in Python 3?","options":["1.5 (float)","1 (int)","1.5 (str)","2 (int)"],"answer":0,"explanation":"The / operator performs true division and produces a float for numeric operands.","id":"core-0032","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"Data Types","unit":"Programming","difficulty":"Exam","marks":1,"stem":"What does `int(\"12\") + 3` evaluate to?","options":["\"123\"","15","\"15\"","TypeError"],"answer":1,"explanation":"int(\"12\") converts the digit string to integer 12, then integer addition gives 15.","id":"core-0033","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"Data Operators","unit":"Programming","difficulty":"Exam","marks":1,"stem":"What does `17 // 5` evaluate to in Python?","options":["3.4","2","3","4"],"answer":2,"explanation":"// performs floor division: 17 divided by 5 gives floor value 3.","id":"core-0034","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"Data Operators","unit":"Programming","difficulty":"Exam","marks":1,"stem":"What does `17 % 5` evaluate to?","options":["3","5","0","2"],"answer":3,"explanation":"17 = 5×3 + 2, so the remainder is 2.","id":"core-0035","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"Control Structures - Intro","unit":"Programming","difficulty":"Exam","marks":1,"stem":"Which set contains all three basic structured programming control constructs?","options":["Sequence, selection, repetition","Input, storage, output","Integer, float, string","Router, hub, switch"],"answer":0,"explanation":"Statements execute in sequence, branch via selection, and iterate through repetition.","id":"core-0036","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"Data Structures","unit":"Programming","difficulty":"Exam","marks":1,"stem":"A Python list is `items = [4, 7, 9]`. What does `items[1]` produce?","options":["4","7","9","1"],"answer":1,"explanation":"Python sequences use zero-based indexing: items[1] is the second item.","id":"core-0037","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"Data Structures","unit":"Programming","difficulty":"Exam","marks":1,"stem":"Which Python data structure stores key–value pairs?","options":["List","Tuple","Dictionary","String"],"answer":2,"explanation":"A dictionary maps keys to associated values.","id":"core-0038","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"Basic Programming Concepts","unit":"Programming","difficulty":"Exam","marks":1,"stem":"What is returned by `len([\"a\", \"b\", \"c\"])`?","options":["2","4","\"abc\"","3"],"answer":3,"explanation":"len counts the three elements in the list.","id":"core-0039","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"Desk Checking and Sub-programs","unit":"Programming","difficulty":"Exam","marks":1,"stem":"What is the main purpose of desk checking?","options":["Manually trace variable values and control flow to detect logic errors","Measure network bandwidth","Compile a hardware driver","Encrypt student passwords"],"answer":0,"explanation":"Desk checking follows each execution step and records changing values.","id":"core-0040","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"Unit Testing and Error Detection","unit":"Programming","difficulty":"Exam","marks":1,"stem":"A function accepts boundary values from 0 through 10 inclusive. Which is a useful boundary test set?","options":["4, 5, 6, 7","−1, 0, 10, 11","2, 3, 4, 5","20, 30, 40, 50"],"answer":1,"explanation":"Test just below, at, and just above the accepted boundaries.","id":"core-0041","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"Error Correction","unit":"Programming","difficulty":"Exam","marks":1,"stem":"A program runs without a crash but produces the wrong total. What type of error is most likely?","options":["Syntax error","IndentationError at parsing","Logic error","Missing interpreter installation"],"answer":2,"explanation":"A logic error can produce an incorrect result even though the program executes.","id":"core-0042","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"Sequence","unit":"Programming","difficulty":"Exam","marks":1,"stem":"What is printed after `x = 4; x = x + 3; print(x)`?","options":["4","3","11","7"],"answer":3,"explanation":"The second assignment updates x from 4 to 7 before printing.","id":"core-0043","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"Mechatronic Systems","unit":"Mechatronics","difficulty":"Exam","marks":1,"stem":"Which definition best describes a mechatronic system?","options":["A system combining mechanical components, electronics, computing and control","A system using mechanics without any control","A website storing only text","An internet link between two offices"],"answer":0,"explanation":"Mechatronics integrates hardware, sensors, control and computation.","id":"core-0044","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"Components","unit":"Mechatronics","difficulty":"Exam","marks":1,"stem":"Which is an actuator rather than a sensor?","options":["Ultrasonic range sensor","Servo motor","Thermistor","Light-dependent resistor"],"answer":1,"explanation":"An actuator produces physical action; a servo moves to a controlled position.","id":"core-0045","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"Components","unit":"Mechatronics","difficulty":"Exam","marks":1,"stem":"Which device is most suitable for detecting distance to an obstacle without touching it?","options":["DC motor","Relay output","Ultrasonic distance sensor","RGB status LED"],"answer":2,"explanation":"An ultrasonic sensor measures distance from reflected sound pulses.","id":"core-0046","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"Components","unit":"Mechatronics","difficulty":"Exam","marks":1,"stem":"An LDR is primarily used to measure changes in what quantity?","options":["Motor shaft speed","Network latency","Air pressure","Light level"],"answer":3,"explanation":"An LDR is a light-dependent resistor whose resistance changes with light intensity.","id":"core-0047","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"Automation","unit":"Mechatronics","difficulty":"Exam","marks":1,"stem":"What distinguishes a feedback-controlled system from a simple timed open-loop system?","options":["It measures an output or condition and adjusts its action accordingly","It never uses sensors","It can only operate once","It avoids software decisions"],"answer":0,"explanation":"Feedback allows a controller to respond to measured conditions rather than only a preset timing sequence.","id":"core-0048","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"Automation","unit":"Mechatronics","difficulty":"Exam","marks":1,"stem":"A conveyor motor turns on whenever a beam-break sensor detects an object, otherwise stops. What controls the motor?","options":["The network default gateway","A programmed decision based on sensor input","A random signal unrelated to the sensor","A fixed hourly calendar only"],"answer":1,"explanation":"Sensor readings feed a selection rule that determines an actuator output.","id":"core-0049","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"Requirements","unit":"Mechatronics","difficulty":"Exam","marks":1,"stem":"Which requirement is measurable and testable?","options":["The robot is really cool","The robot looks futuristic","The robot stops within 10 cm of an obstacle in five consecutive trials","The robot is probably safe"],"answer":2,"explanation":"A quantified stopping criterion can be tested and evaluated consistently.","id":"core-0050","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"Algorithms Robotics","unit":"Mechatronics","difficulty":"Exam","marks":1,"stem":"An obstacle-avoiding robot must decide whether to turn. Which control structure fits the decision?","options":["Sequence without any condition","A type cast only","A list length calculation only","Selection using an if/else condition"],"answer":3,"explanation":"Conditional selection responds differently when an obstacle is detected.","id":"core-0051","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"Practical - Robot Movement","unit":"Mechatronics","difficulty":"Exam","marks":1,"stem":"A differential-drive robot turns on the spot when which motor behaviour occurs?","options":["The left and right wheels rotate in opposite directions","Both wheels rotate forward at equal speed","Both wheels stop","Only the sensor changes its threshold"],"answer":0,"explanation":"Opposite wheel rotation produces rotation about a point near the robot centre.","id":"core-0052","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"Practical - Robot Movement","unit":"Mechatronics","difficulty":"Exam","marks":1,"stem":"For a robot travelling straight, wheel diameter changes but wheel rotation count stays fixed. What happens to distance travelled?","options":["It must remain identical","It changes proportionally with wheel circumference","It depends only on VLAN membership","It always becomes zero"],"answer":1,"explanation":"Distance = wheel rotations × circumference, assuming no slip.","id":"core-0053","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"Social Ethical","unit":"Mechatronics","difficulty":"Exam","marks":1,"stem":"Which safety approach is strongest for a robot working near people?","options":["Rely on students noticing danger","Remove all warning indicators","Combine risk assessment, emergency stop and tested operating limits","Disable obstacle sensing"],"answer":2,"explanation":"Multiple safety controls mitigate foreseeable risks and failures.","id":"core-0054","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"Practical - AI Vision Sensor","unit":"Mechatronics","difficulty":"Intermediate","marks":1,"stem":"An AI vision sensor labels an object incorrectly under poor lighting. What is a sound engineering response?","options":["Assume the prediction is always correct","Increase motor speed immediately","Discard all test records","Test under varied lighting and adjust confidence thresholds or training data"],"answer":3,"explanation":"Vision accuracy depends on conditions and data; testing and safeguards reduce false detections.","id":"core-0055","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"LAN, WAN, WLAN, VLAN, VPN — Essential Networking","unit":"Networks","difficulty":"Intermediate","marks":1,"stem":"The network 10.20.30.0/26 uses conventional IPv4 network and broadcast addresses. How many usable host addresses are available?","options":["62","64","63","30"],"answer":0,"explanation":"A /26 leaves 6 host bits, giving 2^6 = 64 total addresses, minus network and broadcast = 62 usable.","id":"core-0056","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"LAN, WAN, WLAN, VLAN, VPN — Essential Networking","unit":"Networks","difficulty":"Intermediate","marks":1,"stem":"For 192.168.10.130 with mask 255.255.255.192, which is the network address?","options":["192.168.10.0","192.168.10.128","192.168.10.130","192.168.10.192"],"answer":1,"explanation":"A /26 creates blocks of 64 in the final octet: 0,64,128,192. The address .130 belongs to block .128–.191.","id":"core-0057","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"LAN, WAN, WLAN, VLAN, VPN — Essential Networking","unit":"Networks","difficulty":"Intermediate","marks":1,"stem":"A PC sends a broadcast Ethernet frame on an access port in VLAN 20. Where should a normal managed switch forward it?","options":["To all ports in all VLANs","Only to the configured DNS server","To eligible ports in VLAN 20, excluding the ingress port","Across every router without routing policy"],"answer":2,"explanation":"Layer-2 broadcasts are flooded within the sender’s VLAN, not automatically across other VLANs.","id":"core-0058","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"LAN, WAN, WLAN, VLAN, VPN — Essential Networking","unit":"Networks","difficulty":"Intermediate","marks":1,"stem":"A trunk between switches allows VLANs 10 and 20. A port is misconfigured as access VLAN 30 on the far switch. What is the most likely direct issue for a device attached there?","options":["An 802.1Q tag necessarily encrypts its packets","All switches on campus lose MAC addresses","The device automatically gets administrator rights","The device is in the wrong broadcast domain and may not reach intended subnet services"],"answer":3,"explanation":"Incorrect VLAN membership changes the local broadcast domain and often the DHCP/gateway path.","id":"core-0059","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"Data Processing and Transmission","unit":"Networks","difficulty":"Intermediate","marks":1,"stem":"A video stream prioritises low latency over guaranteed delivery of each packet. Which transport protocol is a common choice?","options":["UDP","TCP with strict acknowledgement of every byte before proceeding","DNS","ARP"],"answer":0,"explanation":"Many real-time systems prefer UDP’s low-overhead datagrams and implement their own tolerance or recovery.","id":"core-0060","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"Computer Networks","unit":"Networks","difficulty":"Intermediate","marks":1,"stem":"A school has 2 physically independent uplinks between distribution switches, but only one is used in a conventional spanning-tree Layer-2 topology. What is the usual purpose of blocking a redundant path?","options":["Remove all VLAN tags","Prevent Layer-2 forwarding loops","Double the number of IP addresses","Disable all IPv6 traffic"],"answer":1,"explanation":"Spanning Tree Protocol can block redundant active forwarding paths to prevent loops and broadcast storms.","id":"core-0061","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"Data Structures","unit":"Programming","difficulty":"Intermediate","marks":1,"stem":"After `a = [1, 2]; b = a; b.append(3)`, what is the value of `a`?","options":["[1, 2]","[3]","[1, 2, 3]","A NameError"],"answer":2,"explanation":"a and b refer to the same mutable list; appending through either name changes that list.","id":"core-0062","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"Data Structures","unit":"Programming","difficulty":"Intermediate","marks":1,"stem":"What does `\"abc\"[1:]` produce in Python?","options":["\"ab\"","\"b\"","\"abc\"","\"bc\""],"answer":3,"explanation":"Slice [1:] starts at index 1 and continues through the end, returning the characters b and c.","id":"core-0063","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"Selection","unit":"Programming","difficulty":"Intermediate","marks":1,"stem":"What is the value of `not (True and False) or False` in Python?","options":["True","False","None","0 as an integer"],"answer":0,"explanation":"True and False is False; not False is True; True or False is True.","id":"core-0064","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"Repetition","unit":"Programming","difficulty":"Intermediate","marks":1,"stem":"A loop runs `total = 0; for i in range(1, 5): total += i * i`. What is `total` after the loop?","options":["55","30","14","20"],"answer":1,"explanation":"range(1,5) generates 1,2,3,4; squares are 1+4+9+16 = 30.","id":"core-0065","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"Unit Testing and Error Detection","unit":"Programming","difficulty":"Intermediate","marks":1,"stem":"A Python function divides by a variable `count`. Which test specifically targets its most dangerous input?","options":["count = 1","count = 10","count = 0","count = 100"],"answer":2,"explanation":"Zero division raises a ZeroDivisionError and needs an explicit guard or validation.","id":"core-0066","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"Automation","unit":"Mechatronics","difficulty":"Intermediate","marks":1,"stem":"A distance sensor fluctuates around the threshold and causes a motor to rapidly turn on and off. Which control technique most directly addresses this?","options":["Use the same single threshold without filtering","Turn off all sensor readings","Assign the motor a VLAN","Hysteresis with distinct on/off thresholds"],"answer":3,"explanation":"Hysteresis prevents repeated switching when noisy readings hover around one threshold.","id":"core-0067","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"Practical - Robot Movement","unit":"Mechatronics","difficulty":"Intermediate","marks":1,"stem":"A wheel of diameter 8 cm makes 5 full turns without slipping. Approximately how far does it travel?","options":["126 cm","40 cm","201 cm","25 cm"],"answer":0,"explanation":"Distance = rotations × π × diameter = 5 × π × 8 ≈ 125.7 cm.","id":"core-0068","sourceQuality":"Hand-authored exam practice"},{"type":"mc","module":"Requirements","unit":"Mechatronics","difficulty":"Intermediate","marks":1,"stem":"A robot succeeds in 47 of 50 identical obstacle trials. What is its observed success rate?","options":["47%","94%","90%","96%"],"answer":1,"explanation":"47 divided by 50 = 0.94, which is 94%.","id":"core-0069","sourceQuality":"Hand-authored exam practice"},{"module":"Social Networks","unit":"Networks","difficulty":"Intermediate","type":"mc","marks":1,"stem":"Which statement best defines **Social network**?","options":["A group of nodes with relatively many connections among themselves within a larger network.","A diagram that visualises entities as nodes and their relationships as connecting lines.","An entity's online representation, often using a username, profile information and image.","A structure of connected people, groups or organisations that communicate and interact through relationships."],"answer":3,"explanation":"Social network: A structure of connected people, groups or organisations that communicate and interact through relationships.","id":"core-0070","sourceQuality":"Course concepts / supplemented exam prep"},{"module":"Social Networks","unit":"Networks","difficulty":"Intermediate","type":"mc","marks":1,"stem":"Which statement best defines **Entity**?","options":["A structure of connected people, groups or organisations that communicate and interact through relationships.","An edge or connection between entities, such as following, friendship or a shared affiliation.","A group of nodes with relatively many connections among themselves within a larger network.","A person, group or organisation represented as a node within a social network."],"answer":3,"explanation":"Entity: A person, group or organisation represented as a node within a social network.","id":"core-0071","sourceQuality":"Course concepts / supplemented exam prep"},{"module":"Social Networks","unit":"Networks","difficulty":"Intermediate","type":"mc","marks":1,"stem":"Which statement best defines **Relationship**?","options":["An activity or change such as posting, messaging, joining a group or commenting.","A group of nodes with relatively many connections among themselves within a larger network.","An edge or connection between entities, such as following, friendship or a shared affiliation.","A person, group or organisation represented as a node within a social network."],"answer":2,"explanation":"Relationship: An edge or connection between entities, such as following, friendship or a shared affiliation.","id":"core-0072","sourceQuality":"Course concepts / supplemented exam prep"},{"module":"Social Networks","unit":"Networks","difficulty":"Intermediate","type":"mc","marks":1,"stem":"Which statement best defines **Network event**?","options":["A group of nodes with relatively many connections among themselves within a larger network.","An entity's online representation, often using a username, profile information and image.","An activity or change such as posting, messaging, joining a group or commenting.","A diagram that visualises entities as nodes and their relationships as connecting lines."],"answer":2,"explanation":"Network event: An activity or change such as posting, messaging, joining a group or commenting.","id":"core-0073","sourceQuality":"Course concepts / supplemented exam prep"},{"module":"Social Networks","unit":"Networks","difficulty":"Intermediate","type":"mc","marks":1,"stem":"Which statement best defines **Digital profile**?","options":["An entity's online representation, often using a username, profile information and image.","A person, group or organisation represented as a node within a social network.","A connection with direction, useful when one account follows another without being followed back.","An activity or change such as posting, messaging, joining a group or commenting."],"answer":0,"explanation":"Digital profile: An entity's online representation, often using a username, profile information and image.","id":"core-0074","sourceQuality":"Course concepts / supplemented exam prep"},{"module":"Social Networks","unit":"Networks","difficulty":"Intermediate","type":"mc","marks":1,"stem":"Which statement best defines **Directed edge**?","options":["A structure of connected people, groups or organisations that communicate and interact through relationships.","An entity's online representation, often using a username, profile information and image.","An activity or change such as posting, messaging, joining a group or commenting.","A connection with direction, useful when one account follows another without being followed back."],"answer":3,"explanation":"Directed edge: A connection with direction, useful when one account follows another without being followed back.","id":"core-0075","sourceQuality":"Course concepts / supplemented exam prep"},{"module":"Graph Theory","unit":"Networks","difficulty":"Intermediate","type":"mc","marks":1,"stem":"Which statement best defines **Graph**?","options":["A measure related to a node's shortest-path distances to other nodes.","A mathematical model consisting of vertices (nodes) and edges (connections).","A measure of how strongly a node's neighbours connect with one another.","A measure based on how many direct connections a node has."],"answer":1,"explanation":"Graph: A mathematical model consisting of vertices (nodes) and edges (connections).","id":"core-0076","sourceQuality":"Course concepts / supplemented exam prep"},{"module":"Graph Theory","unit":"Networks","difficulty":"Intermediate","type":"mc","marks":1,"stem":"Which statement best defines **Degree**?","options":["The number of edges connected to a node in an undirected graph.","A measure based on how many direct connections a node has.","A connecting path with the fewest edges in an unweighted graph.","A mathematical model consisting of vertices (nodes) and edges (connections)."],"answer":0,"explanation":"Degree: The number of edges connected to a node in an undirected graph.","id":"core-0077","sourceQuality":"Course concepts / supplemented exam prep"},{"module":"Graph Theory","unit":"Networks","difficulty":"Intermediate","type":"mc","marks":1,"stem":"Which statement best defines **Path**?","options":["A sequence of adjacent nodes linked by edges.","A measure based on how many direct connections a node has.","The greatest shortest-path distance between any pair of nodes in a connected graph.","The number of edges connected to a node in an undirected graph."],"answer":0,"explanation":"Path: A sequence of adjacent nodes linked by edges.","id":"core-0078","sourceQuality":"Course concepts / supplemented exam prep"},{"module":"Graph Theory","unit":"Networks","difficulty":"Intermediate","type":"mc","marks":1,"stem":"Which statement best defines **Shortest path**?","options":["A connecting path with the fewest edges in an unweighted graph.","A measure of how often a node lies on shortest paths between other nodes.","A mathematical model consisting of vertices (nodes) and edges (connections).","The number of edges connected to a node in an undirected graph."],"answer":0,"explanation":"Shortest path: A connecting path with the fewest edges in an unweighted graph.","id":"core-0079","sourceQuality":"Course concepts / supplemented exam prep"},{"module":"Graph Theory","unit":"Networks","difficulty":"Intermediate","type":"mc","marks":1,"stem":"Which statement best defines **Diameter**?","options":["The greatest shortest-path distance between any pair of nodes in a connected graph.","A measure of how strongly a node's neighbours connect with one another.","Identifying groups of nodes that are more strongly connected internally.","A connecting path with the fewest edges in an unweighted graph."],"answer":0,"explanation":"Diameter: The greatest shortest-path distance between any pair of nodes in a connected graph.","id":"core-0080","sourceQuality":"Course concepts / supplemented exam prep"},{"module":"Graph Theory","unit":"Networks","difficulty":"Intermediate","type":"mc","marks":1,"stem":"Which statement best defines **Clustering coefficient**?","options":["A measure of how strongly a node's neighbours connect with one another.","A measure related to a node's shortest-path distances to other nodes.","A connecting path with the fewest edges in an unweighted graph.","The greatest shortest-path distance between any pair of nodes in a connected graph."],"answer":0,"explanation":"Clustering coefficient: A measure of how strongly a node's neighbours connect with one another.","id":"core-0081","sourceQuality":"Course concepts / supplemented exam prep"},{"module":"Computer Networks","unit":"Networks","difficulty":"Intermediate","type":"mc","marks":1,"stem":"Which statement best defines **Computer network**?","options":["A device or point that can send, receive or forward data.","A local area network covering a limited area, such as a school building.","An arrangement in which a client requests resources and a server supplies them.","A group of connected devices that exchange data and share resources."],"answer":3,"explanation":"Computer network: A group of connected devices that exchange data and share resources.","id":"core-0082","sourceQuality":"Course concepts / supplemented exam prep"},{"module":"Computer Networks","unit":"Networks","difficulty":"Intermediate","type":"mc","marks":1,"stem":"Which statement best defines **Node**?","options":["A group of connected devices that exchange data and share resources.","A layout where devices connect to a central switch or other hub device.","A device or point that can send, receive or forward data.","A local area network covering a limited area, such as a school building."],"answer":2,"explanation":"Node: A device or point that can send, receive or forward data.","id":"core-0083","sourceQuality":"Course concepts / supplemented exam prep"},{"module":"Computer Networks","unit":"Networks","difficulty":"Intermediate","type":"mc","marks":1,"stem":"Which statement best defines **LAN**?","options":["A layout where devices connect to a central switch or other hub device.","A local area network covering a limited area, such as a school building.","The arrangement of network devices and the connections between them.","A wide area network spanning large geographical distances."],"answer":1,"explanation":"LAN: A local area network covering a limited area, such as a school building.","id":"core-0084","sourceQuality":"Course concepts / supplemented exam prep"},{"module":"Computer Networks","unit":"Networks","difficulty":"Intermediate","type":"mc","marks":1,"stem":"Which statement best defines **WAN**?","options":["Agreed rules that allow devices to communicate correctly.","An initial exchange that establishes or negotiates communication settings.","An arrangement in which a client requests resources and a server supplies them.","A wide area network spanning large geographical distances."],"answer":3,"explanation":"WAN: A wide area network spanning large geographical distances.","id":"core-0085","sourceQuality":"Course concepts / supplemented exam prep"},{"module":"Computer Networks","unit":"Networks","difficulty":"Intermediate","type":"mc","marks":1,"stem":"Which statement best defines **Network topology**?","options":["A layout where devices connect to a central switch or other hub device.","A device or point that can send, receive or forward data.","The arrangement of network devices and the connections between them.","A wide area network spanning large geographical distances."],"answer":2,"explanation":"Network topology: The arrangement of network devices and the connections between them.","id":"core-0086","sourceQuality":"Course concepts / supplemented exam prep"},{"module":"Computer Networks","unit":"Networks","difficulty":"Intermediate","type":"mc","marks":1,"stem":"Which statement best defines **Star topology**?","options":["The arrangement of network devices and the connections between them.","An arrangement in which a client requests resources and a server supplies them.","A layout where devices connect to a central switch or other hub device.","Agreed rules that allow devices to communicate correctly."],"answer":2,"explanation":"Star topology: A layout where devices connect to a central switch or other hub device.","id":"core-0087","sourceQuality":"Course concepts / supplemented exam prep"},{"module":"LAN, WAN, WLAN, VLAN, VPN — Essential Networking","unit":"Networks","difficulty":"Intermediate","type":"mc","marks":1,"stem":"Which statement best defines **LAN**?","options":["Wide Area Network: connects networks over large distances, often via service-provider links.","Switch port normally assigned to one VLAN for an endpoint.","Local Area Network: connects devices across a small geographic area such as one school or office.","Router interface used by a host to reach destinations outside its local IP subnet."],"answer":2,"explanation":"LAN: Local Area Network: connects devices across a small geographic area such as one school or office.","id":"core-0088","sourceQuality":"Course concepts / supplemented exam prep"},{"module":"LAN, WAN, WLAN, VLAN, VPN — Essential Networking","unit":"Networks","difficulty":"Intermediate","type":"mc","marks":1,"stem":"Which statement best defines **WAN**?","options":["Router interface used by a host to reach destinations outside its local IP subnet.","Wide Area Network: connects networks over large distances, often via service-provider links.","Wireless LAN: local networking using wireless technology such as Wi-Fi.","Routing between separate VLAN IP networks using a router or Layer 3 switch."],"answer":1,"explanation":"WAN: Wide Area Network: connects networks over large distances, often via service-provider links.","id":"core-0089","sourceQuality":"Course concepts / supplemented exam prep"},{"module":"LAN, WAN, WLAN, VLAN, VPN — Essential Networking","unit":"Networks","difficulty":"Intermediate","type":"mc","marks":1,"stem":"Which statement best defines **WLAN**?","options":["Logical range of IP addresses; often mapped one subnet per VLAN in a typical design.","Wireless LAN: local networking using wireless technology such as Wi-Fi.","Routing between separate VLAN IP networks using a router or Layer 3 switch.","Router interface used by a host to reach destinations outside its local IP subnet."],"answer":1,"explanation":"WLAN: Wireless LAN: local networking using wireless technology such as Wi-Fi.","id":"core-0090","sourceQuality":"Course concepts / supplemented exam prep"},{"module":"LAN, WAN, WLAN, VLAN, VPN — Essential Networking","unit":"Networks","difficulty":"Intermediate","type":"mc","marks":1,"stem":"Which statement best defines **VLAN**?","options":["Access control list: rules permitting or denying specified traffic.","Wide Area Network: connects networks over large distances, often via service-provider links.","Virtual LAN: logically divides a switched network into separate Layer 2 broadcast domains.","Switch port capable of carrying traffic for multiple VLANs, typically via 802.1Q tags."],"answer":2,"explanation":"VLAN: Virtual LAN: logically divides a switched network into separate Layer 2 broadcast domains.","id":"core-0091","sourceQuality":"Course concepts / supplemented exam prep"},{"module":"LAN, WAN, WLAN, VLAN, VPN — Essential Networking","unit":"Networks","difficulty":"Intermediate","type":"mc","marks":1,"stem":"Which statement best defines **VPN**?","options":["Router interface used by a host to reach destinations outside its local IP subnet.","Switch port normally assigned to one VLAN for an endpoint.","Virtual Private Network: protected virtual connection over another network, usually using encryption.","Logical range of IP addresses; often mapped one subnet per VLAN in a typical design."],"answer":2,"explanation":"VPN: Virtual Private Network: protected virtual connection over another network, usually using encryption.","id":"core-0092","sourceQuality":"Course concepts / supplemented exam prep"},{"module":"LAN, WAN, WLAN, VLAN, VPN — Essential Networking","unit":"Networks","difficulty":"Intermediate","type":"mc","marks":1,"stem":"Which statement best defines **Access port**?","options":["Switch port normally assigned to one VLAN for an endpoint.","Router interface used by a host to reach destinations outside its local IP subnet.","Virtual Private Network: protected virtual connection over another network, usually using encryption.","Routing between separate VLAN IP networks using a router or Layer 3 switch."],"answer":0,"explanation":"Access port: Switch port normally assigned to one VLAN for an endpoint.","id":"core-0093","sourceQuality":"Course concepts / supplemented exam prep"},{"module":"Data Processing and Transmission","unit":"Networks","difficulty":"Intermediate","type":"mc","marks":1,"stem":"Which statement best defines **Data compression**?","options":["A transport protocol that provides ordered, reliable delivery of data.","Compression that allows exact reconstruction of the original data, such as ZIP or PNG.","Reducing the number of bits needed to represent information for storage or transfer.","A service that resolves human-readable domain names to IP addresses."],"answer":2,"explanation":"Data compression: Reducing the number of bits needed to represent information for storage or transfer.","id":"core-0094","sourceQuality":"Course concepts / supplemented exam prep"},{"module":"Data Processing and Transmission","unit":"Networks","difficulty":"Intermediate","type":"mc","marks":1,"stem":"Which statement best defines **Lossless compression**?","options":["Splitting data into packets that travel through a network and are reassembled at arrival.","Compression that allows exact reconstruction of the original data, such as ZIP or PNG.","A transport protocol that provides ordered, reliable delivery of data.","A method/software for encoding and decoding media data, for example H.264 video."],"answer":1,"explanation":"Lossless compression: Compression that allows exact reconstruction of the original data, such as ZIP or PNG.","id":"core-0095","sourceQuality":"Course concepts / supplemented exam prep"},{"module":"Data Processing and Transmission","unit":"Networks","difficulty":"Intermediate","type":"mc","marks":1,"stem":"Which statement best defines **Lossy compression**?","options":["A network interface identifier used for local-link communication.","Reducing the number of bits needed to represent information for storage or transfer.","A method/software for encoding and decoding media data, for example H.264 video.","Compression that removes some data to achieve smaller files, as in JPEG or MP3."],"answer":3,"explanation":"Lossy compression: Compression that removes some data to achieve smaller files, as in JPEG or MP3.","id":"core-0096","sourceQuality":"Course concepts / supplemented exam prep"},{"module":"Data Processing and Transmission","unit":"Networks","difficulty":"Intermediate","type":"mc","marks":1,"stem":"Which statement best defines **Codec**?","options":["Splitting data into packets that travel through a network and are reassembled at arrival.","A method/software for encoding and decoding media data, for example H.264 video.","Compression that allows exact reconstruction of the original data, such as ZIP or PNG.","Compression that removes some data to achieve smaller files, as in JPEG or MP3."],"answer":1,"explanation":"Codec: A method/software for encoding and decoding media data, for example H.264 video.","id":"core-0097","sourceQuality":"Course concepts / supplemented exam prep"},{"module":"Data Processing and Transmission","unit":"Networks","difficulty":"Intermediate","type":"mc","marks":1,"stem":"Which statement best defines **Container format**?","options":["A network interface identifier used for local-link communication.","Information a router uses to choose where to forward a packet.","A file format, such as MP4 or MKV, holding encoded video, audio and other tracks.","Compression that allows exact reconstruction of the original data, such as ZIP or PNG."],"answer":2,"explanation":"Container format: A file format, such as MP4 or MKV, holding encoded video, audio and other tracks.","id":"core-0098","sourceQuality":"Course concepts / supplemented exam prep"},{"module":"Data Processing and Transmission","unit":"Networks","difficulty":"Intermediate","type":"mc","marks":1,"stem":"Which statement best defines **Packet switching**?","options":["Compression that removes some data to achieve smaller files, as in JPEG or MP3.","A transport protocol that provides ordered, reliable delivery of data.","Splitting data into packets that travel through a network and are reassembled at arrival.","A file format, such as MP4 or MKV, holding encoded video, audio and other tracks."],"answer":2,"explanation":"Packet switching: Splitting data into packets that travel through a network and are reassembled at arrival.","id":"core-0099","sourceQuality":"Course concepts / supplemented exam prep"},{"module":"Network Hardware","unit":"Networks","difficulty":"Intermediate","type":"mc","marks":1,"stem":"Which statement best defines **Switch**?","options":["A device that forwards frames between devices on a local network using MAC addresses.","A device that forwards IP packets between separate networks.","A cable with a central conductor and shielding, used in broadband and television systems.","Hardware or software that permits or blocks traffic using security rules."],"answer":0,"explanation":"Switch: A device that forwards frames between devices on a local network using MAC addresses.","id":"core-0100","sourceQuality":"Course concepts / supplemented exam prep"},{"module":"Network Hardware","unit":"Networks","difficulty":"Intermediate","type":"mc","marks":1,"stem":"Which statement best defines **Router**?","options":["A device that forwards IP packets between separate networks.","Cable that transports data as pulses of light with high bandwidth and low interference.","Twisted-pair copper cable carrying electrical signals, commonly used in local networks.","Hardware or software that permits or blocks traffic using security rules."],"answer":0,"explanation":"Router: A device that forwards IP packets between separate networks.","id":"core-0101","sourceQuality":"Course concepts / supplemented exam prep"},{"module":"Network Hardware","unit":"Networks","difficulty":"Intermediate","type":"mc","marks":1,"stem":"Which statement best defines **Wireless access point**?","options":["Twisted-pair copper cable carrying electrical signals, commonly used in local networks.","A device connecting Wi‑Fi clients to a wired or larger network.","A device that receives and retransmits a signal to extend its reach.","Wireless networking using radio signals to connect devices."],"answer":1,"explanation":"Wireless access point: A device connecting Wi‑Fi clients to a wired or larger network.","id":"core-0102","sourceQuality":"Course concepts / supplemented exam prep"},{"module":"Network Hardware","unit":"Networks","difficulty":"Intermediate","type":"mc","marks":1,"stem":"Which statement best defines **Firewall**?","options":["A device connecting Wi‑Fi clients to a wired or larger network.","Hardware or software that permits or blocks traffic using security rules.","Wireless networking using radio signals to connect devices.","A device that forwards frames between devices on a local network using MAC addresses."],"answer":1,"explanation":"Firewall: Hardware or software that permits or blocks traffic using security rules.","id":"core-0103","sourceQuality":"Course concepts / supplemented exam prep"},{"module":"Network Hard
