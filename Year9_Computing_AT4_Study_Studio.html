utline a use case and measurable test case.","answer":"State the main steps or features in a logical order. Describe the task in IPO terms: Describe what sensors or users input, what the controller does with that input, what must be stored or transmitted and how actuators or displays produce an output. Functional requirements: Define the actions a system must perform, including specific use cases and tests with known input and expected output."},{"verb":"Explain","question":"Explain why requirements must guide component selection and testing.","answer":"Link the mechanism to its cause or purpose, and use the given context. Test against the brief: Good requirements are specific enough to test. Identify what result counts as success and how you would demonstrate it."}],"sourceNote":"Supplementary, independently authored exam-preparation knowledge. Original Canvas extracts appear separately below.","workshop":{"goal":"Translate a user goal into a measurable acceptance condition.","example":"After detecting a test obstacle the robot must stop within 0.5 s. Measure detection to full stop during a controlled test.","trap":"“Stop quickly” cannot be marked as passed or failed without a threshold."}},{"id":"Social Ethical","unit":"Mechatronics","source":"Canvas lesson PDF","terms":[{"term":"Automation job displacement","desc":"Human tasks being reduced or changed by automated machines."},{"term":"Workplace safety","desc":"Protecting people from moving machinery, electrical risks and system faults."},{"term":"Accountability","desc":"Determining who is responsible for the outcomes and failures of an automated system."},{"term":"Transparency","desc":"Explaining how a system makes important decisions to affected users."},{"term":"Privacy of sensor data","desc":"Safeguarding images, locations and other personal information captured by sensors."},{"term":"Fairness","desc":"Designing automated decisions to avoid unjustified disadvantage to groups or individuals."},{"term":"Efficiency benefit","desc":"Performing suitable repetitive tasks quickly and consistently."},{"term":"Human oversight","desc":"Giving trained people meaningful ability to supervise or interrupt an automated system."}],"points":[{"title":"Social impacts","text":"Mechatronic and automated systems may improve safety and efficiency but can also affect jobs, privacy, skills and access. Describe different groups affected."},{"title":"Ethical questions","text":"A designer should evaluate foreseeable harm, user safety, privacy from sensors, transparency about automation and human oversight."},{"title":"Legal responsibilities","text":"When analysing a scenario, identify applicable responsibilities such as safe design and appropriate handling of personal information, rather than assuming efficiency is the only design goal."},{"title":"Ethical implications of automation","text":"Automation can reduce repetitive injuries, improve consistency and provide accessibility, but it can displace jobs, exclude users or create surveillance risks. Assess benefits/harms for operators, affected workers, customers, vulnerable groups and the environment. Ethical analysis should link a design choice to real consequences."},{"title":"Responsibility and human control","text":"When a robot makes an unsafe movement, responsibility still rests with people and organisations who design, deploy, test and maintain it. Explain fail-safes, emergency stop, manual override, maintenance, clear instructions and accountability. AI decision-making can be wrong or biased; keep appropriate human oversight."},{"title":"Environmental impact","text":"Compare energy demand, battery replacement, electronic waste, repairability and life cycle. Better design can involve modular repairs, durable components, safe battery recycling and avoiding unnecessary power use. Sustainability means more than using a recyclable box."},{"title":"Legal and industry context","text":"Workplaces have safety obligations, privacy expectations and industry procedures that vary by context. Use general principles such as authorised operation, safe testing, correct documentation, risk assessment and rights over software and data. Do not claim a specific act requires something unless you can identify the applicable legal rule."}],"intentions":[{"verb":"Identify","question":"Identify employment, safety and privacy effects of automation.","answer":"Use exact examples and roles from the lesson. For example: Automation job displacement — Human tasks being reduced or changed by automated machines. Workplace safety — Protecting people from moving machinery, electrical risks and system faults."},{"verb":"Define","question":"Define ethical responsibility in a mechatronic design scenario.","answer":"Use an accurate definition and a clear distinguishing feature. Automation job displacement: Human tasks being reduced or changed by automated machines. Also review the 'Detailed information' and original Canvas lesson for the specific terms named in the question."},{"verb":"Outline","question":"Outline consequences for two different groups affected by a robot.","answer":"State the main steps or features in a logical order. Social impacts: Mechatronic and automated systems may improve safety and efficiency but can also affect jobs, privacy, skills and access. Describe different groups affected. Ethical questions: A designer should evaluate foreseeable harm, user safety, privacy from sensors, transparency about automation and human oversight."},{"verb":"Explain","question":"Explain how a designer could manage an ethical trade-off.","answer":"Link the mechanism to its cause or purpose, and use the given context. Legal responsibilities: When analysing a scenario, identify applicable responsibilities such as safe design and appropriate handling of personal information, rather than assuming efficiency is the only design goal."}],"sourceNote":"Supplementary, independently authored exam-preparation knowledge. Original Canvas extracts appear separately below.","workshop":{"goal":"Explain a benefit, a human impact and a practical safeguard in automation.","example":"Inspection robots can catch more defects. Discuss changed duties with workers and provide training. Keep guarding active while reviewing cycle delays.","trap":"Explain which people or risks are affected. Use any supplied rule when a question asks you to apply a legal duty."}},{"id":"Components","unit":"Mechatronics","source":"Canvas lesson PDF","terms":[{"term":"Microcontroller","desc":"A compact computer that reads inputs, processes instructions and controls outputs."},{"term":"Sensor","desc":"An input device measuring conditions such as light, distance, movement or temperature."},{"term":"Actuator","desc":"A component that makes a physical action, such as a motor, pump or valve."},{"term":"End effector","desc":"The tool or manipulator that performs work at the end of a robot arm."},{"term":"Ultrasonic sensor","desc":"A sensor using sound echoes to estimate distance to objects."},{"term":"PIR sensor","desc":"A passive infrared device detecting changes in infrared radiation from moving warm objects."},{"term":"Servo motor","desc":"An actuator designed to move to a commanded position or angle."},{"term":"DC motor","desc":"An actuator commonly used to provide continuous rotational motion."},{"term":"Accelerometer","desc":"A sensor that measures acceleration along one or more axes."},{"term":"Kinematics","desc":"The study of how objects move, without focusing on the forces causing that motion."},{"term":"Dynamics","desc":"The study of motion in relation to forces and their effects."}],"points":[{"title":"Controllers and microcontrollers","text":"A microcontroller runs instructions, reads input signals and controls outputs. Select a controller according to available input/output capability and the task."},{"title":"Sensors","text":"Sensors detect or measure aspects of the environment and produce information for the controller. The class covers distance sensors and other everyday sensor types."},{"title":"Actuators and their jobs","text":"Actuators turn controller commands into physical effects. DC motors rotate continuously, servos can position an output, steppers make controlled increments, solenoids move linearly, relays switch circuits and pumps move fluids."},{"title":"End effectors and manipulators","text":"The end effector is the tool at the working end of a robot, such as a gripper. Choose it according to the item or process the system must handle."},{"title":"Movement and feedback","text":"Motion type, range, speed and accuracy affect which motor, sensor and controller are appropriate. Explain how selected components interact in a complete input–process–output loop."},{"title":"Sensors and actuators explained","text":"A sensor turns a physical measurement into an electrical/digital signal: ultrasonic measures distance using sound reflections, infrared can detect proximity/lines, light sensors detect brightness, touch switches detect contact, encoders measure rotation. An actuator produces an action: DC motor spins, servo moves toward commanded angular position, solenoid moves a plunger, LED emits light, buzzer makes sound. Sensor is input; actuator is output."},{"title":"Microcontrollers and drivers","text":"A microcontroller reads sensor inputs, executes a program and controls outputs. It differs from a full computer because it often runs a dedicated embedded program with limited memory. Motors typically require a motor driver because controller pins cannot safely supply motor current; drivers handle switching and sometimes direction/speed. Power, grounding and component ratings must be respected."},{"title":"Digital and analogue signals","text":"Digital inputs are discrete states such as HIGH/LOW; analogue inputs represent a range of measured values which an ADC converts to numbers. PWM rapidly turns output on/off with a variable duty cycle and can control average motor power or LED brightness, depending on the actuator/controller. Do not equate PWM with a true continuously variable analogue voltage."},{"title":"Motor types and choice","text":"DC motors rotate continuously and often need feedback for precise position; servos can target an angle using internal position control; stepper motors move in small controlled steps but can lose steps under load. Wheel robots use differential drive: both sides forward = straight, opposite directions = turn on spot. Mechanical gearing trades speed for torque."},{"title":"Control feedback and noise","text":"A sensor reading may be noisy or inaccurate; filtering, averaging, calibration and hysteresis can reduce unnecessary response changes. For a distance detector, test at different surfaces and angles. Never assume a sensor is accurate just because it returns a number. Explain what measured variable, units and thresholds mean."}],"intentions":[{"verb":"Identify","question":"Identify sensors, actuators, end effectors and microcontrollers.","answer":"Use exact examples and roles from the lesson. For example: Microcontroller — A compact computer that reads inputs, processes instructions and controls outputs. Sensor — An input device measuring conditions such as light, distance, movement or temperature."},{"verb":"Define","question":"Define microcontroller, sensor, actuator and end effector.","answer":"Microcontroller: programmed computing unit controlling a system. Sensor: device that measures an input property. Actuator: device producing physical action from a control signal. End effector: tool at the working end of a robot manipulator, e.g. gripper."},{"verb":"Outline","question":"Outline how a distance sensor and motor operate in a robot system.","answer":"State the main steps or features in a logical order. Controllers and microcontrollers: A microcontroller runs instructions, reads input signals and controls outputs. Select a controller according to available input/output capability and the task. Sensors: Sensors detect or measure aspects of the environment and produce information for the controller. The class covers distance sensors and other everyday sensor types."},{"verb":"Explain","question":"Explain why a specific actuator is appropriate for a given motion.","answer":"Link the mechanism to its cause or purpose, and use the given context. Justify choices: Strong answers specify the required function, the selected component and how its properties match the problem, not simply list the parts."}],"sourceNote":"Supplementary, independently authored exam-preparation knowledge. Original Canvas extracts appear separately below.","workshop":{"goal":"Name components and explain why each fits the required input or action.","example":"A beam sensor detects a parcel, a programmed board chooses a destination and a servo moves the sorting gate to an angle.","trap":"A sensor supplies evidence. The controller decides what that evidence should cause."}},{"id":"Algorithms Robotics","unit":"Mechatronics","source":"Canvas lesson PDF","terms":[{"term":"Robot algorithm","desc":"An ordered procedure for controlling a robot's sensing, decisions and movements."},{"term":"Robot flowchart","desc":"A diagram representing robot actions and branches using standard symbols."},{"term":"Robot pseudocode","desc":"Structured plain-language instructions such as IF obstacle THEN STOP."},{"term":"Desk check for robotics","desc":"Manually tracing sensor values and expected robot actions against an algorithm."},{"term":"Conditional robot rule","desc":"A control rule selecting actions based on a sensor value or event."},{"term":"Repeated sensor polling","desc":"Checking sensor readings repeatedly inside a loop."},{"term":"Motion sequence","desc":"An ordered series of drive, turn, pause and stop operations."},{"term":"Robot validation","desc":"Comparing observed robot movement against defined expected responses and constraints."}],"points":[{"title":"Represent a robot algorithm","text":"Use a flowchart or structured pseudocode to describe inputs from sensors, decisions, actuator actions and repeating operations."},{"title":"Condition-controlled movement","text":"A robot might read a distance sensor repeatedly; if an obstacle is close it stops or turns, otherwise it continues. The choice depends on input values and programmed conditions."},{"title":"Validation and correction","text":"Use desk checking, simulation and physical tests to compare intended and actual actions. Modify variables or algorithms when tests reveal problems."},{"title":"Design a robot decision cycle","text":"A useful robot algorithm repeatedly senses, decides and acts. Obstacle example: IF distance < safe threshold THEN stop and turn; ELSE move forward; REPEAT. Include the condition for ending the task, emergency stop and what to do if the sensor measurement is missing. Use sequence, selection and repetition correctly."},{"title":"Motion and variables","text":"Robot code can store speed, target distance, target angle, sensor reading and elapsed time. Timing-based navigation estimates motion but wheel slip and battery conditions reduce precision; encoder feedback improves repeatability. Explain the difference between commanding a movement and verifying it occurred."},{"title":"Pseudocode vs implementation","text":"Pseudocode describes logic independent of the robot language. Translate it into a flowchart or code with explicit variables and conditions. Test short subprograms such as drive_forward(), turn_left() and read_distance() before assembling a large autonomous routine."},{"title":"Edge cases and testing","text":"What if an obstacle appears after movement begins? What if an object is too close to measure? What if the robot is trapped? Test normal, boundary and unexpected situations. Identify and justify improvement through evidence from runs, not intuition alone."}],"intentions":[{"verb":"Identify","question":"Identify inputs, decisions and actions in robot pseudocode.","answer":"Use exact examples and roles from the lesson. For example: Robot algorithm — An ordered procedure for controlling a robot's sensing, decisions and movements. Robot flowchart — A diagram representing robot actions and branches using standard symbols."},{"verb":"Define","question":"Define algorithm validation and desk checking.","answer":"Use an accurate definition and a clear distinguishing feature. Robot algorithm: An ordered procedure for controlling a robot's sensing, decisions and movements. Also review the 'Detailed information' and original Canvas lesson for the specific terms named in the question."},{"verb":"Outline","question":"Outline a repeated obstacle-avoidance algorithm.","answer":"State the main steps or features in a logical order. Represent a robot algorithm: Use a flowchart or structured pseudocode to describe inputs from sensors, decisions, actuator actions and repeating operations. Condition-controlled movement: A robot might read a distance sensor repeatedly; if an obstacle is close it stops or turns, otherwise it continues. The choice depends on input values and programmed conditions."},{"verb":"Explain","question":"Explain how sensor readings change a robot’s movement.","answer":"Link the mechanism to its cause or purpose, and use the given context. Validation and correction: Use desk checking, simulation and physical tests to compare intended and actual actions. Modify variables or algorithms when tests reveal problems."}],"sourceNote":"Supplementary, independently authored exam-preparation knowledge. Original Canvas extracts appear separately below.","workshop":{"goal":"Design a bounded, testable robot routine and handle lost or invalid sensor data.","example":"While distance is greater than 55 mm, advance and sample again. At 55 mm or below stop. If the reading is invalid, stop and flag the fault.","trap":"A stale reading can make a loop continue after the physical situation changes."}},{"id":"Practical - Robot Movement","unit":"Mechatronics","source":"Canvas lesson PDF","terms":[{"term":"VEX EXP Clawbot","desc":"An educational robotic platform with motors, sensors and a claw manipulator."},{"term":"Drive motor","desc":"An actuator rotating a wheel or mechanism to move a robot."},{"term":"Motor direction","desc":"The chosen forward or reverse rotation affecting how the robot moves."},{"term":"Drive distance","desc":"A command or objective specifying how far a robot should travel."},{"term":"Turn angle","desc":"The intended amount of rotation for a robot's change in heading."},{"term":"Claw mechanism","desc":"A gripper/end effector used to hold, release or move objects."},{"term":"Robot test case","desc":"An input condition and predicted movement used to test a robot program."},{"term":"Iteration in robotics","desc":"Repeatedly adjusting and testing code to improve robot accuracy or consistency."}],"points":[{"title":"Implementing code on a real robot","text":"The class task combines hardware and software. Identify motors, their directions, the movement sequence, measurements and code statements controlling the robot."},{"title":"Test motion deliberately","text":"Measure travel and rotation, run trial movements, and compare actual outcomes with planned outcomes. Adjust timing or commands only after observing evidence."},{"title":"Troubleshooting and constraints","text":"Check that hardware connections, motor directions, chosen values and obstacle responses agree with the intended algorithm. Record changes and retest."},{"title":"Differential drive basics","text":"A two-wheeled robot moves straight when left and right wheels turn forward at approximately equal rates. Turning can be achieved by driving one wheel faster than the other; a turn on the spot uses opposite wheel directions. Actual motion depends on wheel size, distance between wheels, friction and speed. Without sensors, timed commands are approximations."},{"title":"Measuring and calibrating","text":"Wheel circumference = π × diameter. If a wheel diameter is 6 cm, one revolution moves about 18.85 cm without slipping. A planned 75.4 cm move is about four wheel rotations. Measure actual travel, compare with predicted distance and adjust calibration. Wheel slip, unequal motor speeds and surface differences can cause error."},{"title":"Movement algorithms","text":"Break a route into forward segments and turns; use named procedures to avoid repeated code. If using an encoder, loop until a target rotation count is reached. If using only time, consider acceleration and battery changes. In a test log record intended displacement, actual displacement, difference and a plausible explanation."},{"title":"Extension: precision","text":"An encoder records rotations, while an inertial/gyro sensor measures angular rate or orientation-related movement. Neither works perfectly in every condition; sensor fusion can improve navigation. Identify what new sensor would most directly address a particular error."}],"intentions":[{"verb":"Identify","question":"Identify the controller, motors and commands in a movement program.","answer":"Use exact examples and roles from the lesson. For example: VEX EXP Clawbot — An educational robotic platform with motors, sensors and a claw manipulator. Drive motor — An actuator rotating a wheel or mechanism to move a robot."},{"verb":"Define","question":"Define testing and debugging in a robot movement task.","answer":"Use an accurate definition and a clear distinguishing feature. VEX EXP Clawbot: An educational robotic platform with motors, sensors and a claw manipulator. Also review the 'Detailed information' and original Canvas lesson for the specific terms named in the question."},{"verb":"Outline","question":"Outline a measurable movement test and how to record results.","answer":"State the main steps or features in a logical order. Implementing code on a real robot: The class task combines hardware and software. Identify motors, their directions, the movement sequence, measurements and code statements controlling the robot. Test motion deliberately: Measure travel and rotation, run trial movements, and compare actual outcomes with planned outcomes. Adjust timing or commands only after observing evidence."},{"verb":"Explain","question":"Explain how evidence from failed trials should change robot code.","answer":"Link the mechanism to its cause or purpose, and use the given context. Troubleshooting and constraints: Check that hardware connections, motor directions, chosen values and obstacle responses agree with the intended algorithm. Record changes and retest."}],"sourceNote":"Supplementary, independently authored exam-preparation knowledge. Original Canvas extracts appear separately below.","workshop":{"goal":"Design a controlled test and compare commanded and observed movement.","example":"Repeat 90° turns at two speeds on the same surface. Record actual angles and compare overshoot.","trap":"Change one factor at a time so you can explain differences in the result."}},{"id":"Practical - AI Vision Sensor","unit":"Mechatronics","source":"Optional practical context","terms":[{"term":"AI vision sensor","desc":"A camera-based input device able to analyse visual information about objects."},{"term":"Object detection","desc":"Identifying the presence or position of a target item in a camera image."},{"term":"Vision input","desc":"Camera readings used by software to choose robot behaviour."},{"term":"Image-processing decision","desc":"Program logic using detected object data to decide an action."},{"term":"Lighting conditions","desc":"Environmental changes that can affect vision-based recognition and reliability."},{"term":"False detection","desc":"A sensor reporting an object or classification that is not actually present."},{"term":"Detection threshold","desc":"A chosen confidence or measurement condition used to accept a detection."},{"term":"Vision test case","desc":"A repeatable lighting, distance and object arrangement for checking recognition."}],"points":[{"title":"Source limitation","text":"This uploaded Canvas PDF contains only a link and no exported lesson explanation or diagrams; the original lesson activity cannot be recovered from it."},{"title":"Supplementary context","text":"Vision sensors can provide visual or classification input for a robotic control algorithm. A controller can use a detected object or condition to choose an actuator response."},{"title":"Revision test","text":"Be ready to identify the input, processing, decision and output of a vision-guided robot and to suggest an observable test case."},{"title":"Vision sensor concept","text":"A vision sensor captures images and processes them to detect properties such as colour, shape, position or a learned object class. Its output becomes input to a robot control algorithm. Unlike a simple bump switch, a vision system can classify objects before contact, but performance depends heavily on lighting, camera angle and training/threshold settings."},{"title":"Recognition, confidence and action","text":"A classification result may provide class label, position and confidence. The controller should apply a threshold or validity check before commanding movement, particularly if incorrect classification would be unsafe. Example: detect red block → verify sufficiently confident → position robot → move gripper; on uncertainty, pause for human help."},{"title":"Bias, accuracy and safety","text":"A model trained on only one background may fail on different colours, shadows, reflections or orientations. Test varied lighting, clutter and look-alike objects; measure false positives (detecting a target when absent) and false negatives (missing a real target). Avoid claiming AI understands the scene as a human does."},{"title":"Explain a complete system","text":"Camera/vision sensor = input; controller interprets detection = processing; motors/gripper = actuators/output; updated images or encoders provide feedback. A robust design includes a safe action for no detection, uncertain detection or failed hardware. This is supplementary because the exported practical page had no full lesson text."}],"intentions":[{"verb":"Identify","question":"Identify vision input, processing and actuator output.","answer":"Use exact examples and roles from the lesson. For example: AI vision sensor — A camera-based input device able to analyse visual information about objects. Object detection — Identifying the presence or position of a target item in a camera image."},{"verb":"Define","question":"Define a vision sensor in general terms.","answer":"Use an accurate definition and a clear distinguishing feature. AI vision sensor: A camera-based input device able to analyse visual information about objects. Also review the 'Detailed information' and original Canvas lesson for the specific terms named in the question."},{"verb":"Outline","question":"Outline a possible robot response to an identified visual input.","answer":"State the main steps or features in a logical order. Source limitation: This uploaded Canvas PDF contains only a link and no exported lesson explanation or diagrams; the original lesson activity cannot be recovered from it. Supplementary context: Vision sensors can provide visual or classification input for a robotic control algorithm. A controller can use a detected object or condition to choose an actuator response."},{"verb":"Explain","question":"Explain why a vision-controlled algorithm needs explicit test cases.","answer":"Link the mechanism to its cause or purpose, and use the given context. Revision test: Be ready to identify the input, processing, decision and output of a vision-guided robot and to suggest an observable test case."}],"sourceNote":"Supplementary, independently authored exam-preparation knowledge. Original Canvas extracts appear separately below.","workshop":{"goal":"Use visual detection as a contextual example of sensing and decision-making.","example":"If the object is right of centre, turn right slightly and read again. Stop or reacquire when the object is lost.","trap":"Camera alignment and physical distance are separate measurements. Treat sensor-specific details as supplementary."}}],"cornell":[{"id":"cn-1","title":"Mechatronic systems: the big picture","unit":"Mechatronics","memorise":"Mechatronics = mechanical + electronics + computing + control. Robot = programmable machine. Automation = task performed with reduced direct human control.","rows":[{"cue":"Define: mechatronics","answer":"A mechatronic system combines physical mechanisms, electronic hardware, sensors, actuators and programmable control to perform an intended task. A washing machine measures conditions, follows a control program and drives a drum and water valves; a robot arm senses or receives positions and moves motors. The important feature is integration, not simply the presence of a motor.","flashPoints":["Mechanics + electronics + programmed control","Sensors measure, controllers decide, actuators act"]},{"cue":"Distinguish: robot, automated system, autonomous system","answer":"A robot is a programmable physical machine capable of manipulating or moving objects. An automated system follows programmed instructions with limited human intervention (e.g. timed irrigation). An autonomous system additionally senses conditions and makes some operating decisions while pursuing a goal (e.g. a robot vacuum adapting its path). These categories can overlap.","flashPoints":["Robot: programmable physical machine","Automatic: follows preset rules","Autonomous: makes some decisions without direct control"]},{"cue":"Identify: physical + digital subsystems","answer":"Typical subsystems: structure/mechanism (wheels, gears, arm), power (battery/supply), inputs (sensors and user commands), processing (microcontroller and code), outputs (motors, LEDs, alarms), communications (wired/wireless links). The code translates input information into actions constrained by the mechanical design.","flashPoints":["Physical: frame, gears, wheels and motors","Digital: sensor readings, program and controller"]},{"cue":"Explain: why use mechatronics?","answer":"Mechatronic systems can increase precision, repeatability, efficiency and safety in repetitive, dirty or hazardous work. Limitations include expense, maintenance, power use, sensor error, cybersecurity and the need for human oversight. An exam response should link a benefit or drawback to a named task rather than saying technology is simply faster.","flashPoints":["Repeatable movement and measurement","Useful for precision, safety and repetitive work"]}],"summary":"System = input → processing/decisions → physical output; feedback makes the system respond to actual conditions."},{"id":"cn-2","title":"Input, process, output, storage and transmission","unit":"Mechatronics","memorise":"IPO: INPUT (data) → PROCESS (logic) → OUTPUT (action). Add STORAGE, TRANSMISSION and FEEDBACK when needed.","rows":[{"cue":"Identify: inputs and outputs","answer":"Inputs include button presses, light levels, colour detected by a camera, ultrasonic distance and a timer reading. Outputs include rotating a motor, opening a claw, showing text and transmitting a warning. In an exam scenario, name the actual quantity sensed and the actual action produced—not just “sensor” and “motor”.","flashPoints":["Input: measurement or command","Output: movement, display or sound"]},{"cue":"Explain: processing and storage","answer":"Processing converts inputs into decisions: compare a distance reading with a threshold, select a direction or calculate speed. Storage holds persistent settings, calibration values, historical readings or program instructions. Temporary variables in memory also hold working values. Storage can be useful even if a basic IPO diagram omits it.","flashPoints":["Processing: apply a rule or calculation","Storage: retain a value for later use"]},{"cue":"Explain: transmission and feedback","answer":"Transmission carries information between components (wired sensor pins, Wi‑Fi, Bluetooth or a network). In a feedback system, an output influences the environment, the sensor measures the changed condition, and the controller adjusts the output. Example: a heater turns on, room temperature rises and the thermostat switches the heater off.","flashPoints":["Transmission: move data between components","Feedback: measure the result and feed it into the next decision"]},{"cue":"Apply: automatic gate","answer":"Input: proximity sensor and safety beam. Process: check whether a vehicle is present and the closing path is clear. Output: motor raises/lowers the gate, light signals state. Storage: opening speed and timing settings. Feedback: limit switch confirms fully open/closed; safety beam prevents closing on an obstruction.","flashPoints":["Sensor detects a vehicle","Controller checks the rule","Motor moves the gate"]}],"summary":"In scenarios use the formula “Input [measured data] → process [condition/algorithm] → output [specific action]”."},{"id":"cn-3","title":"Sensors: selecting and interpreting inputs","unit":"Mechatronics","memorise":"Sensor measures a physical quantity. Typical exam pairings: distance→ultrasonic/ToF, light→LDR, motion→PIR, orientation→gyro, position→encoder.","rows":[{"cue":"Define: sensor, analogue and digital","answer":"A sensor converts a physical condition into an electrical or digital signal for processing. An analogue reading varies across a range (e.g. voltage representing light intensity); a digital signal is represented in discrete values (often on/off or digital measurements). A microcontroller can use an analogue-to-digital converter (ADC) to sample an analogue voltage.","flashPoints":["Sensor converts a physical condition into a reading","Analogue: continuously varying signal","Digital: discrete representation"]},{"cue":"Compare: active vs passive sensing","answer":"An active sensor sends out energy and measures its return; ultrasonic distance sensors send sound pulses and measure echoes. A passive sensor detects naturally occurring energy or changes; a passive infrared motion detector senses changes in thermal radiation. Distinguish this from analogue versus digital, which describes signal representation.","flashPoints":["Active sensing emits a signal and measures the response","Passive sensing detects an existing signal"]},{"cue":"Identify: major sensor functions","answer":"Ultrasonic/ToF: measure distance; infrared reflectance: track a line; optical/camera or AI vision: identify coloured objects/shapes; gyroscope: angular motion; accelerometer: acceleration/tilt; encoder: wheel/shaft rotation; temperature probe: heat; limit switch: whether a position has been reached.","flashPoints":["Distance: proximity","Touch: contact","Vision: colour or position","Temperature: heat measurement"]},{"cue":"Explain: accuracy, calibration and noise","answer":"A sensor can be affected by ambient light, reflective surfaces, alignment, timing or electrical interference. Calibration establishes reference values; filtering or averaging reduces random variation; threshold/hysteresis avoids repeated switching near a boundary. Example: “detected” only after three consecutive valid observations improves reliability.","flashPoints":["Accuracy: closeness to true value","Calibration: compare against a reference and adjust","Noise: unwanted variation"]},{"cue":"Justify: choose a sensor for a design","answer":"Choose using required measurement, range, precision, response time, price, power, compatibility and operating conditions. A robot needing exact wheel travel may use encoders; a robot that must stop near a wall may use a distance sensor. One sensor rarely solves every problem: vision could locate a coloured ball while distance sensing controls safe approach.","flashPoints":["Match the measurement to the task","Check range, accuracy, conditions and response time"]},{"cue":"Apply · Choose a sensor for a parcel gate","answer":"Use a break-beam or proximity sensor to detect a parcel before it reaches the gate. The sensor reports presence. A controller decides whether to turn the gate and a servo produces the movement.","flashPoints":["Beam interrupted → parcel present","Controller chooses the route","Servo moves the gate"]},{"cue":"Explain · Why add a second sensor?","answer":"A limit switch can confirm the gate actually reached its end position. If the switch stays inactive after a move command, the controller can stop and report a possible jam.","flashPoints":["Limit switch confirms end position","Missing confirmation can trigger a stop or fault"]}],"summary":"A good justification names the measurement, operating conditions and why that sensor meets the requirement."},{"id":"cn-4","title":"Actuators and end effectors","unit":"Mechatronics","memorise":"Actuator changes electrical/control energy into physical action. DC motor=continuous spin; servo=controlled position; stepper=discrete steps; solenoid=linear push/pull.","rows":[{"cue":"Define: actuator and end effector","answer":"An actuator produces physical movement or another physical output in response to a control signal. An end effector is the tool attached to a robot arm to interact with objects, such as a gripper, suction cup or welding tool. An end effector may use an actuator to open/close or operate.","flashPoints":["Actuator causes physical action","End effector is the tool that interacts with the object"]},{"cue":"Compare: DC, servo and stepper motors","answer":"A DC motor rotates continuously and is useful for wheels and fans; varying voltage or PWM can vary speed. A hobby servo includes control to move toward a commanded angle, useful for arms and claws. A stepper motor rotates in small commanded increments, useful for precise positioning, though missed steps can cause errors. Match the device to the needed motion.","flashPoints":["DC motor: continuous rotation","Servo: position control","Stepper: moves in discrete steps"]},{"cue":"Explain: solenoid, relay, pump","answer":"A solenoid uses electromagnetic force for a push/pull movement such as a latch. A relay is an electrically controlled switch for another circuit; it is not a motor. A pump moves liquid/air and may be the output of automated watering or dosing. Each actuator has different load, power and interface requirements.","flashPoints":["Solenoid: linear movement","Relay: electrically controlled switch","Pump: moves fluid"]},{"cue":"Justify: selection constraints","answer":"Consider force/torque, required speed, positioning accuracy, movement range, power draw, response time and durability. A wheel drive needing continuous motion suits a DC/geared motor; a gripper needing set opening angles suits a servo. Explain why supply voltage and current must be compatible with the driver circuitry.","flashPoints":["Match force, speed, travel and precision","Check power and safety limits"]},{"cue":"Explain: motor driver and safety","answer":"Microcontroller signal pins cannot normally supply the high motor current directly. A motor driver or relay switches power from an appropriate supply; limits and emergency stops protect the machine. Mechanical stops, software constraints and limit switches reduce damage from overtravel.","flashPoints":["Driver handles actuator power beyond the controller output","Use safe limits and a stop mechanism"]}],"summary":"Select output hardware based on motion needed: rotation, positioning, gripping, switching or fluid movement."},{"id":"cn-5","title":"Microcontrollers, processors and control systems","unit":"Mechatronics","memorise":"Microcontroller = processor + memory + I/O on one chip. Open-loop uses no output feedback; closed-loop measures output and corrects it.","rows":[{"cue":"Define: microcontroller, CPU and co-processor","answer":"A microcontroller is a compact computing device with processor, memory and input/output interfaces that runs embedded programs. The CPU executes instructions; a specialised co-processor can accelerate work such as AI vision or other dedicated calculations. An embedded system is designed for a specific function rather than being a general-purpose desktop computer.","flashPoints":["Microcontroller: processor, memory and I/O in one chip","CPU: executes instructions","Co-processor: handles specialised work"]},{"cue":"Compare: open and closed loop","answer":"Open-loop control acts without verifying the actual result: “run motor for 3 seconds”. Closed-loop control measures the result, compares it with a target and adjusts the output: “drive until the encoder reaches the required position”. Closed-loop systems can correct some disturbances but require sensors and carefully designed control.","flashPoints":["Open loop: no measured output used to correct action","Closed loop: measured feedback affects the next action"]},{"cue":"Explain: target, error and response","answer":"In feedback control, error = desired value − measured value. Controller logic chooses a motor response to reduce error, with limits to prevent overshoot. Example: a robot steers toward a line based on lateral-position error. A very aggressive response can cause oscillation.","flashPoints":["Error = target − measurement","Controller uses the error to decide the adjustment"]},{"cue":"Apply: choosing controller components","answer":"Identify sensors, input ports, required calculations, output ports and communication. Verify pin count, voltage, memory, speed and compatible control interfaces. For a smart greenhouse, a microcontroller may read moisture/temperature sensors, control pump and fan drivers and log measurements.","flashPoints":["Choose enough input and output ports","Check processing speed, power and sensor compatibility"]},{"cue":"Beyond: reliability design","answer":"Watchdog timers can recover from unresponsive software; power isolation, fail-safe defaults and manual override improve robustness. Explain the purpose rather than assuming every school robot includes these features.","flashPoints":["Handle faults explicitly","Use a safe default, timeout or watchdog where appropriate"]}],"summary":"Closed-loop: setpoint → comparison → control action → measured output → updated comparison."},{"id":"cn-6","title":"Robot movement, degrees of freedom and navigation","unit":"Mechatronics","memorise":"Degree of freedom (DOF) = independent motion. Differential drive turns by changing left/right wheel speeds.","rows":[{"cue":"Define: degrees of freedom","answer":"Degrees of freedom describe independent ways a mechanism can move, such as translation along an axis or rotation around an axis. A robot arm with multiple joints can position and orient its end effector more flexibly, but needs more precise control and calibration.","flashPoints":["Degrees of freedom count independent movements","Translation and rotation can each contribute"]},{"cue":"Distinguish: motion styles","answer":"Pick-and-place: move between prescribed positions to transfer an object. Point-to-point: travel between specified target positions; the path between positions may be less important. Contouring: carefully follow a continuous path, such as drawing, welding or spraying along a curve. Select based on whether the trajectory itself matters.","flashPoints":["Linear: straight movement","Rotational: turning around an axis","Combined: simultaneous movements"]},{"cue":"Explain: differential-drive turning","answer":"A two-wheel robot goes straight when both wheels move at similar speeds; it curves when wheel speeds differ; opposite wheel directions can turn it approximately on the spot. Turning distance depends on wheel size, wheelbase, speed, floor friction and calibration. Time-based motion is less repeatable than encoder or sensor feedback.","flashPoints":["Wheel speed difference turns the robot","Opposite wheel directions can pivot it"]},{"cue":"Apply: drivetrain, arm and claw","answer":"In the class robot, the drivetrain controls navigation, the arm moves its height/position and the claw grasps an object. Break a pickup routine into stages: locate, align, approach, stop, lower arm, open/close claw, lift and retreat. Each stage should have safe stopping conditions.","flashPoints":["Drivetrain moves the robot","Arm positions the tool","Claw grips or releases the object"]},{"cue":"Explain: limitations and safety","answer":"Motor power limits, obstacles, wheel slip and sensor delays can cause inaccurate movement. Use controlled speeds, distance checks and mechanical travel limits. Test in a clear workspace and never assume timed rotation equals a precise angle without calibration.","flashPoints":["Wheel slip and obstacles affect movement","Use safe speed, travel limits and a stop rule"]}],"summary":"Motion question: specify direction/speed plus the condition that ends the action.","supplementary":true},{"id":"cn-7","title":"Automation, autonomy and decision rules","unit":"Mechatronics","memorise":"IF condition THEN action; automation repeats predefined tasks; autonomy uses sensing to adjust decisions.","rows":[{"cue":"Define: automation","answer":"Automation uses programmed controls to execute tasks that would otherwise require continuous manual action. Systems may operate on schedules, triggers or sensor readings. A programmable traffic signal is automated; an adaptive signal that measures vehicle queues has more feedback and decision capability.","flashPoints":["Automation performs tasks with reduced manual intervention","Programmed rules connect input to action"]},{"cue":"Compare: supervised, automatic and autonomous","answer":"Human-controlled systems take direct commands; automated systems carry out predefined steps; autonomous systems use perceptions and rules to plan or adapt while operating. Real systems often combine modes and retain manual override for safety.","flashPoints":["Supervised: human monitors or intervenes","Automatic: follows set rules","Autonomous: makes some decisions independently"]},{"cue":"Explain: rules and priorities","answer":"An automated robot needs explicit conditions: IF obstacle distance < 100 mm THEN stop, ELSE continue. Prioritise safety rules above goal-seeking: a low battery or emergency stop should override a collection command. Conflicting rules need an ordered decision strategy.","flashPoints":["Check the most important condition first","Safety stops should override movement"]},{"cue":"Apply: finite states","answer":"A robot may use states SEARCHING, ALIGNING, APPROACHING, GRABBING and RETURNING. Transitions occur when a camera detects an object, the error becomes small, or the distance threshold is reached. State-based design makes complex automation easier to debug and prevents unrelated actions from running simultaneously.","flashPoints":["Name states such as search, approach and stop","A condition triggers a transition"]},{"cue":"Beyond: edge cases","answer":"Consider sensor reading missing, multiple targets, target temporarily lost, or motor jam. Add fallbacks (stop/retry/alert) and timeouts instead of infinite loops. A robust solution handles unusual situations rather than only ideal demonstrations.","flashPoints":["Test missing, boundary and invalid sensor data","Specify a safe fallback"]},{"cue":"Compare · Fixed timer and feedback at the boundary","answer":"A fixed timer runs for the programmed duration. A feedback controller samples the actual condition after acting. In a moisture rule of below 25%, 24% runs the pump and 25% stops it.","flashPoints":["Timer runs for a preset duration","Feedback uses a new measurement","Below 25% runs the pump, exactly 25% stops it"]}],"summary":"A good automated algorithm includes both the desired behaviour and a safe response when conditions change."},{"id":"cn-8","title":"Functional and non-functional requirements","unit":"Mechatronics","memorise":"Functional = what the system must DO. Non-functional = how WELL or under what constraints it must operate.","rows":[{"cue":"Define: functional requirement","answer":"A measurable behaviour the system must perform. Example: “When a red object is detected, the robot shall align with its horizontal centre and stop within 60 mm of it.” This tells a developer which behaviour to implement and what result a test should check.","flashPoints":["Functional requirement states what the system must do","Example: stop when an obstacle is detected"]},{"cue":"Define: non-functional requirement","answer":"A quality or constraint affecting implementation or performance: safety, reliability, accuracy, response time, ease of use, cost, size, battery endurance and privacy. Example: “The robot must stop within 0.5 seconds of detecting an obstacle.” Strong requirements have measurable criteria.","flashPoints":["Non-functional requirement states a quality or constraint","Example: stop within 0.5 s of detection"]},{"cue":"Explain: users, stakeholders and constraints","answer":"Users interact directly with the solution; stakeholders are affected or responsible (operators, teachers, technicians, owners). Identify the problem, users, environment, budget, hardware restrictions and success measures before choosing sensors or writing code.","flashPoints":["Users operate or receive the service","Stakeholders are affected by it","Constraints limit possible designs"]},{"cue":"Apply: requirements to testing","answer":"Turn each requirement into a test. “Recognise red balls” becomes trials under several light conditions; “safe operation” becomes obstruction-stop and timeout tests; “work for 30 minutes” becomes a battery-duration test. Acceptance criteria prevent declaring success based only on appearance.","flashPoints":["Turn each requirement into a measurable test","State the input, action and expected result"]},{"cue":"Explain: trade-offs","answer":"Improving one criterion may worsen another: faster travel may reduce stopping accuracy; more sensors raise cost and power use; wireless convenience may introduce security issues. A justification identifies the trade-off and why the chosen balance fits the stated task.","flashPoints":["A change can improve one goal and weaken another","Compare the effects against the requirements"]}],"summary":"Use “The system shall…” plus an observable action and, where possible, a measurable condition."},{"id":"cn-9","title":"Robot algorithms, AI vision and sensor thresholds","unit":"Mechatronics","memorise":"Find → align → approach → interact. Test detection confidence, centre offset, distance and timeouts.","rows":[{"cue":"Explain: vision output and object coordinates","answer":"An AI-vision sensor may provide detected objects, class labels/colours and their bounding boxes/centre coordinates. A robot can compare an object’s centreX with the image centre to decide whether to turn left or right. The class lesson links to an AI vision practical, but the full practical text was not exported; these implementation notes supplement that gap.","flashPoints":["Vision can report object type, centre and size","Use the coordinate system defined for the camera"]},{"cue":"Apply: horizontal alignment","answer":"Calculate horizontal error = target centreX − camera centreX. IF error < −tolerance turn left; IF error > tolerance turn right; OTHERWISE drive forward. A tolerance band prevents the robot constantly twitching when nearly centred. Check coordinate orientation on the actual robot before assuming a sign convention.","flashPoints":["Compare object centre with image centre","Turn towards the object and sample again","Use a tolerance around the centre"]},{"cue":"Apply: safe approach","answer":"WHILE a target is visible and the measured distance exceeds a set threshold, drive forward slowly. Recheck sensors every iteration. Stop once near enough or if target disappears, a timeout occurs, or an obstacle appears. Fixed-time forward movement without rechecking risks overshooting.","flashPoints":["Advance only with valid alignment and distance","Stop at the threshold or when detection fails"]},{"cue":"Explain: procedural decomposition","answer":"Use small functions such as find_target(), align_target(), approach_target() and grasp_target(). Each should have a clear purpose, inputs and stopping conditions. Breaking the algorithm into functions makes errors easier to locate and allows individual parts to be unit tested.","flashPoints":["Separate detection, alignment and movement","Test each procedure on its own"]},{"cue":"Beyond: checking false positives","answer":"Colour recognition may confuse similarly coloured objects, and lighting changes can affect results. Verify detections over repeated frames or with distance readings. Avoid blindly chasing a visual target that is out of bounds or unsafe to reach.","flashPoints":["Confirm readings across frames or against another sensor","Handle inconsistent readings safely"]},{"cue":"Trace · Approach with three readings","answer":"With a move rule of distance > 55 mm, readings 70, 56 and 55 cause move, move, then stop. Take a fresh reading after each move. If the sensor returns no valid value, stop or use the stated safe recovery rule.","flashPoints":["70 mm → move","56 mm → move","55 mm → stop","Missing reading → safe fallback"]}],"summary":"Sensors are read repeatedly during movement; each movement loop needs a condition to STOP.","supplementary":true},{"id":"cn-10","title":"Testing, evaluation and design improvements","unit":"Mechatronics","memorise":"Test against requirements, not just “it worked once”. Repeat trials and collect evidence.","rows":[{"cue":"Explain: design iteration","answer":"Identify need → research → specify criteria → design → prototype → test → evaluate → improve. Iterative development repeats earlier stages after feedback. A problem may require redesign of both code and hardware; do not treat programming as the only possible fix.","flashPoints":["Plan, build, test, improve and retest","Use results to choose the next change"]},{"cue":"Describe: fair test","answer":"Hold key variables constant (distance, lighting, floor, battery level) and change one factor at a time. Record expected result and observed result, including failed attempts. Repeat trials to judge consistency; one success does not establish reliability.","flashPoints":["Change one factor at a time","Keep conditions consistent and repeat trials"]},{"cue":"Identify: causes of failure","answer":"Software errors include wrong comparison signs, indentation, endless loops and incorrect sensor thresholds. Hardware problems include loose connections, battery voltage, wheel slip, blocked sensors and an overloaded motor. Distinguish evidence of a fault from a guessed cause before changing multiple things.","flashPoints":["Check sensing, rule logic and actuator behaviour separately","Compare commanded and actual movement"]},{"cue":"Apply: evaluation statement","answer":"“The robot collected 8 of 10 balls under bright lighting, meeting the 70% success criterion. It failed twice in shadow because its vision sensor misidentified the target. Recalibrating the threshold and testing under varied lighting is the next improvement.” This is stronger than “the robot works well.”","flashPoints":["State the requirement","Quote a test result","Judge whether it meets the requirement"]}],"summary":"Claim + test evidence + requirement + limitation + justified improvement = strong evaluation."},{"id":"cn-11","title":"Mechatronics in industry and society","unit":"Mechatronics","memorise":"Examples: factory arms, medical robots, autonomous vehicles, agriculture, drones, household automation.","rows":[{"cue":"Identify: applications","answer":"Factories use programmable arms for repetitive assembly; agriculture uses sensors and controlled irrigation; hospitals may use robot-assisted equipment; warehouses use automated movement; aircraft/drone systems combine sensing and control. Choose a specific application and connect sensors, processing and output.","flashPoints":["Manufacturing: assembly and sorting","Agriculture: monitoring and control","Warehousing: moving goods"]},{"cue":"Explain: industry benefits","answer":"Automation can improve consistency, reduce exposure to hazardous environments, increase throughput and support precise tasks. It can also reduce some routine jobs while creating roles in maintenance, programming and oversight. Effects depend on training, system design and where it is used.","flashPoints":["Consistent output and fewer repetitive errors","Can reduce human exposure to hazards"]},{"cue":"Analyse: social and ethical issues","answer":"Consider worker displacement, unequal access, safety in shared spaces, privacy from cameras, unclear accountability for faults and bias in computer vision. Discuss affected stakeholders and both a benefit and a possible harm rather than treating all automation as good or bad.","flashPoints":["Consider effects on jobs, privacy and safety","Name who benefits and who bears the risk"]},{"cue":"Explain: legal and responsible design","answer":"Follow applicable safety obligations, privacy/data-handling requirements, copyright rules for reused code/assets and workplace procedures. In Australia, privacy and surveillance obligations can depend on the organisation and state law; do not invent a universal rule. For school projects, seek approval before collecting or sharing identifiable footage.","flashPoints":["Use guards, training and safe stop behaviour","Apply the stated rules and document the safeguards"]},{"cue":"Justify: ethical improvement","answer":"Example: a classroom robot with a camera should process only needed detections, avoid retaining personal footage, offer a clear operating indicator and include manual stop. These measures reduce privacy and safety risk while maintaining the learning objective.","flashPoints":["Match the improvement to a specific risk","Explain how it lowers the risk and how to test it"]}],"summary":"An extended response should cover technical impact, people affected, ethical risk and a reasonable mitigation."},{"id":"cn-12","title":"Computer networks and network types: LAN, WAN, WLAN","unit":"Networks","memorise":"Network = connected nodes + transmission links + protocols. LAN = local; WAN = geographically broad; WLAN = wireless LAN.","rows":[{"cue":"Define: network, node and link","answer":"A computer network connects two or more devices to exchange data and share resources. A node may be a computer, phone, printer, sensor, switch or router. A link carries data using copper, fibre, radio or another medium. Devices must agree on communication protocols.","flashPoints":["Network: connected devices sharing data or resources","Node: device or endpoint","Link: connection between nodes"]},{"cue":"Differentiate: LAN and WAN","answer":"A Local Area Network (LAN) covers a limited site such as a school, home or office and is usually administered by one organisation. A Wide Area Network (WAN) connects networks across larger geographical distances, often using service-provider infrastructure. The internet is a global collection of interconnected networks; WAN does not necessarily mean “the internet”.","flashPoints":["LAN: local site","WAN: links distant sites or networks"]},{"cue":"Define: WLAN, PAN and VPN","answer":"A Wireless LAN (WLAN) uses Wi‑Fi for devices within a local network. A Personal Area Network (PAN) connects nearby personal devices (often Bluetooth). A Virtual Private Network (VPN) creates an encrypted logical connection over another network; it is a security/connectivity method, not a geographical network size.","flashPoints":["WLAN: local wireless network","PAN: short-range personal network","VPN: private tunnel over another network"]},{"cue":"Explain: why connect systems?","answer":"Benefits include file sharing, shared printers, central storage, messaging, collaboration, remote access and IoT monitoring. Disadvantages include security exposure, privacy risk, network dependence, congestion, maintenance costs and potential outages.","flashPoints":["Share resources and communicate","Support remote access and central services"]},{"cue":"Compare: a school example","answer":"Student laptops and classroom PCs connect via a school LAN (many using Wi‑Fi/WLAN). A school server may control files and logins. The campus router connects to an internet service provider across a WAN; staff may use a VPN for authorised remote access.","flashPoints":["School campus: LAN","Wi-Fi within campus: WLAN","Connection between campuses: WAN"]},{"cue":"Apply · One campus loses its link to another","answer":"The local LAN can keep working even if the WAN link fails. A printer reachable over local Wi-Fi uses the WLAN. A remote school server can become unreachable when the WAN link is down.","flashPoints":["The LAN can keep working when the WAN fails","A local printer may work while the remote server is unreachable"]}],"summary":"LAN/WAN refer mainly to scope; WLAN refers to wireless access within a local network; VPN refers to secure virtual connectivity."},{"id":"cn-13","title":"Client–server, peer-to-peer and shared resources","unit":"Networks","memorise":"Client requests a service; server supplies it. Peer-to-peer nodes share without relying on one dedicated central server.","rows":[{"cue":"Describe: client–server model","answer":"A client is a device or application requesting a service. A server provides it, such as authentication, file storage, websites, databases or printing. Many clients can access one service; permissions and central management can improve consistency.","flashPoints":["Client requests a service","Server receives the request and supplies the service"]},{"cue":"Compare: peer-to-peer","answer":"In peer-to-peer (P2P) networking, devices communicate directly and may act as both providers and users of resources. It can be practical for small networks but often makes permissions, backups, updates and security harder to manage centrally.","flashPoints":["Peers can act as both clients and servers","Resources can be shared without a dedicated central server"]},{"cue":"Explain: strengths and weaknesses","answer":"Client–server: central backups/security, easier account management, but server cost and a potential single point of failure. P2P: less central infrastructure and simple local sharing, but inconsistent access rules and difficult scaling. Some systems combine both approaches.","flashPoints":["Central servers simplify administration","They can become a single point of failure","Peer sharing can be harder to control"]},{"cue":"Apply: school print service","answer":"A student computer submits a print job to a print server; the server checks permissions and queues the job; a printer produces the document. Inputs: print file and student login. Process: authentication/queue. Storage: print queue. Output: printed pages.","flashPoints":["Client submits print job","Print server queues it and sends it to a printer"]},{"cue":"Beyond: redundancy and cloud","answer":"Critical services can be replicated across multiple servers for availability. Cloud storage is still implemented on networks of physical servers; it is not a separate magical form of storage. Consider privacy and internet dependence when evaluating cloud-based services.","flashPoints":["Redundancy provides another way to access a service","Cloud hosting can distribute resources"]}],"summary":"If an exam asks for a server role, name the exact shared service it provides."},{"id":"cn-14","title":"Network topologies, connections and transmission","unit":"Networks","memorise":"Topology = arrangement of links. Star: each device connects to a central switch. Mesh: several alternative routes.","rows":[{"cue":"Define: topology and links","answer":"A topology describes how devices and connections are arranged physically or logically. Wired links may use copper or fibre; wireless links use electromagnetic signals. Network performance depends on link capacity, traffic, physical constraints and reliability.","flashPoints":["Topology is the arrangement of nodes and links","Links may be wired or wireless"]},{"cue":"Compare: bus, star, ring and mesh","answer":"Bus shares a backbone; failure or congestion on that cable can affect many users. Star connects each device to a central device; easy to isolate a faulty cable, but the central switch is critical. Ring passes traffic around a loop. Mesh offers multiple possible paths and can be resilient, though complex and expensive.","flashPoints":["Bus: shared backbone","Star: central device","Ring: loop","Mesh: multiple paths"]},{"cue":"Explain: collisions and switching","answer":"Older shared-medium networks such as hubs can have competing transmissions. Modern switched Ethernet usually gives each port a separate link, improving efficiency and reducing collisions in full-duplex operation. A switch forwards frames based on learned MAC addresses rather than blindly sending everything to every port.","flashPoints":["Shared media can contend","Switching forwards frames towards the relevant port when known"]},{"cue":"Justify: school design","answer":"Star topology with managed switches suits classrooms: adds/removes devices easily, localises most cable faults, and supports VLANs. Several switches may connect to distribution switches. Redundant uplinks can increase reliability when configured carefully to avoid loops.","flashPoints":["A switched star makes endpoint faults easier to isolate","A failed central switch can affect the whole star"]},{"cue":"Beyond: physical versus logical","answer":"The way cables are connected need not match the logical communication pattern. A switched network may look like a star physically while multiple VLANs form separate logical networks across shared hardware.","flashPoints":["Physical topology describes actual connections","Logical topology describes how traffic flows"]}],"summary":"When justifying a topology, compare fault tolerance, cost, expansion and maintenance."},{"id":"cn-15","title":"Network hardware: NIC, hub, switch, router, WAP","unit":"Networks","memorise":"Switch connects devices in a LAN; router connects IP networks; wireless access point connects Wi‑Fi clients to the LAN.","rows":[{"cue":"Identify: NIC and hub","answer":"A Network Interface Controller (NIC) enables a device to connect to a network (Ethernet or wireless). A hub repeats incoming electrical signals to all other ports without directing individual frames; it is largely obsolete in modern LANs.","flashPoints":["NIC provides a network interface","Hub repeats incoming traffic to its other ports"]},{"cue":"Explain: switch","answer":"A switch links devices in an Ethernet LAN and forwards traffic using MAC addresses. It learns which MAC addresses are reachable via its ports. Managed switches can support VLANs, monitoring and port security. A switch normally works at the data-link layer; a Layer 3 switch can also route.","flashPoints":["A switch learns source MAC addresses by port","Uses destination MAC to forward local frames"]},{"cue":"Explain: router and default gateway","answer":"A router forwards packets between different IP networks, such as the school LAN and internet or two internal VLANs. Clients send non-local destinations to their configured default gateway. Routers commonly also perform functions such as NAT and packet filtering, depending on configuration.","flashPoints":["A router forwards IP packets between networks","Default gateway handles destinations outside the local subnet"]},{"cue":"Explain: wireless access point, modem, firewall","answer":"A Wireless Access Point (WAP/AP) connects Wi‑Fi devices to a wired network. A modem converts signals appropriate to an access technology (e.g. cable). A firewall checks traffic against security rules; it may be a dedicated appliance, router feature or software. These are distinct roles even if a home gateway combines them.","flashPoints":["Access point connects Wi-Fi clients","Modem interfaces with the provider link","Firewall filters traffic"]},{"cue":"Apply: school connection path","answer":"Laptop → Wi‑Fi access point → classroom/distribution switch → school router/firewall → ISP → remote server. For a file on a local school server, traffic may never need to reach the internet. Name which device forwards within a LAN versus between networks.","flashPoints":["Device → access point or switch → router → WAN when the destination is remote"]},{"cue":"Distinguish · Four jobs in one network","answer":"A switch forwards local Ethernet frames. A router forwards packets to another IP network. An access point attaches Wi-Fi clients to the local network. A firewall filters traffic using configured rules.","flashPoints":["Switch: local frames","Router: IP between networks","Access point: Wi-Fi clients","Firewall: traffic rules"]}],"summary":"Switch = local Ethernet forwarding; router = between IP networks; AP = radio access; firewall = traffic rules."},{"id":"cn-16","title":"Wired transmission: UTP, coaxial and fibre","unit":"Networks","memorise":"UTP sends electrical signals; fibre sends light; coaxial has shielded copper construction.","rows":[{"cue":"Describe: UTP/Ethernet copper","answer":"Unshielded Twisted Pair (UTP) is commonly used for Ethernet LAN cabling. Twisted copper pairs reduce electromagnetic interference and carry electrical signals. Advantages: affordable, easy to install and compatible with typical switches. Limitations include finite cable distance and some susceptibility to interference.","flashPoints":["UTP uses twisted copper pairs","Common for wired Ethernet inside a building"]},{"cue":"Describe: coaxial cable","answer":"Coaxial cable has a central copper conductor and shielding. It is common in cable television and some broadband connections. Shielding helps resist interference; it is less common for modern office Ethernet to individual computers than UTP.","flashPoints":["Coax has a centre conductor and shielding","Often used in cable systems"]},{"cue":"Describe: fibre optic","answer":"Optical fibre uses pulses of light through glass/plastic. It supports long distances and high data rates and is resistant to electromagnetic interference. It can be more costly to terminate and requires suitable transceivers; bending and connector cleanliness matter.","flashPoints":["Fibre sends light","Useful over long distances and resistant to electromagnetic interference"]},{"cue":"Compare: bandwidth, latency and reliability","answer":"Bandwidth is the maximum data-carrying capacity of a connection; throughput is the actual useful rate achieved. Latency is delay before data arrives. Fibre may provide high capacity and range but a fast fibre link alone does not guarantee low end-to-end latency if routes are congested.","flashPoints":["Bandwidth: capacity","Latency: delay","Reliability: consistent operation under the conditions"]},{"cue":"Apply: choose media","answer":"Use copper Ethernet for short desktop runs where cost matters, fibre for long building-to-building backbone links, and coaxial where the ISP connection uses a coaxial service. Justify choices using distance, interference, cost, speed and environment.","flashPoints":["Use fibre for a long or interference-prone link","Use copper where distance and cost favour it"]}],"summary":"Copper = practical short LAN runs; fibre = strong choice for long/high-capacity backbones."},{"id":"cn-17","title":"Wireless transmission, cellular, Bluetooth and IoT","unit":"Networks","memorise":"Wi‑Fi: local networking. Cellular: wide-area carrier network. Bluetooth/Zigbee: short-range often low-power connections.","rows":[{"cue":"Describe: Wi‑Fi and WAP","answer":"Wi‑Fi uses radio to link local devices via access points. It offers mobility and easy deployment but performance varies with walls, distance, interference and the number of devices. Wireless security configuration matters because signals extend outside a room.","flashPoints":["Wi-Fi provides local wireless access","A WAP connects wireless clients to the LAN"]},{"cue":"Describe: cellular, satellite and Bluetooth","answer":"Cellular networks connect mobile devices via provider base stations, often covering broad areas; 4G/5G are examples. Satellite can reach remote areas but may face weather, latency or visibility limitations. Bluetooth connects nearby devices such as headphones or controls and often has low power requirements.","flashPoints":["Cellular: wide-area mobile network","Satellite: remote coverage","Bluetooth: short-range links"]},{"cue":"Explain: Zigbee/Z-Wave and mesh","answer":"Low-power smart-home sensors may use protocols such as Zigbee or Z-Wave. Some devices relay messages across a mesh, extending coverage. Mesh does not necessarily make every connection faster; the design balances range, energy and reliability.","flashPoints":["Zigbee and Z-Wave are low-power wireless options","Mesh devices can relay traffic across multiple hops"]},{"cue":"Define: Internet of Things","answer":"IoT connects physical devices that sense, process, transmit or act on data. A smart greenhouse may measure soil moisture, send readings to a server and operate a pump. Risks include weak device security, privacy and network outages.","flashPoints":["IoT means connected physical devices with sensing or control","Consider security and power needs"]},{"cue":"Apply: wireless choice","answer":"For a classroom laptop use Wi‑Fi; for a wearable sensor link use a low-power short-range technology; for a travelling vehicle use cellular. Explain why the chosen technology matches range, power, speed and infrastructure.","flashPoints":["Match range, bandwidth and power to the job","Consider interference and obstructions"]}],"summary":"A wireless question usually requires a trade-off: coverage, power, reliability, interference, cost and security.","supplementary":true},{"id":"cn-18","title":"Addressing: MAC, IP, DNS, DHCP and subnetting","unit":"Networks","memorise":"MAC = local interface identifier; IP = network address; DNS = name → address; DHCP = automatic IP settings.","rows":[{"cue":"Distinguish: MAC and IP address","answer":"A MAC address identifies a network interface at the local-link level. An IP address identifies an interface in an IP network so packets can be routed. Switches commonly use MAC addresses for local frame delivery; routers use destination IP networks to choose routes.","flashPoints":["MAC: local link address","IP: logical address used for routing"]},{"cue":"Explain: DNS and DHCP","answer":"Domain Name System (DNS) resolves human-readable names such as example.com to IP addresses. Dynamic Host Configuration Protocol (DHCP) can automatically assign IP settings such as address, subnet mask, gateway and DNS server. If DNS fails, reaching a website by name may fail even when direct IP connectivity works.","flashPoints":["DNS resolves names to addresses","DHCP supplies network configuration automatically"]},{"cue":"Explain: network address and subnet mask","answer":"An IPv4 subnet mask defines which address bits identify the local network. Devices usually communicate directly when on the same subnet; to reach a different subnet they send traffic via a router/default gateway. Example: with 192.168.10.25/24, the network is 192.168.10.0 and typical usable host range is .1 to .254.","flashPoints":["A subnet mask identifies network bits","Devices use it to decide if a destination is local"]},{"cue":"Apply: identify a misconfiguration","answer":"If a computer has the wrong default gateway, it may reach local devices but not the internet. If it has the wrong subnet mask, it might treat remote devices as local or vice versa. If two devices are configured with the same IPv4 address on one network, conflicts may prevent reliable communication.","flashPoints":["Check address, mask and gateway","If only names fail, check DNS"]},{"cue":"Beyond: /26 worked example","answer":"A /26 IPv4 mask leaves 6 host bits: 2^6 = 64 addresses per subnet, normally 62 usable for ordinary host assignment. 192.168.5.64/26 covers .64–.127; network .64, broadcast .127, normally assignable .65–.126. This is extension practice rather than a requirement stated in the exam notification.","flashPoints":["/26 leaves 6 host bits","64 total addresses","Usually 62 usable host addresses in a conventional IPv4 subnet"]}],"summary":"DNS names; DHCP addresses; gateway routes. For /n IPv4, host bits = 32 − n.","supplementary":true},{"id":"cn-19","title":"Protocols, handshaking and layered communication","unit":"Networks","memorise":"Protocol = agreed communication rules. TCP = reliable ordered delivery; IP = addressing/routing; HTTP(S) = web transfer.","rows":[{"cue":"Define: protocol and handshaking","answer":"A protocol specifies formatting, timing and interpretation of messages so different devices can communicate. A handshake is an exchange that establishes communication parameters before or during a connection. Different protocols handle different parts of network communication.","flashPoints":["Protocol: agreed communication rules","Handshaking: setup messages that agree or establish a connection"]},{"cue":"Distinguish: TCP, UDP and IP","answer":"IP addresses and routes packets between networks but does not itself guarantee delivery. TCP supports reliable, ordered data delivery using acknowledgements/retransmission. UDP sends datagrams without TCP’s built-in delivery guarantees and may suit real-time traffic where low overhead is useful.","flashPoints":["TCP: reliable ordered byte stream","UDP: datagrams without built-in delivery guarantees","IP: addressing and routing"]},{"cue":"Describe: HTTP, HTTPS, DNS and Ethernet","answer":"HTTP transfers web requests/responses; HTTPS protects that exchange using TLS encryption and server authentication. DNS translates names to addresses. Ethernet defines common wired local-network frame transmission; Wi‑Fi provides wireless LAN connectivity. Several protocols operate together for one web page load.","flashPoints":["HTTP: web requests and responses","HTTPS: HTTP protected by TLS","DNS: name resolution","Ethernet: local link protocol"]},{"cue":"Explain: packets versus frames","answer":"An application message can be split into transport segments and carried in IP packets; on a local link it is placed in a frame. Headers contain addressing/control details needed to move data. Each layer handles a different responsibility, allowing many kinds of hardware and software to interoperate.","flashPoints":["An IP packet is carried inside a link-layer frame","Frame addressing applies to the local link"]},{"cue":"Apply: web request sequence","answer":"Join Wi‑Fi → receive IP settings (often DHCP) → resolve a name (DNS) → contact the server over IP and TCP (or relevant transport) → negotiate TLS for HTTPS → request and display content. The school firewall may allow or block the traffic based on policies.","flashPoints":["Resolve the hostname","Connect to the server","Send the request","Receive the response"]}],"summary":"Think layers: application (HTTP/DNS), transport (TCP/UDP), internet (IP), local link (Ethernet/Wi‑Fi)."},{"id":"cn-20","title":"Data packets, routing and packet switching","unit":"Networks","memorise":"Packet switching = split → label → route → reassemble. Different packets can travel different routes.","rows":[{"cue":"Define: packets","answer":"A packet is a manageable unit of data carrying payload plus header information such as source/destination addresses and other control fields. Dividing large messages allows network resources to be shared among users, supports retransmission and makes efficient routing possible.","flashPoints":["A packet carries payload and header information","The header supports delivery"]},{"cue":"Explain: packet switching","answer":"The sender divides data into packets; routers forward each toward the destination using routing information. Packets can encounter different delays and routes. The receiving transport/application mechanisms put the useful data in the correct order or handle missing pieces when required.","flashPoints":["Split data into packets","Forward packets through t
