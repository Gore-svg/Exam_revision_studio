tance by time. Display the speed in km/h. Saving the result is storage.","trap":"“Speed” is the output. “Divide distance by time” describes the process."}},{"id":"Flowcharts","unit":"Programming","source":"Canvas lesson PDF","terms":[{"term":"Terminator","desc":"The rounded start/end shape in a flowchart."},{"term":"Process symbol","desc":"A rectangle representing an action or computation."},{"term":"Input/output symbol","desc":"A parallelogram for reading or displaying data."},{"term":"Decision symbol","desc":"A diamond that creates branches based on a condition."},{"term":"Flow arrow","desc":"A directed line showing the order in which flowchart steps execute."},{"term":"Branch label","desc":"Text such as Yes and No identifying decision exits."},{"term":"Loop in flowchart","desc":"A path directed back to an earlier step to repeat instructions."},{"term":"Flowchart readability","desc":"Clear direction and consistent symbols that make program logic easy to trace."}],"points":[{"title":"Common visual symbols","text":"Terminator oval: start/end. Parallelogram: input/output. Rectangle: process. Diamond: decision. Flow arrows: sequence/direction. Use consistent notation and connect every meaningful branch."},{"title":"Representing selection","text":"A diamond has alternative branches following a condition such as pass/fail, and the paths may join later. Label the branches clearly."},{"title":"Representing loops","text":"A loop has an arrow returning to an earlier condition or step. Trace the termination condition and check whether the loop can stop."},{"title":"Read and construct","text":"Convert a written problem into steps, draw the required symbols and trace sample inputs through the flowchart to check correctness."},{"title":"Standard symbols to memorise","text":"Oval/rounded terminator = START/END; parallelogram = INPUT/OUTPUT; rectangle = PROCESS; diamond = DECISION (label branches Yes/No or True/False); arrows = control flow; connector = continuation. These symbols describe an algorithm independently of any language, so use them consistently."},{"title":"Selection and repetition on a diagram","text":"For selection, an arrow enters a decision diamond and splits into two labelled paths; they may converge after alternate actions. For repetition, a path returns to a condition or loop body. Be certain a loop has a way to terminate or deliberately runs forever. Flow follows arrows; do not infer from visual placement alone."},{"title":"Read and produce flowcharts","text":"Example: input mark; if mark >= 50 output Pass, otherwise Fail; end. Show one decision with two valid labelled branches. To debug, simulate inputs 49, 50 and 51, tracking the branch. In an exam, reproduce a flowchart logically, not decoratively. Avoid mixing a processing rectangle with a decision diamond."},{"title":"Extension","text":"A nested decision handles several categories such as A/B/C grades. Be cautious about condition order and overlapping ranges. Flowcharts become unwieldy for very long programs, so break complex algorithms into procedures or use pseudocode."}],"intentions":[{"verb":"Identify","question":"Identify the terminator, process, input/output, decision and arrow symbols.","answer":"Use exact examples and roles from the lesson. For example: Terminator — The rounded start/end shape in a flowchart. Process symbol — A rectangle representing an action or computation."},{"verb":"Define","question":"Define a flowchart and a decision branch.","answer":"Use an accurate definition and a clear distinguishing feature. Terminator: The rounded start/end shape in a flowchart. Also review the 'Detailed information' and original Canvas lesson for the specific terms named in the question."},{"verb":"Outline","question":"Outline a flowchart for a pass/fail algorithm.","answer":"State the main steps or features in a logical order. Common visual symbols: Terminator oval: start/end. Parallelogram: input/output. Rectangle: process. Diamond: decision. Flow arrows: sequence/direction. Use consistent notation and connect every meaningful branch. Representing selection: A diamond has alternative branches following a condition such as pass/fail, and the paths may join later. Label the branches clearly."},{"verb":"Explain","question":"Explain how a loop is represented and traced in a flowchart.","answer":"Link the mechanism to its cause or purpose, and use the given context. Read and construct: Convert a written problem into steps, draw the required symbols and trace sample inputs through the flowchart to check correctness."}],"sourceNote":"Supplementary, independently authored exam-preparation knowledge. Original Canvas extracts appear separately below.","workshop":{"goal":"Choose symbols, label decision exits and trace the arrows with real inputs.","example":"Read n in a parallelogram, compare n > 0 in a diamond, print on Yes and decrement in a rectangle. Loop back to the diamond.","trap":"Returning to the input box can overwrite the state you just changed."}},{"id":"Pseudocode","unit":"Programming","source":"Canvas Pseudocode lesson (29 October 2026), pp. 1–3 + clarifying examples","terms":[{"term":"Pseudocode","desc":"English-like representation of an algorithm, independent of a programming language; keywords use CAPITALS and indentation shows control structure."},{"term":"BEGIN name / END name","desc":"Every procedure/subroutine begins and ends with the SAME name."},{"term":"IF condition THEN / ELSE / ENDIF","desc":"Binary selection; ELSE is optional, but ENDIF must match its IF."},{"term":"CASEWHERE / OTHERWISE / ENDCASE","desc":"Multi-way choice: CASEWHERE expression evaluates to, case labels, optional OTHERWISE and closing ENDCASE."},{"term":"WHILE / ENDWHILE","desc":"Pre-test loop: a condition is checked before each repetition and must eventually become false."},{"term":"REPEAT / UNTIL","desc":"Post-test loop: statements run at least once; the condition is checked after the statements."},{"term":"FOR / NEXT","desc":"Counter loop: FOR variable = start TO finish STEP increment, then matching NEXT variable."}],"points":[{"title":"Purpose and examination focus","text":"Pseudocode plans an algorithm in English-like steps without writing Python. Explain sequence, selection and repetition, then construct or trace an algorithm."},{"title":"Exact classroom conventions","text":"Write control keywords in CAPITALS. Each IF has ENDIF; WHILE has ENDWHILE; CASEWHERE has ENDCASE; FOR has NEXT variable; REPEAT has UNTIL condition. Indent the body of every control structure by one level."},{"title":"Procedure format","text":"BEGIN Check Mark / four-space indented body / END Check Mark. The names match. A naked BEGIN ... END is not the exact procedure convention shown in the lesson."},{"title":"Selection","text":"IF mark >= 50 THEN, indented OUTPUT \"PASS\", ELSE, indented OUTPUT \"FAIL\", ENDIF. Nested IFs need their own ENDIF. Avoid assuming ELSEIF is a documented keyword in your class sheet."},{"title":"Multiway selection","text":"CASEWHERE colour evaluates to, followed by indented RED: process, GREEN: process, OTHERWISE: fallback, then ENDCASE. Conditions and output actions should be clear."},{"title":"Pre-test and post-test loops","text":"WHILE distance > 55 ... INPUT distance ... ENDWHILE may run zero times. REPEAT ... INPUT distance ... UNTIL distance <= 55 runs at least once. Update loop state so it can terminate."},{"title":"Counter loop","text":"FOR i = 1 TO 5 STEP 1, indented OUTPUT i, NEXT i. The named counter in NEXT must match the FOR counter. Do not substitute FOR i FROM 1 TO 5; this is not the displayed class form."},{"title":"Robot example","text":"BEGIN Approach Object / INPUT distance / WHILE distance > 55 / MOVE FORWARD / INPUT distance / ENDWHILE / STOP / END Approach Object, with each inner statement indented correctly. This uses a new sensor reading each cycle."},{"title":"Common mistakes to avoid","text":"Missing ENDIF, ENDWHILE or ENDCASE; ELSE at the wrong indentation; mixing WHILE and UNTIL; mismatched NEXT variable; missing STEP; closing END without its procedure name; loops that never update the condition."},{"title":"Assessment practice","text":"Identify the logic; define pseudocode; outline the order of execution; explain zero-or-more vs one-or-more repetition; trace variable values; write code using the exact syllabus conventions. Pseudocode is not itself executable Python."}],"intentions":[{"verb":"Identify","question":"Identify the five classroom control formats and their paired endings.","answer":"IF ... ENDIF; CASEWHERE ... ENDCASE; WHILE ... ENDWHILE; REPEAT ... UNTIL; FOR ... NEXT variable. Each algorithm is wrapped in BEGIN name ... END name."},{"verb":"Define","question":"Define pseudocode and give two reasons it is useful.","answer":"Pseudocode is a readable, language-independent representation of algorithm logic. It helps plan programs and discuss or review logic before implementing in Python."},{"verb":"Outline","question":"Outline how a FOR/NEXT loop is written using the course convention.","answer":"FOR counter = 1 TO 5 STEP 1, indent the repeated process, then NEXT counter aligned with FOR. The counter named in NEXT must be the same."},{"verb":"Explain","question":"Explain the difference between WHILE and REPEAT/UNTIL.","answer":"WHILE checks before running the body, so its body may never run; REPEAT/UNTIL checks after the body, so it always runs at least once."},{"verb":"Explain","question":"Explain what is wrong with IF/ELSE/ENDIF blocks that are not indented correctly.","answer":"The branch body and enclosing structure become unclear. Indenting nested statements under IF and ELSE, and aligning ELSE and ENDIF with IF, makes the control flow readable."},{"verb":"Apply","question":"Write a robot algorithm that stops once a sensor reads a distance of 55 mm or less.","answer":"BEGIN Approach Object; INPUT distance; WHILE distance > 55; (indented) MOVE FORWARD; INPUT distance; ENDWHILE; STOP; END Approach Object. Preserve nesting and use a fresh distance reading each pass."}],"sourceNote":"Supplementary, independently authored exam-preparation knowledge. Original Canvas extracts appear separately below.","workshop":{"goal":"Write and trace named procedures using the six classroom forms.","example":"In WHILE distance > 55, read distance before the first test and update it after each movement. At 55 exactly, exit and stop.","trap":"Use BEGIN name/END name and the correct closer. Python range syntax belongs in Python answers."}},{"id":"Control Structures - Intro","unit":"Programming","source":"Canvas lesson PDF","terms":[{"term":"Control structure","desc":"A programming construct that determines which instructions run and in what order."},{"term":"Sequence","desc":"Running instructions one after another in a specified order."},{"term":"Selection","desc":"Choosing a path according to a Boolean condition."},{"term":"Repetition","desc":"Re-running a group of instructions while or until a condition is met."},{"term":"Structured programming","desc":"Organising algorithms using clear, nested control structures."},{"term":"Conditional expression","desc":"An expression evaluated to True or False to control a branch or loop."},{"term":"Nested structure","desc":"A control structure inside another, such as an IF inside a FOR loop."},{"term":"Indentation block","desc":"The group of Python statements belonging to the same parent structure."}],"points":[{"title":"Three fundamental structures","text":"Sequence executes instructions in order. Selection chooses which statements run based on a condition. Repetition repeats a block according to a condition or count."},{"title":"Combining structures","text":"Real programs can nest or combine these structures to process inputs, make choices and repeatedly update information."},{"title":"Trace control flow","text":"Trace the actual execution path, not merely the visual order of the lines: selection skips branches, and repetition revisits statements."},{"title":"Three control structures","text":"Sequence runs statements in order; selection chooses a branch using a condition; repetition executes a block more than once while a condition holds or for each item. These can be combined to build complex programs. Learn to identify them from code or flowchart, and explain why one is appropriate."},{"title":"Decision-making conditions","text":"Conditions evaluate to booleans True/False. Comparison operators include ==, !=, >, <, >= and <=. Logical operators and/or/not combine or invert tests. Parentheses can make logic explicit. For conditions A and B, A and B requires both; A or B needs at least one. An assignment '=' does not compare values in Python."},{"title":"Scope and indentation","text":"In Python, indentation determines which statements belong to an if, for, while or function block. Incorrect indentation changes program logic or causes an error. Nested structures execute inner code only under the surrounding structure's rules; construct a trace table before answering output questions."},{"title":"Exam strategy","text":"For a short code extract: identify the control structure, state the condition, track variable updates, then write exact outputs. Test boundaries, such as x equal to 10 when comparing x > 10 versus x >= 10."}],"intentions":[{"verb":"Identify","question":"Identify examples of sequence, selection and repetition in code.","answer":"Use exact examples and roles from the lesson. For example: Control structure — A programming construct that determines which instructions run and in what order. Sequence — Running instructions one after another in a specified order."},{"verb":"Define","question":"Define all three fundamental control structures.","answer":"Use an accurate definition and a clear distinguishing feature. Control structure: A programming construct that determines which instructions run and in what order. Also review the 'Detailed information' and original Canvas lesson for the specific terms named in the question."},{"verb":"Outline","question":"Outline how a program could combine a decision and a loop.","answer":"State the main steps or features in a logical order. Three fundamental structures: Sequence executes instructions in order. Selection chooses which statements run based on a condition. Repetition repeats a block according to a condition or count. Combining structures: Real programs can nest or combine these structures to process inputs, make choices and repeatedly update information."},{"verb":"Explain","question":"Explain how control flow changes when a condition is true or false.","answer":"Link the mechanism to its cause or purpose, and use the given context. Trace control flow: Trace the actual execution path, not merely the visual order of the lines: selection skips branches, and repetition revisits statements."}],"sourceNote":"Supplementary, independently authored exam-preparation knowledge. Original Canvas extracts appear separately below.","workshop":{"goal":"Choose sequence, selection or an appropriate loop based on when a condition is tested.","example":"A PIN prompt that must run at least once uses REPEAT … UNTIL pin = expectedPIN.","trap":"WHILE checks before the body. REPEAT tests the stopping condition after the body."}},{"id":"Sequence","unit":"Programming","source":"Canvas lesson PDF","terms":[{"term":"Sequential execution","desc":"Performing statements in the written order, one after the previous one."},{"term":"Assignment","desc":"Storing a value in a variable with the = operator in Python."},{"term":"Statement order","desc":"The arrangement of instructions that can affect the final result."},{"term":"Reassignment","desc":"Replacing a variable's previous value with a newly computed value."},{"term":"Accumulation","desc":"Repeatedly updating a running total such as total = total + x."},{"term":"Input-before-processing","desc":"Reading data before attempting calculations that depend on it."},{"term":"Output-after-processing","desc":"Displaying the computed result after the relevant calculation."},{"term":"Trace","desc":"Recording changing variable values as statements run."}],"points":[{"title":"Execution order","text":"In a sequence, statements execute in their specified order unless another control structure changes the flow. The order matters when values change."},{"title":"Variables and assignments","text":"An assignment replaces a variable’s current value. If x starts at 4 and then x = x + 3, a later output of x is 7; outputting before the assignment gives the earlier value."},{"title":"Design and read code","text":"Identify what is input, what each line changes, and which line outputs the result. Trace consecutive lines using a table when needed."},{"title":"Execution order","text":"Sequence executes statements top to bottom unless a function call or control structure changes the path. Example: x=2; x=x+3; x=x*4; print(x) outputs 20. Reordering the assignments produces a different value. Track each line with an updated variable table rather than calculating all operations simultaneously."},{"title":"Assignments and input","text":"In Python, '=' stores the value of the right-hand expression in the variable on the left. User input obtained from input() is text (str), so use int() or float() conversion before numerical arithmetic; conversion can fail if text is not a valid number. Output via print() can combine text and variables."},{"title":"Order of operations and state","text":"Arithmetic uses parentheses, exponentiation, multiplication/division, then addition/subtraction, with operation-specific associativity. A variable retains its latest assigned value; x=x+1 increments the previous value, it is not a mathematical equation to solve. Distinguish literals from variables and expressions."},{"title":"Common mistakes","text":"Referencing a variable before assigning it, trying to add a string and integer, overlooking indentation, and confusing print(5+2) with print('5+2'). Read exact quotation marks and operators in every code-tracing question."}],"intentions":[{"verb":"Identify","question":"Identify the exact order of execution in a short Python program.","answer":"Use exact examples and roles from the lesson. For example: Sequential execution — Performing statements in the written order, one after the previous one. Assignment — Storing a value in a variable with the = operator in Python."},{"verb":"Define","question":"Define sequence and assignment.","answer":"Use an accurate definition and a clear distinguishing feature. Sequential execution: Performing statements in the written order, one after the previous one. Also review the 'Detailed information' and original Canvas lesson for the specific terms named in the question."},{"verb":"Outline","question":"Outline a variable trace for consecutive statements.","answer":"State the main steps or features in a logical order. Execution order: In a sequence, statements execute in their specified order unless another control structure changes the flow. The order matters when values change. Variables and assignments: An assignment replaces a variable’s current value. If x starts at 4 and then x = x + 3, a later output of x is 7; outputting before the assignment gives the earlier value."},{"verb":"Explain","question":"Explain how changing the order of statements changes output.","answer":"Link the mechanism to its cause or purpose, and use the given context. Design and read code: Identify what is input, what each line changes, and which line outputs the result. Trace consecutive lines using a table when needed."}],"sourceNote":"Supplementary, independently authored exam-preparation knowledge. Original Canvas extracts appear separately below.","workshop":{"goal":"Put reading, calculation and output in dependency order.","example":"Read length and width, compute area, then print it.","trap":"Trace where a value first exists. A variable read before assignment can cause a runtime error."}},{"id":"Selection","unit":"Programming","source":"Canvas lesson PDF","terms":[{"term":"Boolean condition","desc":"A test producing either True or False."},{"term":"IF","desc":"A statement executing a branch only when its condition is true."},{"term":"ELSE","desc":"The branch that runs when earlier IF/ELIF conditions do not match."},{"term":"ELIF","desc":"Python keyword for checking another condition after an IF."},{"term":"Nested IF","desc":"A conditional statement placed inside another conditional branch."},{"term":"Comparison operator","desc":"An operator such as ==, >= or != used to compare values."},{"term":"Boolean AND","desc":"A logical operation that is True only if both operands are True."},{"term":"Boolean OR","desc":"A logical operation that is True if at least one operand is True."}],"points":[{"title":"Boolean decisions","text":"Selection chooses code based on a condition that evaluates true or false. Comparisons include equality and greater/less-than tests."},{"title":"Two-way and multiple-way choices","text":"In Python, if executes when its condition is true; else handles the remaining case. elif provides additional mutually ordered alternatives and only the first satisfied branch in a chain executes."},{"title":"Nested selection and logic","text":"Conditions can be combined with and/or/not or nested inside other branches. Check the exact boundary values when testing decisions."},{"title":"if / elif / else","text":"Python uses if for the first condition, elif for alternative conditions only when previous branches did not run, and else when no preceding conditions match. Exactly one branch of a single if/elif/else chain runs, assuming the chain is reached. Multiple independent if statements are different: more than one can run."},{"title":"Boundary and ordering traps","text":"Example: if mark>=85: High; elif mark>=50: Pass; else: Not yet. A mark of 90 takes the first branch only. If you test mark>=50 first, the >=85 branch would never be reached. Include exact equals cases in tests, and use >= if the boundary should count."},{"title":"Logical conditions","text":"and combines requirements; or allows alternatives; not reverses. Example: age>=13 and permission==True requires both parts. In Python == compares and = assigns. Logical expressions use short-circuit evaluation; sometimes the second part is not evaluated if the first already determines the result."},{"title":"Exam application","text":"For 'explain' questions, describe the possible paths and the condition that selects each. For 'debug', show a test input that demonstrates the wrong branch, then rewrite only the relevant condition/ordering. A case that works for one value is not proof of correctness."}],"intentions":[{"verb":"Identify","question":"Identify a conditional branch in Python code.","answer":"Use exact examples and roles from the lesson. For example: Boolean condition — A test producing either True or False. IF — A statement executing a branch only when its condition is true."},{"verb":"Define","question":"Define selection and Boolean condition.","answer":"Use an accurate definition and a clear distinguishing feature. Boolean condition: A test producing either True or False. Also review the 'Detailed information' and original Canvas lesson for the specific terms named in the question."},{"verb":"Outline","question":"Outline execution in an if/elif/else chain.","answer":"State the main steps or features in a logical order. Boolean decisions: Selection chooses code based on a condition that evaluates true or false. Comparisons include equality and greater/less-than tests. Two-way and multiple-way choices: In Python, if executes when its condition is true; else handles the remaining case. elif provides additional mutually ordered alternatives and only the first satisfied branch in a chain executes."},{"verb":"Explain","question":"Explain why boundary values matter when testing conditional logic.","answer":"Link the mechanism to its cause or purpose, and use the given context. Nested selection and logic: Conditions can be combined with and/or/not or nested inside other branches. Check the exact boundary values when testing decisions."}],"sourceNote":"Supplementary, independently authored exam-preparation knowledge. Original Canvas extracts appear separately below.","workshop":{"goal":"Write a Boolean condition for the exact rule and test equality.","example":"Free entry for residents aged 65 or over uses age >= 65 and resident. Test a resident who is exactly 65.","trap":"AND requires both conditions. OR changes who qualifies."}},{"id":"Repetition","unit":"Programming","source":"Canvas lesson PDF","terms":[{"term":"Iteration","desc":"Repeating a collection of instructions, also known as looping."},{"term":"Pre-test loop","desc":"A loop that evaluates its condition before executing the body, possibly zero times."},{"term":"Post-test loop","desc":"A loop that executes at least once before checking a stopping condition."},{"term":"FOR loop","desc":"A counting or sequence-iteration loop, frequently used when iterations are known."},{"term":"WHILE loop","desc":"A loop that continues as long as its condition remains True."},{"term":"Loop body","desc":"The block of statements executed each repetition."},{"term":"Termination condition","desc":"The test that eventually stops a loop."},{"term":"Infinite loop","desc":"Repetition that never reaches a stopping condition."}],"points":[{"title":"Iteration and loop body","text":"Iteration repeats a sequence of steps. The loop body is the part executed repeatedly; a termination condition determines when execution stops."},{"title":"Pre-test loops","text":"A pre-test checks its condition before entering the body. A WHILE/ENDWHILE or Python while loop may run zero times if the condition is false immediately."},{"title":"Post-test loops","text":"A post-test checks after the body, so the body executes at least once. The source contrasts pre-test and post-test explicitly."},{"title":"Counting loops","text":"A counting/for loop repeats according to a sequence or range. In Python range(1,4) produces 1, 2 and 3, not 4."},{"title":"Tracing and infinite loops","text":"Track the condition and changing variables at each iteration. If a required change never occurs, a loop may not terminate."},{"title":"for versus while","text":"A for loop repeats over a known sequence or range; a while loop repeats while a boolean condition remains true. range(5) produces 0,1,2,3,4; range(2,8,2) produces 2,4,6. A while loop needs state changes or conditions that eventually stop it unless indefinite repetition is deliberate."},{"title":"Counters and accumulators","text":"A counter increases to record how many times something happened; an accumulator stores a running total. Example: total=0; for n in [2,4,6]: total+=n; after loop total=12. An off-by-one error occurs when a boundary includes or excludes one too many items, especially with range and comparisons."},{"title":"Nested loops","text":"An inner loop completes all its iterations for each outer-loop iteration. If outer runs 3 times and inner runs 4 times, the inner body executes 12 times. Excessive nesting may increase runtime; distinguish outputs produced inside vs after loops. break exits the nearest loop, continue skips to its next iteration."},{"title":"Common defects","text":"Infinite loop: while condition never becomes false. Wrong indentation: updating the counter outside the loop can cause it. Resetting total inside a loop loses prior values. Trace first, middle and final iterations, including the final condition check. In exam scenarios, write the termination rule explicitly."}],"intentions":[{"verb":"Identify","question":"Identify pre-test, post-test and counting loops.","answer":"Use exact examples and roles from the lesson. For example: Iteration — Repeating a collection of instructions, also known as looping. Pre-test loop — A loop that evaluates its condition before executing the body, possibly zero times."},{"verb":"Define","question":"Define iteration, loop body and termination condition.","answer":"Use an accurate definition and a clear distinguishing feature. Iteration: Repeating a collection of instructions, also known as looping. Also review the 'Detailed information' and original Canvas lesson for the specific terms named in the question."},{"verb":"Outline","question":"Outline a trace table for a counting or while loop.","answer":"State the main steps or features in a logical order. Iteration and loop body: Iteration repeats a sequence of steps. The loop body is the part executed repeatedly; a termination condition determines when execution stops. Pre-test loops: A pre-test checks its condition before entering the body. A WHILE/ENDWHILE or Python while loop may run zero times if the condition is false immediately."},{"verb":"Explain","question":"Explain how a loop can execute zero times or fail to terminate.","answer":"Link the mechanism to its cause or purpose, and use the given context. Tracing and infinite loops: Track the condition and changing variables at each iteration. If a required change never occurs, a loop may not terminate."}],"sourceNote":"Supplementary, independently authored exam-preparation knowledge. Original Canvas extracts appear separately below.","workshop":{"goal":"Choose loop boundaries and place counters, accumulators and updates at the right level.","example":"Set total = 0 before the loop. Add each item inside it. Return total after the loop.","trap":"Python range excludes its stop value. An accumulator reset inside the loop loses earlier results."}},{"id":"Data Types","unit":"Programming","source":"Canvas lesson PDF","terms":[{"term":"Integer","desc":"A whole-number value stored as an int in Python, such as -3 or 17."},{"term":"Float","desc":"A numerical value that supports decimals, such as 2.75."},{"term":"String","desc":"A sequence of characters treated as text, such as \"007\"."},{"term":"Boolean","desc":"A True or False value used in conditions."},{"term":"Type conversion","desc":"Changing data from one type to another, for example int(\"14\")."},{"term":"Type error","desc":"An error caused by using an operation on incompatible data types."},{"term":"List","desc":"An ordered, mutable collection storing multiple values in Python."},{"term":"Index","desc":"A numeric position used to access an item, usually starting at 0 in Python."}],"points":[{"title":"Why types matter","text":"A data type identifies how a value can be stored and what operations make sense. Choosing the type affects accuracy and program behaviour."},{"title":"Common Python types","text":"int stores whole numbers; float stores decimal numbers; str stores text; bool stores True or False. Values that look numeric may still be strings."},{"title":"Inputs and conversions","text":"Python input() returns text; explicit conversion such as int() or float() is needed before performing numeric operations with it, where valid."},{"title":"Type decisions","text":"Select types according to purpose: age as int, measured temperature as float, name as str and a yes/no flag as bool."},{"title":"Core Python types","text":"int stores whole numbers (including negatives); float stores decimal/floating-point numbers; str stores text inside quotes; bool is True or False. list is an ordered mutable collection; tuple is ordered immutable; dict maps keys to values. Know the differences between 7, 7.0, '7' and True. The type determines valid operations."},{"title":"Conversion and input","text":"input() returns str. int('12') produces 12; float('2.5') produces 2.5; str(12) produces '12'. int('hello') raises a ValueError. A common error is '3'+'4' giving '34' while 3+4 gives 7. Use type() for checking and write conversions where needed."},{"title":"Boolean truth and comparisons","text":"Expressions such as 5>2 yield bool values. A boolean is not the string 'True'; comparisons are case-sensitive for strings. Floating point can have precision limitations, so 0.1+0.2 may not compare exactly equal to 0.3. This matters more in higher-difficulty debugging questions."},{"title":"Data appropriateness","text":"Use integer for a count, float for measurement, string for a student ID that might start with zeros, and boolean for a yes/no flag. Choice affects validation, correctness and presentation. Passwords should not be stored as plaintext regardless of type."}],"intentions":[{"verb":"Identify","question":"Identify int, float, str and bool values.","answer":"Use exact examples and roles from the lesson. For example: Integer — A whole-number value stored as an int in Python, such as -3 or 17. Float — A numerical value that supports decimals, such as 2.75."},{"verb":"Define","question":"Define data type and type conversion.","answer":"Use an accurate definition and a clear distinguishing feature. Integer: A whole-number value stored as an int in Python, such as -3 or 17. Also review the 'Detailed information' and original Canvas lesson for the specific terms named in the question."},{"verb":"Outline","question":"Outline the data types suitable for common app fields.","answer":"State the main steps or features in a logical order. Why types matter: A data type identifies how a value can be stored and what operations make sense. Choosing the type affects accuracy and program behaviour. Common Python types: int stores whole numbers; float stores decimal numbers; str stores text; bool stores True or False. Values that look numeric may still be strings."},{"verb":"Explain","question":"Explain what happens when numeric text is treated as a string.","answer":"Link the mechanism to its cause or purpose, and use the given context. Type decisions: Select types according to purpose: age as int, measured temperature as float, name as str and a yes/no flag as bool."}],"sourceNote":"Supplementary, independently authored exam-preparation knowledge. Original Canvas extracts appear separately below.","workshop":{"goal":"Select representations that preserve meaning and convert input before arithmetic.","example":"Store locker code \"007\" as a string, a closed/open state as a Boolean and 12.5 cm as a float.","trap":"input() returns text. Convert a numeric entry when the task requires arithmetic."}},{"id":"Data Operators","unit":"Programming","source":"Canvas lesson PDF","terms":[{"term":"Floor division //","desc":"Division rounding down to the nearest integer (toward negative infinity)."},{"term":"Modulo %","desc":"An operation returning the remainder after integer division."},{"term":"Exponentiation **","desc":"An operator raising a value to a power."},{"term":"Equality ==","desc":"A comparison checking whether two values are equal."},{"term":"Inequality !=","desc":"A comparison checking whether two values differ."},{"term":"Greater-or-equal >=","desc":"A comparison testing whether the left value is at least the right value."},{"term":"Logical NOT","desc":"A Boolean operation that reverses True and False."},{"term":"Operator precedence","desc":"The rules governing the order in which expressions are evaluated."}],"points":[{"title":"Arithmetic operations","text":"Python uses +, -, *, /; // is floor division, % gives remainder and ** raises to a power. Parentheses clarify order of operations."},{"title":"Relational operations","text":"Python tests equality with ==, inequality with !=, and comparisons with <, <=, >, >=. = is assignment, not an equality comparison in Python."},{"title":"Logical operations","text":"and requires both conditions true; or requires at least one true; not reverses a Boolean result. Parentheses help show combined test conditions."},{"title":"Apply, do not just name","text":"For age checks, threshold scores or validation, use the correct operator and trace true/false conditions at the boundary."},{"title":"Arithmetic operators","text":"+ add, - subtract, * multiply, / true division, // floor division, % remainder, ** power. In Python, 7/2=3.5, 7//2=3 and 7%2=1. For negatives, // rounds toward negative infinity; e.g. -7//2=-4. Use brackets to make complex arithmetic readable."},{"title":"Comparison and logic","text":"== equals; != not equal; >/< greater/less; >=/<= include equality. and, or, not work with truth values. The statement 4<5 and 9<3 is False because both must be true. In code, x=5 stores 5 and x==5 tests equality. Missing the second '=' is a frequent exam mistake."},{"title":"String and assignment operators","text":"'ab'+'cd' becomes 'abcd' (concatenation); 'ha'*3 becomes 'hahaha'. += updates a variable (x+=2 is similar to x=x+2). Order of operations matters: multiplication happens before addition unless parentheses change it. Be careful with mixing numeric and string data."},{"title":"Exam calculation checks","text":"To trace expression (14%5)*2+3, find remainder 4, multiply 8, add 3 → 11. To test parity, n%2==0 identifies even integers. For loops, n//10 can remove the last decimal digit for nonnegative integers; n%10 returns the last digit."}],"intentions":[{"verb":"Identify","question":"Identify arithmetic, relational and logical operators in a snippet.","answer":"Use exact examples and roles from the lesson. For example: Floor division // — Division rounding down to the nearest integer (toward negative infinity). Modulo % — An operation returning the remainder after integer division."},{"verb":"Define","question":"Define ==, !=, %, //, and, or and not.","answer":"Use an accurate definition and a clear distinguishing feature. Floor division //: Division rounding down to the nearest integer (toward negative infinity). Also review the 'Detailed information' and original Canvas lesson for the specific terms named in the question."},{"verb":"Outline","question":"Outline how a condition combining multiple tests evaluates.","answer":"State the main steps or features in a logical order. Arithmetic operations: Python uses +, -, *, /; // is floor division, % gives remainder and ** raises to a power. Parentheses clarify order of operations. Relational operations: Python tests equality with ==, inequality with !=, and comparisons with <, <=, >, >=. = is assignment, not an equality comparison in Python."},{"verb":"Explain","question":"Explain the difference between assignment and comparison in Python.","answer":"Link the mechanism to its cause or purpose, and use the given context. Apply, do not just name: For age checks, threshold scores or validation, use the correct operator and trace true/false conditions at the boundary."}],"sourceNote":"Supplementary, independently authored exam-preparation knowledge. Original Canvas extracts appear separately below.","workshop":{"goal":"Trace precedence, comparisons and remainder with explicit intermediate values.","example":"17 // 5 is 3 and 17 % 5 is 2. Use n % 2 == 0 to test whether an integer is even.","trap":"= assigns a value and == compares values. Check parentheses when AND and OR are mixed."}},{"id":"Basic Programming Concepts","unit":"Programming","source":"Canvas lesson PDF","terms":[{"term":"Function","desc":"A named, reusable block of code that performs a task and may produce a result."},{"term":"Parameter","desc":"A variable named in a function definition that receives supplied data."},{"term":"Argument","desc":"A value passed into a function call."},{"term":"Return value","desc":"Data sent from a function back to its caller."},{"term":"Built-in function","desc":"A predefined Python function such as len(), sum() or print()."},{"term":"Input function","desc":"Python input() reads user input and returns a string."},{"term":"Type-casting function","desc":"A function like int() or float() that converts compatible values."},{"term":"Comment","desc":"Explanatory source text ignored by Python, introduced by #."}],"points":[{"title":"Input and output functions","text":"Built-in functions receive data and can produce results. Python input() receives text from a user and print() displays output."},{"title":"Other functions in the class text","text":"The lesson covers mathematical functions, string-handling functions and the distinction between collecting input and presenting output."},{"title":"Functions and reusable subprograms","text":"Functions package a task, may accept parameters and may return a result. They reduce repetition and make code easier to test and reuse."},{"title":"Documentation and meaning","text":"Use meaningful names and appropriate comments or documentation so another programmer can understand the purpose of code."},{"title":"Variables, constants and identifiers","text":"Variables name stored values and may change during execution; a constant is intended not to change (Python often uses uppercase naming by convention). Meaningful identifiers improve readability; keywords such as for cannot be variable names. Comments beginning with # explain purpose; they do not run as instructions."},{"title":"Functions and parameters","text":"A function groups reusable steps under a name. def area(w,h): return w*h defines a function with two parameters; area(3,4) passes arguments and yields 12. return sends a value to the caller; print displays a value and typically does not return the computed result. A function can be invoked many times with different data."},{"title":"Scope, documentation and style","text":"Local variables created inside a function are generally local to that function. Avoid relying on accidental global variables; use parameters and return values where possible. Consistent naming, indentation and a short explanatory comment for a complex decision make testing and debugging easier."},{"title":"Errors and debugging","text":"Syntax error violates Python grammar; runtime error happens during execution (e.g. divide by zero); logic error executes but produces the wrong answer (e.g. incorrect threshold). Read error messages, reproduce the issue with a small test, isolate one change and rerun. A program that launches is not necessarily correct."}],"intentions":[{"verb":"Identify","question":"Identify input, output, mathematics and string functions.","answer":"Use exact examples and roles from the lesson. For example: Function — A named, reusable block of code that performs a task and may produce a result. Parameter — A variable named in a function definition that receives supplied data."},{"verb":"Define","question":"Define function and parameter.","answer":"Use an accurate definition and a clear distinguishing feature. Function: A named, reusable block of code that performs a task and may produce a result. Also review the 'Detailed information' and original Canvas lesson for the specific terms named in the question."},{"verb":"Outline","question":"Outline how a function accepts an input and produces a result.","answer":"State the main steps or features in a logical order. Input and output functions: Built-in functions receive data and can produce results. Python input() receives text from a user and print() displays output. Other functions in the class text: The lesson covers mathematical functions, string-handling functions and the distinction between collecting input and presenting output."},{"verb":"Explain","question":"Explain how functions and documentation aid modular programming.","answer":"Link the mechanism to its cause or purpose, and use the given context. Documentation and meaning: Use meaningful names and appropriate comments or documentation so another programmer can understand the purpose of code."}],"sourceNote":"Supplementary, independently authored exam-preparation knowledge. Original Canvas extracts appear separately below.","workshop":{"goal":"Follow assignment and explain how callers reuse a returned result.","example":"In total = subtotal + fee, Python evaluates the right side before changing total.","trap":"print shows information. return passes a value back to a caller for reuse."}},{"id":"Data Structures","unit":"Programming","source":"Canvas lesson PDF","terms":[{"term":"Array/list","desc":"An ordered collection of elements accessed by position; Python commonly uses lists."},{"term":"Dictionary","desc":"A Python mapping of keys to values, written with curly braces."},{"term":"Tuple","desc":"An ordered collection whose items cannot be reassigned after creation."},{"term":"Indexing","desc":"Accessing one item of a sequence using its zero-based position."},{"term":"Append","desc":"A list operation that adds an item to the end of a list."},{"term":"Iteration over collection","desc":"Processing elements of a sequence using a loop."},{"term":"Key-value pair","desc":"A dictionary entry associating a key with its stored value."},{"term":"Mutable structure","desc":"A collection that can be changed after creation, such as a list."}],"points":[{"title":"Arrays and Python lists","text":"An array/list holds related values in an ordered collection. Python list indexing begins at zero; list elements can be accessed, changed or iterated over."},{"title":"Records and dictionaries","text":"A record groups different fields about an entity. In Python a dictionary holds key/value associations, such as name and score, and supports lookup by key."},{"title":"Files and persistence","text":"A file stores data for later use. The Canvas source includes ideas about opening files for appending, writing lines and closing files."},{"title":"Search, list and nested structures","text":"The lesson explores listing, searching and combining data structures. Read each index or key carefully, especially when structures are nested."},{"title":"Lists","text":"A Python list is ordered and mutable, written [2,4,6]. Index positions start at 0, so values[1] is 4 and values[-1] is the final element. append adds an item, len returns length, and for item in values iterates through elements. Attempting to access beyond a list's valid indices raises IndexError."},{"title":"Tuples, dictionaries and sets","text":"Tuple: ordered and normally immutable, e.g. (3,4). Dictionary: key–value collection, e.g. {'name':'Ada','score':9}, accessed by dictionary keys; in modern Python iteration preserves insertion order, but lookup is by key. Set: unordered collection of unique values for membership and removing duplicates. Choose structures based on intended operations."},{"title":"Tabular data and records","text":"Records can be represented as dictionaries and lists of dictionaries. For example, students=[{'name':'A','mark':82},{'name':'B','mark':45}]; iterate through records and use keys. A 2D list may represent rows/columns for a grid. Be careful not to confuse list indexing with dictionary key lookup."},{"title":"Choosing a structure","text":"A roster is a list; a fixed coordinate may be a tuple; a mapping from username to score is a dictionary; unique club members may be a set. For high marks state ordering, uniqueness, editability and lookup requirements, not just the structure's name."}],"intentions":[{"verb":"Identify","question":"Identify a list, dictionary/record and file in a code example.","answer":"Use exact examples and roles from the lesson. For example: Array/list — An ordered collection of elements accessed by position; Python commonly uses lists. Dictionary — A Python mapping of keys to values, written with curly braces."},{"verb":"Define","question":"Define array/list, record and file.","answer":"Use an accurate definition and a clear distinguishing feature. Array/list: An ordered collection of elements accessed by position; Python commonly uses lists. Also review the 'Detailed information' and original Canvas lesson for the specific terms named in the question."},{"verb":"Outline","question":"Outline a search or iteration through a list.","answer":"State the main steps or features in a logical order. Arrays and Python lists: An array/list holds related values in an ordered collection. Python list indexing begins at zero; list elements can be accessed, changed or iterated over. Records and dictionaries: A record groups different fields about an entity. In Python a dictionary holds key/value associations, such as name and score, and supports lookup by key."},{"verb":"Explain","question":"Explain when a dictionary is more useful than a simple list.","answer":"Link the mechanism to its cause or purpose, and use the given context. Search, list and nested structures: The lesson explores listing, searching and combining data structures. Read each index or key carefully, especially when structures are nested."}],"sourceNote":"Supplementary, independently authored exam-preparation knowledge. Original Canvas extracts appear separately below.","workshop":{"goal":"Read, update and append to a list, and choose an index boundary that avoids errors.","example":"In [12, 15, 18], index 1 is 15. Assigning to index 1 replaces it. append(20) instead adds a fourth element.","trap":"A list of length n has indices 0 through n−1. “Second item” means index 1."}},{"id":"Desk Checking and Sub-programs","unit":"Programming","source":"Canvas lesson PDF","terms":[{"term":"Desk checking","desc":"Manually stepping through an algorithm while tracking variables and outputs."},{"term":"Trace table","desc":"A table recording the state of variables at key points in an algorithm."},{"term":"Dry run","desc":"A manual simulation of program execution before or alongside actual testing."},{"term":"Subprogram","desc":"A reusable function, procedure or subroutine called by a larger program."},{"term":"Procedure","desc":"A subprogram primarily carrying out actions rather than returning a value."},{"term":"Function call","desc":"The expression or statement that invokes a named reusable block."},{"term":"Local variable","desc":"A variable used inside a function with a scope limited to that function."},{"term":"Test data","desc":"Inputs selected to reveal whether code behaves as expected."}],"points":[{"title":"Desk checking","text":"Desk checking is manually simulating the execution of an algorithm with a pen-and-paper trace table. Record variables and change their values in execution order."},{"title":"Why trace multiple paths","text":"Try cases that trigger different selection paths, loop counts and boundary values. Desk checking can reveal mistakes but cannot guarantee the program has none."},{"title":"Subprograms and functions","text":"Breaking a problem into reusable functions makes programs modular. Trace values passed to parameters, local changes and returned values."},{"title":"Independent checking","text":"The lesson notes that checking by someone other than the author can reveal assumptions that the original programmer overlooks."},{"title":"Desk checking","text":"Desk checking manually simulates an algorithm line by line before or without running it. Create columns for step, variables, conditions, printed output and any relevant loop iteration. Update values in execution order and clearly note whether a branch was taken. This catches logic errors that are invisible to syntax checkers."},{"title":"Sub-programs / functions","text":"A sub-program divides a larger task into reusable, independently testable pieces. Parameters receive input; return values supply results to calling code. In Python, def calculate_tax(income): ...; return tax is a function, while print(tax) only displays. Decomposition supports reuse, readability, maintainability and separate tests."},{"title":"Trace and test","text":"For function double(x): return x*2, the call double(5) evaluates to 10. For functions that modify a local counter, do not assume the original variable outside always changes. Desk-check expected values for normal, boundary and invalid cases. Note function-call order when a function calls another."},{"title":"Debugging worksheet","text":"Record actual and expected output, input chosen, variable trace and location of divergence. Fix the first incorrect step, then rerun previous tests. In 'outline' questions, list the stages; in 'explain', give a causal reason why desk checking reveals the bug."}],"intentions":[{"verb":"Identify","question":"Identify variable changes in a trace table.","answer":"Use exact examples and roles from the lesson. For example: Desk checking — Manually stepping through an algorithm while tracking variables and outputs. Trace table — A table recording the state of variables at key points in an algorithm."},{"verb":"Define","question":"Define desk checking and subprogram.","answer":"Use an accurate definition and a clear distinguishing feature. Desk checking: Manually stepping through an algorithm while tracking variables and outputs. Also review the 'Detailed information' and original Canvas lesson for the specific terms named in the question."},{"verb":"Outline","question":"Outline how to trace multiple paths through a program.","answer":"State the main steps or features in a logical order. Desk checking: Desk checking is manually simulating the execution of an algorithm with a pen-and-paper trace table. Record variables and change their values in execution order. Why trace multiple paths: Try cases that trigger different selection paths, loop counts and boundary values. Desk checking can reveal mistakes but cannot guarantee the program has none."},{"verb":"Explain","question":"Explain why independent desk checking may expose hidden assumptions.","answer":"Link the mechanism to its cause or purpose, and use the given context. Independent checking: The lesson notes that checking by someone other than the author can reveal assumptions that the original programmer overlooks."}],"sourceNote":"Supplementary, independently authored exam-preparation knowledge. Original Canvas extracts appear separately below.","workshop":{"goal":"Trace parameters, state, condition outcomes and output; show one row per meaningful change.","example":"Calling double(6) supplies argument 6 to parameter n. The function returns 12. The caller can add 1 and store 13.","trap":"The argument is supplied in the call. The parameter is the receiving name in the definition."}},{"id":"Unit Testing and Error Detection","unit":"Programming","source":"Exam guide / related modules (lesson text not provided)","terms":[{"term":"Unit test","desc":"A focused check that a small function or component returns its expected result."},{"term":"Expected result","desc":"The value or behaviour a test case predicts for a particular input."},{"term":"Actual result","desc":"The behaviour observed when a test is executed."},{"term":"Boundary test","desc":"Checking values at and around a decision limit."},{"term":"Syntax error","desc":"Code that violates the programming language's grammatical rules."},{"term":"Runtime error","desc":"An error that occurs during execution, such as division by zero."},{"term":"Logic error","desc":"Code that runs but produces an unintended result."},{"term":"Regression test","desc":"A previous test rerun to ensure a new change has not broken old functionality."}],"points":[{"title":"Source limitation","text":"The exported Canvas page contains only its heading and a link, not the lesson content. This section is a study supplement informed by the exam notification, not a reproduction of the lesson."},{"title":"Test a unit","text":"Unit tests check a small independent part of a program against expected behaviour. Include normal inputs, boundary values and invalid input where appropriate."},{"title":"Common error classes","text":"Syntax errors prevent proper parsing; runtime errors occur during execution; logic errors produce an unintended result even if the program runs."},{"title":"Use expected and actual output","text":"A good test case documents inputs, expected outputs, actual outputs and whether the test passes. Fix the cause and rerun affected tests."},{"title":"Unit tests vs integration tests","text":"A unit test checks one small component, e.g. a function calculating a grade, with known inputs and expected results. Integration testing checks whether components work together, such as a user interface correctly passing a mark to the grade function. System testing assesses the whole working product. A test passing for one input does not prove all inputs are safe."},{"title":"Test-case design","text":"Typical data tests common valid values; boundary tests check limits exactly on, just below and just above a threshold; invalid tests check disallowed types/ranges. Example for pass threshold 50: test 49, 50 and 51 plus nonnumeric input. Each test case needs input, expected output, actual output and pass/fail result."},{"title":"Errors to distinguish","text":"Syntax errors prevent valid parsing; runtime exceptions occur during execution; logic errors produce incorrect results while code still runs. Syntax examples include missing colon; runtime include ZeroDivisionError; logic include using > instead of >=. A strong response states which type applies and how to find or fix it."},{"title":"Automated tests","text":"In Python, assert sum([2,3])==5 checks a condition and raises AssertionError if it fails. Modern test frameworks can organise many assertions, but clear inputs and expected values matter more than framework names at Year 9. Test expected behaviour and unexpected inputs rather than writing tests that always pass."},{"title":"Regression testing","text":"After correcting a bug, rerun prior successful tests to ensure the fix has not introduced another error. Keep a test log linking requirements to test cases. This material supplements a Canvas page export that contained only a title/link."}],"intentions":[{"verb":"Identify","question":"Identify normal, boundary and invalid test inputs.","answer":"Use exact examples and roles from the lesson. For example: Unit test — A focused check that a small function or component returns its expected result. Expected result — The value or behaviour a test case predicts for a particular input."},{"verb":"Define","question":"Define unit testing and a logic error.","answer":"Use an accurate definition and a clear distinguishing feature. Unit test: A focused check that a small function or component returns its expected result. Also review the 'Detailed information' and original Canvas lesson for the specific terms named in the question."},{"verb":"Outline","question":"Outline a test table with expected and actual outputs.","answer":"State the main steps or features in a logical order. Source limitation: The exported Canvas page contains only its heading and a link, not the lesson content. This section is a study supplement informed by the exam notification, not a reproduction of the lesson. Test a unit: Unit tests check a small independent part of a program against expected behaviour. Include normal inputs, boundary values and invalid input where appropriate."},{"verb":"Explain","question":"Explain how a test result can isolate a defect.","answer":"Link the mechanism to its cause or purpose, and use the given context. Use expected and actual output: A good test case documents inputs, expected outputs, actual outputs and whether the test passes. Fix the cause and rerun affected tests."}],"sourceNote":"Supplementary, independently authored exam-preparation knowledge. Original Canvas extracts appear separately below.","workshop":{"goal":"Design normal, boundary and invalid cases and state the expected result before execution.","example":"For speed > 40, test 39, 40 and 41. Expect no warning at 39 and 40, then a warning at 41.","trap":"A test with input alone cannot tell you whether the observed result is correct."}},{"id":"Error Correction","unit":"Programming","source":"Exam guide / related modules (lesson text not provided)","terms":[{"term":"Debugging","desc":"Locating, understanding and correcting defects in an algorithm or program."},{"term":"Reproduce error","desc":"Follow consistent input and steps to make an observed fault happen again."},{"term":"Isolate cause","desc":"Narrow testing to the smallest code region responsible for incorrect behaviour."},{"term":"Syntax correction","desc":"Fixing punctuation, indentation or structure so the program can execute."},{"term":"Logic correction","desc":"Changing program decisions or calculations so output matches the requirement."},{"term":"Retest","desc":"Running tests again after making a correction."},{"term":"Print tracing","desc":"Temporarily displaying variable values to understand what code is doing."},{"term":"Test report","desc":"A record of input, expected output, actual output and whether a test passes."}],"points":[{"title":"Source limitation","text":"The exported Canvas page contains only its heading and a link, not the lesson content. This section is supplementary rather than claimed class content."},{"title":"A disciplined correction cycle","text":"Reproduce the failure, read the error or observe the wrong output, isolate the smallest likely section, revise it and run tests again."},{"title":"Different mistakes require different fixes","text":"Syntax problems require valid code structure; logic problems require correcting conditions or calculations; runtime problems need handling of invalid states or operations."},{"title":"Debugging workflow","text":"Reproduce the error; observe expected and actual result; classify the error; isolate the smallest relevant part; inspect values using a trace table or debugger; make a minimal change; retest the failing case; run regression tests. Avoid changing many unrelated lines at once or assuming the last line printed is the problem."},{"title":"Reading error messages","text":"NameError often means a variable name is undefined; TypeError means a value is used with an incompatible operation; ValueError often means a suitable type was supplied but its value is invalid for conversion; IndexError is a sequence index outside range; ZeroDivisionError means dividing by zero. The displayed line may be where failure appears, not where the underlying incorrect data originated."},{"title":"Fixing logic","text":"A loop that runs one iteration too many may use <= instead of <. A pass threshold error may use >50 rather than >=50. A counter may reset inside a loop. Explain why the corrected expression changes behaviour for a concrete boundary input, then add that input to tests."},{"title":"Handling unexpected input","text":"Validate numeric values with appropriate exception handling (try/except ValueError) where taught, check list length before indexing and use safe defaults only when appropriate. Error handling improves user experience but must not conceal serious data problems. Document the original defect and its correction."}],"intentions":[{"verb":"Identify","question":"Identify syntax, runtime and logic errors.","answer":"Use exact examples and roles from the lesson. For example: Debugging — Locating, understanding and correcting defects in an algorithm or program. Reproduce error — Follow consistent input and steps to make an observed fault happen again."},{"verb":"Define","question":"Define debugging and correction.","answer":"Use an accurate definition and a clear distinguishing feature. Debugging: Locating, understanding and correcting defects in an algorithm or program. Also review the 'Detailed information' and original Canvas lesson for the specific terms named in the question."},{"verb":"Outline","question":"Outline a reproducible debug-and-retest process.","answer":"State the main steps or features in a logical order. Source limitation: The exported Canvas page contains only its heading and a link, not the lesson content. This section is supplementary rather than claimed class content. A disciplined correction cycle: Reproduce the failure, read the error or observe the wrong output, isolate the smallest likely section, revise it and run tests again."},{"verb":"Explain","question":"Explain why retesting is necessary after changing code.","answer":"Link the mechanism to its cause or purpose, and use the given context. Different mistakes require different fixes: Syntax problems require valid code structure; logic problems require correcting conditions or calculations; runtime problems need handling of invalid states or operations."}],"sourceNote":"Supplementary, independently authored exam-preparation knowledge. Original Canvas extracts appear separately below.","workshop":{"goal":"Classify the failure, identify the cause, fix it and rerun the revealing test.","example":"A return inside a sum loop returns after the first item. Move return outside the loop and retest [3,4,5] and an empty list.","trap":"A wrong result can occur even when the programme runs without an exception."}},{"id":"Mechatronic Systems","unit":"Mechatronics","source":"Canvas lesson PDF","terms":[{"term":"Mechatronic system","desc":"A system combining mechanical engineering, electronics and computing to perform tasks."},{"term":"Degree of freedom","desc":"One independent linear or rotational movement available to a robot."},{"term":"Pick-and-place movement","desc":"Robot motion between loading and placing positions, often used in repetitive assembly."},{"term":"Point-to-point motion","desc":"Movement between programmed locations, suitable for operations such as spot welding."},{"term":"Contouring","desc":"Continuous programmed motion along a smooth path, used in tasks such as spray painting."},{"term":"Industrial robot","desc":"A programmable machine used for operations like welding, assembly or materials handling."},{"term":"Robotic end effector","desc":"A tool at the working end of a robot, such as a gripper or welding head."},{"term":"Stationary robot","desc":"A robot fixed to a location while an arm manipulates objects in its work area."}],"points":[{"title":"What mechatronics combines","text":"Mechatronic systems integrate mechanical components, electronics, computer control and often sensors/actuators so that hardware can perform a task."},{"title":"Real-world uses","text":"Industrial and service robots, manufacturing devices and automated mechanisms are examples. Describe what a specific system senses, processes and physically does."},{"title":"Design principles and impacts","text":"System design needs to consider intended users, how movement is controlled, suitable components, safe operation and effects on people."},{"title":"What is mechatronics?","text":"Mechatronics combines mechanics, electronics, sensors, control systems and software to make devices that detect conditions and perform physical actions. Examples include automatic doors, robotic arms, factory sorting machines and assistive devices. A mechatronic device uses inputs, processing/control logic, actuators and feedback to perform a task."},{"title":"Input–process–output–feedback","text":"Sensors measure the environment (light, distance, temperature, rotation). Controller software reads signals, applies rules or control algorithms, and commands actuators such as motors, servos or buzzers. Feedback measures the result so the controller can correct errors. Example: a line-following robot senses line position, chooses wheel speeds, moves, senses again and continuously adjusts."},{"title":"Open-loop versus closed-loop","text":"Open-loop control gives commands without measuring the outcome (run motor for two seconds). Closed-loop control measures output and adjusts based on error (turn until a rotation sensor reports 90°). Closed-loop systems can handle disturbances better but need additional sensors and robust control. A sensor simply existing does not make a system closed-loop unless readings influence commands."},{"title":"Safety, constraints and validation","text":"Functional requirements describe actions (stop near obstacles); nonfunctional requirements describe accuracy, speed, battery life, reliability and safety. Consider moving-part hazards, safe voltages, stable structures, emergency stops and human oversight. Use controlled classroom demonstrations rather than unsafe unsupervised machinery."}],"intentions":[{"verb":"Identify","question":"Identify mechanical, electronic and control elements in a robot.","answer":"Use exact examples and roles from the lesson. For example: Mechatronic system — A system combining mechanical engineering, electronics and computing to perform tasks. Degree of freedom — One independent linear or rotational movement available to a robot."},{"verb":"Define","question":"Define a mechatronic system.","answer":"Use an accurate definition and a clear distinguishing feature. Mechatronic system: A system combining mechanical engineering, electronics and computing to perform tasks. Also review the 'Detailed information' and original Canvas lesson for the specific terms named in the question."},{"verb":"Outline","question":"Outline how sensors, controllers and actuators interact.","answer":"State the main steps or features in a logical order. What mechatronics combines: Mechatronic systems integrate mechanical components, electronics, computer control and often sensors/actuators so that hardware can perform a task. Real-world uses: Industrial and service robots, manufacturing devices and automated mechanisms are examples. Describe what a specific system senses, processes and physically does."},{"verb":"Explain","question":"Explain one real-world benefit or design issue in automation.","answer":"Link the mechanism to its cause or purpose, and use the given context. Design principles and impacts: System design needs to consider intended users, how movement is controlled, suitable components, safe operation and effects on people."}],"sourceNote":"Supplementary, independently authored exam-preparation knowledge. Original Canvas extracts appear separately below.","workshop":{"goal":"Trace a complete sensor–controller–actuator chain and identify feedback.","example":"A temperature sensor reads the room, a controller compares the reading to a set point and a motor drives a fan. Later readings inform the next decision.","trap":"Actuators act on the physical system. Sensors provide measurements."}},{"id":"Automation","unit":"Mechatronics","source":"Canvas lesson PDF","terms":[{"term":"Automated control","desc":"A system that senses and makes adjustments to achieve a desired result with limited human input."},{"term":"Autonomous control","desc":"A system able to make operational decisions and act without ongoing direct human instructions."},{"term":"Human control","desc":"A system where a person directly provides operating commands."},{"term":"Set point","desc":"The desired target value, such as a programmed room temperature."},{"term":"Feedback loop","desc":"Repeatedly measuring output or state and adjusting operation according to the result."},{"term":"Open-loop control","desc":"Executing commands without measuring whether the desired result was achieved."},{"term":"Closed-loop control","desc":"Using sensor feedback to adjust actions toward a target."},{"term":"Thermostat","desc":"A controller that compares measured temperature with a target and turns heating or cooling on or off."},{"term":"Mobile robot","desc":"A robot able to move around its environment rather than being fixed in one place."}],"points":[{"title":"Human control and autonomous control","text":"A human-controlled system is directed by a person; an autonomous system uses programmed decisions and sensing to carry out activities with less continuous intervention."},{"title":"Reasons for automation","text":"The lesson discusses performing repetitive, dangerous, dirty and sometimes otherwise impractical tasks. Evaluate efficiency and consistency alongside cost, reliability and workforce effects."},{"title":"Robot categories and evolution","text":"The class material identifies industrial, mobile, educational and domestic robots. System design has evolved with human needs, technology and new opportunities."},{"title":"Feedback and control","text":"A control system reads its inputs, processes a rule or target, and commands actuators. A closed-loop system uses feedback measurements to adjust its output; a simple open-loop command does not measure whether the target was reached."},{"title":"Automated control vs autonomy","text":"Automation uses rules and equipment to perform tasks with reduced ongoing human intervention. Autonomy describes systems that can make certain decisions under changing conditions; not every automated device is intelligent or uses AI. A timer-driven sprinkler is automated but might not measure soil moisture; a sensor-controlled system can respond to conditions."},{"title":"Closed loop and set point","text":"In a simple feedback controller, a sensor measures the process variable, compares it with a desired set point, computes an error and adjusts an actuator. In a heater, a temperature below the target causes heating to turn on, and readings repeatedly update the decision. Hysteresis (different on/off thresholds) can stop rapid switching near a target."},{"title":"Industrial applications","text":"Automated warehouses, car assembly, agriculture and manufacturing use sensors, actuators and controllers to improve consistency, safety and throughput. Risks include equipment costs, maintenance, loss of flexibility, employment change and security vulnerabilities. Weigh benefits and consequences for workers, customers and owners."},{"title":"Sensors, decision, action","text":"An automatic door senses a person, checks movement and safety conditions, drives a motor to open, then uses timing/position feedback to close safely. A high-quality algorithm must include what happens if the sensor fails or an obstacle appears. Distinguish trigger, rule, actuator, feedback and fail-safe."},{"title":"Extension: control tuning","text":"Proportional control makes correction roughly proportional to error; PID adds integral and derivative behaviour to manage steady error and overshoot. You generally do not need PID equations for this exam, but describing feedback, delay and overshoot can strengthen evaluation."}],"intentions":[{"verb":"Identify","question":"Identify human-controlled and autonomous systems.","answer":"Use exact examples and roles from the lesson. For example: Automated control — A system that senses and makes adjustments to achieve a desired result with limited human input. Autonomous control — A system able to make operational decisions and act without ongoing direct human instructions."},{"verb":"Define","question":"Define automation and feedback control.","answer":"Use an accurate definition and a clear distinguishing feature. Automated control: A system that senses and makes adjustments to achieve a desired result with limited human input. Also review the 'Detailed information' and original Canvas lesson for the specific terms named in the question."},{"verb":"Outline","question":"Outline reasons for automating dangerous, repetitive or difficult tasks.","answer":"State the main steps or features in a logical order. Human control and autonomous control: A human-controlled system is directed by a person; an autonomous system uses programmed decisions and sensing to carry out activities with less continuous intervention. Reasons for automation: The lesson discusses performing repetitive, dangerous, dirty and sometimes otherwise impractical tasks. Evaluate efficiency and consistency alongside cost, reliability and workforce effects."},{"verb":"Explain","question":"Explain one way robotics has evolved to meet a human need.","answer":"Link the mechanism to its cause or purpose, and use the given context. Feedback and control: A control system reads its inputs, processes a rule or target, and commands actuators. A closed-loop system uses feedback measurements to adjust its output; a simple open-loop command does not measure whether the target was reached."}],"sourceNote":"Supplementary, independently authored exam-preparation knowledge. Original Canvas extracts appear separately below.","workshop":{"goal":"Compare fixed commands with feedback and evaluate suitability for a repetitive process.","example":"A timer can close a valve after five minutes. A moisture-controlled valve closes when feedback shows the soil has reached its target.","trap":"Describe the repeated measurement and the subsequent action when explaining feedback."}},{"id":"Requirements","unit":"Mechatronics","source":"Canvas lesson PDF","terms":[{"term":"Sensor input","desc":"Data received about a robot's surroundings or operation."},{"term":"Storage","desc":"Holding information for later use, in memory or a physical store."},{"term":"Transmission","desc":"Transferring signals, data, power or motion among system components."},{"term":"Processing","desc":"Calculations and decisions that transform inputs into action instructions."},{"term":"Actuator output","desc":"An observable action such as motor movement or buzzer sound."},{"term":"Functional requirement","desc":"A required capability, e.g. the robot must stop when an obstacle is detected."},{"term":"Non-functional requirement","desc":"A quality constraint such as accuracy, safety, response time or reliability."},{"term":"Use case","desc":"A described sequence of interactions that achieves the user's goal."},{"term":"Test case","desc":"A defined input and expected response used to confirm a requirement."}],"points":[{"title":"Describe the task in IPO terms","text":"Describe what sensors or users input, what the controller does with that input, what must be stored or transmitted and how actuators or displays produce an output."},{"title":"Functional requirements","text":"Define the actions a system must perform, including specific use cases and tests with known input and expected output."},{"title":"Non-functional requirements","text":"State measurable quality constraints such as safety, response speed, reliability, size, energy use and ease of use."},{"title":"Test against the brief","text":"Good requirements are specific enough to test. Identify what result counts as success and how you would demonstrate it."},{"title":"User needs and success criteria","text":"Begin with a genuine user and problem; define what the automated device must do and under which conditions. Functional requirements describe measurable actions (detect obstacle and stop within a chosen safe distance). Nonfunctional requirements specify qualities (repeatability, low cost, simple controls, reliability). Design criteria must be testable, not merely 'good' or 'fast'."},{"title":"Constraints and priorities","text":"Budget, components, power supply, dimensions, available skills, time, accessibility and classroom safety influence the design. Prioritise essential requirements first, then desirable ones. Consider the use environment: lighting can affect optical sensors, rough floors affect traction, and batteries reduce in voltage as they drain."},{"title":"Testing the specification","text":"For obstacle avoidance: test detection at a range of distances, different object colours/shapes if relevant, and on changes in background conditions. Include expected result, observed result, pass/fail and recommended modification. A device that works once in ideal conditions may still fail the requirement for reliability."},{"title":"Evaluation rubric","text":"Compare final performance with each criterion, describe evidence and propose specific improvements. If turning overshoots by 12°, possible causes include wheel slip, speed, inaccurate timing and missing sensor feedback; propose calibration or a rotation sensor and then retest."}],"intentions":[{"verb":"Identify","question":"Identify inputs, processes and outputs in a robot proposal.","answer":"Use exact examples and roles from the lesson. For example: Sensor input — Data received about a robot's surroundings or operation. Storage — Holding information for later use, in memory or a physical store."},{"verb":"Define","question":"Define functional and non-functional requirements for a robot.","answer":"Use an accurate definition and a clear distinguishing feature. Sensor input: Data received about a robot's surroundings or operation. Also review the 'Detailed information' and original Canvas lesson for the specific terms named in the question."},{"verb":"Outline","question":"O
