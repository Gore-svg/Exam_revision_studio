const DATA={"modules":[{"id":"Social Networks","unit":"Networks","source":"Canvas lesson PDF","terms":[{"term":"Social network","desc":"A structure of connected people, groups or organisations that communicate and interact through relationships."},{"term":"Entity","desc":"A person, group or organisation represented as a node within a social network."},{"term":"Relationship","desc":"An edge or connection between entities, such as following, friendship or a shared affiliation."},{"term":"Network event","desc":"An activity or change such as posting, messaging, joining a group or commenting."},{"term":"Digital profile","desc":"An entity's online representation, often using a username, profile information and image."},{"term":"Directed edge","desc":"A connection with direction, useful when one account follows another without being followed back."},{"term":"Community","desc":"A group of nodes with relatively many connections among themselves within a larger network."},{"term":"Sociogram","desc":"A diagram that visualises entities as nodes and their relationships as connecting lines."}],"points":[{"title":"Why people and systems connect","text":"Connections make communication, collaboration, sharing data and resources, and access to services possible. A connection is useful when its benefits to individuals or organisations solve a defined need."},{"title":"People, devices, and relationships","text":"In social network modelling, represent people or other entities as nodes and the relationships between them as edges. Describe who is connected and what the connection means before interpreting the diagram."},{"title":"Choosing a network for a real problem","text":"Identify the users, the information they need, the devices or services involved, and why connecting them makes an improvement. Compare alternatives using the needs of those users."},{"title":"Models: people, nodes, edges","text":"A social network is a system of entities (individuals, organisations or accounts) connected by relationships. In a graph, a node/vertex represents an entity; an edge represents a relationship such as following, friendship or exchanging information. A directed edge A → B shows A follows B and does not imply B follows A. An undirected edge means the connection is mutual. Weighted edges represent strength, frequency or cost, for instance messages per day."},{"title":"Reading network structure","text":"Degree is the number of connections at a node in an undirected graph. In a directed graph, in-degree counts incoming links and out-degree counts outgoing links. A hub is a highly connected node. A bridge connects communities, so removing it may separate groups; clusters/communities have many internal edges. A shortest path is a series of minimum steps between nodes. These concepts help explain how news and misinformation spread."},{"title":"Platforms, influence and algorithms","text":"Social feeds can rank or recommend content using engagement signals, network connections and inferred interests. Higher reach is not the same as reliability or accuracy. An influencer may have many followers but few genuinely interactive connections. Algorithms can amplify popular content and create feedback loops or filter bubbles. Evaluate who controls the ranking, what personal data is used, and whether bias disadvantages some people."},{"title":"Privacy and safety","text":"Profiles may expose identifiers, location, interests, relationship data and posts. Threats include impersonation, phishing, harassment, oversharing, account takeover and targeted manipulation. Reduce risk using strong unique passwords, multi-factor authentication, restricted audience settings, cautious sharing and reporting tools. An ethical design obtains informed consent, protects minors and minimises unnecessary collection."},{"title":"Exam scenario","text":"A rumour spreads quickly from one student to several friendship groups. Explain using a network model: represent students as nodes and communication links as edges; identify bridge nodes that transmit the rumour between communities; compare directed follow relationships with mutual friendships; propose verification and platform interventions. Define, explain and apply each term rather than just naming it."}],"intentions":[{"verb":"Identify","question":"Identify two reasons people connect computers or online services.","answer":"Use exact examples and roles from the lesson. For example: Social network — A structure of connected people, groups or organisations that communicate and interact through relationships. Entity — A person, group or organisation represented as a node within a social network."},{"verb":"Define","question":"Define a social network in terms of connected entities.","answer":"Use an accurate definition and a clear distinguishing feature. Social network: A structure of connected people, groups or organisations that communicate and interact through relationships. Also review the 'Detailed information' and original Canvas lesson for the specific terms named in the question."},{"verb":"Outline","question":"Outline who benefits from sharing resources through a network.","answer":"State the main steps or features in a logical order. Why people and systems connect: Connections make communication, collaboration, sharing data and resources, and access to services possible. A connection is useful when its benefits to individuals or organisations solve a defined need. People, devices, and relationships: In social network modelling, represent people or other entities as nodes and the relationships between them as edges. Describe who is connected and what the connection means before interpreting the diagram."},{"verb":"Explain","question":"Explain how a connection between people or devices solves a problem.","answer":"Link the mechanism to its cause or purpose, and use the given context. Choosing a network for a real problem: Identify the users, the information they need, the devices or services involved, and why connecting them makes an improvement. Compare alternatives using the needs of those users."}],"sourceNote":"Supplementary, independently authored exam-preparation knowledge. Original Canvas extracts appear separately below.","workshop":{"goal":"Model people and relationships; explain what the model can and cannot show.","example":"If one contact is the sole link between two groups, losing that connection stops messages travelling between them.","trap":"Degree counts direct connections. A person with few connections can still be a bridge."}},{"id":"Graph Theory","unit":"Networks","source":"Canvas lesson PDF","terms":[{"term":"Graph","desc":"A mathematical model consisting of vertices (nodes) and edges (connections)."},{"term":"Degree","desc":"The number of edges connected to a node in an undirected graph."},{"term":"Path","desc":"A sequence of adjacent nodes linked by edges."},{"term":"Shortest path","desc":"A connecting path with the fewest edges in an unweighted graph."},{"term":"Diameter","desc":"The greatest shortest-path distance between any pair of nodes in a connected graph."},{"term":"Clustering coefficient","desc":"A measure of how strongly a node's neighbours connect with one another."},{"term":"Degree centrality","desc":"A measure based on how many direct connections a node has."},{"term":"Betweenness centrality","desc":"A measure of how often a node lies on shortest paths between other nodes."},{"term":"Closeness centrality","desc":"A measure related to a node's shortest-path distances to other nodes."},{"term":"Community detection","desc":"Identifying groups of nodes that are more strongly connected internally."}],"points":[{"title":"Exam focus","text":"Count vertices and edges, find degree and trace shortest unweighted paths. A larger network need not have shorter distances. Numerical centrality formulas are optional unless specified in class."},{"title":"Vertices and edges","text":"A graph models relationships: a vertex/node stands for an entity and an edge/link represents a connection. An edge may be directed or undirected according to the relationship."},{"title":"Node degree and paths","text":"For an undirected graph, degree counts edges touching a node. A path is a sequence of adjacent connected nodes, and the shortest path is the least number of edges when all edges are treated equally. Trace the graph before calculating."},{"title":"Interpreting network structure","text":"Use connectivity, degree, shortest paths and network structure to describe which nodes connect groups, how information could travel and whether multiple routes are available."},{"title":"Social network representation","text":"A sociogram represents people as nodes and relationships as lines. Network visualisation helps identify social communities, information spread and changes in connection patterns."},{"title":"Graph representation","text":"A graph G=(V,E) contains vertices V and edges E. An undirected edge joins two vertices without direction; directed graphs use arrows. A weighted graph attaches values such as travel time, delay, distance or bandwidth cost to edges. Draw a correct graph from a table or story: include every node, connection, direction and relevant weight. A missing arrow changes the allowed routes."},{"title":"Paths, cycles and connectivity","text":"A path is a sequence of vertices connected by edges; a cycle starts and ends at the same vertex without repeating other vertices. In an unweighted graph, a shortest path minimises number of edges; in a weighted graph, the cheapest route minimises total edge weights and may use more edges. Connectivity means there is a path between vertices; a bridge is an edge whose removal would disconnect part of an undirected graph."},{"title":"Degree and network resilience","text":"Degree counts incident edges in an undirected graph. For a directed graph use in-degree and out-degree. A network with redundant paths can remain connected after one link fails, whereas a single central bridge is a failure risk. In an exam, calculate an example by listing each edge touching the node, then analyse what happens if one link is removed."},{"title":"Applications and traps","text":"Social networks use friendship/follow edges; transport networks use roads/route costs; computer networks use links or estimated latency. A star network has a central connection device and is not automatically the best in every situation. Do not assume a diagram indicates physical cable positions unless it is explicitly a physical topology; logical flow can differ."},{"title":"Extension: route algorithms","text":"Breadth-first search finds a shortest path in terms of edge count for an unweighted graph. Dijkstra's algorithm finds shortest paths with nonnegative edge weights. You do not need to memorise implementation unless taught, but understanding why minimum hops and minimum total weight can differ makes an excellent high-mark explanation."}],"intentions":[{"verb":"Identify","question":"Identify the nodes and edges in a network scenario.","answer":"Use exact examples and roles from the lesson. For example: Graph — A mathematical model consisting of vertices (nodes) and edges (connections). Degree — The number of edges connected to a node in an undirected graph."},{"verb":"Define","question":"Define degree and shortest path.","answer":"Use an accurate definition and a clear distinguishing feature. Graph: A mathematical model consisting of vertices (nodes) and edges (connections). Also review the 'Detailed information' and original Canvas lesson for the specific terms named in the question."},{"verb":"Outline","question":"Outline how to calculate degree and trace a path in an undirected graph.","answer":"State the main steps or features in a logical order. Vertices and edges: A graph models relationships: a vertex/node stands for an entity and an edge/link represents a connection. An edge may be directed or undirected according to the relationship. Node degree and paths: For an undirected graph, degree counts edges touching a node. A path is a sequence of adjacent connected nodes, and the shortest path is the least number of edges when all edges are treated equally. Trace the graph before calculating."},{"verb":"Explain","question":"Explain how a graph helps interpret or plan a real network.","answer":"Link the mechanism to its cause or purpose, and use the given context. Social network representation: A sociogram represents people as nodes and relationships as lines. Network visualisation helps identify social communities, information spread and changes in connection patterns."}],"sourceNote":"Supplementary, independently authored exam-preparation knowledge. Original Canvas extracts appear separately below.","workshop":{"goal":"Count nodes and edges, then justify a shortest path and what happens when an edge is removed.","example":"For AB, AC, BC and CD, C has degree 3. A–C–D is a shortest A-to-D route of 2 edges. Remove CD and D becomes isolated.","trap":"Count edges rather than vertices for path length. Use total weight only when the question specifies a cost."}},{"id":"Computer Networks","unit":"Networks","source":"Canvas lesson PDF","terms":[{"term":"Computer network","desc":"A group of connected devices that exchange data and share resources."},{"term":"Node","desc":"A device or point that can send, receive or forward data."},{"term":"LAN","desc":"A local area network covering a limited area, such as a school building."},{"term":"WAN","desc":"A wide area network spanning large geographical distances."},{"term":"Network topology","desc":"The arrangement of network devices and the connections between them."},{"term":"Star topology","desc":"A layout where devices connect to a central switch or other hub device."},{"term":"Client-server model","desc":"An arrangement in which a client requests resources and a server supplies them."},{"term":"Protocol","desc":"Agreed rules that allow devices to communicate correctly."},{"term":"Handshake","desc":"An initial exchange that establishes or negotiates communication settings."},{"term":"TCP/IP","desc":"The family of protocols used to support communication across interconnected networks."}],"points":[{"title":"What makes a network","text":"A network has nodes that exchange data through wired or wireless connections. Sources create or send data; sinks receive it; intermediary devices such as switches and routers can forward it. Not every node needs a direct connection to every other node if a route exists."},{"title":"LAN, WAN and VPN: distinguish them","text":"A LAN (Local Area Network) covers a limited local site, such as a school. A WAN (Wide Area Network) covers much larger geographical areas and links networks over distance. A VPN (Virtual Private Network) is a secure virtual connection across another network, not another physical size category."},{"title":"Topology: star and bus","text":"Topology is the arrangement of links and devices. In a star, devices connect to a central networking device; in a bus, devices share a common connection. Evaluate topologies by cabling, reliability, redundancy, management and security."},{"title":"Protocols and handshaking","text":"A protocol is an agreed rule for exchanging data. The lesson mentions TCP/IP, Ethernet and HTTP. Handshaking is the initial communication that establishes compatible communication rules before information is exchanged."},{"title":"Client–server requests","text":"A client such as a laptop or phone requests a service; a server supplies a resource or service if the request is accepted. Applications include websites, email, file sharing, games and databases."},{"title":"LAN, WAN, WLAN and PAN","text":"A LAN (local area network) links devices across a limited site, for example a home, lab or school campus; a WAN (wide area network) links networks over much larger areas, for example branches in different cities. The Internet is a global network of networks, not one company's LAN. A WLAN is a wireless LAN using Wi-Fi, while a PAN connects personal devices over short range, such as Bluetooth. Network size is a separate idea from whether a connection is wired or wireless."},{"title":"VLAN: the critical distinction","text":"A VLAN (virtual local area network) divides one physical switched network into separate logical Layer 2 broadcast domains. PCs can be connected to the same physical switch yet be in different VLANs. Example: staff on VLAN 10, students on VLAN 20 and guests on VLAN 30. Broadcast traffic for one VLAN normally stays inside that VLAN. To communicate between VLANs, traffic must go through a Layer 3 router or multilayer switch with appropriate rules. VLANs segment traffic and improve management; they are not encryption and are not sufficient security on their own."},{"title":"Switch ports and 802.1Q","text":"An access port normally carries one VLAN for an end-user device; a trunk port can carry multiple VLANs between switches using 802.1Q tagging. Devices in the same VLAN on different switches can communicate when properly connected and configured. If two PCs have IP addresses in different subnets, they ordinarily need Layer 3 routing to exchange IP traffic, even if they are plugged into the same hardware. Avoid the misconception that a VLAN itself provides Internet access."},{"title":"WAN vs VLAN vs VPN","text":"WAN describes geographical coverage; VLAN describes logical segmentation within switched infrastructure; VPN describes a protected virtual connection over another network (often with encryption). A company might use a WAN to connect branches, VLANs to separate staff and guest networks at each branch, and a VPN for remote workers. These terms solve different problems and are not alternatives in one classification."},{"title":"Types of computer network","text":"Client-server: client devices request services such as login, files or web pages from a server. Peer-to-peer: each connected device may share directly with peers without a dedicated central server for that resource. Central servers can simplify management, backup and permissions but introduce cost and dependencies; peer-to-peer can be simpler for a small group but harder to secure and coordinate at scale."}],"intentions":[{"verb":"Identify","question":"Identify a LAN, a WAN and a VPN in three scenarios.","answer":"LAN: small local area such as one school. WAN: large geographical coverage connecting distant networks. VPN: encrypted virtual connection across a public or shared network; it is a security/connection method, not a size class."},{"verb":"Define","question":"Define node, topology, protocol and client–server network.","answer":"Use an accurate definition and a clear distinguishing feature. Computer network: A group of connected devices that exchange data and share resources. Also review the 'Detailed information' and original Canvas lesson for the specific terms named in the question."},{"verb":"Outline","question":"Outline the exact device links in the school network-builder practical.","answer":"Internet → Firewall → Router → Switch. The first switch connects to 3 servers and a second switch. The second switch connects to two PCs and a wireless access point. The access point connects wirelessly to a laptop."},{"verb":"Explain","question":"Explain how packets move from a client through a network to a server.","answer":"The client sends a request using compatible protocols. A message is encoded and divided into addressed packets; intermediate networking devices forward them over a wired or wireless route; the server receives them and returns a response. A client–server application can use this exchange to deliver a service."}],"sourceNote":"Supplementary, independently authored exam-preparation knowledge. Original Canvas extracts appear separately below.","workshop":{"goal":"Classify LAN, WAN and WLAN from a diagram, then identify what fails when a link goes down.","example":"A school printer on the same campus can remain reachable when the WAN link to another campus fails.","trap":"A school can use a LAN locally and a WAN link to other sites at the same time."}},{"id":"LAN, WAN, WLAN, VLAN, VPN — Essential Networking","unit":"Networks","source":"AT4 VLANs · Canvas networking lessons","terms":[{"term":"LAN","desc":"Local Area Network: connects devices across a small geographic area such as one school or office."},{"term":"WAN","desc":"Wide Area Network: connects networks over large distances, often via service-provider links."},{"term":"WLAN","desc":"Wireless LAN: local networking using wireless technology such as Wi-Fi."},{"term":"VLAN","desc":"Virtual LAN: logically divides a switched network into separate Layer 2 broadcast domains."},{"term":"VPN","desc":"Virtual Private Network: protected virtual connection over another network, usually using encryption."},{"term":"Access port","desc":"Switch port normally assigned to one VLAN for an endpoint."},{"term":"Trunk port","desc":"Switch port capable of carrying traffic for multiple VLANs, typically via 802.1Q tags."},{"term":"Inter-VLAN routing","desc":"Routing between separate VLAN IP networks using a router or Layer 3 switch."},{"term":"Broadcast domain","desc":"Group of devices that receive a Layer 2 broadcast within a VLAN."},{"term":"Subnet","desc":"Logical range of IP addresses; often mapped one subnet per VLAN in a typical design."},{"term":"Default gateway","desc":"Router interface used by a host to reach destinations outside its local IP subnet."},{"term":"ACL","desc":"Access control list: rules permitting or denying specified traffic."}],"points":[{"title":"LAN vs WAN: same features at different scales","text":"LAN connects devices on one local site; a WAN connects dispersed LANs and remote resources over large areas, potentially using leased lines, fibre or carrier networks. A LAN may have a router to reach external networks; the WAN may include routers and provider infrastructure. The Internet is a worldwide network of networks, so it is usually considered an example of a global WAN-like system rather than a local network. A remote site can have its own LAN plus a WAN link to headquarters."},{"title":"WLAN and PAN are not synonyms","text":"WLAN uses Wi-Fi to provide local connectivity over radio; it remains a LAN even though there are no Ethernet cables to the clients. PAN means personal area network such as a smartphone paired with earbuds over Bluetooth. A Wi-Fi access point normally bridges wireless clients into a LAN, while the router connects that LAN to other IP networks."},{"title":"VLAN: physical vs logical networks","text":"VLANs logically divide a physical switched infrastructure. Imagine a switch with staff computers on ports 1–8 in VLAN 10 and students on ports 9–20 in VLAN 20. All devices use one switch but Layer 2 broadcasts and normal switching stay in their assigned VLAN. VLANs help separation and reduce unnecessary broadcast traffic; they do not themselves encrypt data and are not a substitute for secure access-control policy."},{"title":"Access and trunk ports","text":"An access port normally accepts/transmits untagged frames for an endpoint on one VLAN. A trunk carries several VLANs, commonly using IEEE 802.1Q VLAN tags, between switches or to a router/L3 device. You do not typically configure a standard student laptop to understand VLAN tags to join an access port. For traffic across physical switches, trunk configuration must support the required VLANs."},{"title":"Inter-VLAN routing and restrictions","text":"Separate VLANs are separate L2 broadcast domains. To exchange IP packets, their hosts normally need a router or multilayer switch with an interface for the appropriate subnets. A default gateway is the device the host uses to send packets off its own subnet. Routing might permit traffic by default unless a firewall/ACL restricts it, so 'VLAN = perfect security' is false."}],"intentions":[],"sourceNote":"Focus on network scope, wireless access, logical segmentation and VPN purpose. Port modes and tagging are optional depth.","workshop":{"goal":"Identify scope, wireless connectivity, logical grouping and tunnelling separately.","example":"The campus uses a LAN with a WLAN for tablets. A guest VLAN shares the physical switches while separating broadcast traffic. A staff VPN provides a protected tunnel from home.","trap":"A VLAN does not encrypt its traffic. Cross-group access still depends on routing and access policy."}},{"id":"Data Processing and Transmission","unit":"Networks","source":"Canvas lesson PDF","terms":[{"term":"Data compression","desc":"Reducing the number of bits needed to represent information for storage or transfer."},{"term":"Lossless compression","desc":"Compression that allows exact reconstruction of the original data, such as ZIP or PNG."},{"term":"Lossy compression","desc":"Compression that removes some data to achieve smaller files, as in JPEG or MP3."},{"term":"Codec","desc":"A method/software for encoding and decoding media data, for example H.264 video."},{"term":"Container format","desc":"A file format, such as MP4 or MKV, holding encoded video, audio and other tracks."},{"term":"Packet switching","desc":"Splitting data into packets that travel through a network and are reassembled at arrival."},{"term":"IP address","desc":"A logical address used for directing data toward a network destination."},{"term":"DNS","desc":"A service that resolves human-readable domain names to IP addresses."},{"term":"TCP","desc":"A transport protocol that provides ordered, reliable delivery of data."},{"term":"MAC address","desc":"A network interface identifier used for local-link communication."},{"term":"Routing table","desc":"Information a router uses to choose where to forward a packet."}],"points":[{"title":"Compression and transmission","text":"Compression reduces the amount of data to store or transfer. Lossless compression permits exact reconstruction; lossy compression removes some information to obtain a smaller representation. Identify where fidelity matters."},{"title":"Codec versus container","text":"A codec encodes/compresses and decodes/decompresses audio or video content; H.264 is an example given in class. A container such as MP4 or MOV packages streams such as video, audio and subtitles. The container is not itself a codec."},{"title":"Packets and packet switching","text":"A message is divided into addressed packets rather than being sent as one continuous block. Routers can forward packets along available paths; the destination reassembles them in the right order. This improves utilisation, robustness and scalability."},{"title":"IP addresses and DNS","text":"IP addresses identify network destinations for routing. DNS maps familiar domain names to IP addresses, reducing the need to remember numbers. DNS is name resolution, not a substitute for IP routing."},{"title":"TCP/IP roles and router hops","text":"In the classroom explanation, TCP segments and reassembles messages in order, IP carries source/destination addressing, routers use routing tables to choose a next hop, and MAC addressing is associated with each local link. The source describes link-layer addresses changing between hops."},{"title":"Binary, bits and bytes","text":"All digital information can be represented as bits (0/1). Eight bits = one byte. Bit rate is commonly measured in bits per second (bps), whereas file size is commonly bytes (B); Mbps is NOT the same as MB/s. Theoretical transfer time ≈ file size in bits ÷ bit rate; real throughput can be lower because of overhead, congestion and retransmission. For example, 8 MB is approximately 64 Mb (decimal units), so at 16 Mbps the ideal time is roughly 4 seconds."},{"title":"Packets and packet switching","text":"Long messages are split into packets containing payload and control information such as source/destination addressing and sequence data at relevant protocols. Routers can forward packets along paths that may vary; receivers reconstruct the stream or application data. Packet switching shares links efficiently among users and can route around faults, but delays, packet loss and out-of-order arrival must be handled. Do not say the Internet physically sends an entire document as one unbroken block."},{"title":"Processing vs transmission","text":"Processing means transforming data, such as compressing, encrypting or validating it; transmission means moving the encoded data through media. End-to-end steps: collect input → encode → optional compression/encryption → packetise → transmit → detect/correct errors or retry → decode → present output. Bandwidth is capacity; latency is time to start receiving a response; throughput is achieved delivery rate."},{"title":"Compression: lossless vs lossy","text":"Lossless compression retains every original bit of information when decompressed: suitable for text, code, data files and archival records. Lossy compression permanently removes selected information to produce smaller representations: often suitable for photos, audio and video, but repeated re-encoding can degrade quality. ZIP/PNG commonly use lossless methods; JPEG and MP3 commonly use lossy techniques. Judge the choice by quality requirements, compatibility, storage and available bandwidth."},{"title":"Codecs and file formats","text":"A codec encodes/decodes audio or video streams; containers group tracks, timing and metadata. A filename suffix alone does not prove the exact codec. Compression ratio compares original and compressed size; a 10 MB file reduced to 4 MB is 60% smaller and has original:compressed ratio 2.5:1. Choose suitable compression for a task, giving a reason about reversibility or perceived quality."}],"intentions":[{"verb":"Identify","question":"Identify two lossless and lossy situations from the lesson.","answer":"Use exact examples and roles from the lesson. For example: Data compression — Reducing the number of bits needed to represent information for storage or transfer. Lossless compression — Compression that allows exact reconstruction of the original data, such as ZIP or PNG."},{"verb":"Define","question":"Define lossless compression, lossy compression, codec and container.","answer":"Lossless compression reconstructs data exactly; lossy removes information. Codec: encodes/decodes media (e.g. H.264). Container: holds video/audio/subtitle tracks (e.g. MP4, MOV). Do not confuse a media wrapper with an encoding method."},{"verb":"Outline","question":"Outline what DNS, TCP and IP do when a website is requested.","answer":"State the main steps or features in a logical order. Compression and transmission: Compression reduces the amount of data to store or transfer. Lossless compression permits exact reconstruction; lossy compression removes some information to obtain a smaller representation. Identify where fidelity matters. Codec versus container: A codec encodes/compresses and decodes/decompresses audio or video content; H.264 is an example given in class. A container such as MP4 or MOV packages streams such as video, audio and subtitles. The container is not itself a codec."},{"verb":"Explain","question":"Explain packet switching and the route taken through routers.","answer":"Link the mechanism to its cause or purpose, and use the given context. Class practicals: Class activities include using HandBrake to inspect codec, container and compression changes; terminal traceroute; DNS activities; and Cisco Packet Tracer simulations."}],"sourceNote":"Supplementary, independently authored exam-preparation knowledge. Original Canvas extracts appear separately below.","workshop":{"goal":"Explain a transfer from name resolution to delivery and choose a suitable compression method.","example":"A client resolves a hostname with DNS. Routers forward using destination IP. If the app uses TCP, it receives ordered reliable bytes. 6 MB at 12 Mb/s ideally takes 4 s.","trap":"Convert bytes to bits. H.264 codes video while MP4 packages streams. Compression is optional."}},{"id":"Network Hardware","unit":"Networks","source":"Canvas lesson PDF","terms":[{"term":"Switch","desc":"A device that forwards frames between devices on a local network using MAC addresses."},{"term":"Router","desc":"A device that forwards IP packets between separate networks."},{"term":"Wireless access point","desc":"A device connecting Wi‑Fi clients to a wired or larger network."},{"term":"Firewall","desc":"Hardware or software that permits or blocks traffic using security rules."},{"term":"UTP Ethernet","desc":"Twisted-pair copper cable carrying electrical signals, commonly used in local networks."},{"term":"Coaxial cable","desc":"A cable with a central conductor and shielding, used in broadband and television systems."},{"term":"Optical fibre","desc":"Cable that transports data as pulses of light with high bandwidth and low interference."},{"term":"Wi‑Fi","desc":"Wireless networking using radio signals to connect devices."},{"term":"Repeater","desc":"A device that receives and retransmits a signal to extend its reach."},{"term":"Internet of Things","desc":"A network of physical devices containing sensors, controllers and connectivity."}],"points":[{"title":"Copper UTP Ethernet","text":"Unshielded twisted-pair (UTP) has four twisted pairs of copper conductors. Twisting reduces interference. A wired LAN uses these cables to connect computers, switches, access points and routers. The source gives examples of 100 Mbps and Gigabit (1000 Mbps) Ethernet."},{"title":"Coaxial versus optical fibre","text":"Coaxial cable has a central conductor, insulation and shielding; it transmits electrical signals and is used in cable/broadband systems. Optical fibre sends light through glass strands and is suited to high bandwidth and long distances with low electromagnetic interference."},{"title":"Wireless transmission media","text":"The class material covers Wi-Fi, cellular networks, satellite and Bluetooth. Compare their scale, mobility, signal transmission, coverage and purpose rather than claiming they are interchangeable."},{"title":"Switch versus router","text":"A switch connects devices within a LAN and can make forwarding choices using MAC addresses. A router connects different networks and forwards IP packets along network paths. Explain their different jobs in a school network."},{"title":"Wireless access point","text":"An access point provides a wireless connection for clients such as laptops and phones to join a local network. The access point still usually needs an upstream connection to other network equipment."},{"title":"What each device actually does","text":"Network interface card (NIC): network connection and MAC address at the link layer. Switch: forwards LAN frames primarily according to learned MAC-address tables. Router: joins IP networks and forwards packets, often acting as default gateway. Wireless access point: connects Wi-Fi clients to a LAN. Modem/ONT: interfaces with the service provider's access technology. Firewall: enforces rules to permit, block or inspect traffic. Server: provides services; client: requests them. Do not confuse a home box with one function: many combine router, switch, access point and firewall."},{"title":"MAC address vs IP address","text":"A MAC address identifies a network interface for local link delivery; IP addresses provide logical destination addressing across networks. Switches commonly learn which MAC addresses are on which ports; routers use IP routing tables. Changing Wi-Fi networks normally changes the local IP configuration without changing the hardware's physical identity (although software can randomise MAC addresses)."},{"title":"VLAN hardware setup, explained","text":"Managed switches can divide ports into VLAN 10/20/30. A staff desktop on an access port in VLAN 10 is isolated at Layer 2 from a guest desktop on VLAN 30 even if both ports are on the same switch. A tagged trunk can connect multiple VLANs between switches. Inter-VLAN routing uses a router or Layer 3 switch, and security rules should restrict access. On an unmanaged switch, normal user VLAN configuration may not be available."},{"title":"Physical transmission hardware","text":"Twisted-pair copper uses electrical impulses; common Ethernet cables use RJ45 connectors. Fibre-optic cable sends light through glass or plastic and is useful for high-bandwidth, long-distance and interference-resistant links. Wireless adapters and antennas use radio; access points manage clients and share channel resources. Hubs, unlike modern switches, repeat incoming signals to other ports, so they do not independently direct each frame to only one destination."},{"title":"Addressing and common services","text":"DHCP automatically leases network settings such as IP address, subnet mask, gateway and DNS server. DNS translates human-readable domain names to IP addresses. NAT allows many private internal addresses to share public address translation at a router. These are different services: DHCP assigns configuration; DNS resolves names; NAT translates address information. Access points do not automatically replace routers or DHCP servers."}],"intentions":[{"verb":"Identify","question":"Identify the roles of switches, routers, wireless access points and servers.","answer":"Switch forwards frames between LAN devices, using MAC addresses. Router forwards IP packets between networks. Wireless access point bridges Wi-Fi clients into a network. Server provides services/resources to clients."},{"verb":"Define","question":"Define UTP, coaxial cable and optical fibre.","answer":"Use an accurate definition and a clear distinguishing feature. Switch: A device that forwards frames between devices on a local network using MAC addresses. Also review the 'Detailed information' and original Canvas lesson for the specific terms named in the question."},{"verb":"Outline","question":"Outline how a school could connect wired computers and wireless laptops.","answer":"State the main steps or features in a logical order. Copper UTP Ethernet: Unshielded twisted-pair (UTP) has four twisted pairs of copper conductors. Twisting reduces interference. A wired LAN uses these cables to connect computers, switches, access points and routers. The source gives examples of 100 Mbps and Gigabit (1000 Mbps) Ethernet. Coaxial versus optical fibre: Coaxial cable has a central conductor, insulation and shielding; it transmits electrical signals and is used in cable/broadband systems. Optical fibre sends light through glass strands and is suited to high bandwidth and long distances with low electromagnetic interference."},{"verb":"Explain","question":"Explain how switches and routers differ when forwarding network data.","answer":"Link the mechanism to its cause or purpose, and use the given context. Hardware selection exam reasoning: When asked to justify hardware, name the devices, where they sit, their role, relevant transmission media and why the arrangement fits the number of users, coverage and reliability required."}],"sourceNote":"Supplementary, independently authored exam-preparation knowledge. Original Canvas extracts appear separately below.","workshop":{"goal":"Select devices and a transmission medium, then justify each using the scenario.","example":"A wired desktop connects through a switch. Tablets connect through a wireless access point. A router forwards traffic between IP networks. Optical fibre suits an interference-prone long run.","trap":"Switch and router describe distinct jobs even when one product combines them."}},{"id":"Vulnerabilities Intro","unit":"Networks","source":"Canvas lesson PDF","terms":[{"term":"Cybersecurity","desc":"Protecting digital devices, networks and data from attacks and unauthorised access."},{"term":"Malware","desc":"Software intended to harm, disrupt, spy on or compromise a device."},{"term":"Ransomware","desc":"Malware that restricts access to data and typically demands payment."},{"term":"Phishing","desc":"Fraudulent communications attempting to steal information or prompt unsafe action."},{"term":"Social engineering","desc":"Manipulating people into revealing information or bypassing security procedures."},{"term":"Denial-of-service attack","desc":"Flooding or overwhelming a service so legitimate users cannot access it."},{"term":"Authentication","desc":"Verifying the identity of a user or device before granting access."},{"term":"Encryption","desc":"Transforming readable data into ciphertext, requiring a key to recover it."},{"term":"VLAN","desc":"A logical separation of devices into different broadcast domains on shared infrastructure."},{"term":"VPN","desc":"An encrypted network tunnel used to protect traffic across other networks."}],"points":[{"title":"Types of cyber threats","text":"The material covers malware and viruses, ransomware, phishing and social engineering, denial-of-service and weakly secured network equipment. Different threats target availability, confidentiality or control in different ways."},{"title":"Social engineering examples","text":"Social engineering manipulates people instead of directly attacking software. Class examples include pretexting, tailgating and quid-pro-quo deception. Explain the human behaviour being exploited."},{"title":"Access controls and authentication","text":"Use strong, unique passwords, two-factor authentication, restricted administrator privileges and appropriately managed user accounts to reduce unauthorised access."},{"title":"Firewalls and filtering","text":"A firewall monitors and permits or blocks network traffic according to rules, including traffic between a LAN and outside networks. It can help protect devices and regulate traffic between security segments."},{"title":"Encryption and secure communication","text":"Encryption protects information by making it unreadable without the key. Lesson examples include protecting transmitted data using HTTPS/TLS and data at rest on network storage."},{"title":"Threat, vulnerability and risk","text":"A threat is a potential source of harm (attacker, malware, natural hazard); a vulnerability is a weakness that can be exploited (weak password, unpatched software); risk combines likelihood with potential impact. A control is a mitigation such as MFA, backup, firewall or training. A useful written response describes threat → exploited weakness → likely consequence → proportionate mitigation."},{"title":"CIA security principles","text":"Confidentiality means information is accessible only to authorised people; integrity means information remains accurate and unaltered except by authorised changes; availability means systems/data can be accessed when needed. Examples: encryption supports confidentiality, file hashes and access controls support integrity, redundant servers and backups support availability. A security control can support several principles."},{"title":"Common attacks at Year 9","text":"Phishing tricks users into giving information or opening harmful content; malware includes viruses, worms, trojans and ransomware; password attacks exploit weak or reused credentials; social engineering exploits trust; denial-of-service overwhelms access to a service. Explain what happens and how to reduce the risk without needing instructions to carry out an attack."},{"title":"Controls: layers of defence","text":"Use unique passphrases, MFA, least privilege, updates, backups, secure configuration, access controls, encryption, user awareness and monitoring. A firewall filters network traffic according to rules; an antivirus tool looks for malicious behaviour or files; neither guarantees total safety. Separate guest and staff networks using VLANs, but also apply routing/firewall rules between them for effective access restrictions."},{"title":"Wi-Fi and physical issues","text":"Use modern Wi-Fi security such as WPA2/WPA3 with strong credentials, restrict administration access, disable unused services and update device firmware. Physical equipment can be lost, damaged or stolen, so secure switches, servers and cabling, and protect backups. Public networks can be riskier; verify endpoints and use HTTPS. A VPN changes the protected path, not whether a website is trustworthy."}],"intentions":[{"verb":"Identify","question":"Identify malware, phishing and social engineering in scenarios.","answer":"Use exact examples and roles from the lesson. For example: Cybersecurity — Protecting digital devices, networks and data from attacks and unauthorised access. Malware — Software intended to harm, disrupt, spy on or compromise a device."},{"verb":"Define","question":"Define VLAN and VPN, and distinguish them from LAN and WAN.","answer":"LAN = local-area network (geographical scope). WAN = wide-area network (geographical scope). VLAN = virtual local-area network, logical network segmentation that separates groups on shared hardware. VPN = virtual private network, an encrypted remote network connection/tunnel. A VLAN helps isolate groups; a VPN protects traffic and can support remote access."},{"verb":"Outline","question":"Outline security measures for a school network using segmentation and access controls.","answer":"Separate student and administration traffic into VLANs, control permitted inter-VLAN traffic using firewall rules, restrict privileged accounts, use strong passwords and 2FA, apply updates, monitor logs and maintain backups."},{"verb":"Explain","question":"Explain how firewall rules, VLANs and encryption reduce different risks.","answer":"VLANs separate devices into logical groups, limiting which traffic should cross between them. A firewall permits or blocks packets between those groups or the internet according to rules. Encryption protects confidentiality if transmitted data is intercepted. They mitigate different parts of the risk."}],"sourceNote":"Supplementary, independently authored exam-preparation knowledge. Original Canvas extracts appear separately below.","workshop":{"goal":"Separate the weakness, threat, consequence and control.","example":"A default password is a vulnerability. An attacker can use it to sign in and change settings. Rotate it and restrict administrative access.","trap":"A backup supports recovery. It does not patch a vulnerability or stop credential theft."}},{"id":"Social and Ethical","unit":"Networks","source":"Canvas lesson PDF","terms":[{"term":"Privacy","desc":"The protection and appropriate control of personal information about individuals."},{"term":"Cyberbullying","desc":"Using digital communications to repeatedly harass or harm other people."},{"term":"Misinformation","desc":"False or misleading information shared regardless of intent to deceive."},{"term":"Algorithmic bias","desc":"Unfair patterns in digital systems that disadvantage certain groups."},{"term":"Censorship","desc":"Restricting access to, or publication of, certain information or expression."},{"term":"Intellectual property","desc":"Rights protecting original creative or intellectual work from unauthorised use."},{"term":"Accessibility","desc":"Designing platforms so people with different abilities can use them."},{"term":"Alt text","desc":"A text description that helps screen-reader users understand images."},{"term":"Captions","desc":"Written representations of speech and significant audio for video accessibility."},{"term":"Privacy Act","desc":"Australian legislation relevant to the handling of personal information by covered organisations."}],"points":[{"title":"Social consequences of network connections","text":"Evaluate positive uses such as connection and access to information alongside potential harms such as exclusion, misleading information, privacy issues and harmful online interactions."},{"title":"Privacy and security expectations","text":"A digital system should consider consent, personal information, appropriate sharing, access control and changing expectations about safety and personal privacy."},{"title":"Misinformation and responsibility","text":"The module discusses the spread of misleading information and the roles of users and platforms in checking information and limiting harm. When evaluating, consider both intended and unintended effects."},{"title":"Different perspectives and accessibility","text":"The course explicitly asks you to consider Aboriginal and Torres Strait Islander Peoples, culturally and linguistically diverse communities, people of differing ages and genders, and people with disability. Evaluate access, inclusion and barriers instead of assuming users have identical needs."},{"title":"Ethical and legal evaluation","text":"Address what developers and organisations should do when connecting people and systems: protect data, design inclusively, comply with applicable responsibilities and consider the consequences of their choices."},{"title":"Privacy, confidentiality and consent","text":"Personal data includes names, images, locations, identifiers and usage patterns. Privacy concerns a person's control over collection and use; confidentiality concerns preventing unauthorised disclosure. Collect only what is needed, explain why it is collected, obtain appropriate consent and apply permissions and retention limits. An apparently anonymous dataset may still identify someone if combined with other information."},{"title":"Cybersecurity and fair access","text":"Systems must provide equitable access where possible: consider disability accessibility, language barriers, internet availability, technology cost and digital literacy. Password sharing, unauthorised access, bullying and deliberate misinformation cause harm even if technically easy. Explain the effects on students, staff, clients or wider communities and propose safe design choices."},{"title":"Copyright, intellectual property and attribution","text":"Creators usually have rights over their original software, media and written work. Downloading content does not automatically grant permission to redistribute it; some licences allow reuse with conditions such as attribution. Distinguish copyright from plagiarism: citing another person's idea may avoid plagiarism but does not necessarily give permission to reproduce a copyrighted asset. School policies and legislation must be followed."},{"title":"Data breaches and responses","text":"If private account data leaks, consequences can include identity misuse, loss of trust and operational disruption. Responsible responses include identifying affected systems, containing access, informing appropriate authorities and users under applicable policies, changing exposed credentials, and reviewing controls. In exam answers evaluate impact and ethics, not just technical fixes."},{"title":"Evaluate a scenario","text":"A school wants to monitor students' online activity. State possible benefits such as wellbeing and safety; risks such as unnecessary surveillance, error, discrimination and insecure storage; affected stakeholders; and mitigations such as purpose limits, access policies, consent processes, transparency and auditing. High-scoring evaluation weighs trade-offs before a conclusion."}],"intentions":[{"verb":"Identify","question":"Identify two positive and two negative effects of social networks.","answer":"Use exact examples and roles from the lesson. For example: Privacy — The protection and appropriate control of personal information about individuals. Cyberbullying — Using digital communications to repeatedly harass or harm other people."},{"verb":"Define","question":"Define privacy, digital exclusion and misinformation in context.","answer":"Use an accurate definition and a clear distinguishing feature. Privacy: The protection and appropriate control of personal information about individuals. Also review the 'Detailed information' and original Canvas lesson for the specific terms named in the question."},{"verb":"Outline","question":"Outline concerns of different groups using an online system.","answer":"State the main steps or features in a logical order. Social consequences of network connections: Evaluate positive uses such as connection and access to information alongside potential harms such as exclusion, misleading information, privacy issues and harmful online interactions. Privacy and security expectations: A digital system should consider consent, personal information, appropriate sharing, access control and changing expectations about safety and personal privacy."},{"verb":"Explain","question":"Explain an ethical design decision using benefits, risks and affected users.","answer":"Link the mechanism to its cause or purpose, and use the given context. Ethical and legal evaluation: Address what developers and organisations should do when connecting people and systems: protect data, design inclusively, comply with applicable responsibilities and consider the consequences of their choices."}],"sourceNote":"Supplementary, independently authored exam-preparation knowledge. Original Canvas extracts appear separately below.","workshop":{"goal":"Name a stakeholder, explain a concrete impact and propose a feasible response.","example":"Sharing a robot video with visible names can reveal students’ identities. Ask permission and crop or blur unnecessary identifiers.","trap":"“It affects privacy” needs the particular information exposed, to whom and with what consequence."}},{"id":"Identifying and Defining","unit":"Networks","source":"Canvas lesson PDF","terms":[{"term":"Problem statement","desc":"A clear description of the user need or issue to be addressed by a solution."},{"term":"Stakeholder","desc":"A person or group affected by, or involved with, the proposed system."},{"term":"Functional requirement","desc":"A feature or behaviour a system must provide: what it does."},{"term":"Non-functional requirement","desc":"A quality constraint such as security, reliability, speed or usability."},{"term":"Use case","desc":"A description of a user's interaction with a system to achieve a goal."},{"term":"Success criteria","desc":"Observable, measurable conditions used to determine whether a design works."},{"term":"Constraint","desc":"A limit such as budget, hardware availability, time or technical compatibility."},{"term":"Test case","desc":"A particular input, expected output and conditions used to check a requirement."}],"points":[{"title":"Describe the user need","text":"Name a real situation that a networked system could solve, the people who would use the solution, and how connecting devices improves the existing situation."},{"title":"Functional requirements","text":"Functional requirements specify what the networked solution must do. Use cases describe how users interact with functions, and test cases compare an input/action with an expected output."},{"title":"Non-functional requirements","text":"Non-functional requirements specify qualities or constraints such as acceptable performance, privacy, availability, usability and security."},{"title":"Planning and testing network designs","text":"Break the problem into smaller parts, sketch which nodes connect to which others, select devices and media, then test the implementation against its requirements."},{"title":"Define the problem, not the solution first","text":"A design brief describes the user's problem, who experiences it, the context, constraints and what success looks like. Do not begin with 'make a website' unless the need actually justifies it. Identify primary/secondary stakeholders, current workflow, inputs, processes, storage and outputs. Distinguish functional requirements (what the system does) from non-functional requirements (speed, reliability, usability, security)."},{"title":"Decompose and prioritise","text":"Break a large network problem into smaller jobs: user access, cabling, IP settings, permissions, service delivery, resilience and maintenance. Classify requirements by essential vs desirable. Typical constraints include budget, equipment, time, available skills and policies. Write measurable acceptance criteria, such as a laptop reaching a file server via Wi-Fi with correct permissions."},{"title":"Planning a network","text":"Produce a labelled topology, address plan, device inventory and test plan. Consider server vs peer-to-peer, wired vs wireless, switches and routers, VLAN segmentation, access control, maintenance and growth. A good diagram specifies what connects where and why; an exam can ask you to justify choices against users' needs."},{"title":"Evidence and evaluation","text":"Research and interview stakeholders, compare alternatives using criteria, test prototypes and record improvements. Explain why your selected architecture fits the task instead of repeating generic advantages. Be careful with assumptions: three departments using different services do not automatically require three physical networks."}],"intentions":[{"verb":"Identify","question":"Identify likely users and needs in a school network proposal.","answer":"Use exact examples and roles from the lesson. For example: Problem statement — A clear description of the user need or issue to be addressed by a solution. Stakeholder — A person or group affected by, or involved with, the proposed system."},{"verb":"Define","question":"Define functional and non-functional network requirements.","answer":"Use an accurate definition and a clear distinguishing feature. Problem statement: A clear description of the user need or issue to be addressed by a solution. Also review the 'Detailed information' and original Canvas lesson for the specific terms named in the question."},{"verb":"Outline","question":"Outline use cases with input and expected output.","answer":"State the main steps or features in a logical order. Describe the user need: Name a real situation that a networked system could solve, the people who would use the solution, and how connecting devices improves the existing situation. Functional requirements: Functional requirements specify what the networked solution must do. Use cases describe how users interact with functions, and test cases compare an input/action with an expected output."},{"verb":"Explain","question":"Explain how to choose a preferred network design from competing requirements.","answer":"Link the mechanism to its cause or purpose, and use the given context. Planning and testing network designs: Break the problem into smaller parts, sketch which nodes connect to which others, select devices and media, then test the implementation against its requirements."}],"sourceNote":"Supplementary, independently authored exam-preparation knowledge. Original Canvas extracts appear separately below.","workshop":{"goal":"Write measurable requirements from a problem statement.","example":"Functional: the guest tablets can submit a registration. Non-functional: confirmation appears within three seconds at the expected load.","trap":"A technology name is usually a possible solution. State the need before choosing equipment."}},{"id":"Producing and Implementing","unit":"Networks","source":"Canvas lesson PDF","terms":[{"term":"Implementation","desc":"Building and configuring a planned digital solution using suitable tools and components."},{"term":"Network simulation","desc":"A virtual environment for designing and testing how network devices connect."},{"term":"Packet Tracer","desc":"A network simulator used to configure devices and observe network behaviour."},{"term":"IP configuration","desc":"Assigning suitable addresses and other network settings to devices."},{"term":"Connectivity test","desc":"A check that data can travel between intended endpoints."},{"term":"Ping","desc":"A basic network test that checks whether a destination responds to ICMP echo requests."},{"term":"Documentation","desc":"Records of a solution's design, settings, changes and test outcomes."},{"term":"Iteration","desc":"Improving a solution by reviewing results and adjusting the design."}],"points":[{"title":"Plan and iterate","text":"Start with the defined need and requirements, generate alternatives, evaluate them and implement a preferred design. An iterative approach means testing and refining instead of assuming the first layout is final."},{"title":"Build and test","text":"Model how devices connect; provide needed network hardware and services; then check that users can reach intended resources and that restricted resources remain inaccessible."},{"title":"Documentation and evaluation","text":"Record the selected topology, hardware, addressing or other relevant implementation choices, test outcomes and changes. Evaluate whether the implemented solution meets the original functional and non-functional requirements."},{"title":"Implementation workflow","text":"Convert requirements into a plan, assemble or simulate network hardware, connect devices, set addressing, configure VLANs and access rules where relevant, then test. Work methodically: one change at a time and a record of results. A diagram should match the final implemented layout, not merely the original design."},{"title":"IP subnets and VLAN example","text":"VLAN 10 can be associated with subnet 192.168.10.0/24 for staff, VLAN 20 with 192.168.20.0/24 for students and VLAN 30 with 192.168.30.0/24 for guests. The IP scheme and VLAN IDs are separate concepts but commonly mapped one subnet per VLAN. A router/L3 switch is needed for inter-VLAN IP routing; a firewall or ACL defines who may reach which services. Never assume isolation is perfect without testing policies."},{"title":"Systematic network testing","text":"Verify each layer: physical link; local switch/VLAN communication; address and subnet; gateway; DNS resolution; access to required resources; and access denied to restricted resources. Record expected vs actual result, e.g. 'Student PC reaches learning server' versus 'Student PC cannot reach payroll server'. A single successful ping is not proof that every network service works."},{"title":"Debugging and evaluation","text":"If only guest Wi-Fi fails, inspect wireless access, guest VLAN membership, DHCP pool and firewall rules. If all sites fail, inspect WAN connection, upstream router or shared services. Evaluate speed, accessibility, reliability, security and scalability against original criteria. Recommend changes with evidence."}],"intentions":[{"verb":"Identify","question":"Identify the devices and connections required by a proposed network.","answer":"Use exact examples and roles from the lesson. For example: Implementation — Building and configuring a planned digital solution using suitable tools and components. Network simulation — A virtual environment for designing and testing how network devices connect."},{"verb":"Define","question":"Define an iterative design process.","answer":"Use an accurate definition and a clear distinguishing feature. Implementation: Building and configuring a planned digital solution using suitable tools and components. Also review the 'Detailed information' and original Canvas lesson for the specific terms named in the question."},{"verb":"Outline","question":"Outline the steps of planning, implementing and testing a network.","answer":"State the main steps or features in a logical order. Plan and iterate: Start with the defined need and requirements, generate alternatives, evaluate them and implement a preferred design. An iterative approach means testing and refining instead of assuming the first layout is final. Build and test: Model how devices connect; provide needed network hardware and services; then check that users can reach intended resources and that restricted resources remain inaccessible."},{"verb":"Explain","question":"Explain how test results should change the final design.","answer":"Link the mechanism to its cause or purpose, and use the given context. Documentation and evaluation: Record the selected topology, hardware, addressing or other relevant implementation choices, test outcomes and changes. Evaluate whether the implemented solution meets the original functional and non-functional requirements."}],"sourceNote":"Supplementary, independently authored exam-preparation knowledge. Original Canvas extracts appear separately below.","workshop":{"goal":"Turn each network requirement into a test with expected behaviour.","example":"From guest Wi-Fi, load a public page and verify success. Attempt to reach a known staff service and verify access is denied.","trap":"A connection icon proves association with Wi-Fi. It does not prove that a particular route or policy works."}},{"id":"Vulnerabilities Practical","unit":"Networks","source":"Canvas lesson PDF","terms":[{"term":"Steganography","desc":"Hiding the existence of information inside an ordinary-looking file or message."},{"term":"Least significant bit","desc":"A low-value bit position that may be altered in some images to conceal data with little visible change."},{"term":"Ciphertext","desc":"Data that has been transformed into an unreadable form using encryption."},{"term":"Plaintext","desc":"The original readable message before encryption or after decryption."},{"term":"Symmetric encryption","desc":"Encryption where sender and receiver use the same secret key."},{"term":"Public-key encryption","desc":"Encryption using related public and private keys for different operations."},{"term":"Cipher key","desc":"A value used by an encryption method to control encryption and decryption."},{"term":"Security through obscurity","desc":"Relying on a hidden design or detail instead of strong protective controls."}],"points":[{"title":"Learning goal of the practical","text":"The practical explores security threats and countermeasures by examining how information can be concealed, encrypted or intercepted; the original PDF contains longer exercises and examples."},{"title":"Steganography versus encryption","text":"Steganography hides the existence of a message inside an ordinary-looking medium such as an image or audio file. Encryption transforms message content so it cannot be understood without the key. They protect information in different ways."},{"title":"Classical and modern codes","text":"The exported practical includes activities about ciphers, coded messages and encryption, including explaining how a key or algorithm changes what a reader can understand."},{"title":"Communications privacy and security","text":"Interception and eavesdropping can expose confidential information. Secure communication uses appropriate protection measures and careful treatment of received files and links."},{"title":"Using practical knowledge in exam answers","text":"Identify the risk shown in a scenario; explain what could be exposed; choose a relevant mitigation from the theoretical security lesson; justify how that mitigation helps."},{"title":"Test safely and with permission","text":"In school network exercises, identify weaknesses by inspecting the authorised simulated setup, configuration, role permissions, audit logs and documented symptoms. Avoid accessing other users' data or running intrusive testing without explicit authorisation. Record what could go wrong, who is affected and the relevant control."},{"title":"Practical checklist","text":"Confirm default passwords were changed, updates applied, guest Wi-Fi separated, permissions use least privilege, backups exist and traffic policy matches requirements. Test denied access as well as granted access. Example: guest client should reach the public Internet but not access staff file shares; the VLAN alone must be supported by suitable routing/firewall controls."},{"title":"Prioritising fixes","text":"Rate each issue by likelihood and impact. A default administrator password on an exposed router is usually more urgent than a minor interface inconvenience; a missing backup affects availability. Propose defence in depth and show how to verify the fix, not just say 'add more security'."},{"title":"Compare before and after","text":"Use a table: observed weakness → risk → mitigation → retest outcome. In an explain response, link control to the threat mechanism. In an evaluate response, add trade-offs such as cost, usability and ongoing maintenance."}],"intentions":[{"verb":"Identify","question":"Identify information-hiding and information-encryption techniques.","answer":"Use exact examples and roles from the lesson. For example: Steganography — Hiding the existence of information inside an ordinary-looking file or message. Least significant bit — A low-value bit position that may be altered in some images to conceal data with little visible change."},{"verb":"Define","question":"Define steganography and encryption.","answer":"Use an accurate definition and a clear distinguishing feature. Steganography: Hiding the existence of information inside an ordinary-looking file or message. Also review the 'Detailed information' and original Canvas lesson for the specific terms named in the question."},{"verb":"Outline","question":"Outline how a security practical demonstrates a vulnerability safely.","answer":"State the main steps or features in a logical order. Learning goal of the practical: The practical explores security threats and countermeasures by examining how information can be concealed, encrypted or intercepted; the original PDF contains longer exercises and examples. Steganography versus encryption: Steganography hides the existence of a message inside an ordinary-looking medium such as an image or audio file. Encryption transforms message content so it cannot be understood without the key. They protect information in different ways."},{"verb":"Explain","question":"Explain how interception risks can be reduced by appropriate countermeasures.","answer":"Link the mechanism to its cause or purpose, and use the given context. Using practical knowledge in exam answers: Identify the risk shown in a scenario; explain what could be exposed; choose a relevant mitigation from the theoretical security lesson; justify how that mitigation helps."}],"sourceNote":"Supplementary, independently authored exam-preparation knowledge. Original Canvas extracts appear separately below.","workshop":{"goal":"Match the defence to the way an attack succeeds.","example":"If a password is stolen, MFA can require a second proof of identity. If ransomware corrupts files, test recovery from an offline backup.","trap":"One security control rarely solves every stage of the scenario. State which risk your control reduces."}},{"id":"Algorithms","unit":"Programming","source":"Canvas lesson PDF","terms":[{"term":"Algorithm","desc":"A finite, ordered set of unambiguous steps for solving a problem."},{"term":"Decomposition","desc":"Breaking a complex problem into smaller manageable tasks."},{"term":"Abstraction","desc":"Focusing on important details and ignoring irrelevant complexity."},{"term":"Pseudocode","desc":"Plain-language-like notation for describing an algorithm without specific program syntax."},{"term":"Flowchart","desc":"A diagram representing algorithm steps using standard shapes and arrows."},{"term":"Algorithm efficiency","desc":"The resources such as steps or time needed to complete a solution."},{"term":"Termination","desc":"A condition ensuring an algorithm finishes rather than running forever."},{"term":"Validation","desc":"Checking whether an algorithm correctly meets the problem requirements."}],"points":[{"title":"Definition and properties","text":"An algorithm is a finite, ordered set of instructions for completing a task. Clear, unambiguous steps can be represented using everyday language, flowcharts or pseudocode before programming."},{"title":"Design from a problem","text":"Identify inputs, processes and outputs. Split a larger problem into steps and check whether each path through the algorithm produces the required result."},{"title":"Representation and testing","text":"Flowcharts show decisions and control flow with symbols; pseudocode expresses the logic as structured words. Desk checking tests sample inputs before or alongside code."},{"title":"What makes an algorithm","text":"An algorithm is a finite, clear series of steps that solves a problem; it needs defined inputs and desired outputs. It is language-independent: code is one implementation. Qualities include correctness, clarity, termination and efficiency. A recipe-like list that omits decisions or stopping conditions can fail for unusual inputs."},{"title":"Decomposition and abstraction","text":"Decomposition breaks a difficult problem into parts; abstraction ignores irrelevant detail while keeping the essential features. Pattern recognition finds similarities in problems that might share a solution. Generalisation designs an algorithm for many inputs rather than one hard-coded example."},{"title":"Trace a simple algorithm","text":"Example: initialise total=0; for each number in [3,5,2], add it to total; output total. Trace total as 0 → 3 → 8 → 10. Create a variable-trace table for larger algorithms. Look for off-by-one errors and conditions that never become false."},{"title":"Efficiency and correctness","text":"If an algorithm searches 100 items one by one, its worst-case comparisons can increase as the list grows; a binary search can be more efficient but requires sorted data. At this level explain efficiency in plain terms and test representative, boundary and invalid cases. An efficient wrong algorithm remains wrong."}],"intentions":[{"verb":"Identify","question":"Identify inputs, processes and outputs in an algorithm.","answer":"Use exact examples and roles from the lesson. For example: Algorithm — A finite, ordered set of unambiguous steps for solving a problem. Decomposition — Breaking a complex problem into smaller manageable tasks."},{"verb":"Define","question":"Define algorithm and unambiguous instructions.","answer":"Use an accurate definition and a clear distinguishing feature. Algorithm: A finite, ordered set of unambiguous steps for solving a problem. Also review the 'Detailed information' and original Canvas lesson for the specific terms named in the question."},{"verb":"Outline","question":"Outline an algorithm as numbered steps or pseudocode.","answer":"State the main steps or features in a logical order. Definition and properties: An algorithm is a finite, ordered set of instructions for completing a task. Clear, unambiguous steps can be represented using everyday language, flowcharts or pseudocode before programming. Design from a problem: Identify inputs, processes and outputs. Split a larger problem into steps and check whether each path through the algorithm produces the required result."},{"verb":"Explain","question":"Explain why a step-by-step algorithm should be tested before coding.","answer":"Link the mechanism to its cause or purpose, and use the given context. Representation and testing: Flowcharts show decisions and control flow with symbols; pseudocode expresses the logic as structured words. Desk checking tests sample inputs before or alongside code."}],"sourceNote":"Supplementary, independently authored exam-preparation knowledge. Original Canvas extracts appear separately below.","workshop":{"goal":"Write finite, unambiguous steps with an input, a result and a stopping rule.","example":"For identical urgency scores, process the earlier arrival first, then compare unique job IDs if arrival times are equal.","trap":"A condition such as “until it works” needs an observable pass condition and a suitable stopping rule."}},{"id":"Input, Process, Output","unit":"Programming","source":"Canvas lesson PDF","terms":[{"term":"Input","desc":"Data received from a user, file, sensor, database or other program."},{"term":"Process","desc":"A calculation, comparison or transformation performed on input data."},{"term":"Output","desc":"A result sent to the screen, speaker, file, network or actuator."},{"term":"Storage","desc":"Saving information so it can be retrieved or used later."},{"term":"Transmission","desc":"Moving information from one component or system to another."},{"term":"IPO model","desc":"A breakdown of a system into input, process and output stages."},{"term":"Validation of input","desc":"Checking whether received data is acceptable before processing it."},{"term":"Casting","desc":"Converting a value from one data type to another, such as int(input())."}],"points":[{"title":"IPO model","text":"Input is data entered or captured, processing transforms or evaluates that data, and output is the resulting information or action. Storage keeps data for later use and transmission sends it between devices."},{"title":"Map an app","text":"For a quiz app: user answer is input, comparison to an answer key is processing, score display is output, and saving progress is storage. A networked app may also transmit results."},{"title":"Analyse a scenario","text":"When identifying IPO elements, say what the specific data is and how it is used; just writing the words input, process and output does not fully explain the system."},{"title":"IPO model","text":"Input is data or a signal entering a system; process is a transformation, decision or calculation; output is the result or action. Storage remembers information for later; feedback uses output or current state information to influence future decisions. Example: a thermostat reads temperature (input), compares it with a set point (process), switches a heater (output), then reads again (feedback)."},{"title":"How to design IPO tables","text":"Write columns for user/sensor inputs, rules and calculations, outputs, storage and potential errors. For a grade calculator: input assessment marks; process weighted average and validation; output grade/feedback; storage saved results. Distinguish a button (input device) from a display (output), and the internal value from the hardware reading."},{"title":"Data validation","text":"Validate type and range before processing. A number of students cannot be negative; a date must be valid. Validation checks acceptability, whereas verification checks whether entered data matches the source. When an IPO system gives wrong results, trace whether the sensor/input, processing rule or output mapping caused it."}],"intentions":[{"verb":"Identify","question":"Identify the input, processing, output, storage and transmission in an app.","answer":"Use exact examples and roles from the lesson. For example: Input — Data received from a user, file, sensor, database or other program. Process — A calculation, comparison or transformation performed on input data."},{"verb":"Define","question":"Define input, process, output and storage.","answer":"Use an accurate definition and a clear distinguishing feature. Input: Data received from a user, file, sensor, database or other program. Also review the 'Detailed information' and original Canvas lesson for the specific terms named in the question."},{"verb":"Outline","question":"Outline the flow of data through a quiz application.","answer":"State the main steps or features in a logical order. IPO model: Input is data entered or captured, processing transforms or evaluates that data, and output is the resulting information or action. Storage keeps data for later use and transmission sends it between devices. Map an app: For a quiz app: user answer is input, comparison to an answer key is processing, score display is output, and saving progress is storage. A networked app may also transmit results."},{"verb":"Explain","question":"Explain why distinguishing IPO elements helps design software.","answer":"Link the mechanism to its cause or purpose, and use the given context. Analyse a scenario: When identifying IPO elements, say what the specific data is and how it is used; just writing the words input, process and output does not fully explain the system."}],"sourceNote":"Supplementary, independently authored exam-preparation knowledge. Original Canvas extracts appear separately below.","workshop":{"goal":"Separate supplied data, the operation, its result and any saved record.","example":"Distance and elapsed time are inputs. Divide dis
