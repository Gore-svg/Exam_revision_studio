ware","unit":"Networks","difficulty":"Intermediate","type":"mc","marks":1,"stem":"Which statement best defines **UTP Ethernet**?","options":["A device that receives and retransmits a signal to extend its reach.","A network of physical devices containing sensors, controllers and connectivity.","Twisted-pair copper cable carrying electrical signals, commonly used in local networks.","Hardware or software that permits or blocks traffic using security rules."],"answer":2,"explanation":"UTP Ethernet: Twisted-pair copper cable carrying electrical signals, commonly used in local networks.","id":"core-0104","sourceQuality":"Course concepts / supplemented exam prep"},{"module":"Network Hardware","unit":"Networks","difficulty":"Intermediate","type":"mc","marks":1,"stem":"Which statement best defines **Coaxial cable**?","options":["A device connecting Wi‑Fi clients to a wired or larger network.","Hardware or software that permits or blocks traffic using security rules.","A cable with a central conductor and shielding, used in broadband and television systems.","Wireless networking using radio signals to connect devices."],"answer":2,"explanation":"Coaxial cable: A cable with a central conductor and shielding, used in broadband and television systems.","id":"core-0105","sourceQuality":"Course concepts / supplemented exam prep"},{"module":"Vulnerabilities Intro","unit":"Networks","difficulty":"Intermediate","type":"mc","marks":1,"stem":"Which statement best defines **Cybersecurity**?","options":["Manipulating people into revealing information or bypassing security procedures.","Protecting digital devices, networks and data from attacks and unauthorised access.","Software intended to harm, disrupt, spy on or compromise a device.","Transforming readable data into ciphertext, requiring a key to recover it."],"answer":1,"explanation":"Cybersecurity: Protecting digital devices, networks and data from attacks and unauthorised access.","id":"core-0106","sourceQuality":"Course concepts y":"Intermediate","type":"mc","marks":1,"stem":"Which statement best defines **Expected result**?","options":["The behaviour observed when a test is executed.","Checking values at and around a decision limit.","Code that runs but produces an unintended result.","The value or behaviour a test case predicts for a particular input."],"answer":3,"explanation":"Expected result: The value or behaviour a test case predicts for a particular input.","id":"core-0215","sourceQuality":"Course concepts / supplemented exam prep"},{"module":"Unit Testing and Error Detection","unit":"Programming","difficulty":"Intermediate","type":"mc","marks":1,"stem":"Which statement best defines **Actual result**?","options":["Code that violates the programming language's grammatical rules.","The behaviour observed when a test is executed.","Code that runs but produces an unintended result.","A focused check that a small function or component returns its expected result."],"answer":1,"explanation":"Actual result: The behaviour observed when a test is executed.","id":"core-0216","sourceQuality":"Course concepts / supplemented exam prep"},{"module":"Unit Testing and Error Detection","unit":"Programming","difficulty":"Intermediate","type":"mc","marks":1,"stem":"Which statement best defines **Boundary test**?","options":["Code that violates the programming language's grammatical rules.","Code that runs but produces an unintended result.","Checking values at and around a decision limit.","A previous test rerun to ensure a new change has not broken old functionality."],"answer":2,"explanation":"Boundary test: Checking values at and around a decision limit.","id":"core-0217","sourceQuality":"Course concepts / supplemented exam prep"},{"module":"Unit Testing and Error Detection","unit":"Programming","difficulty":"Intermediate","type":"mc","marks":1,"stem":"Which statement best defines **Syntax error**?","options":["The behaviour observed when a test is executed.","A focused check that a small function o  again.","Temporarily displaying variable values to understand what code is doing.","Changing program decisions or calculations so output matches the requirement."],"answer":1,"explanation":"Reproduce error: Follow consistent input and steps to make an observed fault happen again.","id":"core-0221","sourceQuality":"Course concepts / supplemented exam prep"},{"module":"Error Correction","unit":"Programming","difficulty":"Intermediate","type":"mc","marks":1,"stem":"Which statement best defines **Isolate cause**?","options":["Follow consistent input and steps to make an observed fault happen again.","Narrow testing to the smallest code region responsible for incorrect behaviour.","Changing program decisions or calculations so output matches the requirement.","Temporarily displaying variable values to understand what code is doing."],"answer":1,"explanation":"Isolate cause: Narrow testing to the smallest code region responsible for incorrect behaviour.","id":"core-0222","sourceQuality":"Course concepts / supplemented exam prep"},{"module":"Error Correction","unit":"Programming","difficulty":"Intermediate","type":"mc","marks":1,"stem":"Which statement best defines **Syntax correction**?","options":["Fixing punctuation, indentation or structure so the program can execute.","Changing program decisions or calculations so output matches the requirement.","A record of input, expected output, actual output and whether a test passes.","Locating, understanding and correcting defects in an algorithm or program."],"answer":0,"explanation":"Syntax correction: Fixing punctuation, indentation or structure so the program can execute.","id":"core-0223","sourceQuality":"Course concepts / supplemented exam prep"},{"module":"Error Correction","unit":"Programming","difficulty":"Intermediate","type":"mc","marks":1,"stem":"Which statement best defines **Logic correction**?","options":["Running tests again after making a correction.","A record of input, expected output, actual output and whet  gripper or welding head.","Continuous programmed motion along a smooth path, used in tasks such as spray painting.","One independent linear or rotational movement available to a robot."],"answer":3,"explanation":"Degree of freedom: One independent linear or rotational movement available to a robot.","id":"core-0227","sourceQuality":"Course concepts / supplemented exam prep"},{"module":"Mechatronic Systems","unit":"Mechatronics","difficulty":"Intermediate","type":"mc","marks":1,"stem":"Which statement best defines **Pick-and-place movement**?","options":["Continuous programmed motion along a smooth path, used in tasks such as spray painting.","Robot motion between loading and placing positions, often used in repetitive assembly.","A tool at the working end of a robot, such as a gripper or welding head.","A robot fixed to a location while an arm manipulates objects in its work area."],"answer":1,"explanation":"Pick-and-place movement: Robot motion between loading and placing positions, often used in repetitive assembly.","id":"core-0228","sourceQuality":"Course concepts / supplemented exam prep"},{"module":"Mechatronic Systems","unit":"Mechatronics","difficulty":"Intermediate","type":"mc","marks":1,"stem":"Which statement best defines **Point-to-point motion**?","options":["A tool at the working end of a robot, such as a gripper or welding head.","One independent linear or rotational movement available to a robot.","Movement between programmed locations, suitable for operations such as spot welding.","A programmable machine used for operations like welding, assembly or materials handling."],"answer":2,"explanation":"Point-to-point motion: Movement between programmed locations, suitable for operations such as spot welding.","id":"core-0229","sourceQuality":"Course concepts / supplemented exam prep"},{"module":"Mechatronic Systems","unit":"Mechatronics","difficulty":"Intermediate","type":"mc","marks":1,"stem":"Which statement best defines **Contouring**?","options":["A tool at the working end of a robot, such as a gripper or welding head.","One independent linear or rotational movement available to a robot.","Continuous programmed motion along a smooth path, used in tasks such as spray painting.","Robot motion between loading and placing positions, often used in repetitive assembly."],"answer":2,"explanation":"Contouring: Continuous programmed motion along a smooth path, used in tasks such as spray painting.","id":"core-0230","sourceQuality":"Course concepts / supplemented exam prep"},{"module":"Mechatronic Systems","unit":"Mechatronics","difficulty":"Intermediate","type":"mc","marks":1,"stem":"Which statement best defines **Industrial robot**?","options":["Robot motion between loading and placing positions, often used in repetitive assembly.","A programmable machine used for operations like welding, assembly or materials handling.","A system combining mechanical engineering, electronics and computing to perform tasks.","Continuous programmed motion along a smooth path, used in tasks such as spray painting."],"answer":1,"explanation":"Industrial robot: A programmable machine used for operations like welding, assembly or materials handling.","id":"core-0231","sourceQuality":"Course concepts / supplemented exam prep"},{"module":"Automation","unit":"Mechatronics","difficulty":"Intermediate","type":"mc","marks":1,"stem":"Which statement best defines **Automated control**?","options":["The desired target value, such as a programmed room temperature.","A controller that compares measured temperature with a target and turns heating or cooling on or off.","Executing commands without measuring whether the desired result was achieved.","A system that senses and makes adjustments to achieve a desired result with limited human input."],"answer":3,"explanation":"Automated control: A system that senses and makes adjustments to achieve a desired result with limited human input.","id":"core-0232","sourceQuality":"Course concepts / supplemented e ature.","id":"core-0235","sourceQuality":"Course concepts / supplemented exam prep"},{"module":"Automation","unit":"Mechatronics","difficulty":"Intermediate","type":"mc","marks":1,"stem":"Which statement best defines **Feedback loop**?","options":["A controller that compares measured temperature with a target and turns heating or cooling on or off.","Repeatedly measuring output or state and adjusting operation according to the result.","A robot able to move around its environment rather than being fixed in one place.","Using sensor feedback to adjust actions toward a target."],"answer":1,"explanation":"Feedback loop: Repeatedly measuring output or state and adjusting operation according to the result.","id":"core-0236","sourceQuality":"Course concepts / supplemented exam prep"},{"module":"Automation","unit":"Mechatronics","difficulty":"Intermediate","type":"mc","marks":1,"stem":"Which statement best defines **Open-loop control**?","options":["A controller that compares measured temperature with a target and turns heating or cooling on or off.","The desired target value, such as a programmed room temperature.","Executing commands without measuring whether the desired result was achieved.","A robot able to move around its environment rather than being fixed in one place."],"answer":2,"explanation":"Open-loop control: Executing commands without measuring whether the desired result was achieved.","id":"core-0237","sourceQuality":"Course concepts / supplemented exam prep"},{"module":"Requirements","unit":"Mechatronics","difficulty":"Intermediate","type":"mc","marks":1,"stem":"Which statement best defines **Sensor input**?","options":["A required capability, e.g. the robot must stop when an obstacle is detected.","A described sequence of interactions that achieves the user's goal.","An observable action such as motor movement or buzzer sound.","Data received about a robot's surroundings or operation."],"answer":3,"explanation":"Sensor input: Data received about a robot's ial Ethical","unit":"Mechatronics","difficulty":"Intermediate","type":"mc","marks":1,"stem":"Which statement best defines **Workplace safety**?","options":["Giving trained people meaningful ability to supervise or interrupt an automated system.","Protecting people from moving machinery, electrical risks and system faults.","Explaining how a system makes important decisions to affected users.","Human tasks being reduced or changed by automated machines."],"answer":1,"explanation":"Workplace safety: Protecting people from moving machinery, electrical risks and system faults.","id":"core-0245","sourceQuality":"Course concepts / supplemented exam prep"},{"module":"Social Ethical","unit":"Mechatronics","difficulty":"Intermediate","type":"mc","marks":1,"stem":"Which statement best defines **Accountability**?","options":["Determining who is responsible for the outcomes and failures of an automated system.","Protecting people from moving machinery, electrical risks and system faults.","Giving trained people meaningful ability to supervise or interrupt an automated system.","Human tasks being reduced or changed by automated machines."],"answer":0,"explanation":"Accountability: Determining who is responsible for the outcomes and failures of an automated system.","id":"core-0246","sourceQuality":"Course concepts / supplemented exam prep"},{"module":"Social Ethical","unit":"Mechatronics","difficulty":"Intermediate","type":"mc","marks":1,"stem":"Which statement best defines **Transparency**?","options":["Giving trained people meaningful ability to supervise or interrupt an automated system.","Performing suitable repetitive tasks quickly and consistently.","Explaining how a system makes important decisions to affected users.","Determining who is responsible for the outcomes and failures of an automated system."],"answer":2,"explanation":"Transparency: Explaining how a system makes important decisions to affected users.","id":"core-0247","sourceQuality":"Course concepts / suppleme "Course concepts / supplemented exam prep"},{"module":"Components","unit":"Mechatronics","difficulty":"Intermediate","type":"mc","marks":1,"stem":"Which statement best defines **Sensor**?","options":["The study of motion in relation to forces and their effects.","An input device measuring conditions such as light, distance, movement or temperature.","A sensor that measures acceleration along one or more axes.","An actuator designed to move to a commanded position or angle."],"answer":1,"explanation":"Sensor: An input device measuring conditions such as light, distance, movement or temperature.","id":"core-0251","sourceQuality":"Course concepts / supplemented exam prep"},{"module":"Components","unit":"Mechatronics","difficulty":"Intermediate","type":"mc","marks":1,"stem":"Which statement best defines **Actuator**?","options":["A component that makes a physical action, such as a motor, pump or valve.","The study of motion in relation to forces and their effects.","A passive infrared device detecting changes in infrared radiation from moving warm objects.","An actuator designed to move to a commanded position or angle."],"answer":0,"explanation":"Actuator: A component that makes a physical action, such as a motor, pump or valve.","id":"core-0252","sourceQuality":"Course concepts / supplemented exam prep"},{"module":"Components","unit":"Mechatronics","difficulty":"Intermediate","type":"mc","marks":1,"stem":"Which statement best defines **End effector**?","options":["The study of how objects move, without focusing on the forces causing that motion.","A sensor using sound echoes to estimate distance to objects.","The tool or manipulator that performs work at the end of a robot arm.","An actuator designed to move to a commanded position or angle."],"answer":2,"explanation":"End effector: The tool or manipulator that performs work at the end of a robot arm.","id":"core-0253","sourceQuality":"Course concepts / supplemented exam prep"},{"module":"Components","unit":"Mechatronics","difficulty":"Intermediate","type":"mc","marks":1,"stem":"Which statement best defines **Ultrasonic sensor**?","options":["A sensor using sound echoes to estimate distance to objects.","An actuator commonly used to provide continuous rotational motion.","A compact computer that reads inputs, processes instructions and controls outputs.","A passive infrared device detecting changes in infrared radiation from moving warm objects."],"answer":0,"explanation":"Ultrasonic sensor: A sensor using sound echoes to estimate distance to objects.","id":"core-0254","sourceQuality":"Course concepts / supplemented exam prep"},{"module":"Components","unit":"Mechatronics","difficulty":"Intermediate","type":"mc","marks":1,"stem":"Which statement best defines **PIR sensor**?","options":["The study of motion in relation to forces and their effects.","A passive infrared device detecting changes in infrared radiation from moving warm objects.","An input device measuring conditions such as light, distance, movement or temperature.","A sensor using sound echoes to estimate distance to objects."],"answer":1,"explanation":"PIR sensor: A passive infrared device detecting changes in infrared radiation from moving warm objects.","id":"core-0255","sourceQuality":"Course concepts / supplemented exam prep"},{"module":"Algorithms Robotics","unit":"Mechatronics","difficulty":"Intermediate","type":"mc","marks":1,"stem":"Which statement best defines **Robot algorithm**?","options":["Manually tracing sensor values and expected robot actions against an algorithm.","An ordered procedure for controlling a robot's sensing, decisions and movements.","A diagram representing robot actions and branches using standard symbols.","A control rule selecting actions based on a sensor value or event."],"answer":1,"explanation":"Robot algorithm: An ordered procedure for controlling a robot's sensing, decisions and movements.","id":"core-0256","sourceQuality":"Course concepts / supplemented exam prep"},{"module":"A ot"],"answer":2}],"explanation":"Each blank asks for one distinct technical term; check the definitions in Revision.","id":"core-0384","sourceQuality":"Course concepts / supplemented exam prep"},{"type":"blank","module":"Practical - AI Vision Sensor","unit":"Mechatronics","difficulty":"Intermediate","marks":3,"stem":"Complete the three related **Practical - AI Vision Sensor** definitions. Each _____ is a separate dropdown: (1) A camera-based input device able to analyse visual information about objects. = _____; (2) Identifying the presence or position of a target item in a camera image. = _____; (3) Camera readings used by software to choose robot behaviour. = _____.","parts":[{"prompt":"A camera-based input device able to analyse visual information about objects.","options":["AI vision sensor","Lighting conditions","Object detection","False detection"],"answer":0},{"prompt":"Identifying the presence or position of a target item in a camera image.","options":["Vision input","Detection threshold","Object detection","Vision test case"],"answer":2},{"prompt":"Camera readings used by software to choose robot behaviour.","options":["AI vision sensor","Image-processing decision","Vision input","Object detection"],"answer":2}],"explanation":"Each blank asks for one distinct technical term; check the definitions in Revision.","id":"core-0385","sourceQuality":"Course concepts / supplemented exam prep"},{"type":"blank","module":"Practical - AI Vision Sensor","unit":"Mechatronics","difficulty":"Intermediate","marks":3,"stem":"Complete the three related **Practical - AI Vision Sensor** definitions. Each _____ is a separate dropdown: (1) Camera readings used by software to choose robot behaviour. = _____; (2) Program logic using detected object data to decide an action. = _____; (3) Environmental changes that can affect vision-based recognition and reliability. = _____.","parts":[{"prompt":"Camera readings used by software to choose robot behaviour.","options":["Lighting conditions","False detection","Vision input","Vision test case"],"answer":2},{"prompt":"Program logic using detected object data to decide an action.","options":["AI vision sensor","False detection","Vision test case","Image-processing decision"],"answer":3},{"prompt":"Environmental changes that can affect vision-based recognition and reliability.","options":["Lighting conditions","Detection threshold","Vision test case","Vision input"],"answer":0}],"explanation":"Each blank asks for one distinct technical term; check the definitions in Revision.","id":"core-0386","sourceQuality":"Course concepts / supplemented exam prep"},{"type":"short","module":"LAN, WAN, WLAN, VLAN, VPN — Essential Networking","unit":"Networks","difficulty":"Exam","marks":4,"stem":"A school has staff PCs, student PCs and guest Wi-Fi on the same switches. Explain a sensible VLAN design and how to secure access between groups.","criteria":[{"label":"Separate broadcast domains","accept":["vlan","segment"],"why":"Separate groups into distinct VLANs."},{"label":"Separate subnets","accept":["subnet","ip network"],"why":"Use appropriate IP subnets."},{"label":"Routing","accept":["router","layer-3","gateway"],"why":"Inter-VLAN traffic uses routing."},{"label":"Rules","accept":["firewall","acl","access control"],"why":"Enforce permitted traffic with rules."}],"model":"Use a student VLAN, staff VLAN and guest VLAN on managed switches, each mapped to its own IP subnet. An access port belongs to one VLAN while trunks carry tags between switches. Inter-VLAN traffic passes via a router or Layer-3 switch; firewall/ACL rules allow required services but block guest access to internal resources.","explanation":"Four independently assessable ideas; compare your reasoning with the model answer. Keyword marking is only an estimate.","id":"core-0387","sourceQuality":"Hand-authored exam practice"},{"type":"short","module":"LAN, WAN, WLAN, VLAN, VPN — Essential Networking","unit":"Networks","difficulty":"Exam","marks":4,"stem":"A user can reach an IP address but not a website by its domain name. Give four ordered diagnostic checks or explanations.","criteria":[{"label":"Connection","accept":["connection","ping","link"],"why":"Check link/IP reachability."},{"label":"IP config","accept":["address","ip","gateway"],"why":"Check IP and gateway configuration."},{"label":"DNS server","accept":["dns","resolver"],"why":"Check DNS server configuration and reachability."},{"label":"Name resolution","accept":["nslookup","lookup","record","name"],"why":"Query a known record or compare name resolution."}],"model":"First confirm the device has a working connection and IP configuration. Then test the website IP to isolate routing from naming. Inspect the configured DNS resolver, and use a name lookup such as nslookup to see whether the domain resolves to an address.","explanation":"Four independently assessable ideas; compare your reasoning with the model answer. Keyword marking is only an estimate.","id":"core-0388","sourceQuality":"Hand-authored exam practice"},{"type":"short","module":"LAN, WAN, WLAN, VLAN, VPN — Essential Networking","unit":"Networks","difficulty":"Exam","marks":4,"stem":"Explain why a VLAN alone is not a complete security solution for a school network.","criteria":[{"label":"Segmentation","accept":["broadcast","segment","vlan"],"why":"VLANs separate Layer-2 broadcast domains."},{"label":"Inter-VLAN traffic","accept":["route","layer-3","router"],"why":"Routing can still allow traffic across VLANs."},{"label":"Access controls","accept":["firewall","acl","rules"],"why":"Explicit policies are needed to restrict access."},{"label":"Other controls","accept":["authentication","patch","password","monitor"],"why":"Other technical/security controls remain necessary."}],"model":"A VLAN creates a separate logical broadcast domain, improving organisation and limiting some local traffic. However, if a router permits inter-VLAN forwarding, devices may still access each other. ACLs or firewall rules must enforce least-privilege traffic, alongside authentication, patching and monitoring.","explanation":"Four independently assessable ideas; compare your reasoning with the model answer. Keyword marking is only an estimate.","id":"core-0389","sourceQuality":"Hand-authored exam practice"},{"type":"short","module":"Computer Networks","unit":"Networks","difficulty":"Exam","marks":4,"stem":"Compare a switch, router, wireless access point and modem in a school network.","criteria":[{"label":"Switch","accept":["switch","mac"],"why":"Switch connects LAN devices and uses MAC addresses."},{"label":"Router","accept":["router","subnet","ip"],"why":"Router forwards between IP networks."},{"label":"AP","accept":["access point","wi-fi","wireless"],"why":"AP joins Wi-Fi devices to a LAN."},{"label":"Modem","accept":["modem","isp","internet connection"],"why":"Modem terminates/modulates an ISP connection, when required."}],"model":"A switch connects devices on the same Ethernet LAN and forwards frames using MAC addresses. A router connects IP networks and acts as a gateway. An access point allows wireless stations to join the LAN. A modem interfaces with some ISP access technologies; some fibre services instead use an ONT.","explanation":"Four independently assessable ideas; compare your reasoning with the model answer. Keyword marking is only an estimate.","id":"core-0390","sourceQuality":"Hand-authored exam practice"},{"type":"short","module":"Data Processing and Transmission","unit":"Networks","difficulty":"Exam","marks":4,"stem":"Explain how packet switching delivers a message and identify two possible transmission problems.","criteria":[{"label":"Packets","accept":["packet","fragment"],"why":"Message divided into packets."},{"label":"Addressing","accept":["header","destination","address"],"why":"Packets include addressing information."},{"label":"Routing","accept":["router","route","forward"],"why":"Routers forward packets."},{"label":"Problems","accept":["delay","loss","congestion","out of order"],"why":"Packets can be delayed, lost or arrive out of order."}],"model":"The message is split into packets with headers identifying destinations. Network devices independently forward each packet along available routes. Delay, congestion, loss and reordering can occur. Protocols such as TCP can detect missing data and arrange retransmission/order.","explanation":"Four independently assessable ideas; compare your reasoning with the model answer. Keyword marking is only an estimate.","id":"core-0391","sourceQuality":"Hand-authored exam practice"},{"type":"short","module":"Data Processing and Transmission","unit":"Networks","difficulty":"Exam","marks":4,"stem":"Distinguish lossy and lossless compression and give an appropriate application for each.","criteria":[{"label":"Lossy","accept":["lossy"],"why":"Lossy removes original information."},{"label":"Lossless","accept":["lossless"],"why":"Lossless allows exact reconstruction."},{"label":"Application lossy","accept":["jpeg","mp3","photo","music"],"why":"Media often tolerates some quality loss."},{"label":"Application lossless","accept":["png","zip","source","text"],"why":"Text/source/archive data needs exact recovery."}],"model":"Lossy compression discards some original detail to achieve smaller files, so JPEG photos or MP3 sound can trade quality for size. Lossless compression preserves enough information for exact reconstruction, suitable for ZIP archives, program files or PNG graphics.","explanation":"Four independently assessable ideas; compare your reasoning with the model answer. Keyword marking is only an estimate.","id":"core-0392","sourceQuality":"Hand-authored exam practice"},{"type":"short","module":"Vulnerabilities Intro","unit":"Networks","difficulty":"Exam","marks":4,"stem":"Explain a four-layer plan to reduce phishing-related account compromise for a school.","criteria":[{"label":"Education","accept":["train","recognise","verify","awareness"],"why":"Teach users to verify requests."},{"label":"Authentication","accept":["mfa","multi-factor"],"why":"Use MFA."},{"label":"Filtering","accept":["filter","spam","email"],"why":"Apply filtering and technical controls."},{"label":"Response","accept":["report","reset","incident","revoke"],"why":"Report incidents and reset credentials/revoke sessions."}],"model":"Educate users to inspect suspicious links and verify requests independently. Apply email filtering. Require MFA on important accounts. Provide a reporting process with password resets, session revocation and incident response after suspected compromise.","explanation":"Four independently assessable ideas; compare your reasoning with the model answer. Keyword marking is only an estimate.","id":"core-0393","sourceQuality":"Hand-authored exam practice"},{"type":"short","module":"Graph Theory","unit":"Networks","difficulty":"Exam","marks":4,"stem":"A school network is drawn as a graph. Explain vertices, edges, degree and how a path could inform resilience.","criteria":[{"label":"Vertices","accept":["vertex","vertices","node"],"why":"Represent devices as vertices."},{"label":"Edges","accept":["edge","connection","link"],"why":"Represent physical/logical links as edges."},{"label":"Degree","accept":["degree"],"why":"Degree counts incident edges."},{"label":"Paths","accept":["path","redundancy","alternative"],"why":"Alternate paths can improve resilience."}],"model":"Each router or switch is a vertex, and each link is an edge. A vertex degree is the count of attached links. Paths show how data travels through the graph; the existence of alternative paths can prevent a single link failure from disconnecting a section.","explanation":"Four independently assessable ideas; compare your reasoning with the model answer. Keyword marking is only an estimate.","id":"core-0394","sourceQuality":"Hand-authored exam practice"},{"type":"short","module":"Social and Ethical","unit":"Networks","difficulty":"Exam","marks":4,"stem":"Explain four responsible practices function studyTarget() {

const VAGUE_KEYS = new Set(['data','system','network','process','device','security','information','computer','use','uses','example','feature','test']);
const NEGATORS = new Set(['not','never','no','cannot','without','neither']);
const NEGATION_FILLERS = new Set(['a','an','the','actually','necessarily','really','directly','automatically','always','any','all','ever','even','it','provide','provides','use','uses','used','is','are','be']);
function markingTokens(value) {

    .replace(/[≥≤≠×÷]/g,c=>({'≥':'>=','≤':'<=','≠':'!=','×':'*','÷':'/'})[c])
    .replace(/\bdoesn[’']t\b/g,'does not').replace(/\bisn[’']t\b/g,'is not')
    .replace(/\baren[’']t\b/g,'are not').replace(/\bdon[’']t\b/g,'do not')
    .replace(/\bcan[’']t\b/g,'cannot').replace(/\bwon[’']t\b/g,'will not')

    .replace(/\bcolours?\b/g,'colour').replace(/\bmilli(?:second|seconds)\b/g,'ms')
    .replace(/\bmilli(?:metre|metres|meter|meters)\b/g,'mm')

function flashDeck(deck) {

function flashSessionCards(deck,mode) {

function flashDays(id, rating) {
  const previous=state.flashReviews[id]?.days||0;
  return rating===1?1:Math.min(60,Math.max(rating===2?3:7,Math.round(previous*(rating===2?2:3))));
}
function startFlashReplay(){
  Object.assign(state.flashPrefs,{mode:'replay',replayIndex:0});
  flashSelected=null;flashRevealed=false;persist();render();
  document.querySelector('[data-flash-reveal]')?.focus();
}
function flipFlash(){
  const turn=document.querySelector('.flash-turn');
  if(!turn)return;
  flashRevealed=!flashRevealed;
  turn.classList.toggle('is-flipped',flashRevealed);
  turn.querySelector('[data-flash-face="front"]').setAttribute('aria-hidden',String(flashRevealed));
  turn.querySelector('[data-flash-face="back"]').setAttribute('aria-hidden',String(!flashRevealed));
  const button=document.querySelector('[data-flash-reveal]');
  button.setAttribute('aria-pressed',String(flashRevealed));
  button.textContent=flashRevealed?'Show prompt':'Reveal answer';
  const ratings=document.querySelector('[data-flash-ratings]');
  if(ratings)ratings.hidden=!flashRevealed;
}
function advanceFlash(direction=1, nextId=null) {
  const {deck,mode}=state.flashPrefs;
  const cards=flashSessionCards(deck,mode);
  if(mode==='replay'){
    state.flashPrefs.replayIndex=Math.max(0,Math.min(cards.length,(state.flashPrefs.replayIndex||0)+direction));
    persist();
  }else{
    const index=cards.findIndex(card=>card.id===flashSelected);
    flashSelected=nextId||cards[(index+direction+cards.length)%cards.length]?.id;
  }
  flashRevealed=false;render();
  document.querySelector('[data-flash-reveal],[data-flash-prev]:not([disabled])')?.focus();
}
function studyClick(e) {
  const t=e.target.closest('button');
  if(!t){
    if(e.target.closest('[data-flash-card]') && !window.getSelection()?.toString()){flipFlash();return true;}
    return false;
  }
  if(t.hasAttribute('data-cornell-all')){
    state.cornellShowAll=!state.cornellShowAll;
    for(const sample of document.querySelectorAll('.sample-slot'))sample.open=state.cornellShowAll;
    t.textContent=state.cornellShowAll?'Close all samples':'Reveal all samples';persist();return true;
  }
  if(t.dataset.moduleCornell){
    state.focusCornell=moduleSheets[t.dataset.moduleCornell];state.cornellUnit='All';flipPage('cornell');return true;
  }
  if(t.dataset.moduleReady){
    state.moduleReady[t.dataset.moduleReady]=!state.moduleReady[t.dataset.moduleReady];persist();render();return true;
  }
  if(t.dataset.cornellFlash||t.dataset.moduleFlash){
    state.flashPrefs.deck=t.dataset.cornellFlash||moduleSheets[t.dataset.moduleFlash]||'core';
    state.flashPrefs.replayIndex=0;flashSelected=null;flashRevealed=false;flipPage('flashcards');return true;
  }
  if(t.hasAttribute('data-flash-redo')){startFlashReplay();return true;}
  if(t.hasAttribute('data-flash-reveal')){flipFlash();return true;}
  if(t.hasAttribute('data-flash-next')){advanceFlash();return true;}
  if(t.hasAttribute('data-flash-prev')){advanceFlash(-1);return true;}
  if(t.dataset.flashRate!==undefined && flashRevealed && flashSelected){
    const {deck,mode}=state.flashPrefs;
    const before=flashSessionCards(deck,mode);
    const current=before.findIndex(card=>card.id===flashSelected);
    const nextId=before.length>1?before[(current+1)%before.length].id:null;
    const rating=Number(t.dataset.flashRate),days=rating?flashDays(flashSelected,rating):0;
    state.flashReviews[flashSelected]={days,due:Date.now()+(days?days*DAY:600000)};
    persist();advanceFlash(1,nextId);return true;
  }
  return false;
}
function studyChange(t) {
  const kind=t.hasAttribute('data-flash-deck')?'deck':t.hasAttribute('data-flash-mode')?'mode':null;
  if(!kind)return false;
  state.flashPrefs[kind]=t.value;state.flashPrefs.replayIndex=0;flashSelected=null;flashRevealed=false;persist();render();return true;
}
function saveCornellSlot(t) {
  if(!t.dataset.cornellSlot)return;
  const entries=state.cornellEntries[t.dataset.sheet]??={};
  entries[t.dataset.cornellSlot]=t.value;
  const count=document.querySelector('[data-cornell-count]');
  if(count)count.textContent=Object.values(entries).filter(value=>String(value).trim()).length+'/'+count.dataset.total+' slots filled';
  persist();
}

function tutorPaths(module) {
  const toPath=(row,diagnostic,i,example)=>({
    id:'issue-'+i,title:row[0],info:row[1],example,diagnostic,
    questions:row[2].map(n=>'at4-'+String(n).padStart(3,'0'))
  });
  const base=TUTOR_PATHS[module.id]||[];
  const checks=TUTOR_CHECKS[module.id]||[];
  return [
    ...base.map((row,i)=>toPath(row,checks[i],i)),
    ...(TUTOR_MORE[module.id]||[]).map((row,i)=>toPath(row,row[3],base.length+i,row[4]))
  ];
}
function tutorQuestions(module,path) {
  return path.questions.map(question).filter(Boolean);
}
function diagnosticChoices(path) {
  const [stem,...options]=path.diagnostic;
  const shift=Number(path.id.slice(6))%options.length;
  return {stem,options:options.map((_,i)=>options[(i+options.length-shift)%options.length]),correct:shift};
}
function diagnosticPanel(paths,run) {
  if(run.complete){
    const marked=paths.map(path=>{
      const answer=run.answers[path.id];
      return {path,answer,right:answer===diagnosticChoices(path).correct};
    });
    const correct=marked.filter(result=>result.right).length;
    const skipped=marked.filter(result=>result.answer==null).length;
    const suggested=marked.find(result=>!result.right&&result.answer!=null)||marked.find(result=>!result.right);
    return `<section class="card tutor-diagnostic"><div class="row spread"><h3 tabindex="-1" data-tutor-anchor>Diagnostic results</h3>
      <button class="btn small" data-tutor-action="reset">Retake diagnostic</button></div>
      <p><strong>${correct} of ${paths.length} correct</strong>${skipped?' · '+skipped+' skipped':''}</p>
      <p>${suggested?`Start with <strong>${esc(suggested.path.title)}</strong>, or choose another issue below.`:'You got every check right. You can still choose any issue for targeted practice.'}</p>
      <ul class="tutor-issues">${marked.map(({path,answer,right})=>`<li>
      <div>${pill(right?'Correct':answer==null?'Skipped':'Review',right?'good':'')} <strong>${esc(path.title)}</strong></div>
      <button class="btn small" data-tutor-pick="${esc(path.id)}">${path.id===suggested?.path.id?'Select recommended issue':'Select issue'}</button>
      </li>`).join('')}</ul></section>`;
  }
  const index=Math.min(run.index||0,paths.length-1);
  const path=paths[index];
  const {stem,options}=diagnosticChoices(path);
  const answer=run.answers[path.id];
  const hasAnswer=Number.isInteger(answer);
  return `<section class="card tutor-diagnostic">
    <div class="row spread"><h3 tabindex="-1" data-tutor-anchor>Topic diagnostic</h3>${pill((index+1)+' / '+paths.length)}</div>
    <progress value="${index+1}" max="${paths.length}" aria-label="Diagnostic question position"></progress>
    <p class="stem">${esc(stem)}</p>
    <div class="options">${options.map((option,i)=>`<button type="button" class="option${i===answer?' selected':''}" aria-pressed="${i===answer}" data-tutor-answer="${i}"><strong>${String.fromCharCode(65+i)}.</strong> ${esc(option)}</button>`).join('')}</div>
    <div class="btnrow">
      <button class="btn primary" data-tutor-action="next" ${hasAnswer?'':'disabled'}>${index===paths.length-1?'See results':'Next question'}</button>
      <button class="btn" data-tutor-action="skip">Skip question</button>
      <button class="btn" data-tutor-action="back" ${index?'':'disabled'}>Back</button>
    </div>
    <p class="sub">Your answers stay saved if you pause. Feedback appears after the final question.</p></section>`;
}
function tutorLesson(module,selected){
  const targeted=tutorQuestions(module,selected);
  const key=module.id+'::'+selected.id;
  const current=state.tutorDrafts[key]||'';
  const [scenario,workedAnswer]=selected.diagnostic;
  const first=targeted.find(q=>q.type==='short'&&q.model)||targeted.find(q=>q.type==='mc');
  const prompt=first?.stem||'Explain the key rule in your own words and give a different example where it applies.';
  const reference=first?.model||(first?.type==='mc'&&first.options[first.answer])||selected.info;
  const detail=first?.explanation;
  const marked=targeted.filter(q=>{
    const attempt=state.attempts.tutor?.[q.id];
    return attempt&&!attempt.pending;
  }).length;
  return `<section class="card workshop tutor-lesson">
    <div class="eyebrow">YOUR FOCUS</div><h3 tabindex="-1" data-tutor-anchor>${esc(selected.title)}</h3>
    <div class="tutor-step"><h4>1. Learn the rule</h4><p>${esc(selected.info)}</p></div>
    <div class="tutor-step"><h4>2. Follow a worked example</h4>
      <p>${esc(scenario)}</p><p><strong>${esc(workedAnswer)}</strong></p>
      ${selected.example?`<p>${esc(selected.example)}</p>`:''}</div>
    <div class="tutor-step"><h4>3. Try a fresh question from memory</h4><p class="explain">${esc(prompt)}</p>
      <textarea data-tutor-draft="${esc(key)}" aria-label="Tutor response" placeholder="Write your reasoning before opening the sample">${esc(current)}</textarea>
      <details class="sample-slot"><summary>Compare with a sample response</summary><div class="sample-text">${esc(reference)}${detail?`<p>${esc(detail)}</p>`:''}</div></details></div>
    </section>
    <section class="card"><h3>4. Practise this issue</h3>
    <div class="row spread"><p class="sub">${marked} of ${targeted.length} marked in tutor practice.</p>
    <button class="btn primary" data-start-tutor>Start ${targeted.length} targeted questions</button></div>
    <ol class="tutor-list">${targeted.map((q,i)=>`<li><button class="btn small" data-start-tutor="${i}">Question ${i+1}</button> <span>${esc(q.stem.split('\n')[0].slice(0,150))}</span> ${pill(TYPE_LABELS[q.type])}</li>`).join('')}</ol></section>`;
}
function tutor(){

  const module=DATA.modules.find(m=>m.id===prefs.module);
  const paths=module?tutorPaths(module):[];
  const issue=paths.find(item=>item.id===prefs.issue);
  const selected=issue&&issue.id===prefs.confirmed?issue:null;
  const run=module?state.tutorDiagnostics[module.id]:null;
  return title('Personal tutor','Choose a topic, narrow it to one issue, then confirm to open your lesson.')+
    `<section class="card"><label class="field">Topic
    <select data-tutor-field="module">${revisionOptions(module?.id||'',[['','Choose a topic'],...DATA.modules.map(m=>[m.id,m.id])])}</select></label>
    ${module?`<div class="btnrow"><button class="btn" data-tutor-action="toggle">${prefs.showDiagnostic?'Hide diagnostic':run?.complete?'View diagnostic results':run?'Resume diagnostic':'Start optional diagnostic'}</button>
    <span class="sub">One multiple-choice question per issue · ${paths.length} questions</span></div>`:''}</section>
    ${prefs.showDiagnostic&&run&&paths.length?diagnosticPanel(paths,run):''}
    ${module?`<section class="card"><label class="field">Issue

function startTutor(index){
  const module=DATA.modules.find(m=>m.id===state.tutorPrefs.module);
  const topic=module&&tutorPaths(module).find(path=>path.id===state.tutorPrefs.confirmed);
  if(!topic||topic.id!==state.tutorPrefs.issue)return;
  state.tutorQueue=tutorQuestions(module,topic).map(q=>q.id);
  Object.assign(state.practice,{set:'tutor',unit:'All',module:'All',type:'All',difficulty:'All',status:'all',query:'',index});
  flipPage('practice');
}
function tutorClick(e){
  const start=e.target.closest('[data-start-tutor]');
  if(start){startTutor(Number(start.dataset.startTutor)||0);return true;}
  const moduleLink=e.target.closest('[data-open-tutor]');
  if(moduleLink){
    state.tutorPrefs={module:moduleLink.dataset.openTutor,issue:'',confirmed:'',showDiagnostic:false};
    flipPage('tutor');return true;
  }
  const pick=e.target.closest('[data-tutor-pick]');
  if(pick){
    Object.assign(state.tutorPrefs,{issue:pick.dataset.tutorPick,confirmed:'',showDiagnostic:false});
    persist();render();document.querySelector('[data-tutor-action="confirm"]')?.focus();return true;
  }
  const button=e.target.closest('[data-tutor-action],[data-tutor-answer]');
  if(button){
    const prefs=state.tutorPrefs;
    const module=DATA.modules.find(m=>m.id===prefs.module);
    if(!module)return true;
    const paths=tutorPaths(module);
    const action=button.dataset.tutorAction;
    const freshRun=()=>({index:0,answers:{},complete:false});
    let run=state.tutorDiagnostics[module.id];
    let focus='[data-tutor-anchor]';
    if(action==='confirm'){
      if(paths.some(path=>path.id===prefs.issue)){
        prefs.confirmed=prefs.issue;prefs.showDiagnostic=false;
      }
    }else if(action==='toggle'){
      if(!run)state.tutorDiagnostics[module.id]=freshRun();
      prefs.showDiagnostic=!prefs.showDiagnostic;
      if(!prefs.showDiagnostic)focus='[data-tutor-action="toggle"]';
    }else if(action==='reset'){
      state.tutorDiagnostics[module.id]=freshRun();
    }else if(run&&!run.complete){
      const path=paths[run.index];
      if(button.hasAttribute('data-tutor-answer')){
        run.answers[path.id]=Number(button.dataset.tutorAnswer);
        focus=`[data-tutor-answer="${button.dataset.tutorAnswer}"]`;
      }else if(action==='back'){
        run.index=Math.max(0,run.index-1);
      }else if(action==='next'||action==='skip'){
        if(action==='skip')run.answers[path.id]=null;
        if(run.index===paths.length-1)run.complete=true;
        else run.index++;
      }
    }
    persist();render();document.querySelector(focus)?.focus();return true;
  }
  const retry=e.target.closest('[data-retry-current]');
  if(retry){
    const q=filtered()[state.practice.index];
    if(!q)return true;
    const attempt=state.attempts[state.practice.set]?.[q.id];
    if(attempt)attempt.hideFeedback=true;
    delete state.practice.drafts[q.id];matchSelection=null;persist();render();
    document.querySelector('[data-answer="p"],[data-choice="p"],[data-match-side="left"],[data-blank="p"]')?.focus();
    return true;
  }
  return false;
}
function tutorChange(t){
  const field=t.dataset.tutorField;
  if(field==='module'){
    state.tutorPrefs={module:t.value,issue:'',confirmed:'',showDiagnostic:false};
    persist();render();document.querySelector('[data-tutor-field="module"]')?.focus();return true;
  }
  if(field==='issue'){
    state.tutorPrefs.issue=t.value;
    if(state.tutorPrefs.confirmed!==t.value)state.tutorPrefs.confirmed='';
    persist();render();document.querySelector('[data-tutor-field="issue"]')?.focus();return true;
  }
  return false;
}

function bulkPreviewMarkup({accepted,issues}) {

  return `<div class="bulk-preview"><h4>Review import</h4>
    <p>${accepted.length} ready · ${failureCount} skipped</p>

    ${failureCount?`<details class="bulk-format" open><summary>Skipped sources and packs (${failureCount})</summary>
      <ul class="bulk-results">${issues.map(({sourceName,message})=>`<li><strong>${esc(sourceName)}</strong><span class="sub">${esc(message)}</span></li>`).join('')}</ul>
    </details>`:''}
    ${accepted.length?`<button type="button" class="btn primary" data-bulk-commit>Import ${accepted.length} valid pack${accepted.length===1?'':'s'}</button>`:'<p class="sub">Fix a source or choose another and preview again.</p>'}

}

async function inspectBulkSources(files,folder,pastedText) {
  const accepted=[],issues=[],knownKeys=existingImportKeys();
  const reject=(sourceName,message)=>issues.push({sourceName,message});
  const sources=[...new Set([...files,...folder])];
  const totalSources=sources.length+Number(Boolean(pastedText.trim()));
  if (!totalSources) return {accepted,issues:[{sourceName:'No sources selected',message:'Choose files or a folder, or paste import text.'}]};
  if (totalSources>BULK_SOURCE_LIMIT)
    return {accepted,issues:[{sourceName:'Batch limit',message:'Preview up to 100 sources at a time.'}]};
  let batchBytes=0;
  let packsChecked=0;
  const addText=(sourceText,sourceName)=>{
    let parsed;
    try { parsed=parseImportText(sourceText); }
    catch (error) { reject(sourceName,error.message);return; }
    const packs=Array.isArray(parsed)?parsed:[parsed];
    if (!packs.length) { reject(sourceName,'The pack list is empty.');return; }
    if (packsChecked+packs.length>BULK_SOURCE_LIMIT) {
      reject(sourceName,'This source would take the batch over 100 packs. Split it into smaller batches.');
      return;
    }
    packsChecked+=packs.length;
    packs.forEach((rawPack,index)=>{
      const entryName=packs.length===1?sourceName:`${sourceName} · pack ${index+1}`;
      try {
        const prepared=buildImportedPack(rawPack,entryName);
        const key=packContentKey(prepared.kind,prepared.pack);
        if (knownKeys.has(key)) { reject(entryName,'Identical to a pack already imported or in this preview.');return; }
        knownKeys.add(key);
        accepted.push({...prepared,key,sourceName:entryName});
      } catch (error) { reject(entryName,error.message); }
    });
  };
  for (const file of sources) {
    const sourceName=file.webkitRelativePath||file.name;
    if (!/\.(json|txt)$/i.test(file.name)) { reject(sourceName,'Unsupported file. Use .json or .txt.');continue; }
    if (file.size>IMPORT_SOURCE_BYTES) { reject(sourceName,'Larger than the 2 MiB per-source limit.');continue; }
    batchBytes+=file.size;
    if (batchBytes>BULK_BATCH_BYTES) { reject(sourceName,'The batch exceeds 8 MiB. Import this file in a smaller batch.');continue; }
    try { addText(await file.text(),sourceName); }
    catch { reject(sourceName,'Could not read this file. Select it again and retry.'); }
  }
  if (pastedText.trim()) {
    const pasteBytes=new Blob([pastedText]).size;
    if (pasteBytes>IMPORT_SOURCE_BYTES) reject('Pasted text','Larger than the 2 MiB per-source limit.');
    else if (batchBytes+pasteBytes>BULK_BATCH_BYTES) reject('Pasted text','The batch exceeds 8 MiB. Preview the pasted text separately.');
    else addText(pastedText,'Pasted text');
  }
  return {accepted,issues};
}
function clearBulkImport() {
  Object.assign(bulkImportSession,{files:[],folder:[],pastedText:'',preview:null});
}
function commitBulkImport() {
  const preview=bulkImportSession.preview;
  if (!preview?.accepted.length || bulkImportSession.busy) return;
  const knownKeys=existingImportKeys();
  const newImports=preview.accepted.filter(entry=>!knownKeys.has(entry.key));
  const duplicateCount=preview.accepted.length-newImports.length;
  if (!newImports.length) {
    setBulkPreview({accepted:[],issues:[...preview.issues,{sourceName:'Batch',message:'These packs have already been imported.'}]});
    return;
  }
  const nextState=appendImportedPacks(state,newImports);
  const newBanks=newImports.filter(entry=>entry.kind==='practice');
  const bankCount=newBanks.length;
  if (bankCount) nextState.practice=practiceWithImportedBank(state.practice,newBanks.at(-1).pack.id);
  nextState.message=`Imported ${bankCount} practice bank(s) and ${newImports.length-bankCount} exam(s). ${preview.issues.length+duplicateCount} skipped.`;
  if (persist(nextState)) {
    state=nextState;
    // Keep rejected-source feedback visible after saving the valid subset.
    const issues=preview.issues.slice();
    if (duplicateCount) issues.push({sourceName:'Batch',message:`${duplicateCount} pack(s) were already imported.`});
    clearBulkImport();
    if (issues.length) bulkImportSession.preview={accepted:[],issues};
  }
  render();
  document.getElementById('bulk-import-title')?.focus();
}
