","evidenceGroups":[["time","hours","duration"],["> 0","positive","greater than 0","greater than zero","above zero"],["division by zero","divide by zero","negative duration","negative time","valid denominator"]]}],"unit":"Programming"},{"id":"at4-017","module":"Desk Checking and Sub-programs","type":"mc","stem":"Given `def total(price, qty): return price * qty`, which statement is correct for `total(6, 3)`?","marks":1,"difficulty":"Exam","evidence":"AT4 study guide","options":["price and qty are arguments","6 and 3 are parameters","6 and 3 are arguments and the result is 18","The function prints 18"],"answer":2,"explanation":"The call passes arguments to parameters price and qty. return gives the result to the caller without printing it.","unit":"Programming"},{"id":"at4-018","module":"Unit Testing and Error Detection","type":"blank","stem":"A missing closing parenthesis produces a _____ error. Dividing by zero while running produces a _____ error. Charging $5 where the specification says $4 produces a _____ error.","marks":3,"difficulty":"Exam","evidence":"AT4 study guide","parts":[{"prompt":"Missing parenthesis","options":["logic","runtime","syntax","hardware"],"answer":2},{"prompt":"Divide by zero","options":["runtime","syntax","logic","hardware"],"answer":0},{"prompt":"Wrong charge","options":["syntax","hardware","runtime","logic"],"answer":3}],"explanation":"Syntax affects how code can be parsed. A runtime error occurs during execution. A logic error can produce an incorrect result without an exception.","unit":"Programming"},{"id":"at4-019","module":"Unit Testing and Error Detection","type":"short","stem":"The rule is “free delivery when the order total is at least $50”. The function incorrectly tests `total > 50`. Provide one boundary test with expected and faulty outputs, and give the corrected condition.","marks":4,"difficulty":"Exam","evidence":"AT4 study guide","model":"Use total = 50. Expect free delivery. The faulty function charges for delivery because 50 > 50 is false. Use total >= 50.","criteria":[{"label":"Boundary input","why":"Use exactly $50.","evidenceGroups":[["50"]]},{"label":"Expected output","why":"Free delivery.","evidenceGroups":[["free delivery","delivery is free","free shipping","no delivery charge","expected free"]]},{"label":"Faulty output","why":"Paid delivery.","evidenceGroups":[["faulty function charges","incorrectly charges","paid delivery","charges for delivery","actual paid","actual charges","faulty result paid"]]},{"label":"Fix","why":"Use total >= 50.","evidenceGroups":[[">= 50","at least 50","50 or more","greater than or equal to 50"]]}],"unit":"Programming"},{"id":"at4-020","module":"LAN, WAN, WLAN, VLAN, VPN — Essential Networking","type":"mc","stem":"Students on Wi-Fi and staff on Ethernet connect on one campus. Which description identifies the wireless part of the local network?","marks":1,"difficulty":"Exam","evidence":"Canvas lesson • supporting AT4 topic","options":["WAN","VPN","WLAN","VLAN"],"answer":2,"explanation":"A WLAN is a wireless local area network. Wi-Fi does not by itself indicate segmentation, a secure tunnel or wide-area scope.","unit":"Networks"},{"id":"at4-021","module":"Network Hardware","type":"blank","stem":"Connect classroom devices by cable using a _____. Connect tablets over Wi-Fi using an _____. Enforce a rule blocking incoming connections using a _____.","marks":3,"difficulty":"Exam","evidence":"AT4 study guide","parts":[{"prompt":"Wired classroom","options":["modem","switch","firewall","access point"],"answer":1},{"prompt":"Wireless tablets","options":["switch","router only","access point","NIC"],"answer":2},{"prompt":"Traffic rule","options":["hub","access point","NIC","firewall"],"answer":3}],"explanation":"A switch connects wired devices locally, an access point provides wireless connectivity and a firewall filters traffic according to rules.","unit":"Networks"},{"id":"at4-022","module":"Network Hardware","type":"short","stem":"An industrial link runs 600 m beside motors that cause electromagnetic interference. Choosing between ordinary copper Ethernet cabling and suitably rated optical fibre, recommend one and give two reasons.","marks":3,"difficulty":"Exam","evidence":"AT4 study guide","model":"Use suitably rated optical fibre. It carries light, so the optical signal is immune to the electromagnetic interference from the motors. Suitable fibre and transceivers can cover 600 m, beyond the usual 100 m limit for ordinary twisted-pair Ethernet links.","criteria":[{"label":"Choice","why":"Suitably rated optical fibre.","evidenceGroups":[["fibre","fiber"]],"contradictions":["choose copper","recommend copper"]},{"label":"Interference","why":"Light signals avoid electromagnetic interference on the link.","evidenceGroups":[["light","optical","fibre","fiber"],["immune","unaffected","not affected","resistant","avoids","does not pick up"],["interference","emi","electromagnetic"]]},{"label":"Range","why":"The chosen fibre link supports the required distance.","evidenceGroups":[["600 m","600m","longer distance","long distance","100 m","100m","required distance"],["fibre","fiber","supports","cover","covers","range","beyond","limit"]]}],"unit":"Networks"},{"id":"at4-023","module":"Data Processing and Transmission","type":"blank","stem":"Look up the server’s IP address from its hostname using _____. Across networks, routers forward packets using destination _____. For reliable ordered delivery in a TCP connection, use _____.","marks":3,"difficulty":"Exam","evidence":"AT4 study guide","parts":[{"prompt":"Hostname lookup","options":["MAC","DNS","TCP","VLAN"],"answer":1},{"prompt":"Destination identifier","options":["MAC address only","filename","IP address","port number only"],"answer":2},{"prompt":"Ordered reliable stream","options":["DNS","TCP","Wi-Fi","VLAN"],"answer":1}],"explanation":"DNS performs name resolution. Routers forward IP packets towards the destination IP network. TCP provides an ordered reliable byte stream.","unit":"Networks"},{"id":"at4-024","module":"Data Processing and Transmission","type":"mc","stem":"A video uses H.264 inside an MP4 file. Which is accurate?","marks":1,"difficulty":"Exam","evidence":"AT4 study guide","options":["MP4 compresses frames and H.264 labels the file","Both are only extensions","H.264 is a codec and MP4 is a container","Both are network protocols"],"answer":2,"explanation":"H.264 defines video coding. MP4 holds streams and associated information.","unit":"Networks"},{"id":"at4-025","module":"Vulnerabilities Intro","type":"short","stem":"A fake school sign-in page captures a staff password. Identify the attack, explain one possible consequence and explain how MFA reduces the risk.","marks":3,"difficulty":"Exam","evidence":"AT4 study guide","model":"This is phishing. An attacker could use the stolen password to access staff files. MFA can require a separate proof of identity, reducing the chance that the password alone is enough.","criteria":[{"label":"Attack","why":"Identify phishing.","evidenceGroups":[["phishing"]]},{"label":"Consequence","why":"A plausible unauthorised action with the stolen password.","evidenceGroups":[["stolen","captured","attacker","unauthorised","unauthorized"],["access","log in","login","impersonate","account","files","staff data"]]},{"label":"Defence","why":"A separate authentication factor reduces reliance on the password alone.","evidenceGroups":[["factor","proof","code","authenticator","key","biometric"],["password","stolen","alone","second","separate","additional"]],"contradictions":["mfa means the password alone is enough","mfa uses only the password"]}],"unit":"Networks"},{"id":"at4-026","module":"Social Ethical","type":"short","stem":"A robot operates near workers. A supplied workplace rule requires risk to be eliminated or minimised so far as reasonably practicable. Identify a hazard, propose a control and explain how to test it before use.","marks":3,"difficulty":"Exam","evidence":"AT4 study guide","model":"A person could be struck by the robot arm. Fit an interlocked barrier that prevents hazardous movement when open. In a controlled test, open the guard and verify the arm cannot start or keep moving hazardously as specified.","criteria":[{"label":"Hazard","why":"A concrete source of injury, such as contact with a moving arm.","evidenceGroups":[["struck","crush","crushed","hit","contact","injury","caught"],["arm","robot","moving","movement"]]},{"label":"Control","why":"A suitable engineering or other justified control tied to the hazard.","evidenceGroups":[["guard","barrier","interlock","light curtain","separation","emergency stop"],["stop","prevents","prevent","reduces","isolate","separate","hazardous movement","access"]]},{"label":"Test","why":"A safe test and an observable expected behaviour.","evidenceGroups":[["test","verify","check","attempt","simulate"],["open","break","enter","trigger","press"],["cannot start","stops","stop","no movement","prevent","cannot move"]]}],"sourceUrl":"https://legislation.nsw.gov.au/view/html/inforce/current/act-2011-010#sec.19","sourceLabel":"NSW Work Health and Safety Act, section 19 (context)","unit":"Mechatronics"},{"id":"at4-027","module":"Mechatronic Systems","type":"blank","stem":"In an automatic door, the beam receiver is the _____. The programmed board is the _____. The motor that opens the door is the _____.","marks":3,"difficulty":"Exam","evidence":"AT4 study guide","parts":[{"prompt":"Beam receiver","options":["actuator","controller","sensor","network"],"answer":2},{"prompt":"Board","options":["controller","actuator","link","sensor"],"answer":0},{"prompt":"Motor","options":["sensor","controller","power source","actuator"],"answer":3}],"explanation":"The receiver provides input, the board processes readings and the motor produces physical motion.","unit":"Mechatronics"},{"id":"at4-028","module":"Repetition","type":"mc","stem":"What does `list(range(2, 8, 2))` evaluate to?","marks":1,"difficulty":"Exam","evidence":"AT4 study guide","options":["[2, 4, 6, 8]","[2, 4, 6]","[0, 2, 4, 6]","[2, 8]"],"answer":1,"explanation":"The stop value 8 is excluded, so the loop visits 2, 4 and 6.","unit":"Programming"},{"id":"at4-029","module":"Selection","type":"mc","stem":"When `valid = False` and `score = 80`, what is the value of `valid and score >= 50`?","marks":1,"difficulty":"Exam","evidence":"AT4 study guide","options":["80","True","False","A syntax error occurs"],"answer":2,"explanation":"The expression uses AND. The false validity flag makes the entire expression false.","unit":"Programming"},{"id":"at4-030","module":"Data Structures","type":"blank","stem":"After `values = [9, 4, 7]`, `values[0]` is _____. After `values[1] = 6`, the second value is _____. After `values.append(2)`, the length is _____.","marks":3,"difficulty":"Exam","evidence":"Canvas lesson • supporting AT4 topic","parts":[{"prompt":"Index 0","options":["4","7","9","0"],"answer":2},{"prompt":"Second value","options":["4","6","9","7"],"answer":1},{"prompt":"Length","options":["2","3","5","4"],"answer":3}],"explanation":"Python indexes lists from zero. Assignment replaces the existing element. append adds a new element at the end.","unit":"Programming"},{"id":"at4-031","module":"Pseudocode","type":"pseudo","stem":"Write classroom pseudocode for Menu Choice. Read one letter. Using CASEWHERE, display \"Add\" for A, \"Remove\" for R and \"Invalid\" for every other letter. Use a named procedure.","marks":5,"difficulty":"Exam","evidence":"AT4 study guide","solution":"BEGIN Menu Choice\n    INPUT choice\n    CASEWHERE choice evaluates to\n        A: OUTPUT \"Add\"\n        R: OUTPUT \"Remove\"\n    OTHERWISE: OUTPUT \"Invalid\"\n    ENDCASE\nEND Menu Choice","rubric":[{"label":"Named procedure","why":"Use BEGIN Menu Choice and matching END Menu Choice, with indentation."},{"label":"Input and dispatch","why":"Read choice, then use CASEWHERE choice evaluates to."},{"label":"Two cases","why":"A gives Add and R gives Remove."},{"label":"Default","why":"OTHERWISE gives Invalid."},{"label":"Closing keyword","why":"Use ENDCASE after the OTHERWISE branch."}],"unit":"Programming"},{"id":"at4-032","module":"Repetition","type":"code","stem":"Write `count_safe(readings, limit)` to return the number of numeric readings strictly greater than 0 and at most limit. readings may be empty and limit is positive. Return an integer.","marks":5,"difficulty":"Exam","evidence":"AT4 study guide","function":"count_safe","starter":"def count_safe(readings, limit):\n    ","solution":"def count_safe(readings, limit):\n    total = 0\n    for reading in readings:\n        if 0 < reading <= limit:\n            total += 1\n    return total","tests":[{"args":[[],3],"expected":0},{"args":[[0,3,4],3],"expected":1},{"args":[[1,2,3],3],"expected":3},{"args":[[-1,0,5],4],"expected":0},{"args":[[4.9,5,5.1,1],5],"expected":3}],"explanation":"Keep the lower boundary exclusive and the upper boundary inclusive. Return the counter after all readings have been processed.","unit":"Programming"},{"id":"at4-033","module":"Error Correction","type":"short","stem":"This function should return the sum of all entries. Explain what happens for [3, 4, 5] and for an empty list. Then describe the smallest correction.\n\ndef add_all(values):\n    total = 0\n    for value in values:\n        total += value\n        return total","marks":3,"difficulty":"Exam","evidence":"AT4 study guide","model":"It returns 3 after the first iteration. For an empty list, the loop never runs and the function reaches its end, returning None. Unindent return total by one level so it runs after the loop and returns 0 for an empty list.","criteria":[{"label":"Non-empty case","why":"It returns 3 after processing the first entry.","evidenceGroups":[["return 3","returns 3","result is 3","result 3","first iteration 3"]]},{"label":"Empty case","why":"It returns None because the loop is skipped.","evidenceGroups":[["none","no value","implicit none"]]},{"label":"Fix","why":"Move return total outside the loop while keeping it inside the function.","evidenceGroups":[["outside the loop","after the loop","unindent return","dedent return","unindent the return","move return left"]]}],"unit":"Programming"},{"id":"at4-034","module":"Data Processing and Transmission","type":"short","stem":"A 12 MB file is sent over an ideal 8 Mb/s link. Treat MB and Mb as decimal units and ignore overhead. Calculate the transfer time and give one reason a real transfer might take longer.","marks":3,"difficulty":"Exam","evidence":"Canvas lesson • supporting AT4 topic","model":"12 MB × 8 = 96 Mb. At 8 Mb/s, 96 ÷ 8 = 12 seconds. Protocol overhead, congestion or retransmissions can increase the actual time.","criteria":[{"label":"Conversion","why":"Convert to 96 Mb, or convert the speed to 1 MB/s.","evidenceGroups":[["96 Mb","96 megabits","1 MB/s","1 megabyte per second"]]},{"label":"Calculation","why":"Calculate 12 seconds with consistent units.","evidenceGroups":[["12 seconds","12 s","12secs","12 sec"]]},{"label":"Real-world factor","why":"Explain a plausible cause, such as protocol overhead using part of the available bandwidth.","evidenceGroups":[["overhead","congestion","retransmission","retransmissions","packet loss","competing traffic","other users","shared link"]]}],"unit":"Networks"},{"id":"at4-035","module":"Computer Networks","type":"mc","stem":"In a wired star with one central switch, which single failure most directly disconnects every connected computer from the others?","marks":1,"difficulty":"Exam","evidence":"AT4 study guide","options":["A cable to one computer breaks","One computer’s monitor stops working","The central switch loses power","A student closes their browser"],"answer":2,"explanation":"The central switch is a shared point of failure. One endpoint cable normally affects only its own device.","unit":"Networks"},{"id":"at4-036","module":"Graph Theory","type":"short","stem":"An undirected unweighted network has edges AB, AC, BC, CD and DE. Give C’s degree, a shortest path from A to E and its length. Which edge between D and E must remain for E to reach the other nodes?","marks":4,"difficulty":"Exam","evidence":"Canvas lesson • supporting AT4 topic","model":"C’s degree is 3 (A, B and D). A → C → D → E is shortest, at 3 edges. DE is E’s only link, so removing it isolates E.","criteria":[{"label":"Degree","why":"C has degree 3.","evidenceGroups":[["degree 3","degree is 3","degree of 3","degree of c is 3","c has 3","c 3","c 3 connections","a b and d"]]},{"label":"Shortest path","why":"A–C–D–E.","evidenceGroups":[["a c d e"]]},{"label":"Length","why":"Three edges.","evidenceGroups":[["3 edges","three edges","3 hops","three hops"]]},{"label":"Connectivity","why":"DE is E’s only link.","evidenceGroups":[["de","d e"],["isolates","only link","only connection","only edge","disconnect","disconnects","isolated","bridge"]]}],"unit":"Networks","diagram":"graph"},{"id":"at4-037","module":"Vulnerabilities Intro","type":"mc","stem":"Which action most directly closes a known flaw in the school router’s current firmware?","marks":1,"difficulty":"Exam","evidence":"AT4 study guide","options":["Rename the Wi-Fi network","Install the manufacturer’s security update","Add a backup drive","Move the router closer to the classroom"],"answer":1,"explanation":"The update addresses the firmware flaw. A backup may help recovery after an incident, but it does not patch the router.","unit":"Networks"},{"id":"at4-038","module":"Algorithms Robotics","type":"blank","stem":"The robot must move when distance is greater than 55 mm and stop otherwise. At 56 mm it should _____. At 55 mm it should _____. At 54 mm it should _____.","marks":3,"difficulty":"Exam","evidence":"AT4 study guide","parts":[{"prompt":"56 mm","options":["move","stop","reverse","ignore reading"],"answer":0},{"prompt":"55 mm","options":["reverse","move","ignore reading","stop"],"answer":3},{"prompt":"54 mm","options":["stop","ignore reading","move","reverse"],"answer":0}],"explanation":"The condition is strictly greater than 55, so equality follows the stop branch.","unit":"Mechatronics"},{"id":"at4-039","module":"Automation","type":"short","stem":"A pump reads a soil sensor every minute. It waters when moisture is below 25% and stops otherwise. Explain how the repeated measurement affects the pump and name one realistic failure that should be tested.","marks":3,"difficulty":"Exam","evidence":"AT4 study guide","model":"A low reading starts watering. The controller takes another reading later and stops the pump once the measured moisture reaches 25% or more. Test a disconnected sensor: a missing or invalid reading should lead to a safe state, such as the pump staying off and a warning.","criteria":[{"label":"Response","why":"Below 25%, the controller turns on the pump.","evidenceGroups":[["below 25","less than 25","< 25","under 25","low reading"],["water","watering","turn on","turns on","starts","start"]]},{"label":"Feedback","why":"A subsequent measurement at or above 25% causes the pump to stop.","evidenceGroups":[["reaches 25","25 or more",">= 25","25 or higher","at least 25"],["stops","stop","switches off","turns off","pump off"]]},{"label":"Failure test","why":"Describe a realistic failure and a safe expected outcome.","evidenceGroups":[["disconnected","invalid","missing","failed","broken","fault"],["stays off","stop","stops","warning","alert","shut off","turn off","pump off"]]}],"unit":"Mechatronics"},{"id":"at4-040","module":"Pseudocode","type":"pseudo","stem":"Write classroom pseudocode for Read PIN. Prompt for and read a PIN at least once, repeat until it matches a given expectedPIN and display \"Unlocked\" once at the end. Use a named procedure and a post-test loop.","marks":5,"difficulty":"Exam","evidence":"AT4 study guide","solution":"BEGIN Read PIN\n    REPEAT\n        OUTPUT \"Enter PIN\"\n        INPUT pin\n    UNTIL pin = expectedPIN\n    OUTPUT \"Unlocked\"\nEND Read PIN","rubric":[{"label":"Named procedure","why":"BEGIN Read PIN and END Read PIN with indentation."},{"label":"Post-test structure","why":"A matching REPEAT and UNTIL pair."},{"label":"Input in the loop","why":"Prompt and read the PIN on every attempt."},{"label":"Stopping condition","why":"UNTIL the entered PIN equals expectedPIN."},{"label":"Final output","why":"Display Unlocked once, after the loop."}],"unit":"Programming"},{"id":"at4-041","module":"Flowcharts","type":"short","stem":"A flowchart reads n, tests n > 0 and, on Yes, prints n then sets n to n − 1 before returning to the test. On No it ends. Trace the printed output for n = 3. Explain why the Yes arrow must return to the decision rather than to input.","marks":3,"difficulty":"Exam","evidence":"AT4 study guide","model":"It prints 3, then 2, then 1. Returning to the decision tests the updated n. Returning to input would ask for and overwrite n with a new value, so the countdown would no longer be controlled by the decrement.","criteria":[{"label":"Trace","why":"3, 2, 1 in order and no zero.","evidenceGroups":[["3 2 1","3 then 2 then 1"]],"contradictions":["3 2 1 0","3 then 2 then 1 then 0"]},{"label":"Updated state","why":"The decision uses the updated n.","evidenceGroups":[["decision","test","condition"],["updated","new value","decremented","decrement","subtract"]]},{"label":"Input error","why":"Returning to input would replace n rather than use the decremented value.","evidenceGroups":[["overwrites","overwrite","replace","replaces","asks again","ask again","re enter","new input"]]}],"unit":"Programming","diagram":"countdown"},{"id":"at4-042","module":"Data Types","type":"mc","stem":"What happens when Python runs `print(\"5\" + 2)`?","marks":1,"difficulty":"Exam","evidence":"AT4 study guide","options":["Prints 7","Raises a TypeError","Prints 52","Prints \"5 + 2\""],"answer":1,"explanation":"Python does not implicitly convert the integer to a string or the string to an integer for this addition.","unit":"Programming"},{"id":"at4-043","module":"Basic Programming Concepts","type":"code","stem":"Write `parcel_charge(weight, express)`. For weight from 0 up to and including 2 kg, base charge is 6. Above 2 kg it is 10. If express is True, add 4. Return the charge as an integer.","marks":5,"difficulty":"Exam","evidence":"AT4 study guide","function":"parcel_charge","starter":"def parcel_charge(weight, express):\n    ","solution":"def parcel_charge(weight, express):\n    if weight <= 2:\n        charge = 6\n    else:\n        charge = 10\n    if express:\n        charge += 4\n    return charge","tests":[{"args":[0,false],"expected":6},{"args":[2,false],"expected":6},{"args":[2,true],"expected":10},{"args":[2.1,false],"expected":10},{"args":[3,true],"expected":14}],"explanation":"Work out the base charge first and then apply the express surcharge. At exactly 2 kg the lower base charge applies.","unit":"Programming"},{"id":"at4-044","module":"Desk Checking and Sub-programs","type":"short","stem":"A program calls `area(4, 3)` twice and uses the results in a total. The area function currently does `print(width * height)`. Explain the problem, give the replacement line and state the correct total.","marks":3,"difficulty":"Exam","evidence":"AT4 study guide","model":"Printing shows 12 but supplies no value to the caller, so each call returns None. Replace the print line with return width * height. The two returned areas sum to 24.","criteria":[{"label":"Effect","why":"The function displays 12 but returns None.","evidenceGroups":[["print","prints","display","displays"],["none","no return value","no value","does not return"]]},{"label":"Replacement","why":"Use return width * height.","evidenceGroups":[["return width * height","return height * width"]]},{"label":"Result","why":"24.","evidenceGroups":[["24"]]}],"unit":"Programming"},{"id":"at4-045","module":"LAN, WAN, WLAN, VLAN, VPN — Essential Networking","type":"short","stem":"A school uses a student VLAN and a staff VLAN. Explain why a single switch can support both and why a student who can browse the web still needs a separate access rule for a staff resource.","marks":3,"difficulty":"Exam","evidence":"AT4 study guide","model":"A managed switch can logically group ports into different VLANs. Their broadcasts are separated. Web access and access to staff resources are different destinations or services, so an inter-network firewall or access policy should permit web access while controlling or denying student access to staff resources.","criteria":[{"label":"Single switch","why":"Managed VLAN membership can separate logical groups on shared hardware.","evidenceGroups":[["switch"],["logical","logically","separate","different"],["vlan","vlans"]]},{"label":"Effect","why":"Separate local broadcast traffic.","evidenceGroups":[["broadcast","broadcasts"],["separate","separated","within","confined","stay","remain"]]},{"label":"Access rule","why":"Allow needed internet traffic and apply a separate restrictive rule to staff resources.","evidenceGroups":[["firewall","access rule","policy","acl"],["staff","staff resource","staff resources"],["web","internet"],["block","deny","restrict","control","denying","restricting","controlling"]]}],"unit":"Networks"},{"id":"at4-046","module":"Identifying and Defining","type":"short","stem":"Design a small temporary network for a mobile school registration desk and an existing wired campus connection. State one functional requirement, one non-functional requirement and a test for the functional requirement.","marks":3,"difficulty":"Exam","evidence":"Canvas lesson • supporting AT4 topic","model":"Functional: the desk tablets must reach the registration server over Wi-Fi. Non-functional: the registration confirmation should display within three seconds under the stated expected load. Test by connecting a tablet, submitting a test registration and checking that the server records it and the tablet receives confirmation.","criteria":[{"label":"Function","why":"States what the solution must do.","evidenceGroups":[["tablet","tablets","desk","register","registration"],["reach","connect","submit","send","access","server","wifi"]]},{"label":"Quality","why":"States a measurable quality or constraint.","evidenceGroups":[["seconds","second","response time","latency","availability","uptime","signal strength","kb/s","mb/s"],["within","under","less than","at least","limit","display","maximum","minimum","target"]]},{"label":"Test","why":"Gives a procedure and observable expected result for the stated function.","evidenceGroups":[["test","connect","submit","send"],["confirmation","server records","record","receive","can access","successful","receives","appears"]]}],"unit":"Networks"},{"id":"at4-047","module":"Data Processing and Transmission","type":"mc","stem":"Which pair correctly identifies the addressing used for local Ethernet delivery and for forwarding between IP networks?","marks":1,"difficulty":"Exam","evidence":"AT4 study guide","options":["Local IP / between networks MAC","Local DNS / between networks TCP","Local MAC / between networks destination IP","Local SSID / between networks MAC"],"answer":2,"explanation":"A local frame uses link-layer addresses. Routing across networks uses the destination IP address.","unit":"Networks"},{"id":"at4-048","module":"Social and Ethical","type":"short","stem":"A student team wants to publish a video of its robot test. Student faces and readable name tags appear. Describe one privacy risk and give two practical steps before publishing.","marks":3,"difficulty":"Exam","evidence":"AT4 study guide","model":"The clip can reveal identities and school participation to unintended viewers. Obtain informed permission before sharing images of people who are identifiable. Reframe or blur people and remove readable name tags when identifiable footage is unnecessary.","criteria":[{"label":"Risk","why":"Links identifying details to a plausible privacy consequence.","evidenceGroups":[["face","faces","name","name tags","identities","identity","identifiable"],["risk","reveal","expose","unintended","public","recognise","recognize","dox","privacy","identify","identified"]]},{"label":"Permission","why":"Ask identifiable people for permission before sharing, following school procedures.","evidenceGroups":[["permission","consent","ask before","ask first"]]},{"label":"Data minimisation","why":"Remove, blur or otherwise avoid sharing unnecessary identifiers.","evidenceGroups":[["blur","crop","reframe","remove","redact","mask","obscure","hide"]]}],"sourceUrl":"https://www.esafety.gov.au/young-people/consent-sharing-photos-videos","sourceLabel":"eSafety Commissioner · consent for photo and video sharing","unit":"Networks"},{"id":"at4-049","module":"Components","type":"blank","stem":"A robot’s distance sensor provides _____. Its program compares the reading with a threshold during _____. Its drive motor performs the resulting _____.","marks":3,"difficulty":"Exam","evidence":"AT4 study guide","parts":[{"prompt":"Sensor reading","options":["input","processing","output","policy"],"answer":0},{"prompt":"Comparison","options":["output","actuation","processing","storage"],"answer":2},{"prompt":"Motor action","options":["input","output","processing","sampling"],"answer":1}],"explanation":"Measurement is input, comparison is processing and motor movement is physical output.","unit":"Mechatronics"},{"id":"at4-050","module":"Automation","type":"short","stem":"A farm uses a sensor-controlled seed dispenser. Compare one benefit and one limitation of automation in this case. Give a practical way to reduce the limitation.","marks":3,"difficulty":"Exam","evidence":"AT4 study guide","model":"Automation can dispense seeds at repeatable intervals and reduce missed patches. A blocked chute may leave gaps even while the controller commands a drop. A chute sensor and warning can help detect the missing drops so the operator can stop and clear the blockage safely.","criteria":[{"label":"Benefit","why":"Explains a plausible improvement tied to the task.","evidenceGroups":[["repeatable","consistent","precise","faster","efficiency","even","accuracy","less labour"],["seeds","dispense","intervals","planting","gaps","patches"]]},{"label":"Limitation","why":"Explains a specific failure, cost or limitation.","evidenceGroups":[["blocked","blockage","jam","clog","maintenance","cost","sensor failure"],["gaps","misses","missing","drop","drops","time","expense","missed","fault"]]},{"label":"Mitigation","why":"Proposes a practical measure that addresses the chosen limitation.","evidenceGroups":[["sensor","inspection","alarm","warning","maintenance","monitor","detect"],["blockage","blocked","drop","drops","chute","missing","jam","fault","wear"]]}],"unit":"Mechatronics"},{"id":"at4-051","module":"Pseudocode","type":"pseudo","stem":"Write classroom pseudocode for Print Slots. Using FOR/NEXT, output the even locker numbers from 2 through 10 inclusive. Use a named procedure.","marks":4,"difficulty":"Exam","evidence":"AT4 study guide","solution":"BEGIN Print Slots\n    FOR slot = 2 TO 10 STEP 2\n        OUTPUT slot\n    NEXT slot\nEND Print Slots","rubric":[{"label":"Procedure","why":"BEGIN and END use the same name and enclose the steps."},{"label":"Range","why":"FOR slot = 2 TO 10 STEP 2."},{"label":"Body","why":"Output slot inside the loop."},{"label":"Closure","why":"NEXT slot uses the same counter."}],"unit":"Programming"},{"id":"at4-052","module":"Pseudocode","type":"pseudo","stem":"Write classroom pseudocode for Qualify. Read an integer score. Output \"Final\" when score is at least 75 and \"Practice\" otherwise. Use IF/ELSE and a named procedure.","marks":4,"difficulty":"Intermediate","evidence":"AT4 study guide","solution":"BEGIN Qualify\n    INPUT score\n    IF score >= 75 THEN\n        OUTPUT \"Final\"\n    ELSE\n        OUTPUT \"Practice\"\n    ENDIF\nEND Qualify","rubric":[{"label":"Procedure and input","why":"Use a matching named BEGIN/END pair and read the score first."},{"label":"Condition","why":"Use IF score >= 75 THEN."},{"label":"Both branches","why":"Output Final on true and Practice in ELSE."},{"label":"Closure","why":"Use ENDIF and indent both branches."}],"unit":"Programming"},{"id":"at4-053","module":"Pseudocode","type":"short","stem":"A student writes `WHILE distance > 55` and moves the robot in the loop but never updates the distance variable. Explain what happens if its first reading is 70 and give the fix.","marks":2,"difficulty":"Exam","evidence":"AT4 study guide","model":"The stored value remains 70, so the test stays true even if the robot moves closer. Read and store a fresh distance inside the loop after each move.","criteria":[{"label":"Bug","why":"The stored reading remains 70 so the condition remains true.","evidenceGroups":[["70","unchanged","never updates","does not update"],["true","infinite","never stops","keeps moving","stays true","stuck"]]},{"label":"Fix","why":"Update the distance inside the loop after moving.","evidenceGroups":[["read","reading","measure","input","update","sample","store"],["inside","in the loop","every iteration","after moving","after each move","each cycle"]]}],"unit":"Programming"},{"id":"at4-054","module":"Data Structures","type":"code","stem":"Write `first_alert(readings, limit)`. Return the zero-based index of the first reading at least limit. Return -1 if none qualifies. readings is a list of numbers and may be empty.","marks":5,"difficulty":"Exam","evidence":"AT4 study guide","function":"first_alert","starter":"def first_alert(readings, limit):\n    ","solution":"def first_alert(readings, limit):\n    for index in range(len(readings)):\n        if readings[index] >= limit:\n            return index\n    return -1","tests":[{"args":[[],5],"expected":-1},{"args":[[5,7],5],"expected":0},{"args":[[2,5,7],5],"expected":1},{"args":[[1,2],3],"expected":-1},{"args":[[2,6,4],5],"expected":1}],"explanation":"Equality qualifies and the function must return the first matching index, rather than its value or the last match.","unit":"Programming"},{"id":"at4-055","module":"Repetition","type":"code","stem":"Write `sum_multiples(end, factor)` to return the sum of all positive multiples of factor from 1 through end inclusive. end is a non-negative integer and factor is a positive integer.","marks":5,"difficulty":"Exam","evidence":"AT4 study guide","function":"sum_multiples","starter":"def sum_multiples(end, factor):\n    ","solution":"def sum_multiples(end, factor):\n    total = 0\n    for n in range(1, end + 1):\n        if n % factor == 0:\n            total += n\n    return total","tests":[{"args":[0,2],"expected":0},{"args":[4,5],"expected":0},{"args":[6,3],"expected":9},{"args":[7,3],"expected":9},{"args":[4,1],"expected":10}],"explanation":"Use an inclusive upper boundary. A range stop is exclusive, so end + 1 allows end to be visited.","unit":"Programming"},{"id":"at4-056","module":"LAN, WAN, WLAN, VLAN, VPN — Essential Networking","type":"mc","stem":"Which claim about VLANs is accurate?","marks":1,"difficulty":"Exam","evidence":"AT4 study guide","options":["They require separate physical switches for each group","They encrypt all traffic between users","They divide one switched infrastructure into logical groups","They are the same as WAN links"],"answer":2,"explanation":"A VLAN divides switched traffic into logical groups. Encryption and wide-area connections are separate concepts.","unit":"Networks"},{"id":"at4-057","module":"LAN, WAN, WLAN, VLAN, VPN — Essential Networking","type":"blank","stem":"One campus network is a _____. Linking two distant campuses creates a _____. Logically separating guests on the same switched infrastructure uses a _____.","marks":3,"difficulty":"Exam","evidence":"AT4 study guide","parts":[{"prompt":"Campus","options":["LAN","WAN","VPN","VLAN"],"answer":0},{"prompt":"Two campuses","options":["LAN","VLAN","VPN","WAN"],"answer":3},{"prompt":"Logical grouping","options":["WAN","LAN","VLAN","VPN"],"answer":2}],"explanation":"Geographic scope and logical segmentation describe different things.","unit":"Networks"},{"id":"at4-058","module":"Network Hardware","type":"mc","stem":"Why is Bluetooth a reasonable choice for connecting headphones to a phone carried nearby?","marks":1,"difficulty":"Exam","evidence":"AT4 study guide","options":["It uses fibre and is immune to all failures","It supports short-range wireless communication without a cable","It requires a satellite path","It is a wired wide-area protocol"],"answer":1,"explanation":"Bluetooth is suitable for nearby wireless devices. The use case does not require a wide-area link.","unit":"Networks"},{"id":"at4-059","module":"Vulnerabilities Intro","type":"mc","stem":"A school server still uses a publicly known default password. Which part of the situation is the vulnerability?","marks":1,"difficulty":"Exam","evidence":"AT4 study guide","options":["The possibility of someone exploiting it","The attacker","The default password remaining in use","The later loss of files"],"answer":2,"explanation":"The vulnerability is the exploitable weakness. The attacker is a threat source and the potential loss is a consequence.","unit":"Networks"},{"id":"at4-060","module":"Graph Theory","type":"short","stem":"An undirected graph contains AB, BC, CD and DA. Give the shortest-path length from A to C, list the equal-length shortest paths and explain what adding edge AC changes.","marks":3,"difficulty":"Exam","evidence":"Canvas lesson • supporting AT4 topic","model":"The shortest-path length is two edges via either A–B–C or A–D–C. Adding AC makes the shortest path one edge.","criteria":[{"label":"Distance","why":"Two edges.","evidenceGroups":[["two edges","2 edges","two hops","2 hops","length is two","length is 2","length 2"]]},{"label":"Paths","why":"Both A–B–C and A–D–C.","evidenceGroups":[["a b c"],["a d c"]]},{"label":"Shortcut","why":"AC reduces the distance from two to one.","evidenceGroups":[["ac","a c"],["one edge","1 edge","one hop","1 hop","distance of one"]]}],"unit":"Networks"},{"id":"at4-061","module":"Mechatronic Systems","type":"short","stem":"A timer runs an irrigation valve for five minutes regardless of soil moisture. A second design measures moisture while watering and stops when a target is reached. Explain the difference using feedback.","marks":2,"difficulty":"Exam","evidence":"AT4 study guide","model":"The timer design ends based on elapsed time and does not measure whether the soil reached the target. The second design uses repeated moisture readings as feedback and closes the valve when the target is reached.","criteria":[{"label":"Timer design","why":"Uses time without measuring the controlled outcome.","evidenceGroups":[["timer","time","minutes"],["regardless","without feedback","does not measure","does not use moisture","elapsed","five","5"]]},{"label":"Sensor design","why":"Uses a new moisture measurement to decide when to stop.","evidenceGroups":[["moisture"],["reads","readings","measures","measurements","feedback","sensor"],["stops","closes","stop","close","ends","shuts"]]}],"unit":"Mechatronics"},{"id":"at4-062","module":"Requirements","type":"mc","stem":"Which is a measurable non-functional requirement for a robot that must stop at a marker?","marks":1,"difficulty":"Exam","evidence":"Canvas lesson • supporting AT4 topic","options":["Use an algorithm","Stop at the marker","Complete the stop within 0.5 seconds of detection under the stated test conditions","Use a motor"],"answer":2,"explanation":"The time limit specifies how quickly the required stop must happen and can be measured.","unit":"Mechatronics"},{"id":"at4-063","module":"Social Ethical","type":"mc","stem":"A line supervisor proposes recording all identifiable robot-camera footage indefinitely. Which response best addresses the privacy concern while keeping fault diagnosis possible?","marks":1,"difficulty":"Exam","evidence":"AT4 study guide","options":["Publish all footage openly","Keep only the footage needed for diagnosis, restrict access and set a retention period","Keep all footage on every worker’s laptop","Disable the safety system to avoid collecting anything"],"answer":1,"explanation":"Limiting collection, access and retention reduces unnecessary exposure while preserving justified diagnostic use.","unit":"Mechatronics"},{"id":"at4-064","module":"Algorithms Robotics","type":"mc","stem":"The robot’s vision detects red balls but loses a target while moving. Which design most directly prevents it from continuing blindly?","marks":1,"difficulty":"Exam","evidence":"AT4 study guide","options":["Continue at the same speed until the timer finishes","Read the sensor once before starting","Increase the motor speed when the target disappears","Check for a valid detection each cycle and stop or reacquire when it is missing"],"answer":3,"explanation":"Repeated detection checks let the controller act on changed conditions. A missing target needs an explicit branch.","unit":"Mechatronics"},{"id":"at4-065","module":"Flowcharts","type":"short","stem":"At a diamond labelled `tries < 3?`, the Yes path goes to another attempt and the No path ends. Which operation needs to happen on the Yes path before returning to the diamond, and why?","marks":2,"difficulty":"Exam","evidence":"AT4 study guide","model":"Increase tries by one after the attempt. Otherwise the same value is checked again, so a true condition can stay true indefinitely.","criteria":[{"label":"Update","why":"Increment tries after the attempt and before checking again.","evidenceGroups":[["increment","increase","add 1","+ 1","plus one","by one"],["tries","attempt","attempts","counter"]]},{"label":"Termination","why":"Explains how updating lets the condition eventually become false.","evidenceGroups":[["false","terminate","termination","ends","infinite","end","stop","stops","exit","true indefinitely"]]}],"unit":"Programming"},{"id":"at4-066","module":"Selection","type":"mc","stem":"An access rule requires a valid card AND either staff status or a current visitor pass. Which Python expression implements it?","marks":1,"difficulty":"Exam","evidence":"AT4 study guide","options":["valid_card and staff or visitor_pass","valid_card and (staff or visitor_pass)","valid_card or (staff and visitor_pass)","valid_card and staff and visitor_pass"],"answer":1,"explanation":"Parentheses ensure every user needs a valid card. In option A, a visitor pass alone could satisfy the expression.","unit":"Programming"},{"id":"at4-067","module":"Network Hardware","type":"blank","stem":"A local switch learns _____. A router forwards towards a destination _____. A wireless AP carries the local connection over _____ signals.","marks":3,"difficulty":"Exam","evidence":"AT4 study guide","parts":[{"prompt":"Switch learning","options":["DNS names","MAC addresses","encryption keys only","web pages"],"answer":1},{"prompt":"Router destination","options":["IP network","file type","sensor ID","cable colour"],"answer":0},{"prompt":"Wireless signals","options":["light in fibre","wired electric","radio","mechanical"],"answer":2}],"explanation":"A Layer 2 switch learns source MAC addresses. A router uses destination IP, and Wi-Fi transmits using radio.","unit":"Networks"},{"id":"at4-068","module":"Graph Theory","type":"short","stem":"A robot can travel A–B–D or A–C–D. Edges AB and BD take 2 and 7 seconds. AC and CD take 4 and 3 seconds. Which route minimises travel time and why?","marks":2,"difficulty":"Beyond","evidence":"Extension • optional weighted-path practice","model":"A–C–D takes 7 seconds; A–B–D takes 9. Both use two edges, so the sum of travel times determines the faster route.","criteria":[{"label":"Both costs","why":"Computes 9 seconds via B and 7 seconds via C.","evidenceGroups":[["7 seconds","7 s","7 sec"],["9 seconds","9 s","9 sec","takes 9"]]},{"label":"Choice","why":"Chooses A–C–D because it has lower total cost.","evidenceGroups":[["a c d"],["faster","shorter","lower","cheaper","minimum","7 seconds","7 s"]]}],"unit":"Networks"},{"id":"at4-069","module":"LAN, WAN, WLAN, VLAN, VPN — Essential Networking","type":"mc","stem":"A managed switch link to another switch must carry traffic for VLAN 10 and VLAN 20. What would typically be used?","marks":1,"difficulty":"Beyond","evidence":"Extension • VLAN implementation detail","options":["A trunk link","A single access port fixed to VLAN 10","A VPN from each computer","A hub in between"],"answer":0,"explanation":"A trunk normally carries multiple VLANs over one link, with tags used to distinguish VLAN traffic according to the configuration.","unit":"Networks"},{"id":"at4-070","module":"Social Networks","type":"short","stem":"A study group’s messages all pass through one student. Explain one advantage of this arrangement and one reliability risk.","marks":2,"difficulty":"Exam","evidence":"Canvas lesson • supporting AT4 topic","model":"One coordinator can distribute consistent instructions. If that student is unavailable, messages may not reach the rest of the group because there are no alternative paths.","criteria":[{"label":"Advantage","why":"Explains one plausible communication benefit.","evidenceGroups":[["consistent","consistency","coordination","central","clear","efficient","reliable","single source"],["instructions","messages","information","distribute","communication"]]},{"label":"Risk","why":"Identifies dependence on the coordinator and the effect of failure.","evidenceGroups":[["unavailable","offline","absent","failure","fails","single point of failure"],["no alternative","cannot","unable","may not","not reach","cut off","no other","messages stop"]]}],"unit":"Networks"},{"id":"at4-071","module":"Vulnerabilities Intro","type":"short","stem":"A ransomware attack encrypts a team’s shared documents. Explain how an offline backup can help and why it is still useful to restrict write access to the shared drive.","marks":2,"difficulty":"Exam","evidence":"AT4 study guide","model":"An unaffected offline backup can be used to restore files. Restricting write access reduces how many files a compromised account can modify or encrypt.","criteria":[{"label":"Recovery","why":"Restoring unaffected files from offline backup.","evidenceGroups":[["offline","unaffected","separate","clean"],["restore","recover","restoring","recovery"]]},{"label":"Damage limit","why":"Restricting write access limits the files a compromised account can change.","evidenceGroups":[["restrict","restricting","limits","limited","least privilege","reduce","reduces"],["write","modify","encrypt","change"],["access","files","account","permissions"]]}],"unit":"Networks"},{"id":"at4-072","module":"Sequence","type":"mc","stem":"A program must display the area of a rectangle supplied by the user. Which sequence is correct?","marks":1,"difficulty":"Intermediate","evidence":"AT4 study guide","options":["Display area, read dimensions, multiply","Multiply dimensions, display area, read dimensions","Read dimensions, multiply, display area","Read dimensions, display area, multiply"],"answer":2,"explanation":"The dimensions must exist before multiplication. The area must be calculated before it is displayed.","unit":"Programming"},{"id":"at4-073","module":"Practical - Robot Movement","type":"short","stem":"A robot is commanded to drive 400 mm, but stops after 360 mm in a test. Give one plausible cause and a test that would help distinguish a systematic error from a one-off variation.","marks":2,"difficulty":"Exam","evidence":"Canvas lesson • supporting AT4 topic","model":"Wheel slip or calibration can make measured travel differ from the command. Repeat several 400 mm trials on the same surface, record actual distances and check whether the shortfall is consistent.","criteria":[{"label":"Cause","why":"A plausible physical or calibration cause.","evidenceGroups":[["slip","calibration","friction","battery","surface","wheel diameter","wear"]]},{"label":"Repeated test","why":"Controlled trials with actual measured distances and an interpretation of consistency.","evidenceGroups":[["repeat","several","multiple","trials"],["measure","record","measured","distances"],["same","control","consistent","average","compare"]]}],"unit":"Mechatronics"},{"id":"at4-074","module":"Data Processing and Transmission","type":"mc","stem":"Which claim about packet switching and TCP is correct?","marks":1,"difficulty":"Exam","evidence":"AT4 study guide","options":["All network applications must use TCP","Every packet follows the same route by definition","IP forwards packets and TCP can provide ordered reliable delivery for an application using it","Files must be compressed before they can be sent"],"answer":2,"explanation":"IP forwarding and TCP reliability are separate functions. Some applications use other transports and compression is optional.","unit":"Networks"},{"id":"at4-075","module":"Algorithms","type":"short","stem":"A canteen has to total an order, test for a discount and print a receipt. Decompose the task into three useful subproblems and state the information passed from the first two to the next.","marks":2,"difficulty":"Exam","evidence":"AT4 study guide","model":"Calculate the subtotal from the ordered items and prices. Pass the subtotal to the discount calculation, which produces the final amount. Pass the final amount to receipt display.","criteria":[{"label":"Subproblems","why":"Subtotal, discount and receipt are distinct useful tasks.","evidenceGroups":[["subtotal","total","sum"],["discount"],["receipt"]]},{"label":"Data flow","why":"Identifies subtotal and final amount as outputs used by later steps.","evidenceGroups":[["subtotal","total"],["discount"],["final amount","final total","discounted total"],["receipt"]]}],"unit":"Programming"},{"id":"at4-076","module":"Data Types","type":"mc","stem":"Which Python expression reads text from the user and converts it to an integer, assuming valid input?","marks":1,"difficulty":"Intermediate","evidence":"AT4 study guide","options":["str(input())","input(int())","input() + 0","int(input())"],"answer":3,"explanation":"input returns a string, then int converts valid integer text into an integer.","unit":"Programming"},{"id":"at4-077","module":"Social and Ethical","type":"short","stem":"A community group’s booking system relies entirely on a phone app. Describe one exclusion risk and one change that would address it.","marks":2,"difficulty":"Exam","evidence":"AT4 study guide","model":"People without a compatible phone or reliable data may be unable to book. Offer an equivalent phone or in-person booking channel using the same available slots.","criteria":[{"label":"Exclusion","why":"Identifies a group and how the app-only approach affects them.","evidenceGroups":[["compatible phone","smartphone","phone","device","internet","reliable data","connectivity"],["unable","cannot","can not","exclude","excluded","barrier","without","access"]]},{"label":"Change","why":"Proposes an alternative that addresses the identified barrier.","evidenceGroups":[["phone call","phone booking","telephone","in person","face to face","walk in","desktop website","web booking","accessible alternative","offer phone","equivalent phone"]]}],"unit":"Networks"},{"id":"at4-078","module":"Algorithms","type":"mc","stem":"Two ticket algorithms always give the same correct price. One recalculates the total for every printed receipt line. What change removes the repeated work?","marks":1,"difficulty":"Exam","evidence":"AT4 study guide","options":["Remove the receipt","Cache the calculated total and reuse it","Round each price before adding","Calculate the total only for the first customer"],"answer":1,"explanation":"Calculate once per order. Reuse that order’s total without changing the result.","unit":"Programming"},{"id":"at4-079","module":"Algorithms","type":"short","stem":"A queue uses “serve the most urgent job first”. Two jobs can have the same urgency. Explain what is ambiguous and add a rule that makes the result deterministic.","marks":2,"difficulty":"Exam","evidence":"AT4 study guide","model":"The algorithm does not specify which job goes first when urgency is equal. Use earlier arrival time first, then the lower unique job ID if arrival times are equal.","criteria":[{"label":"Ambiguity","why":"Explains that the existing rule does not resolve a tie.","evidenceGroups":[["tie","equal","same urgency"],["ambiguous","unspecified","does not specify","unclear","which","order"]]},{"label":"Tie-break","why":"Gives a clear ordering rule that always resolves a tie.","evidenceGroups":[["arrival","arrived","timestamp","job id","identifier","queue order"],["first","earlier","lower","oldest","smallest","ascending"]]}],"unit":"Programming"},{"id":"at4-080","module":"Input, Process, Output","type":"blank","stem":"A kiosk reads a barcode, looks up its price, displays the price and saves the sale. The scan is _____. Looking up the price is _____. Saving the sale for tomorrow is _____.","marks":3,"difficulty":"Exam","evidence":"Canvas lesson • supporting AT4 topic","parts":[{"prompt":"Barcode scan","options":["storage","input","output","processing"],"answer":1},{"prompt":"Lookup","options":["output","transmission","input","processing"],"answer":3},{"prompt":"Save","options":["storage","output","processing","input"],"answer":0}],"explanation":"Input supplies data, processing transforms or retrieves information for use, and storage retains it.","unit":"Programming"},{"id":"at4-081","module":"Flowcharts","type":"short","stem":"A machine reads a temperature, decides whether it exceeds 35 °C and displays “Alarm” on the true path. Name the symbol for the comparison and the display. What must the false path do if there is no alarm?","marks":3,"difficulty":"Exam","evidence":"AT4 study guide","model":"Use a decision diamond for temperature > 35 and an input/output parallelogram to display Alarm. The false arrow bypasses the display and continues or ends.","criteria":[{"label":"Decision","why":"Names the decision diamond.","evidenceGroups":[["diamond","decision symbol"]]},{"label":"Display","why":"Names the input/output parallelogram.","evidenceGroups":[["parallelogram","input/output symbol"]]},{"label":"False path","why":"Bypasses the alarm and continues or ends.","evidenceGroups":[["false","no"],["bypass","bypasses","skip","skips","without displaying","no alarm","without alarm"],["continue","continues","ends","end","next step"]]}],"unit":"Programming"},{"id":"at4-082","module":"Control Structures - Intro","type":"mc","stem":"A game must always ask for a name once, then ask again only when it is blank. Which condition belongs after the body of the classroom loop?","marks":1,"difficulty":"Exam","evidence":"AT4 study guide","options":["UNTIL name is blank","UNTIL name is not blank","WHILE name is not blank","ENDIF name is blank"],"answer":1,"explanation":"The post-test loop stops when a usable name exists. A blank name must lead to another iteration.","unit":"Programming"},{"id":"at4-083","module":"Sequence","type":"short","stem":"An app prints total before assigning total = price * quantity. Explain why moving that calculation before the print fixes the order of operations.","marks":2,"difficulty":"Exam","evidence":"AT4 study guide","model":"Before assignment, total has no value in a fresh run. First calculate and store price × quantity in total, then print the stored result.","criteria":[{"label":"Failure","why":"Identifies that total is unset before it is read.","evidenceGroups":[["total"],["no value","unassigned","unset","undefined","not defined","nameerror"]]},{"label":"Correct order","why":"Calculate/store the total before displaying it.","evidenceGroups":[["calculate","calculation","compute","assign","store","multiply"],["before","first","then"],["print","display","output"]]}],"unit":"Programming"},{"id":"at4-084","module":"Data Types","type":"mc","stem":"A variable stores the temperature −3.75 and may hold other decimal readings. Which Python type is most appropriate?","marks":1,"difficulty":"Exam","evidence":"AT4 study guide","options":["bool","int","float","str"],"answer":2,"explanation":"A float holds numeric values with a fractional part and supports numerical comparison.","unit":"Programming"},{"id":"at4-085","module":"Data Operators","type":"blank","stem":"In Python, `9 // 4` is _____. `9 % 4` is _____. `2 ** 3` is _____.","marks":3,"difficulty":"Exam","evidence":"AT4 study guide","parts":[{"prompt":"Floor division","options":["1","2","2.25","3"],"answer":1},{"prompt":"Modulo","options":["0","1","2","2.25"],"answer":1},{"prompt":"Exponentiation","options":["6","8","9","16"],"answer":1}],"explanation":"For 9 ÷ 4 the quotient is 2 with remainder 1. Exponentiation raises 2 to the third power.","unit":"Programming"},{"id":"at4-086","module":"Data Operators","type":"mc","stem":"A desk checker sees `5 + 2 * 3 >= 20 or False`. What is the final value?","marks":1,"difficulty":"Exam","evidence":"AT4 study guide","options":["True","False","21","11"],"answer":1,"explanation":"Multiplication runs first. 5 + 6 = 11, so the comparison is false and False or False is false.","unit":"Programming"},{"id":"at4-087","module":"Basic Programming Concepts","type":"mc","stem":"In `new_total = old_total + fee`, when is old_total read?","marks":1,"difficulty":"Exam","evidence":"AT4 study guide","options":["After the left side has been overwritten","While evaluating the right side, before assignment","Only when new_total is printed","Never, because = compares values"],"answer":1,"explanation":"Python evaluates the expression on the right and then assigns its result to the target.","unit":"Programming"},{"id":"at4-088","module":"Desk Checking and Sub-programs","type":"short","stem":"A program runs `def double(n): return n * 2` and then `result = double(6) + 1`. Identify the argument, parameter and final value of result.","marks":3,"difficulty":"Exam","evidence":"AT4 study guide","model":"6 is the argument, n is the parameter, and result is 13 because double returns 12 before the addition.","criteria":[{"label":"Argument","why":"Identifies 6.","evidenceGroups":[["argument"],["6"]]},{"label":"Parameter","why":"Identifies n.","evidenceGroups":[["parameter"],["n"]]},{"label":"Final value","why":"Identifies 13.","evidenceGroups":[["13"]]}],"unit":"Programming"},{"id":"at4-089","module":"Desk Checking and Sub-programs","type":"short","stem":"A function calculates the total fare from two values but reads both with input() inside the function. Explain one benefit of accepting the values as parameters instead and give an example call.","marks":2,"difficulty":"Exam","evidence":"AT4 study guide","model":"Parameters allow callers or unit tests to pass known values without prompting. For example fare(7, 3) supplies two inputs to the calculation.","criteria":[{"label":"Benefit","why":"Explains easier reuse or testing without interactive input.","evidenceGroups":[["test","testing","reuse","reusable","caller","callers"],["known values","without prompting","without input","different values","pass","supplies"]]},{"label":"Example call","why":"Shows a call passing two explicit values.","evidenceGroups":[["fare 7 3","fare 5 2","two arguments","two values","pass both","example call"]]}],"unit":"Programming"},{"id":"at4-090","module":"Data Structures","type":"mc","stem":"After `scores = [12, 15, 18]` and `scores[1] = 20`, what is scores?","marks":1,"difficulty":"Exam","evidence":"Canvas lesson • supporting AT4 topic","options":["[20, 15, 18]","[12, 20, 18]","[12, 15, 20]","[12, 15, 18, 20]"],"answer":1,"explanation":"Index 1 is the second position. Assignment replaces an existing item.","unit":"Programming"},{"id":"at4-091","module":"Data Structures","type":"short","stem":"A temperature log stores hourly readings in a Python list. Explain how index 0 and append differ, and why the list fits the task.","marks":3,"difficulty":"Exam","evidence":"Canvas lesson • supporting AT4 topic","model":"Index 0 reads the first existing reading. append adds a new reading to the end. A list preserves the collection in time order.","criteria":[{"label":"Indexing","why":"Explains that index 0 accesses the first item.","evidenceGroups":[["index 0","0"],["first"]]},{"label":"Append","why":"Adds a new item at the end.","evidenceGroups":[["append"],["add","adds","insert","appends"],["end"]]},{"label":"Fit","why":"Connects order to the sequence of readings.","evidenceGroups":[["order","ordered","sequence","chronological"],["time","hourly","reading","readings"]]}],"unit":"Programming"},{"id":"at4-092","module":"Unit Testing and Error Detection","type":"short","stem":"A speed warning appears when speed is strictly above 40. Give a boundary test pair and expected outputs that would catch a programmer using >= instead of >.","marks":3,"difficulty":"Exam","evidence":"AT4 study guide","model":"At 40 expect no warning. At 41 expect a warning. The 40 test exposes an incorrect warning when the programmer uses >=.","criteria":[{"label":"At threshold","why":"40 must produce no warning.","evidenceGroups":[["40"],["no warning","no alert","does not warn","false","no message"]]},{"label":"Above threshold","why":"A value above 40 such as 41 must warn.","evidenceGroups":[["41","40.1","40.01","above 40","greater than 40"],["warning","warn","true","alert"]]},{"label":"Diagnostic reason","why":"Explains that >= wrongly warns at equality.","evidenceGroups":[[">=","greater than or equal"],["equality","40","threshold"],["incorrect","wrong","fault","incorrectly","produces","warns"]]}],"unit":"Programming"},{"id":"at4-093","module":"Error Correction","type":"blank","stem":"A missing colon after if is a _____ error. An invalid list index is a _____ error. A working comparison that returns the wrong result is a _____ error.","marks":3,"difficulty":"Exam","evidence":"AT4 study guide","parts":[{"prompt":"Colon","options":["runtime","syntax","logic","network"],"answer":1},{"prompt":"Index","options":["syntax","logic","runtime","formatting"],"answer":2},{"prompt":"Wrong result","options":["logic","syntax","runtime","hardware"],"answer":0}],"explanation":"A syntax error prevents valid parsing. A bad index raises an error while running. The comparison can run and still be logically wrong.","unit":"Programming"},{"id":"at4-094","module":"Selection","type":"mc","stem":"Free entry requires both an age of at least 65 and a resident card. Which test implements this?","marks":1,"difficulty":"Exam","evidence":"AT4 study guide","options":["age > 65 and resident","age >= 65 or resident","age >= 65 and resident","age <= 65 and resident"],"answer":2,"explanation":"The exact age is included and both requirements must hold.","unit":"Programming"},{"id":"at4-095","module":"Repetition","type":"mc","stem":"Which Python loop visits 5, 4, 3, 2 and 1 exactly once each?","marks":1,"difficulty":"Exam","evidence":"AT4 study guide","options":["range(5, 1, -1)","range(5, 0, -1)","range(1, 5, -1)","range(5, 0, 1)"],"answer":1,"explanation":"A negative step counts down and the stop value 0 is excluded.","unit":"Programming"},{"id":"at4-096","module":"Repetition","type":"short","stem":"A program sets total = 0 inside a loop immediately before adding each list value. With values [2, 8, 3], what is the final total? Describe the fix.","marks":3,"difficulty":"Exam","evidence":"AT4 study guide","model":"The result is 3 because each iteration resets the accumulator before adding the current value. Set total = 0 once before the loop.","criteria":[{"label":"Trace","why":"Identifies 3 as the final total.","evidenceGroups":[["3"],["final","total","result"]]},{"label":"Cause","why":"Explains that the reset occurs every iteration.","evidenceGroups":[["reset","resets","set to 0"],["each","every","inside","iteration"]]},{"label":"Fix","why":"Moves the initialisation outside and before the loop.","evidenceGroups":[["before the loop","outside the loop","before looping"],["initial","initialise","initialize","set","total"]]}],"unit":"Programming"},{"id":"at4-097","module":"Pseudocode","type":"pseudo","stem":"Write classroom pseudocode for Count Passes. Read four marks and output how many are at least 50. Use a named procedure, FOR/NEXT and IF.","marks":5,"difficulty":"Exam","evidence":"AT4 study guide","solution":"BEGIN Count Passes\n    count = 0\n    FOR i = 1 TO 4 STEP 1\n        INPUT mark\n        IF mark >= 50 THEN\n            count = count + 1\n        ENDIF\n    NEXT i\n    OUTPUT count\nEND Count Passes","rubric":[{"label":"Start","why":"Use matching BEGIN and END and start the counter at zero."},{"label":"Loop","why":"Four iterations with correctly paired FOR and NEXT."},{"label":"Input","why":"Read one mark on each iteration."},{"label":"Selection","why":"Check mark >= 50 and increment count only if true."},{"label":"Output","why":"Display the result after the loop."}],"unit":"Programming"},{"id":"at4-098","module":"Pseudocode","type":"pseudo","stem":"Write a named procedure Check Battery. Read battery percentage. While it is below 30, display \"Charge\" and read again. Once the percentage reaches 30 or more, display \"Ready\". Use WHILE.","marks":5,"difficulty":"Exam","evidence":"AT4 study guide","solution":"BEGIN Check Battery\n    INPUT battery\n    WHILE battery < 30\n        OUTPUT \"Charge\"\n        INPUT battery\n    ENDWHILE\n    OUTPUT \"Ready\"\nEND Check Battery","rubric":[{"label":"Procedure","why":"Use named matching BEGIN and END."},{"label":"Initial reading","why":"Read the battery before the condition."},{"label":"Condition","why":"Use battery < 30 with WHILE and ENDWHILE."},{"label":"Update","why":"Prompt and read inside the loop."},{"label":"Exit","why":"Output Ready after the loop."}],"unit":"Programming"},{"id":"at4-099","module":"Repetition","type":"code","stem":"Write `longest_run(values)` to return the length of the longest consecutive run of positive numbers. Return 0 for an empty list or a list with no positive numbers.","marks":5,"difficulty":"Exam","evidence":"AT4 study guide","function":"longest_run","starter":"def longest_run(values):\n    ","solution":"def longest_run(values):\n    best = 0\n    current = 0\n    for value in values:\n        if value > 0:\n            current += 1\n            best = max(best, current)\n        else:\n            current = 0\n    return best","tests":[{"args":[[]],"expected":0},{"args":[[0,-2]],"expected":0},{"args":[[1,2,0,3]],"expected":2},{"args":[[0,1,2,3]],"expected":3},{"args":[[1,0,2,3,0,4]],"expected":2}],"explanation":"Reset the current run on zero or a negative number. Keep the longest run seen separately.","unit":"Programming"},{"id":"at4-100","module":"Selection","type":"code","stem":"Write `label_reading(value, low, high)`. Assume low <= high. Return \"LOW\" below low, \"HIGH\" above high, and \"OK\" within the inclusive interval.","marks":5,"difficulty":"Exam","evidence":"AT4 study guide","function":"label_reading","starter":"def label_reading(value, low, high):\n    ","solution":"def label_reading(value, low, high):\n    if value < low:\n        return \"LOW\"\n    if value > high:\n        return \"HIGH\"\n    return \"OK\"","tests":[{"args":[2,3,7],"expected":"LOW"},{"args":[3,3,7],"expected":"OK"},{"args":[7,3,7],"expected":"OK"},{"args":[8,3,7],"expected":"HIGH"},{"args":[0,0,0],"expected":"OK"}],"explanation":"Use strict comparisons for the outside cases. Equality is inside the interval.","unit":"Programming"},{"id":"at4-101","module":"Data Structures","type":"code","stem":"Write `first_pair(values, target)` to return the first zero-based index i for which two adjacent entries at i and i+1 add to target. Return -1 if there is no pair.","marks":5,"difficulty":"Exam","evidence":"AT4 study guide","function":"first_pair","starter":"def first_pair(values, target):\n    ","solution":"def first_pair(values, target):\n    for i in range(len(values) - 1):\n        if values[i] + values[i + 1] == target:\n            return i\n    return -1","tests":[{"args":[[],3],"expected":-1},{"args":[[3],3],"expected":-1},{"args":[[1,2,1],3],"expected":0},{"args":[[5,-2,4],2],"expected":1},{"args":[[0,1,3],7],"expected":-1}],"explanation":"Stop one index before the last item because every candidate reads i + 1.","unit":"Programming"},{"id":"at4-102","module":"Pseudocode","type":"match","stem":"Match each opening line to the line that closes its classroom structure.","marks":5,"difficulty":"Exam","evidence":"AT4 study guide","left":["BEGIN Read Code","WHILE remaining > 0","REPEAT","FOR i = 1 TO 4 STEP 1","IF ready THEN"],"right":["ENDWHILE","NEXT i","END Read Code","UNTIL answer = expected","ENDIF"],"keys":[2,0,3,1,4],"explanation":"Closing keywords show the control structure. BEGIN/END preserve the name and FOR/NEXT preserve the counter.","unit":"Programming"},{"id":"at4-103","module":"Flowcharts","type":"match","stem":"Match each flowchart symbol to the statement that belongs inside it.","marks":4,"difficulty":"Exam","evidence":"AT4 study guide","left":["Terminator","Input/output parallelogram","Process rectangle","Decision diamond"],"right":["Read temperature","temperature > 35?","Start","count ← count + 1"],"keys":[2,0,3,1],"explanation":"Start and End use terminators. An operation updates state, while a decision branches based on a condition.","unit":"Programming"},{"id":"at4-104","module":"Desk Checking and Sub-programs","type":"match","stem":"Match each line in this short Python program to its role.","marks":4,"difficulty":"Exam","evidence":"AT4 study guide","left":["def scale(value):","return value * 2","result = scale(5)","print(result)"],"right":["Sends the computed value back to the caller","Displays the stored result","Defines a function with a parameter","Calls the function with an argument and stores its result"],"keys":[2,0,3,1],"explanation":"Parameters are names in the definition; arguments are values supplied in a call.","unit":"Programming"},{"id":"at4-105","module":"Network Hardware","type":"match","stem":"Match each device to the job it performs in this school network.","marks":4,"difficulty":"Exam","evidence":"AT4 study guide","left":["Switch","Router","Wireless access point","Firewall"],"right":["Forwards packets between IP networks","Permits or blocks traffic based on rules","Forwards Ethernet frames within a VLAN","Bridges Wi-Fi devices into the local network"],"keys":[2,0,3,1],"explanation":"A combined home device can do all four jobs. The scenario distinguishes their functions.","unit":"Networks"},{"id":"at4-106","module":"LAN, WAN, WLAN, VLAN, VPN — Essential Networking","type":"match","stem":"Match each network term to the statement that best describes its role.","marks":5,"difficulty":"Exam","evidence":"AT4 study guide","left":["LAN","WAN","VLAN","VPN","WLAN"],"right":["Links widely separated sites","Carries private traffic through a tunnel over another network","Connects devices across one campus","Separates logical groups on shared switches","Uses wireless access within a local network"],"keys":[2,0,3,1,4],"explanation":"Scope, transmission medium, logical grouping and tunnelling describe different properties.","unit":"Networks"},{"id":"at4-107","module":"Data Processing and Transmission","type":"match","stem":"Match each technology to its main job during a file transfer.","marks":4,"difficulty":"Exam","evidence":"AT4 study guide","left":["DNS","IP","TCP","Lossless compression"],"right":["Addresses and forwards packets between networks","Reduces size while allowing exact recovery","Looks up an address from a hostname","Provides ordered reliable byte delivery when used"],"keys":[2,0,3,1],"explanation":"Name resolution, routing, transport and file compression are separate functions.","unit":"Networks"},{"id":"at4-108","module":"Components","type":"match","stem":"Match each part of an automatic door system to the statement describing it.","marks":4,"difficulty":"Exam","evidence":"AT4 study guide","left":["Beam sensor","Programmed controller","Motor","Limit switch"],"right":["Uses the reading to decide whether to close","Reports whether the door reached the end of travel","Detects whether someone is in the doorway","Applies movement to the mechanism"],"keys":[2,0,3,1],"explanation":"The beam sensor and limit switch provide different inputs. The controller decides and the motor acts.","unit":"Mechatronics"},{"id":"at4-109","module":"Unit Testing and Error Detection","type":"match","stem":"Match each observation to its diagnosis or next test.","marks":4,"difficulty":"Exam","evidence":"AT4 study guide","left":["The editor highlights a missing closing bracket","The programme divides by zero while running","An age of 5 receives a free ticket despite a rule of under 5","An accepted value must be at least 5"],"right":["Runtime error","Compare a test at 4 with a test at 5","Syntax error","Logic error at equality"],"keys":[2,0,3,1],"explanation":"Use the actual failure to distinguish error types and choose tests that expose boundary behaviour.","unit":"Programming"},{"id":"at4-110","module":"Vulnerabilities Intro","type":"match","stem":"Match each scenario to the most directly targeted response.","marks":4,"difficulty":"Exam","evidence":"AT4 study guide","left":["Known firmware flaw","Password stolen in phishing","Shared files encrypted","Guest devices can reach staff servers"],"right":["Require a separate authentication factor","Segment the network and block guest-to-staff traffic","Apply the vendor’s security update","Restore unaffected copies from an offline backup"],"keys":[2,0,3,1],"explanation":"Different controls reduce different risks. Backups support recovery and do not close a vulnerability.","unit":"Networks"},{"id":"at4-111","module":"Algorithms Robotics","type":"match","stem":"Match each line of the robot routine to its reason for being in that location.","marks":4,"difficulty":"Exam","evidence":"AT4 study guide","left":["INPUT distance before WHILE","WHILE distance > 55","INPUT distance inside WHILE","Stop motors after ENDWHILE"],"right":["Moves only while the reading is above the threshold","Makes the stop action happen when the loop exits","Ensures the first condition has a measured value","Lets the condition change after moving"],"keys":[2,0,3,1],"explanation":"Initialise, test, update and exit form a complete pre-test loop.","unit":"Mechatronics"},{"id":"at4-112","module":"Computer Networks","type":"mc","stem":"A new classroom can still reach its local printer but cannot reach the remote campus. Which failure is most consistent with this observation?","marks":1,"difficulty":"Exam","evidence":"AT4 study guide","options":["The printer’s USB cable failed","The inter-campus WAN link failed","Every local network port failed","The local printer has no paper"],"answer":1,"explanation":"Local printing indicates local connectivity. The failed path is the link to the remote campus.","unit":"Networks"},{"id":"at4-113","module":"LAN, WAN, WLAN, VLAN, VPN — Essential Networking","type":"short","stem":"A staff laptop accesses resources from home through a VPN. At school, guest laptops use a VLAN. Explain what problem each solves in this scenario.","marks":2,"difficulty":"Exam","evidence":"AT4 study guide","model":"The VPN gives the staff laptop a protected tunnel over the internet to school resources. The guest VLAN separates guests logically on the school switches so their local broadcasts stay in their own group.","criteria":[{"label":"VPN","why":"Links a remote device to school resources through a protected tunnel.","evidenceGroups":[["vpn"],["tunnel","encrypted","secure connection","protected connection"],["remote","home","internet","school resources"]]},{"label":"VLAN","why":"Separates local traffic into logical groups.","evidenceGroups":[["vlan"],["logical","separate","segment"],["guest","broadcast","local","switch"]],"contradictions":["vlan encrypts","vlan encrypt","vlan is a tunnel","vlan provides a tunnel"]}],"unit":"Networks"},{"id":"at4-114","module":"Network Hardware","type":"mc","stem":"A small lab wants to connect a nearby desktop to the local switch with inexpensive cable. Which option fits a standard wired Ethernet connection?","marks":1,"difficulty":"Exam","evidence":"AT4 study guide","options":["Bluetooth","Satellite","Twisted-pair copper Ethernet cable","HDMI"],"answer":2,"explanation":"Twisted pair is commonly used for short wired Ethernet links, where the installation is within the relevant distance limit.","unit":"Networks"},{"id":"at4-115","module":"Network Hardware","type":"blank","stem":"Copper cable carries _____ signals. Optical fibre carries _____ signals. Wi-Fi communicates using _____.","marks":3,"difficulty":"Exam","evidence":"AT4 study guide","parts":[{"prompt":"Copper","options":["electrical","light","sound","radio"],"answer":0},{"prompt":"Optical fibre","options":["electrical","radio","light","sound"],"answer":2},{"prompt":"Wi-Fi","options":["sound","radio","light pulses through fibre","electrical pulses through copper"],"answer":1}],"explanation":"Different transmission media carry information using different physical signals.","unit":"Networks"},{"id":"at4-116","module":"Data Processing and Transmission","type":"short","stem":"A student says “DNS sends the file because it knows the address.” Explain the distinction between a DNS lookup and what the router does once the address is known.","marks":2,"difficulty":"Exam","evidence":"AT4 study guide","model":"DNS translates the server name to an IP address. A router uses the destination IP address to forward packets towards the relevant network.","criteria":[{"label":"DNS","why":"Maps a hostname or domain to an IP address.","evidenceGroups":[["dns"],["name","hostname","domain"],["ip","address"]],"contradictions":["dns sends the file","dns forwards the packets"]},{"label":"Routing","why":"Uses destination IP information to forward packets.","evidenceGroups":[["router","routing"],["forward","forwards","routes","send"],["packets","packet"],["destination","ip"]]}],"unit":"Networks"},{"id":"at4-117","module":"Data Processing and Transmission","type":"short","stem":"A video looks worse after re-encoding, even though the new file is easier to upload. Explain why this can happen and how a container differs from a codec.","marks":3,"difficulty":"Exam","evidence":"AT4 study guide","model":"Lossy compression discards some image information, reducing file size at the cost of quality. A codec encodes or decodes the video data. A container packages the encoded video and other tracks, such as sound.","criteria":[{"label":"Trade-off","why":"Connects lossy compression and reduced size to lost detail or quality.","evidenceGroups":[["lossy"],["smaller","size","reduces","reducing","upload"],["discard","discards","quality","lost detail","loses","loss"]]},{"label":"Codec","why":"Encodes or decodes the media stream.","evidenceGroups":[["codec"],["encode","encodes","encoding","decode","decodes","decoding","compresses"]]},{"label":"Container","why":"Packages one or more media streams or tracks.","evidenceGroups":[["container"],["packages","holds","stores","wraps"],["stream","streams","track","tracks","video","audio"]]}],"unit":"Networks"},{"id":"at4-118","module":"Data Processing and Transmission","type":"mc","stem":"A 4 MB file crosses an ideal 16 Mb/s link. Ignore overhead and use decimal units. How long does the transfer take?","marks":1,"difficulty":"Exam","evidence":"AT4 study guide","options":["0.25 s","1 s","2 s","4 s"],"answer":2,"explanation":"4 MB = 32 Mb. Divide 32 Mb by 16 Mb/s to get 2 seconds.","unit":"Networks"},{"id":"at4-119","module":"Vulnerabilities Intro","type":"short","stem":"Explain how using a unique password for the school account limits damage if the same student’s password for an unrelated game is stolen.","marks":2,"difficulty":"Exam","evidence":"AT4 study guide","model":"The stolen game password will not match the school password. This stops simple password reuse attacks from using that leaked credential to sign into the school account.","criteria":[{"label":"Mechanism","why":"The stolen password differs from the school password.","evidenceGroups":[["different","unique"
