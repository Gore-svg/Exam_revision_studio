he network","Protocols handle ordering or recovery where supported"]},{"cue":"Distinguish: routing, forwarding and switching","answer":"A router uses IP routing decisions to send packets toward other networks. A LAN switch uses MAC addresses to deliver frames within a local network. Network congestion, queueing and unavailable links can affect performance and route choice.","flashPoints":["Routing chooses paths","Forwarding sends a packet to the next hop","Switching moves local frames"]},{"cue":"Explain: bandwidth, latency, loss and jitter","answer":"Bandwidth is potential capacity; latency is delay; packet loss means data is dropped; jitter is variation in packet delay. Streaming video may buffer to cope with jitter; real-time video calls are sensitive to delay. Retransmission helps reliable delivery but costs time.","flashPoints":["Bandwidth: capacity","Latency: delay","Loss: dropped data","Jitter: variation in delay"]},{"cue":"Apply: lost packet scenario","answer":"If a reliable TCP transfer loses a packet, acknowledgements and retransmission help ensure the missing data arrives. A file can be reconstructed correctly even if packets take different routes. The data is not literally “sent as one file” through every router.","flashPoints":["TCP can retransmit missing data","UDP alone does not request retransmission"]},{"cue":"Trace · Name to file transfer","answer":"DNS resolves the server name. IP routers forward packets towards the destination network. If the application uses TCP, it gets ordered reliable bytes. A local Ethernet switch forwards frames using MAC information.","flashPoints":["DNS finds the address","Routers forward IP packets","TCP can deliver ordered reliable bytes"]}],"summary":"Packet switching improves shared use of networks; reliable reconstruction depends on appropriate protocols."},{"id":"cn-21","title":"Compression, file formats, codecs and transmission","unit":"Networks","memorise":"Lossless = identical original recovered. Lossy = some data discarded for a smaller file. Codec ≠ container.","rows":[{"cue":"Define: compression and why it matters","answer":"Compression encodes information using fewer bits to reduce storage and transmission. Smaller files often transfer faster over the same throughput and use less network bandwidth. The trade-off depends on algorithm, computational cost and whether quality can be sacrificed.","flashPoints":["Compression reduces the amount of data","Smaller files need less storage or transmission time"]},{"cue":"Compare: lossless and lossy","answer":"Lossless compression reconstructs exactly the original data—essential for executable files, documents and other data where one bit can matter. Examples include ZIP and PNG. Lossy compression discards information judged less noticeable for better size reduction, commonly JPEG photos and many audio/video codecs. Do not say lossy means a file always looks visibly poor.","flashPoints":["Lossless reconstructs the original exactly","Lossy discards some information for smaller files"]},{"cue":"Explain: codecs and containers","answer":"A codec encodes/decodes media data (e.g. video compressed with H.264). A container is a file structure that stores one or more tracks and associated metadata (e.g. MP4). One container can hold media encoded using different codecs, so “MP4 codec” is imprecise.","flashPoints":["Codec encodes and decodes a media stream","Container packages tracks and metadata"]},{"cue":"Apply: calculate transmission time","answer":"Approximate transfer time = file size in bits ÷ throughput in bits/s, ignoring overhead. Example: 40 MB ≈ 320 megabits (decimal units); over an 8 Mbps connection, best-case transfer is 40 seconds. Compressing to 10 MB reduces best-case time to about 10 seconds, assuming similar conditions.","flashPoints":["Convert bytes to bits before using a bit rate","Time = size ÷ rate"]},{"cue":"Beyond: repeated compression and quality","answer":"Repeatedly exporting a lossy image or video can introduce additional degradation. Saving text/data with lossy methods is unsuitable when exact content matters. Compression ratios and results depend on the content, not just file extension.","flashPoints":["Repeated lossy re-encoding can compound quality loss","Lossless re-encoding preserves the underlying data"]},{"cue":"Calculate · Convert size before using link rate","answer":"A 12 MB file is 96 Mb. At an ideal 8 Mb/s, 96 ÷ 8 = 12 s. Real transfers may take longer because of overhead, competition for bandwidth or retransmission.","flashPoints":["12 MB = 96 Mb","96 Mb ÷ 8 Mb/s = 12 s ideally","Overhead or congestion can slow delivery"]}],"summary":"Lossless for correctness; lossy for acceptable media trade-offs. Codec compresses data; container packages tracks."},{"id":"cn-22","title":"VLANs: the examinable essentials","unit":"Networks","memorise":"VLAN = Virtual Local Area Network: one physical switched infrastructure, multiple logical broadcast domains.","rows":[{"cue":"Define: VLAN and purpose","answer":"A VLAN logically divides a switched LAN into separate groups. Devices on different VLANs are in separate Layer 2 broadcast domains even when connected to the same physical switch. Schools can segregate staff, students, guests and IoT devices to improve organisation, limit broadcasts and support traffic restrictions.","flashPoints":["VLAN logically separates a LAN on shared switches","Each VLAN has its own broadcast domain"]},{"cue":"Extension · Explain: access ports and trunk ports","answer":"An access port normally carries traffic for one VLAN to an end device (e.g. a student PC). A trunk link carries traffic for multiple VLANs between compatible switches or a switch and a router, commonly using IEEE 802.1Q tags. Tags identify which VLAN a frame belongs to; access-port traffic to ordinary end devices is usually untagged.","flashPoints":["Access port normally connects an endpoint to one VLAN","Trunk can carry several VLANs between devices"]},{"cue":"Extension · Explain: VLANs versus IP subnets","answer":"VLANs divide Ethernet broadcast domains; IP subnets divide IP address ranges. Often an organisation assigns one IP subnet to each VLAN, but the concepts are not identical. Example: VLAN 10 Students = 192.168.10.0/24; VLAN 20 Staff = 192.168.20.0/24.","flashPoints":["VLAN: link-layer broadcast grouping","IP subnet: network-layer address grouping"]},{"cue":"Extension · Explain: inter-VLAN routing","answer":"Devices in different VLANs normally need a router or Layer 3 switch to communicate. Firewall/access-control rules can limit permitted cross-VLAN traffic. Example: students can access a shared print server but must not reach staff administration records.","flashPoints":["Inter-VLAN traffic needs layer 3 routing","Apply rules to restrict permitted destinations"]},{"cue":"Apply: school design","answer":"Place student, staff and guest devices in separate logical groups. Local broadcasts remain in their own VLAN. Use a firewall or routing access policy to allow guests onto the internet while blocking access to private staff resources.","flashPoints":["Give guests and staff separate VLANs","Allow guest internet","Block guest access to staff services"]},{"cue":"Extension · Beyond: troubleshoot VLAN failure","answer":"Check switch port VLAN membership, trunk allowed VLANs, 802.1Q settings, address/subnet, correct gateway and inter-VLAN routing/ACLs. A student PC placed on the staff VLAN creates a security/segmentation mistake. VLAN alone is not encryption or a complete security boundary.","flashPoints":["Check port VLAN and trunk membership","Then check gateway, routing and firewall rules"]},{"cue":"Explain · Separate guest broadcasts and staff access","answer":"Use separate logical VLANs for staff and guests on the same switches. Guest broadcasts remain in the guest VLAN. Set a separate policy to allow internet access and deny guest access to staff services.","flashPoints":["Guest broadcasts stay within the guest VLAN","A separate firewall or routing policy controls staff access"]},{"cue":"Contrast · VLAN and VPN in one scenario","answer":"A guest VLAN separates local traffic. A staff member working from home can use a secure VPN to tunnel to school resources across the internet. VLAN membership alone does not encrypt the traffic.","flashPoints":["VLAN separates local traffic","A secure VPN tunnels traffic across another network","VLAN membership alone does not encrypt traffic"]}],"summary":"VLAN isolates Layer 2 broadcasts; router/Layer 3 switch enables controlled communication between VLANs."},{"id":"cn-23","title":"VPNs, VLANs and firewalls: not the same thing","unit":"Networks","memorise":"VLAN segments a LAN; VPN creates a secure virtual connection; firewall applies allow/deny rules.","rows":[{"cue":"Define: VPN","answer":"A Virtual Private Network creates a logical tunnel across another network and typically encrypts traffic between VPN endpoints. Remote-access VPNs can allow approved staff to reach school resources from outside the campus. A VPN does not make all online activity anonymous or eliminate all security risks.","flashPoints":["VPN creates a private tunnel over another network","A secure VPN encrypts and authenticates traffic"]},{"cue":"Compare: VPN and VLAN","answer":"VLANs organise local switched devices into separate broadcast domains; VPNs connect users or sites over existing networks with tunnelled traffic. VLAN separation is not by itself encryption. The two can be used together—for example, staff VPN users receive controlled access to staff services.","flashPoints":["VPN: tunnel across a network","VLAN: logical grouping on the local network"]},{"cue":"Explain: firewall and access controls","answer":"A firewall permits or blocks traffic according to rules such as addresses, ports, protocols, destinations or connection state. Access controls determine which identities can use which resources. A VLAN can reduce the spread of traffic, but the firewall/ACL determines whether specific inter-VLAN communication is permitted.","flashPoints":["Firewall permits or blocks traffic according to rules","Access control gives only required permissions"]},{"cue":"Apply: remote teacher","answer":"A teacher at home establishes a VPN to the school network, authenticates with MFA, and requests a staff file. A firewall restricts the connection to allowed internal services. Guest users on campus remain in a separate guest VLAN and cannot reach the staff file server.","flashPoints":["Remote teacher authenticates to the VPN","Firewall rules limit the internal resources they can reach"]},{"cue":"Justify: defence in depth","answer":"Use distinct protections together: VLAN segmentation, firewall policy, MFA, least-privilege accounts, updates, monitoring and backups. If one control fails, others still reduce risk. “Install a VPN” alone is not a complete cybersecurity plan.","flashPoints":["Layer controls with different roles","Example: MFA, segmentation and a firewall"]}],"summary":"Choose the term by its role: SEGMENT = VLAN; TUNNEL = VPN; FILTER = firewall."},{"id":"cn-24","title":"Cybersecurity: threats, attacks and vulnerabilities","unit":"Networks","memorise":"Threat = possible harm; vulnerability = weakness; risk = likelihood and impact of exploitation.","rows":[{"cue":"Define: security goals (CIA)","answer":"Confidentiality means only authorised people can access information. Integrity means information stays correct and unaltered without authorisation. Availability means services and data are usable when needed. Example: ransomware may threaten availability and sometimes confidentiality.","flashPoints":["Confidentiality: authorised access only","Integrity: data stays accurate and authorised","Availability: systems work when needed"]},{"cue":"Identify: malware types","answer":"Malware is malicious software. Viruses attach to other files/programs; worms can spread across networks; ransomware disrupts access and may extort victims; spyware collects information without permission. Malware may arrive via malicious attachments, infected downloads or vulnerable systems.","flashPoints":["Virus infects other files","Worm spreads itself","Ransomware locks or encrypts data","Spyware collects information"]},{"cue":"Describe: social engineering","answer":"Social engineering manipulates people rather than relying only on technical weaknesses. Phishing impersonates a trusted organisation to obtain information or prompt action; pretexting invents a scenario; tailgating follows an authorised person into a restricted area; quid pro quo offers something in exchange for access or information.","flashPoints":["Social engineering manipulates people","Phishing uses deceptive messages or pages"]},{"cue":"Explain: weak configuration and exposure","answer":"Default passwords, outdated firmware, unnecessary open services, overly broad permissions, absent encryption and poorly configured network devices increase attack opportunities. A vulnerability is not identical to a successful attack; it is a weakness that can be exploited.","flashPoints":["Default passwords, exposed ports and missed updates are vulnerabilities","Limit exposure and patch systems"]},{"cue":"Apply: distinguish impact","answer":"Student records exposed → confidentiality. Marks secretly altered → integrity. School network unavailable during an exam → availability. A strong answer connects the incident to a specific asset and a mitigation.","flashPoints":["A threat exploits a vulnerability","Impact is the resulting harm"]},{"cue":"Apply · Threat, vulnerability and consequence","answer":"An attacker is a threat source. An unchanged default administrator password is a vulnerability. The attacker could exploit it and alter router settings. Change exposed credentials and limit administrative access.","flashPoints":["Threat: attacker","Vulnerability: default password","Consequence: changed router settings"]}],"summary":"CIA triad + attack method + affected asset + mitigation = a strong cybersecurity response."},{"id":"cn-25","title":"Cybersecurity: prevention and response","unit":"Networks","memorise":"Protect with updates, MFA, strong passwords, backups, access limits, encryption, firewall rules and education.","rows":[{"cue":"Explain: authentication, MFA and access rights","answer":"Authentication verifies who a user is; authorisation determines what they may do. Multi-factor authentication combines different factors such as something known and something possessed. Least privilege grants users only the permissions necessary for their tasks.","flashPoints":["Authentication verifies identity","MFA uses different factor types","Authorisation controls what the user can do"]},{"cue":"Explain: encryption and HTTPS","answer":"Encryption transforms readable data into ciphertext using cryptographic keys, protecting confidentiality for data in transit or at rest. HTTPS uses TLS to protect web traffic and authenticate the server. Encryption is not the same as a password or permission: keys and endpoint security still matter.","flashPoints":["Encryption makes data unreadable without the key","HTTPS protects web traffic in transit"]},{"cue":"Describe: updates, monitoring and backups","answer":"Patches fix known weaknesses; antivirus/endpoint protection detects some malicious behaviour; logs and intrusion detection help identify incidents. Backups support recovery from deletion, system failure or ransomware. Keep recovery copies protected and test that restoration works.","flashPoints":["Updates patch flaws","Monitoring detects suspicious activity","Backups support recovery"]},{"cue":"Apply: school controls","answer":"Staff accounts use MFA, student permissions are restricted, guest devices are segmented, sensitive data uses encrypted connections, patches are installed, backups are tested and suspicious messages are reported. Explain how each control addresses a specific risk rather than listing controls without purpose.","flashPoints":["Use student permissions and segmentation","Require MFA for staff","Keep tested backups"]},{"cue":"Explain: incident response","answer":"If something suspicious occurs, stop unsafe activity, report through school procedures, preserve useful information and let authorised staff investigate. For an exam, describe containment, recovery and learning from the incident at a high level; avoid assuming that simply restarting a device solves a compromise.","flashPoints":["Identify and contain the incident","Recover from trusted backups","Fix the cause and document what happened"]}],"summary":"Prevent → detect → respond → recover. A mitigation is useful only if you explain which risk it reduces."},{"id":"cn-26","title":"Graph theory and social-network models","unit":"Networks","memorise":"Graph G = vertices/nodes + edges/links. Degree = number of attached edges (undirected graph).","rows":[{"cue":"Define: node, edge, path and degree","answer":"A node/vertex represents an entity such as a person, computer or router. An edge represents a relationship or connection. A path is a sequence of connected nodes; its length is usually the number of edges. Degree is the number of edges touching a node in an undirected graph.","flashPoints":["Node: point","Edge: connection","Path: sequence of connected nodes","Degree: incident edges at a node"]},{"cue":"Apply: degrees and handshaking lemma","answer":"For edges AB, AC, BC and CD: deg(A)=2, deg(B)=2, deg(C)=3 and deg(D)=1. The sum of degrees is 8, twice the four edges. For an undirected simple graph, sum of all node degrees = 2 × number of edges.","flashPoints":["Each undirected edge contributes two to the sum of degrees","Number of edges = sum of degrees ÷ 2"]},{"cue":"Explain: shortest path, diameter and centrality","answer":"The shortest path between two nodes uses the fewest edges (in an unweighted graph). Diameter is the greatest shortest-path distance between any pair of nodes in a connected graph. A high-degree node has many direct connections but is not automatically the most important node under every centrality measure.","flashPoints":["Shortest path minimises hops or weight","Diameter is the largest shortest-path distance in a connected graph","Centrality estimates importance under a chosen measure"]},{"cue":"Explain: clustering and social networks","answer":"A clustering coefficient measures how strongly neighbours connect to one another. Social graphs can reveal close groups, bridges between communities and the flow of information or misinformation. The class material uses graph models to represent connections and analyse networks.","flashPoints":["Clusters are tightly connected groups","Look for bridges between groups","Do not infer a relationship the graph does not encode"]},{"cue":"Beyond: weighted/directed graphs","answer":"A directed edge indicates direction (e.g. account A follows B). A weighted edge can represent connection cost or travel time. In these graphs, shortest-path calculations can depend on weight rather than simply number of edges; directed graphs may have distinct in-degree and out-degree.","flashPoints":["Directed edges have an orientation","Weighted edges have a cost","Shortest weighted path uses minimum total cost"]},{"cue":"Trace · Degree, shortest path and bridge","answer":"With edges AB, AC, BC and CD, C has degree 3. A–C–D is a shortest A-to-D path of two edges. If CD is removed, D has no path to the other vertices.","flashPoints":["C touches A, B and D → degree 3","A–C–D → two edges","Removing CD isolates D"]}],"summary":"Calculate degrees carefully, count edges in a path and specify whether links are directed or weighted."},{"id":"cn-27","title":"Digital citizenship, social and ethical networking","unit":"Networks","memorise":"Privacy, accessibility, cyberbullying, misinformation, screen habits, inclusion, consent and digital footprint.","rows":[{"cue":"Explain: privacy and informed consent","answer":"Networks can collect location, messages, activity logs and personal details. Collection should be necessary, transparent, appropriately secured and handled under applicable requirements. Informed consent matters when publishing others’ information or images; student work should minimise unnecessary personal data.","flashPoints":["Privacy concerns how personal information is handled","Informed consent requires understanding what is collected and shared"]},{"cue":"Describe: cyberbullying and misinformation","answer":"Cyberbullying is harmful behaviour through digital communication; reporting mechanisms, support and appropriate moderation can reduce harm. Misinformation is false/inaccurate information whether or not deliberate; evaluate authorship, evidence, publication date and independent sources before sharing.","flashPoints":["Cyberbullying harms people through digital channels","Misinformation is false or misleading information","Check evidence before sharing"]},{"cue":"Explain: accessibility and the digital divide","answer":"Not everyone has the same connectivity, language, ability or device access. Accessible design includes readable text, keyboard support, captions and clear navigation. Unequal access can limit participation in education, employment and social services.","flashPoints":["Accessibility reduces barriers in the design","Digital divide describes unequal access, skills or resources"]},{"cue":"Evaluate: opportunities and problems","answer":"Connecting people enables teamwork, rapid communication, remote study and social participation. Problems include surveillance, scams, privacy breaches, harmful social interactions and dependence on platforms. Consider the perspectives of multiple user groups.","flashPoints":["Networks support collaboration","They can also spread harm or exclude people","Explain both in context"]},{"cue":"Apply: responsible network design","answer":"A school communication app should use restricted sharing, a reporting mechanism, accessible interfaces and policies for personal data. A balanced evaluation explains the benefit, the stakeholders, a realistic concern and a protective design response.","flashPoints":["Collect only necessary data","Use privacy controls and accessible formats","Provide a way to report harm"]}],"summary":"Social questions demand perspectives and consequences, not only technical definitions."},{"id":"cn-28","title":"Designing and building a connected system","unit":"Networks","memorise":"Problem → users → requirements → diagram → configure → test → refine.","rows":[{"cue":"Define: problem and user need","answer":"State who needs to communicate, what data must move, where devices are located and what success looks like. Break down the problem into nodes, transmission links, protocols, storage, security and outputs. Avoid designing first and inventing a problem later.","flashPoints":["State the problem and who experiences it","Describe the outcome users need"]},{"cue":"Explain: functional and non-functional network requirements","answer":"Functional: “Guest devices must access the internet but not internal school files.” Non-functional: “Classroom Wi‑Fi must support 25 concurrent users with acceptable response time.” Other constraints include cost, coverage, availability, latency, accessibility and maintenance.","flashPoints":["Functional: what the network must do","Non-functional: how well it must perform or what constraint applies"]},{"cue":"Apply: network plan","answer":"For a smart classroom, identify laptop clients, IoT sensors, AP, switch, router, cloud/local server and firewall. Draw links, assign suitable addresses/VLANs, configure access, then test data path and security. Include a fallback if internet connectivity is unavailable.","flashPoints":["Identify endpoints, access equipment and links","Plan addressing, permissions and tests"]},{"cue":"Describe: verification and evaluation","answer":"Test device connection, DNS lookup, local/remote reachability, correct user access, expected speed and failure behaviour. Evaluate against design criteria and revise. Keep documentation such as topology diagrams, IP tables, test results and change logs.","flashPoints":["Verify against requirements","Evaluate whether it solves the user need","Use results to improve the design"]},{"cue":"Beyond: project management","answer":"Plan roles, resources, deadlines and milestones. Use an iterative process: make a small working network, obtain feedback, expand and retest. Risks include device compatibility, permissions, unexpected interference and insufficient budget.","flashPoints":["Track tasks, dependencies and deadlines","Assign responsibility and record changes"]}],"summary":"A network design earns marks by satisfying a stated need and explaining hardware, data movement and security."},{"id":"cn-29","title":"Software development: problem, algorithm and program","unit":"Programming","memorise":"Algorithm = finite, clear sequence of steps to solve a problem. Program = executable implementation.","rows":[{"cue":"Define: problem-solving and decomposition","answer":"Computational problem-solving begins by identifying the required outcome, users, inputs, constraints and success criteria. Decomposition divides a large problem into smaller manageable tasks. Abstraction removes irrelevant detail so the solution focuses on essential information.","flashPoints":["Problem-solving starts by identifying the need","Decomposition breaks a task into smaller parts"]},{"cue":"Distinguish: algorithm, pseudocode and code","answer":"An algorithm describes the logic independent of language. Pseudocode expresses that logic in structured human-readable steps. A flowchart diagrams it. Python source code follows precise syntax so it can be executed. The same algorithm can be implemented in several programming languages.","flashPoints":["Algorithm: step-by-step method","Pseudocode: structured description","Code: instructions in a programming language"]},{"cue":"Explain: input, processing, output","answer":"Example quiz app: inputs are user response and question data; process compares the answer to an answer key and updates score; output displays feedback/score; storage saves results. Identify variables and data types before writing the program.","flashPoints":["Input supplies data","Processing transforms it","Output presents the result"]},{"cue":"Explain: design before coding","answer":"Write requirements; choose data structures, functions and control structures; draft pseudocode/flowchart; create test cases including edge cases; implement and debug; review with users. Planning reduces major logical redesign later.","flashPoints":["Plan logic before implementation","Trace examples and edge cases before coding"]},{"cue":"Apply: clear algorithm properties","answer":"A useful algorithm has unambiguous steps, a clear start and end, correct logic and finite termination for its intended valid inputs. It should handle unexpected input and state what happens if a search fails, not only if it succeeds.","flashPoints":["Make instructions unambiguous and finite","Define inputs, outputs and stopping conditions"]}],"summary":"Decompose → design algorithm → implement → test → improve."},{"id":"cn-30","title":"Pseudocode: agreed structures and conventions","unit":"Programming","memorise":"BEGIN/END, IF/ELSE/ENDIF, WHILE/ENDWHILE, REPEAT/UNTIL, FOR/NEXT, CASEWHERE/ENDCASE.","rows":[{"cue":"Define: pseudocode","answer":"Pseudocode is structured plain-language notation for algorithm logic, not runnable Python. Indentation and consistent keywords clarify the flow. The class notes show BEGIN name/END name for a procedure and keywords for selection and repetition.","flashPoints":["Structured, language-independent algorithm description","Use the class keywords and indent blocks"]},{"cue":"Apply: sequence and selection","answer":"BEGIN Check Age\n    INPUT age\n    IF age >= 13 THEN\n        OUTPUT \"Allowed\"\n    ELSE\n        OUTPUT \"Not allowed\"\n    ENDIF\nEND Check Age","flashPoints":["Sequence runs top to bottom","IF selects using a condition","Close with ENDIF"]},{"cue":"Apply: pre-test and post-test loops","answer":"WHILE condition … ENDWHILE checks before the body and can run zero times. REPEAT … UNTIL condition checks afterwards and runs at least once. Use FOR counter = start TO finish STEP increment and NEXT counter for a counted loop.","flashPoints":["WHILE tests first and can run zero times","REPEAT tests UNTIL after the body and runs at least once"]},{"cue":"Compare: CASEWHERE and IF chains","answer":"CASEWHERE expression evaluates to selects from listed values. Put each labelled action on an indented line, use OTHERWISE: action for the default, then ENDCASE. To test several different Boolean conditions, use nested IF/ELSE blocks and close each IF with ENDIF.","flashPoints":["CASEWHERE selects a listed value","IF tests conditions that can be more general","OTHERWISE handles a default case"]},{"cue":"Common errors","answer":"Missing ENDIF/ENDWHILE, placing a statement outside its intended block, using an impossible termination condition or changing a loop counter incorrectly. Trace the logic with test data before translating it to Python.","flashPoints":["Match BEGIN/END names and control endings","Indent blocks","Update loop variables"]},{"cue":"Construct · Named WHILE procedure","answer":"BEGIN Approach Marker\n    INPUT distance\n    WHILE distance > 55\n        Move forward one step\n        INPUT distance\n    ENDWHILE\n    Stop motors\nEND Approach Marker","flashPoints":["Read distance before WHILE distance > 55","Move, then take a new reading inside the loop","Stop after ENDWHILE"]},{"cue":"Construct · Named CASEWHERE procedure","answer":"BEGIN Set Mode\n    INPUT choice\n    CASEWHERE choice evaluates to\n        A: OUTPUT \"Automatic\"\n        M: OUTPUT \"Manual\"\n    OTHERWISE: OUTPUT \"Invalid\"\n    ENDCASE\nEND Set Mode","flashPoints":["Use CASEWHERE choice evaluates to","List A and M branches, then OTHERWISE","Close ENDCASE and the named procedure"]}],"summary":"Pseudocode must clearly show start, order, conditions, repetition and stopping."},{"id":"cn-31","title":"Flowcharts: shapes and logic","unit":"Programming","memorise":"Terminal oval = start/end; rectangle = process; parallelogram = input/output; diamond = decision; arrow = flow.","rows":[{"cue":"Identify: standard flowchart symbols","answer":"Start/end uses an oval or rounded terminal; process/calculation uses a rectangle; input/output uses a parallelogram; decision/condition uses a diamond; arrows show control flow. A connector links parts when a large chart needs continuation.","flashPoints":["Terminator: start/end","Parallelogram: input/output","Rectangle: process","Diamond: decision"]},{"cue":"Explain: sequence and branching","answer":"A sequence runs processes in order. A decision diamond usually has labelled True/False or Yes/No arrows to different paths. Paths may rejoin after selection. An unlabeled decision branch can make an algorithm ambiguous.","flashPoints":["Sequence follows arrows","A decision has labelled exits such as Yes and No"]},{"cue":"Explain: repetition in a flowchart","answer":"A loop contains a decision and a backward arrow to repeat the body. In a pre-test loop the decision occurs before the body; in a post-test loop the action occurs before the decision. Ensure at least one route reaches the end.","flashPoints":["A loop returns to the test after updating state","One branch must eventually exit"]},{"cue":"Apply: convert pseudocode","answer":"IF temperature > 30 THEN fan ON ELSE fan OFF becomes: Start → input temperature → decision temperature > 30? → two process boxes → merge → End. Include a clear output and avoid turning every statement into a decision diamond.","flashPoints":["Convert each instruction to a matching symbol","Connect steps and label both decision branches"]},{"cue":"Check: algorithm correspondence","answer":"When converting a flowchart to Python, test whether each input, comparison, action, loop condition and output appears in both. Differences often reveal skipped edge cases or loops that cannot terminate.","flashPoints":["Trace a normal and boundary input","Verify the same output and termination as the pseudocode"]},{"cue":"Trace · A decision loop from input 2","answer":"Read 2, test n > 0, print 2, decrement to 1 and return to the decision. Print 1, decrement to 0, then take the No branch to End. Returning to input would overwrite the counter.","flashPoints":["Print 2, decrement to 1","Print 1, decrement to 0","0 fails n > 0 and exits"]}],"summary":"Read arrows, not the physical position of boxes; make decision labels explicit."},{"id":"cn-32","title":"Sequence, variables, assignment and input/output","unit":"Programming","memorise":"Python executes top to bottom unless control flow changes. Assignment uses =; comparison uses ==.","rows":[{"cue":"Define: sequence and variable","answer":"Sequence is the default execution of statements in order. A variable is a name associated with a stored value that can change. Example: score = 0; score = score + 1. The right side is evaluated first, then the result replaces the old value.","flashPoints":["Sequence runs instructions in order","A variable holds a value that may change"]},{"cue":"Explain: Python input and print","answer":"input(\"Name: \") returns a string. print() displays values. To calculate with a typed number, convert it deliberately: age = int(input(\"Age: \")). Without conversion, \"7\" + \"2\" produces \"72\" as string concatenation, whereas 7 + 2 produces 9.","flashPoints":["input() returns text","print() displays values","Convert before doing arithmetic"]},{"cue":"Describe: good variable names","answer":"Choose meaningful names (total_score, robot_distance). Python is case-sensitive, so Score differs from score. Variable names cannot start with a digit or contain spaces; avoid shadowing built-in names such as list or input.","flashPoints":["Use a meaningful name","Use consistent style","Avoid reserved words"]},{"cue":"Trace: assignment","answer":"x = 5; y = x * 2; x = x + 3; print(y, x) displays 10 8. y remembers the computed value 10; changing x afterward does not automatically recalculate y. Use a desk-check table for multiple updates.","flashPoints":["Evaluate the right side first","Assign the result to the variable on the left"]},{"cue":"Apply: reliable input","answer":"Prompt users clearly and validate input before assuming it is in range. If int(input(...)) receives text like \"hello\", it raises ValueError. A try/except can handle invalid conversion, or an exam algorithm can show input validation in pseudocode.","flashPoints":["Read, convert and validate before use","Handle an invalid entry or ask again"]}],"summary":"Read each assignment as “evaluate right side, store result in name on left”."},{"id":"cn-33","title":"Data types, conversions and Boolean values","unit":"Programming","memorise":"int whole number; float decimal; str text; bool True/False. Type matters to operators and comparisons.","rows":[{"cue":"Define: core types","answer":"int represents integers (e.g. −4, 25); float represents floating-point numbers (e.g. 2.5); str represents text (e.g. \"25\"); bool represents True or False. A variable’s current value has a type that affects the operations permitted.","flashPoints":["int: whole numbers","float: decimal values","str: text","bool: True or False"]},{"cue":"Explain: casting/conversion","answer":"int(\"12\") becomes 12; float(\"2.5\") becomes 2.5; str(12) becomes \"12\". int(2.9) truncates toward zero, producing 2. Not all conversions succeed: int(\"12.5\") fails directly, so format and validation matter.","flashPoints":["Convert with int(), float() or str() as needed","Invalid numeric input can raise ValueError"]},{"cue":"Explain: why Boolean type matters","answer":"Comparisons such as mark >= 50 produce Boolean results used in conditions. Do not confuse the string \"False\" with the Boolean False: a nonempty string is truthy in Python. Explicit comparisons improve readability when evaluating user input.","flashPoints":["A Boolean represents true or false","Conditions use it to choose a branch or keep looping"]},{"cue":"Compare: simple and collection data","answer":"A single int/str stores one value; a list groups multiple values and can be changed; a tuple groups values without ordinary element reassignment; a dictionary associates keys with values. Pick a structure that matches the problem.","flashPoints":["A simple value holds one item","A collection groups values for access or iteration"]},{"cue":"Apply: selecting a type","answer":"Use an integer for whole-number question scores, a float for measured temperature, a Boolean for obstacle_detected, a string for a username and a list for multiple sensor readings. Store a phone number as text if arithmetic is not meaningful.","flashPoints":["Count → int","Decimal measurement → float","ID such as 007 → str","Passed or failed → bool"]}],"summary":"If output looks wrong, inspect whether values are numbers or strings before blaming the formula."},{"id":"cn-34","title":"Arithmetic, relational and logical operators","unit":"Programming","memorise":"+ − * / // % ** ; comparisons == != < <= > >= ; Boolean logic and/or/not.","rows":[{"cue":"Explain: arithmetic operators","answer":"+ addition, − subtraction, * multiplication, / floating-point division, // floor division, % remainder, ** exponentiation. Example: 17 // 5 = 3, 17 % 5 = 2 and 2 ** 3 = 8. Python observes operator precedence: multiplication before addition; use parentheses to remove ambiguity.","flashPoints":["+ − * / for ordinary arithmetic","// floor division","% remainder","** power"]},{"cue":"Explain: relational operators","answer":"Comparisons test conditions: == equal, != not equal, < less than, <= less/equal, > greater and >= greater/equal. Their result is a Boolean. In Python, = assigns a value while == compares values. Confusing them creates an error or wrong logic.","flashPoints":["== equality","!= inequality","< > <= >= order comparisons"]},{"cue":"Explain: logical operators","answer":"and is True only when both conditions are True; or is True when at least one is True; not reverses a Boolean. Example: if age >= 13 and permission: ... requires both. Use parentheses to communicate grouped conditions clearly.","flashPoints":["and requires both","or requires at least one","not reverses the Boolean"]},{"cue":"Trace: combined expression","answer":"For score = 72 and attempts = 2, (score >= 70 and attempts < 3) evaluates True. (score < 50 or attempts == 0) evaluates False. Analyse each comparison first and then combine with logical operators.","flashPoints":["Do arithmetic first, then comparisons, then Boolean operators","Use parentheses to make grouping clear"]},{"cue":"Common traps","answer":"5 / 2 = 2.5, 5 // 2 = 2 and 5 % 2 = 1. Python uses and/or/not, not &&/||/! as executable Boolean keywords. A classroom pseudocode table may write “=” for equality, but real Python requires ==.","flashPoints":["= assigns, == compares","/ differs from //","Use brackets when and and or mix"]}],"summary":"Compute comparisons first; then apply not, and, or with parentheses where needed."},{"id":"cn-35","title":"Selection: if, elif, else and nested decisions","unit":"Programming","memorise":"if tests a condition; elif tests another if earlier conditions were False; else handles the remainder.","rows":[{"cue":"Define: binary and multiway selection","answer":"Binary selection chooses between two paths (IF/ELSE). Multiway selection has more alternatives, often using if/elif/else. Only the first matching branch in one if/elif/else chain executes. Separate if statements are independent and can all run.","flashPoints":["Binary selection chooses between two paths","Multiway selection chooses among several paths"]},{"cue":"Apply: grading example","answer":"mark = 76\nif mark >= 85:\n    grade = \"A\"\nelif mark >= 70:\n    grade = \"B\"\nelse:\n    grade = \"C\"\nprint(grade)\nThe output is B because 76 is at least 70 but below 85.","flashPoints":["Check the highest grade threshold first","Use elif for lower cutoffs and else for the fallback"]},{"cue":"Explain: indentation","answer":"Python uses indentation to define which statements belong to a block; commonly four spaces. The lines under if/elif/else must be indented consistently. Misaligned statements can cause IndentationError or unintended actions.","flashPoints":["Indentation defines which instructions belong to a branch","Align elif and else with if"]},{"cue":"Compare: nested if and logical conditions","answer":"Nested if statements test a second condition within the first. For example, allow entry only if a user is logged in AND has the required role; either nested tests or one combined condition can express this. Choose the clearer structure for the task.","flashPoints":["Nested if expresses a decision inside a decision","and/or can combine conditions when suitable"]},{"cue":"Trace: order matters","answer":"if mark >= 50: print(\"Pass\") elif mark >= 80: print(\"Distinction\") will never print Distinction for 80+ because the first condition already matches. Test more restrictive thresholds before broader ones in a single chain.","flashPoints":["Only the first true branch in an if/elif chain runs","Check specific overlapping cases first"]}],"summary":"With if/elif, the FIRST matching branch wins; list thresholds from highest to lowest when appropriate."},{"id":"cn-36","title":"Repetition: for, while, counters and termination","unit":"Programming","memorise":"for = iterate over a sequence/range; while = repeat while condition remains True.","rows":[{"cue":"Define: iteration and loop body","answer":"Iteration repeats a set of instructions. The indented loop body is the repeated part. A pre-test while loop may execute zero times if its condition is False initially. A post-test algorithm runs the body before checking whether to stop; Python does not have a built-in do...while keyword.","flashPoints":["An iteration is one pass","The loop body contains the repeated instructions"]},{"cue":"Explain: for and range","answer":"total = 0\nfor number in range(1, 5):\n    total += number\nprint(total)\nOutput is 10 because range(1, 5) produces 1, 2, 3, 4; the stop value is excluded. range(5) gives 0–4.","flashPoints":["for iterates through a sequence","Python range excludes the stop value"]},{"cue":"Explain: while termination","answer":"count = 0\nwhile count < 3:\n    print(count)\n    count += 1\nOutput is 0, 1, 2 on separate lines. Without count += 1 the condition never changes and the loop can run indefinitely. Identify the changing state and the stopping condition.","flashPoints":["while checks before each pass","Update state so the condition can become false"]},{"cue":"Apply: sentinel and validation loops","answer":"A sentinel loop continues until a special value such as \"quit\" is entered. A validation loop repeats until the user supplies acceptable data. Avoid using a fixed-count for loop if the number of repetitions is not known in advance.","flashPoints":["A sentinel signals the end","A validation loop repeats until input meets the rules"]},{"cue":"Explain: break, continue and nested loops","answer":"break exits the nearest loop; continue skips to its next iteration. A loop inside another loop may execute multiple times for each outer step. For nested loops, count iterations carefully and note which loop a break affects.","flashPoints":["break exits the loop","continue skips to the next iteration","Nested loops repeat the inner work per outer pass"]},{"cue":"Debug · Why is the sum only the last value?","answer":"If total is set to 0 each time through the loop, each iteration discards the running sum. Initialise before the loop, add inside it and return or display the result afterwards.","flashPoints":["Initialise total before the loop","Add each value inside it","Return or display the total afterwards"]}],"summary":"Off-by-one errors often come from range() excluding its stop value or from wrong ≤ / < conditions."},{"id":"cn-37","title":"Lists, arrays, indexing, iteration and search","unit":"Programming","memorise":"Python list = ordered mutable collection; indexes start at 0; len() gives number of items.","rows":[{"cue":"Define: array/list and index","answer":"The class material uses arrays to explain lists of related values. In Python, a list is an ordered mutable sequence: scores = [68, 75, 91]. scores[0] is 68, scores[-1] is 91. Attempting an out-of-range index raises IndexError.","flashPoints":["List/array groups ordered values","An index identifies a position","Python indexing starts at 0"]},{"cue":"Explain: accessing and updating","answer":"scores[1] = 80 changes the second item. scores.append(95) adds an item; len(scores) gives its current length. To traverse values, for score in scores: ...; to traverse positions, for i in range(len(scores)): ... . Choose the form that matches the algorithm.","flashPoints":["Read with values[i]","Assign values[i] to replace an item","append adds to the end"]},{"cue":"Apply: linear search","answer":"found = False\nfor name in names:\n    if name == target:\n        found = True\n        break\nprint(found)\nThis checks each name until a match or the end. It must correctly handle an empty list and no match.","flashPoints":["Check values one at a time","Return or flag a match","Handle no match"]},{"cue":"Apply: total and average","answer":"scores = [60, 70, 80]\naverage = sum(scores) / len(scores)\nThe result is 70.0. Before dividing, check len(scores) > 0 to avoid ZeroDivisionError. For a manual average, start total = 0 and add each score in a loop.","flashPoints":["Accumulate a total","Divide by the count only when it is non-zero"]},{"cue":"Beyond: aliasing","answer":"If a = [1, 2] and b = a, both names refer to the same list; b.append(3) also changes a. Use b = a.copy() for a separate shallow copy when appropriate. Alias effects are a common tricky code-tracing question.","flashPoints":["Two names can refer to the same list","A mutation through either name affects the shared list"]}],"summary":"Index 0 = first; index len(list) − 1 = last; test empty collections before dividing by length."},{"id":"cn-38","title":"Strings, dictionaries and useful data structures","unit":"Programming","memorise":"Strings are sequences of characters; dictionaries map keys to values; choose data structure by access needs.","rows":[{"cue":"Describe: string indexing and slicing","answer":"A string is an ordered immutable sequence of characters. \"robot\"[0] is \"r\" and \"robot\"[1:4] is \"obo\" (start included, end excluded). len(text) counts characters; text.lower() produces lowercase; text.strip() removes surrounding whitespace.","flashPoints":["Strings use zero-based indexing","Slices include the start and exclude the stop","Strings are immutable"]},{"cue":"Explain: string processing","answer":"To compare text without case sensitivity, use input_text.strip().lower() == \"yes\". To count a character, loop through the string and increment a counter when a match occurs. Because strings are immutable, methods normally return a new string rather than changing the existing string in place.","flashPoints":["Normalise case or whitespace when appropriate","Use string operations to split, search or combine text"]},{"cue":"Define: dictionary","answer":"A dictionary stores key–value pairs: marks = {\"Ari\": 85, \"Lee\": 71}. marks[\"Ari\"] returns 85. marks.get(\"Sam\", 0) can supply a default if a key is absent. Dictionaries suit lookups by name/ID rather than fixed numeric position.","flashPoints":["Dictionary stores key–value pairs","Keys are unique and retrieve their associated values"]},{"cue":"Compare: list, tuple and dictionary","answer":"List: ordered, mutable sequence for changing collections. Tuple: ordered sequence that is not normally reassigned element by element. Dictionary: mapping for keyed lookup. Example: a list of temperatures, a tuple for fixed coordinate (x, y), a dictionary for scores by student ID.","flashPoints":["List: ordered and mutable","Tuple: ordered and immutable","Dictionary: key–value mapping"]},{"cue":"Beyond: sorting and complexity","answer":"sorted(numbers) returns sorted values and numbers.sort() changes a list. Linear search may inspect every item (O(n)); dictionary key lookup is typically efficient on average. These are useful extension concepts, not explicitly required by the assessment notification.","flashPoints":["Sorting changes order","Choose a method based on the data and required performance"]}],"summary":"Lists use positions; dictionaries use keys; strings are text sequences.","supplementary":true},{"id":"cn-39","title":"Functions, parameters, return and modular programs","unit":"Programming","memorise":"def name(parameters): ... return value. Print displays; return sends a value back to caller.","rows":[{"cue":"Define: function and sub-program","answer":"A function is a named reusable block of code that can receive arguments and may return a result. Modular programming decomposes a large program into functions with clear responsibilities, making reuse, testing, maintenance and collaboration easier.","flashPoints":["A function is a reusable named block","A sub-program handles a defined part of a larger task"]},{"cue":"Explain: parameters, arguments and scope","answer":"A parameter is a variable listed in a function definition; an argument is the value passed at a call. Local variables created inside a function normally belong to that function. Do not assume changing a local number automatically changes an unrelated caller variable.","flashPoints":["Parameter: name in definition","Argument: supplied value","Local scope: name available within its function"]},{"cue":"Apply: function with return","answer":"def larger(a, b):\n    if a > b:\n        return a\n    return b\nresult = larger(4, 9)\nprint(result)\nThe output is 9. return immediately ends that function call, so statements after a returned path are skipped.","flashPoints":["Call a function with inputs","return sends the result to the caller","The caller can store or use it"]},{"cue":"Distinguish: print versus return","answer":"print(score) shows text to the user but generally does not supply the value to the caller. return score makes the result available for assignment or later calculation. A function without an explicit return returns None in Python.","flashPoints":["print displays a value","return passes a value back","Printing alone does not provide the calculated result to the caller"]},{"cue":"Explain: modular testing","answer":"Test a small function with normal, boundary and invalid cases. For example, test larger(3, 5), larger(5, 3), larger(4, 4) and negative values. Clear inputs/outputs make unit tests easier and reduce duplicated code.","flashPoints":["Test one function against expected outputs","Test boundaries and invalid inputs","Then check integration"]},{"cue":"Trace · Argument, parameter and result","answer":"In def double(n): return n * 2, n is a parameter. In result = double(6) + 1, 6 is the argument. The function returns 12 and the caller stores 13.","flashPoints":["n is the parameter","6 is the argument","double(6) returns 12, so adding 1 gives 13"]}],"summary":"Parameter receives input; return produces a reusable output; functions should each do one clear job."},{"id":"cn-40","title":"Desk checking, tracing and dry runs","unit":"Programming","memorise":"Trace table = statement executed + each variable’s current value + any output.","rows":[{"cue":"Define: desk checking","answer":"Desk checking manually executes a program or pseudocode line by line using sample inputs, recording how variables and outputs change. It helps find logical errors before or without executing software. It does not guarantee all errors will be found.","flashPoints":["Desk checking traces an algorithm manually","Use concrete inputs and track state"]},{"cue":"Apply: build a trace table","answer":"For x=2; total=0; repeat three times: total=total+x; x=x+1; the rows after each iteration are (x=3,total=2), (x=4,total=5), (x=5,total=9). Use columns for loop index/condition, x, total and output; show the order of statements precisely.","flashPoints":["Create columns for variable values and output","Record changes in execution order"]},{"cue":"Explain: how branches affect the trace","answer":"For each if, write the Boolean result and follow only the executed branch. For a while loop, check its condition before each repetition, including the final False check that ends the loop. A for loop uses every value in its range or collection.","flashPoints":["Evaluate the branch condition","Trace only the branch that runs","Keep values unchanged when no update occurs"]},{"cue":"Identify: common mistakes","answer":"Changing multiple variables at once, treating = as mathematical equality, including the stop number of range, failing to notice break/return, or assuming a branch runs after an earlier elif succeeds. Trace exactly the statements shown rather than the programmer’s intended outcome.","flashPoints":["Check initial values, exact bounds and indentation","Record the final output separately"]},{"cue":"Explain: selecting test inputs","answer":"Test a normal case, boundary values, wrong types, empty collections and options that use every possible branch. If a program checks score >= 50, test 49, 50 and 51 to reveal comparison mistakes.","flashPoints":["Use normal, boundary and invalid inputs","Choose a test that exposes the suspected fault"]},{"cue":"Desk check · An accumulator with a skipped item","answer":"Start total at 1 and add only even values in [2, 5, 4]. After each iteration total is 3, 3, then 7. The final print is 7.","flashPoints":["Start at 1","For [2, 5, 4], totals are 3, 3, 7","Final output is 7"]}],"summary":"Trace literally, update after each executed assignment, and record printed output separately."},{"id":"cn-41","title":"Testing, debugging, validation and unit tests","unit":"Programming","memorise":"Syntax error: invalid code; runtime error: crash while running; logic error: wrong result despite executing.","rows":[{"cue":"Distinguish: error categories","answer":"Syntax errors break Python grammar (missing colon, invalid indentation). Runtime errors happen during execution (division by zero, invalid index, failed int conversion). Logic errors allow a program to run but produce the wrong output (e.g. > instead of >=). IndentationError is a syntax-related error in Python.","flashPoints":["Syntax: invalid code form","Runtime: failure during execution","Logic: runs but gives wrong result"]},{"cue":"Define: testing, debugging and unit testing","answer":"Testing checks whether software meets expected behaviour; debugging locates and fixes defects; a unit test checks an individual function or component with specified inputs and expected outputs. The exported “Unit Testing and Error Detection” Canvas PDF contains only a link, so this topic supplements that missing lesson.","flashPoints":["Testing checks behaviour","Debugging finds and fixes causes","Unit testing checks a small component"]},{"cue":"Explain: test cases and expected results","answer":"Specify input, expected output, actual output and pass/fail. Test normal inputs, boundaries, invalid types, empty input and error-handling paths. For a 0–100 score validator, useful cases include −1, 0, 50, 100, 101 and non-numeric input.","flashPoints":["State input and expected output before running","Compare the actual result","Include boundary cases"]},{"cue":"Differentiate: validation and verification","answer":"Validation checks whether the product solves the user’s real need; verification checks whether it was built according to specified requirements. Input validation checks incoming data meets rules, such as number being 1–10. These meanings are related but not interchangeable.","flashPoints":["Validation checks input against rules","Verification checks it matches the intended source or specification in context"]},{"cue":"Explain: debugging process","answer":"Reproduce the fault, inspect traceback and relevant variables, isolate the smallest failing case, change one cause, rerun the failed case and regression-test nearby features. Print statements and debuggers can reveal intermediate values. Avoid hiding an error by blindly removing code.","flashPoints":["Reproduce the fault","Locate the cause","Fix it and rerun the relevant tests"]},{"cue":"Test · Distinguish > from >=","answer":"The rule “warn above 40” means no warning at 40 and a warning at 41. If a test at 40 warns, the code may have used >= by mistake. Run the revealing test again after the fix.","flashPoints":["At 40 expect no warning","At 41 expect warning","An incorrect >= comparison warns at 40"]}],"summary":"A “good test” has known inputs, expected output and a clear reason for selection."},{"id":"cn-42","title":"Python algorithms and exam-ready code patterns","unit":"Programming","memorise":"Input → validate → loop/process → output. Include clear stopping conditions and handle empty data.","rows":[{"cue":"Apply: count matches","answer":"count = 0\nfor item in items:\n    if item == target:\n        count += 1\nprint(count)\nStart the counter at zero; update only for matching values. This pattern also works for positives, even numbers or threshold readings by changing the condition.","flashPoints":["Start count at zero","Check each item","Increment only on a match"]},{"cue":"Apply: find maximum safely","answer":"if len(values) == 0:\n    print(\"No data\")\nelse:\n    largest = values[0]\n    for value in values:\n        if value > largest:\n            largest = value\n    print(largest)\nDo not initialise largest = 0 if negative inputs are possible.","flashPoints":["Check for empty input","Start with the first valid value","Update when a larger value appears"]},{"cue":"Apply: input until valid","answer":"while True:\n    raw = input(\"1 to 5: \")\n    if raw.isdigit() and 1 <= int(raw) <= 5:\n        answer = int(raw)\n        break\n    print(\"Try again\")\nThis example accepts only unsigned whole-number strings. Explain its limits if asked about negatives or decimals.","flashPoints":["Read input and check the rule","Repeat if invalid","Exit when valid"]},{"cue":"Apply: safe division","answer":"if count != 0:\n    average = total / count\nelse:\n    average = None\nThis protects against division by zero. In some apps a different default or an error message is more appropriate; choose based on the user requirement.","flashPoints":["Check denominator before dividing","Handle zero explicitly","Return or report the result"]},{"cue":"Explain: rubric-aware coding","answer":"Exams may award marks for correct function header, variable initialisation, loops, conditions, return/output, input validation and indentation. Plan before typing; dry-run a typical case and an edge case. Equivalent correct algorithms may exist even if a rigid auto-marker only accepts one reference implementation.","flashPoints":["Follow exact inputs and outputs","Use clear control flow","Test an edge case and check the final result"]}],"summary":"Correct code has valid syntax, correct logic, suitable test cases, and explicit treatment of edge cases."},{"id":"cn-43","title":"Developing apps and web software","unit":"Programming","memorise":"App = interface + logic + data. Web app = front end, possible server/back end, and storage.","rows":[{"cue":"Explain: app architecture","answer":"A user interface collects input and presents results; application logic processes data using variables, conditions and functions; storage persists settings or results. A desktop/mobile app may work locally, while a web application commonly uses a browser to contact server services.","flashPoints":["App architecture separates interface, logic and data","Components exchange inputs and results"]},{"cue":"Define: front end and back end","answer":"Front end is the part users interact with, often HTML for structure, CSS for appearance and JavaScript for browser behaviour. Back end processes server-side requests and may access databases or use languages such as Python. The exam notification emphasises algorithms and Python rather than detailed web frameworks.","flashPoints":["Front end: what the user interacts with","Back end: service logic and stored data"]},{"cue":"Explain: events and validation","answer":"An event such as clicking Submit triggers logic. Validate input to avoid unexpected or unsafe data; give clear error messages. Client-side validation improves convenience but server-side validation is still needed for data sent to a server.","flashPoints":["An event triggers a handler","Validate input before processing it","Show useful feedback"]},{"cue":"Apply: school quiz app","answer":"Interface: prompt, answer field and feedback. Logic: compare response, update score, load next question. Data: question list and answers. Testing: correct/incorrect answers, blank submissions, repeated clicks and completing the last question. Ethical issues: privacy of stored marks and accessibility.","flashPoints":["Interface presents questions","Logic checks answers","Data stores the score or progress"]},{"cue":"Beyond: quality attributes","answer":"Responsive interface, accessibility, security, performance and maintainability are non-functional qualities. Separate UI from reusable logic; use small functions and clear variable names. This improves debugging and future development.","flashPoints":["Quality includes reliability, accessibility and performance","Evaluate against measurable targets"]}],"summary":"For an app question, discuss user input, program decisions, output, data and testability.","supplementary":true},{"id":"cn-44","title":"Command words and answer construction","unit":"Programming","memorise":"Identify = name; define = precise meaning; outline = key features; explain = how/why; justify = choice + evidence.","rows":[{"cue":"Identify and define","answer":"IDENTIFY: supply the relevant term/device (e.g. “a switch”). DEFINE: give the essential meaning, not merely an example (e.g. “a switch forwards Ethernet frames between ports using MAC information”). Avoid long introductions when one accurate phrase is enough.","flashPoints":["Identify: name or recognise","Define: give the precise meaning"]},{"cue":"Describe and outline","answer":"DESCRIBE tells what an object/process is like or does, with relevant features. OUTLINE supplies the main points or sequence without exhaustive detail. Example: “Outline packet switching” → split message, address packets, route, receive/reassemble.","flashPoints":["Describe: state features or what happens","Outline: give the main steps or points"]},{"cue":"Explain","answer":"EXPLAIN means show causal relationships: “A VLAN separates students from staff into different broadcast domains, reducing unwanted local traffic; routing/firewall rules then control access between groups.” “It is safer” is insufficient without saying why.","flashPoints":["Give a reason or mechanism","Link cause to effect in the given scenario"]},{"cue":"Compare, analyse and evaluate","answer":"COMPARE includes similarities and differences using an agreed criterion. ANALYSE breaks down a system and relationships. EVALUATE makes a reasoned judgement against requirements or evidence and recognises limitations. For broad marks, organise response by benefits, drawbacks, evidence and judgement.","flashPoints":["Compare on shared criteria","Analyse relationships or effects","Evaluate using evidence and a judgement"]},{"cue":"Justify and design","answer":"JUSTIFY: choose an option, link its features to user requirements and contrast a plausible alternative. DESIGN: state inputs, outputs, storage, components, control logic and tests. Always use scenario details supplied by the question.","flashPoints":["Justify: support a choice with criteria and reasons","Design: propose a solution that meets the requirements"]}],"summary":"For full marks, match the command word, be precise, show examples and justify with context."},{"id":"cn-45","title":"Rapid memorisation: high-value distinctions","unit":"Programming","memorise":"Core pairs: sensor/actuator; open/closed loop; functional/non-functional; switch/router; LAN/WAN; VLAN/VPN; TCP/IP; lossless/lossy; =/==; for/while; print/return.","rows":[{"cue":"Mechatronics quick recall","answer":"Sensor reads environment; actuator acts. Microcontroller runs logic and controls input/output. Open-loop performs action without measuring result; closed-loop uses feedback. Functional requirements describe actions; non-functional requirements set quality/constraints. A state machine manages stages such as search, align, approach and grasp.","flashPoints":["Sensor measures","Controller applies rules","Actuator acts","Feedback measures the result"]},{"cue":"Networking quick recall","answer":"LAN local site; WAN broader connection; WLAN local Wi‑Fi; VLAN virtual broadcast-domain separation; VPN tunnel across other networks. Switch forwards locally by MAC; router moves IP packets between networks; AP provides Wi‑Fi; firewall filters. DNS resolves names, DHCP supplies IP settings.","flashPoints":["LAN is local, WAN spans sites, WLAN is local wireless","VLAN separates local groups","VPN tunnels over another network"]},{"cue":"Transmission quick recall","answer":"Packet switching splits data and routes packets; TCP provides ordered reliable delivery; IP provides addressing and routing; HTTPS uses TLS for protected web communication. Lossless exactly recovers data; lossy discards some details. Codec compresses media, container holds streams and metadata.","flashPoints":["Convert bytes to bits for bit rates","Lossless preserves all data","Codec encodes and container packages"]},{"cue":"Software quick recall","answer":"Pseudocode plans algorithm; Python executes it. Sequence is order, selection chooses path, iteration repeats. int/float/str/bool are basic types. = assignment, == equality; / division, // floor division, % remainder. A list starts at index 0. A function return passes a value back; print displays it.","flashPoints":["Input → process → output","WHILE tests before, REPEAT tests after","print displays and return passes back a value"]},{"cue":"Exam method","answer":"For a 4-mark explain question: define the concept, describe mechanism, apply example, state consequence or limitation. For code: identify inputs/data types, plan logic, write blocks with four-space indentation, trace a normal case and an edge case. For design: explain component choice in terms of requirements.","flashPoints":["Read the command word","Use a specific example or trace","Check boundaries, units and output"]}],"summary":"High scores come from distinctions and applying them to unfamiliar scenarios—not only memorising vocabulary."}],"questions":[{"id":"at4-001","module":"Algorithms","type":"mc","stem":"Which change makes “keep trying until the robot works” a testable algorithm step?","marks":1,"difficulty":"Exam","evidence":"AT4 study guide","options":["Ask someone to try harder","Repeat at most three times and stop early when the sensor returns a valid reading","Repeat whenever possible","Move on when it seems good"],"answer":1,"explanation":"The limit makes termination explicit. A valid-reading condition gives a testable reason to stop early.","unit":"Programming"},{"id":"at4-002","module":"Data Types","type":"blank","stem":"Store the locker ID \"007\" as _____. Store whether the locker is open as _____. Store its distance reading 12.5 as _____.","marks":3,"difficulty":"Exam","evidence":"AT4 study guide","parts":[{"prompt":"Locker ID","options":["integer","string","float","Boolean"],"answer":1},{"prompt":"Open status","options":["Boolean","integer","string","float"],"answer":0},{"prompt":"Distance","options":["integer","Boolean","float","string"],"answer":2}],"explanation":"Text preserves the leading zeros. A Boolean has two values and a float can represent 12.5.","unit":"Programming"},{"id":"at4-003","module":"Data Operators","type":"mc","stem":"In Python, what is the result of `17 // 5 + 17 % 5`?","marks":1,"difficulty":"Exam","evidence":"AT4 study guide","options":["3","4","5","7"],"answer":2,"explanation":"Floor division gives 3 and modulo gives the remainder 2. Their sum is 5.","unit":"Programming"},{"id":"at4-004","module":"Desk Checking and Sub-programs","type":"short","stem":"Desk check the Python. Give the values of total after each iteration and the exact final output.\n\ntotal = 1\nfor value in [2, 5, 4]:\n    if value % 2 == 0:\n        total = total + value\nprint(total)","marks":4,"difficulty":"Exam","evidence":"AT4 study guide","model":"After 2 → 3. After 5 → 3. After 4 → 7. The final printed output is 7.","criteria":[{"label":"First row","why":"After processing 2, total is 3.","evidenceGroups":[["2 3","after 2 total is 3","3 3 7"]]},{"label":"Second row","why":"After processing 5, total remains 3.","evidenceGroups":[["5 3","after 5 total stays 3","3 3 7"]]},{"label":"Third row","why":"After processing 4, total is 7.","evidenceGroups":[["4 7","after 4 total is 7","3 3 7"]]},{"label":"Output","why":"The single printed value is 7.","evidenceGroups":[["print","prints","printed","output"],["7"]]}],"unit":"Programming"},{"id":"at4-005","module":"Pseudocode","type":"pseudo","stem":"Write classroom pseudocode for Check Gate. Read distance in cm before looping. While distance is greater than 20, move forward one step then read distance again. After the loop, stop the motors. Use a named procedure and a pre-test loop.","marks":5,"difficulty":"Exam","evidence":"AT4 study guide","solution":"BEGIN Check Gate\n    INPUT distance\n    WHILE distance > 20\n        Move forward one step\n        INPUT distance\n    ENDWHILE\n    Stop motors\nEND Check Gate","rubric":[{"label":"Named procedure","why":"BEGIN Check Gate and END Check Gate enclose the indented algorithm."},{"label":"Initial input","why":"Read distance before the first condition check."},{"label":"Pre-test and boundary","why":"WHILE distance > 20 with matching ENDWHILE."},{"label":"Loop body","why":"Both the move and a fresh distance reading occur inside the loop in that order."},{"label":"Stop","why":"Stop motors after the loop, including if the first reading is 20 or less."}],"unit":"Programming"},{"id":"at4-006","module":"Selection","type":"code","stem":"Write `entry_fee(age, member)`. Given an integer age ≥ 0 and a Boolean member, return 0 if age is under 5, otherwise 8 for a member or 12 for a non-member. Return an integer.","marks":5,"difficulty":"Exam","evidence":"AT4 study guide","function":"entry_fee","starter":"def entry_fee(age, member):\n    ","solution":"def entry_fee(age, member):\n    if age < 5:\n        return 0\n    if member:\n        return 8\n    return 12","tests":[{"args":[4,false],"expected":0},{"args":[4,true],"expected":0},{"args":[5,true],"expected":8},{"args":[5,false],"expected":12},{"args":[15,false],"expected":12}],"explanation":"The under-five rule takes priority over membership. At age 5, the membership rule applies.","unit":"Programming"},{"id":"at4-007","module":"LAN, WAN, WLAN, VLAN, VPN — Essential Networking","type":"blank","stem":"A single campus uses a _____. A connection spanning the Sydney campus and a Perth office forms part of a _____. A staff member securely tunnels into the campus network using a _____.","marks":3,"difficulty":"Exam","evidence":"AT4 study guide","parts":[{"prompt":"Single campus","options":["WAN","LAN","VPN","VLAN"],"answer":1},{"prompt":"Between sites","options":["VLAN","WLAN","VPN","WAN"],"answer":3},{"prompt":"Secure tunnel","options":["VPN","LAN","WAN","VLAN"],"answer":0}],"explanation":"LAN and WAN describe geographic scope. A secure VPN tunnel can run over a WAN, including the internet.","unit":"Networks"},{"id":"at4-008","module":"LAN, WAN, WLAN, VLAN, VPN — Essential Networking","type":"short","stem":"Guests and staff share the same physical switches. Explain how VLANs separate their local traffic and describe a rule to keep guests away from the payroll server while allowing internet access.","marks":3,"difficulty":"Exam","evidence":"AT4 study guide","model":"Assign staff and guests to separate VLANs on the managed switches. Local broadcasts stay inside each VLAN. Apply a firewall or routing access rule that blocks guest-to-payroll traffic and permits guest internet traffic.","criteria":[{"label":"Logical grouping","why":"Separate guest and staff VLANs can use the same hardware.","evidenceGroups":[["separate","different","distinct","individual","staff vlan and guest vlan","staff vlan and a guest vlan"],["vlan","vlans"]]},{"label":"Traffic effect","why":"Local broadcasts remain inside their VLAN.","evidenceGroups":[["broadcast","broadcasts"],["stays","stay","remain","remains","confined","limited","separate","within","cannot cross","do not cross"]]},{"label":"Policy","why":"Explicitly block guest access to the payroll server and permit guest internet access.","evidenceGroups":[["block","blocks","deny","denies","restrict","restricts"],["payroll","staff server","staff resources"],["permit","permits","allow","allows"],["internet","web"]],"contradictions":["block internet","deny internet"]}],"unit":"Networks"},{"id":"at4-009","module":"Network Hardware","type":"mc","stem":"Which device is primarily responsible for forwarding IP packets from the school LAN towards a different IP network?","marks":1,"difficulty":"Exam","evidence":"AT4 study guide","options":["Wireless access point","Hub","NIC","Router"],"answer":3,"explanation":"A router forwards packets between IP networks. A Layer 2 switch typically forwards frames within a VLAN.","unit":"Networks"},{"id":"at4-010","module":"Data Processing and Transmission","type":"short","stem":"A teammate must receive the exact original pixels of a diagram. A preview for the website may lose some detail. Explain which compression approach fits each file.","marks":2,"difficulty":"Exam","evidence":"AT4 study guide","model":"Use lossless compression for the diagram so decompression restores the original pixels. Lossy compression can make the preview smaller by discarding some detail, if the resulting quality is acceptable.","criteria":[{"label":"Original","why":"Choose lossless and explain exact recovery.","evidenceGroups":[["lossless"],["exact","original","restore","restores","unchanged","without losing","recover every pixel","same pixels","preserves every pixel"]]},{"label":"Preview","why":"Choose lossy and explain the size–quality trade-off.","evidenceGroups":[["lossy"],["discard","discards","discarding","lose","loses","lower quality","less detail","loss of detail","quality loss"],["smaller","reduces","reduce","size","preview"]],"contradictions":["lossy preserves all detail","lossy restores every pixel"]}],"unit":"Networks"},{"id":"at4-011","module":"Automation","type":"mc","stem":"A fan controller measures the room temperature again after switching on. What makes this feedback?","marks":1,"difficulty":"Exam","evidence":"AT4 study guide","options":["The fan has blades","It uses a second measurement of the controlled condition to make a later decision","A person set the original threshold","It contains an electric motor"],"answer":1,"explanation":"The controller uses a new reading of the quantity it is controlling to decide what to do next.","unit":"Mechatronics"},{"id":"at4-012","module":"Components","type":"short","stem":"A sorter detects a parcel, decides where it goes and turns a gate. Identify a suitable sensor, describe the controller’s decision and name a suitable actuator.","marks":3,"difficulty":"Exam","evidence":"AT4 study guide","model":"A light-beam sensor detects the parcel as it blocks the beam. The controller uses the input and its sorting rule to decide whether the gate should turn. A servo turns the gate to the required angle.","criteria":[{"label":"Sensor","why":"A suitable sensor and how it detects a parcel.","evidenceGroups":[["beam","infrared","camera","proximity","distance","optical","pressure","limit switch"],["detects","detect","blocked","blocks","senses","identify","identifies","trigger","triggers","recognises"]]},{"label":"Controller","why":"A rule-based decision using the detected input.","evidenceGroups":[["controller","processor","program","microcontroller"],["decision","decides","rule","compares","checks","chooses"]]},{"label":"Actuator","why":"A servo or another suitable motor moves the gate.","evidenceGroups":[["servo","servomotor","motor","solenoid"],["gate","turn","turns","move","moves","angle","rotates"]]}],"unit":"Mechatronics"},{"id":"at4-013","module":"Social Ethical","type":"short","stem":"A warehouse robot increases the number of orders packed per hour but changes staff duties. Explain one benefit, one impact on workers and a response that addresses that impact.","marks":3,"difficulty":"Exam","evidence":"AT4 study guide","model":"Repeatable sorting can increase throughput. Some packers may lose routine duties and need new skills. Give affected workers training and a path into robot monitoring or maintenance roles.","criteria":[{"label":"Benefit","why":"A specific benefit connected to automation.","evidenceGroups":[["throughput","productivity","more orders","faster","accuracy","consistent","consistency","repeatable","safer"]]},{"label":"Worker impact","why":"A plausible effect on staff and their work.","evidenceGroups":[["lose","loss","replace","replaced","changes","new skills","fewer","job displacement","reduced","reduction","redundancy","redeployed"],["workers","staff","jobs","duties","packers","roles","positions","training","skills"]]},{"label":"Response","why":"A practical response linked to the identified worker impact.","evidenceGroups":[["training","train","retraining","retrain","redeploy","redeployment","upskill","supervision","maintenance roles"]]}],"unit":"Mechatronics"},{"id":"at4-014","module":"Flowcharts","type":"blank","stem":"Start is shown using a _____. Read a score using a _____. Test score ≥ 50 using a _____.","marks":3,"difficulty":"Exam","evidence":"AT4 study guide","parts":[{"prompt":"Start","options":["diamond","parallelogram","terminator","rectangle"],"answer":2},{"prompt":"Read","options":["diamond","parallelogram","rectangle","terminator"],"answer":1},{"prompt":"Test","options":["diamond","rectangle","terminator","parallelogram"],"answer":0}],"explanation":"A terminator represents Start/End, a parallelogram represents input/output and a diamond branches according to a decision.","unit":"Programming"},{"id":"at4-015","module":"Control Structures - Intro","type":"mc","stem":"The first reading is already valid. Which classroom structure still executes its body at least once?","marks":1,"difficulty":"Exam","evidence":"AT4 study guide","options":["WHILE","IF","CASEWHERE","REPEAT…UNTIL"],"answer":3,"explanation":"REPEAT tests the stopping condition after its body. WHILE can execute zero times.","unit":"Programming"},{"id":"at4-016","module":"Input, Process, Output","type":"short","stem":"An app reads distance in kilometres and elapsed hours, then displays average speed in km/h. Give the IPO and one validation rule with its reason.","marks":4,"difficulty":"Exam","evidence":"Canvas lesson • supporting AT4 topic","model":"Input: distance and elapsed time. Process: divide distance by elapsed hours. Output: speed in km/h. Require elapsed hours > 0 so the program avoids division by zero and rejects negative durations.","criteria":[{"label":"Input","why":"Distance and elapsed hours.","evidenceGroups":[["distance","kilometres","km"],["time","hours","duration"]]},{"label":"Process","why":"Divide distance by elapsed hours.","evidenceGroups":[["divide","divided by","/"],["distance","km"],["time","hours","duration"]]},{"label":"Output","why":"Average speed in km/h.","evidenceGroups":[["speed"],["km/h","km per hour","kilometres per hour"]]},{"label":"Validation","why":"Require time > 0 and explain why.
