["Explaining the Opium Wars","Connect trade imbalance and opium's social harm with Chinese attempts to restrict the trade and foreign demands.","The opium trade caused serious social problems and challenged Qing control; conflict followed over trade and sovereignty.","Describing the wars as simply a disagreement about a product.","Why did the opium trade threaten Qing authority?","It undermined efforts to control trade and protect society, while foreign pressure challenged sovereignty."],
["Explaining the Boxer Rebellion","Consider anti-foreign sentiment, missionary activity, economic and political pressure, and foreign intervention.","The movement opposed foreign traders and Christian missionaries; intervention and occupation intensified perceptions of threats to Chinese sovereignty.","Calling it a rebellion against the Qing alone.","Who were the Boxers primarily opposing?","Foreign influence, including European traders, merchants and Christian missionaries."],
["Comparing civil rights leaders","Compare goals, strategies and context; avoid reducing complex views to a single label.","King is associated with non-violent mass protest and integration; Malcolm X emphasised Black self-determination and separatist ideas, with views changing over time.","Claiming the two men had identical strategies.","State one contrast between King's and Malcolm X's approaches.","King advocated non-violent integrationist protest; Malcolm X emphasised Black self-determination and separatism."],
["Evaluating significance","Use criteria: scale of influence, immediate outcome, longer-term change and limitations.","Rosa Parks' arrest helped spark a mass boycott, but the movement's success depended on collective organisation and legal action.","Giving an individual sole credit for a collective movement.","Why should significance include collective context?","Because social change usually involves many people, organisations and wider conditions."],
["Handling dates and chronology","Anchor events in sequence and avoid confusing separate rebellions or wars.","First Opium War 1839–42; Taiping Rebellion began 1850; Boxer Rebellion 1898–1901; 1911 Revolution.","Mixing up the Taiping and Boxer rebellions.","Which came first: the Taiping or Boxer Rebellion?","The Taiping Rebellion."],
["Building an extended response","Answer the exact question, establish an argument, use organised paragraphs and support each claim with accurate evidence.","A 20-mark response should sustain a judgement about one key individual and their significance to the US Civil Rights Movement.","Writing a biography with no judgement or evidence.","What must an extended response do beyond narrating events?","Make and sustain a judgement, explain significance and support claims with specific evidence."]
];

function showExamResult(){let e=state.exam,score=e.ids.reduce((s,id,i)=>s+(e.answers[i]===questions[id][8]?1:0),0);let essay=e.essay||"";$("#examArea").innerHTML=`<div class="panel"><h2>Mock ${e.mock} results</h2><div class="stat">${score}/30</div><p>Section I multiple-choice score. Section II is not automatically marked.</p><div class="notice"><b>Essay self-marking rubric (practice only, /20):</b><ol><li>Clear argument and direct answer to the question — 0–4</li><li>Accurate contextual knowledge — 0–4</li><li>Specific historical evidence — 0–4</li><li>Explanation of actions, influence and significance — 0–4</li><li>Structure, clarity and sustained judgement — 0–4</li></ol>Review each criterion and award yourself a mark. This is not the school's official rubric.</div><p><b>Essay word count:</b> ${essay.trim()?essay.trim().split(/\s+/).length:0}</p><h3>Review multiple choice</h3>${e.ids.map((id,i)=>{let q=questions[id],ok=e.answers[i]===q[8];return `<details><summary>Q${i+1}: ${ok?'Correct':'Review'} — ${esc(q[3])}</summary><p>Your answer: ${e.answers[i]===undefined?'Unanswered':esc(q[4+e.answers[i]])}</p><p>Correct: ${esc(q[4+q[8]])}</p><p>${esc(q[9])}</p></details>`}).join("")}<button onclick="state.exam=null;go('Exams')">Return to mocks</button></div>`}
function cornell(){let m=modules.find(x=>x.id===(window.noteModule||"movement"));shell("Cornell notes","Use the cue questions to retrieve information before revealing the sample. Your writing is saved separately for each module.",`
<label>Module <select id="noteMod">${modules.map(x=>`<option value="${x.id}" ${x.id===m.id?'selected':''}>${x.name}</option>`).join("")}</select></label><div id="noteArea"></div>`);$("#noteMod").onchange=e=>{window.noteModule=e.target.value;cornell()};let prompts={"movement":["What made the Middle Passage dangerous?","How did chattel slavery degrade enslaved people physically and psychologically?","How can a historian analyse the origin and perspective of a source?"],"wwi":["Explain the MAIN long-term causes of WWI.","Why did the Gallipoli campaign fail?","How did trench conditions affect soldiers?"],"china":["Why did the opium trade create tension?","What caused anti-foreign feeling before the Boxer Rebellion?","How did nationalism challenge Qing authority?"],"rights":["What was the purpose of the UDHR?","Compare King's and Malcolm X's strategies.","How did collective action contribute to civil rights change?"]};let arr=prompts[m.id];$("#noteArea").innerHTML=arr.map((p,i)=>{let key=m.id+"_"+i;let val=state.notes[key]||"";return `<div class="panel"><h3>Cue ${i+1}: ${p}</h3><div class="split"><div><label class="small">Your notes</label><textarea class="field answer noteInput" data-key="${key}">${esc(val)}</textarea></div><div><details><summary>Show sample</summary><p>${esc(sample(m.id,i))}</p></details></div></div></div>`}).join("")+`<div class="panel"><h3>Summary</h3><textarea class="field answer noteInput" data-key="${m.id}_summary" placeholder="Summarise the module in your own words...">${esc(state.notes[m.id+"_summary"]||"")}</textarea><details><summary>Show sample summary</summary><p>${esc(sample(m.id,3))}</p></details><h3>Memory rule</h3><textarea class="field noteInput" data-key="${m.id}_memory" placeholder="Write a short memory rule...">${esc(state.notes[m.id+"_memory"]||"")}</textarea></div>`;document.querySelectorAll(".noteInput").forEach(x=>x.oninput=()=>{state.notes[x.dataset.key]=x.value;save()})}
function sample(m,i){let a={movement:["The Middle Passage involved forced transport in overcrowded ships, with restricted movement, poor ventilation, limited provisions, disease and violence.","Chattel slavery treated people as property. Physical degradation included forced labour, violence and deprivation; psychological degradation included family separation, fear, denial of autonomy and dehumanisation.","Identify creator, date, place and purpose; then explain the viewpoint and evaluate usefulness and limitations in relation to the question."],wwi:["Militarism, alliances, imperialism and nationalism created long-term tensions; the assassination of Archduke Franz Ferdinand triggered the July Crisis.","Steep terrain, Ottoman resistance, planning and command problems and logistical difficulties contributed to the campaign's failure.","Mud, exposure, disease, lice, rats, shellfire and poor sanitation affected health, morale and daily life."],china:["The opium trade caused social harm and challenged Qing attempts to control trade and protect sovereignty, while foreign powers demanded commercial privileges.","Anti-foreign feeling grew from foreign commercial and political influence, missionary activity, unequal privileges and intervention.","Nationalism helped undermine the legitimacy of imperial rule and contributed to revolutionary movements."],rights:["The UDHR established a common international statement of fundamental rights, adopted by the UN General Assembly in 1948.","King is associated with non-violent mass protest and integration; Malcolm X emphasised Black self-determination and separatist ideas. Their views and strategies developed over time.","Boycotts, protests, sit-ins, legal challenges and marches mobilised communities, attracted attention and pressured institutions and governments."]};return a[m][i]||a[m][0]}
function flashcards(){shell("Flashcards","Short retrieval prompts across the course. Rate each card to track what needs another review; ratings are stored locally.",`
<div class="panel"><div class="between"><div><span class="tag">Card ${flashIndex+1} of ${flashDeck.length}</span><span class="muted small" id="flashRating"></span></div><label><input type="checkbox" id="hideKnown"> Hide Easy cards</label></div><div class="flash" id="flashFace" tabindex="0" role="button" aria-label="Flip flashcard"></div><div class="row"><button id="flip">Flip card</button><button id="fPrev">Previous</button><button id="fNext">Next</button><button id="replay">Replay all</button><button id="shuffle">Shuffle</button></div><div class="rule"></div><div class="row"><b>Rate:</b><button data-rate="Again">Again</button><button data-rate="Hard">Hard</button><button data-rate="Good">Good</button><button data-rate="Easy">Easy</button></div></div>`);flashDeck=cards.filter((c)=>!($("#hideKnown")?.checked&&state.ratings[c[0]]==="Easy"));drawFlash();$("#flip").onclick=flipFlash;$("#flashFace").onclick=flipFlash;$("#flashFace").onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();flipFlash()}};$("#fPrev").onclick=()=>{flashIndex=(flashIndex+flashDeck.length-1)%flashDeck.length;flashBack=false;drawFlash()};$("#fNext").onclick=()=>{flashIndex=(flashIndex+1)%flashDeck.length;flashBack=false;drawFlash()};$("#replay").onclick=()=>{flashDeck=cards.slice();flashIndex=0;flashBack=false;drawFlash()};$("#shuffle").onclick=()=>{flashDeck=cards.slice().sort(()=>Math.random()-.5);flashIndex=0;flashBack=false;drawFlash()};$("#hideKnown").onchange=()=>{flashDeck=cards.filter(c=>!($("#hideKnown").checked&&state.ratings[c[0]]==="Easy"));flashIndex=0;drawFlash()};document.querySelectorAll("[data-rate]").forEach(b=>b.onclick=()=>{state.ratings[flashDeck[flashIndex][0]]=b.dataset.rate;save();flashIndex=(flashIndex+1)%flashDeck.length;flashBack=false;drawFlash()})}
function drawFlash(){if(!flashDeck.length){$("#flashFace").textContent="No cards in this view.";return}let c=flashDeck[flashIndex];$("#flashFace").innerHTML=flashBack?`${esc(c[1])}<small>Answer · click to flip back</small>`:`${esc(c[0])}<small>Question · click to reveal</small>`;$("#flashRating").textContent=state.ratings[c[0]]?"· "+state.ratings[c[0]]:""}
function flipFlash(){flashBack=!flashBack;drawFlash()}
function tutor(){shell("Personal tutor","Choose a specific issue, read a focused explanation and test your understanding. Tutor lessons run offline and use rule-based feedback.",`
<div class="panel"><label>Choose a topic <select id="tTopic">${modules.map(m=>`<option>${m.name}</option>`).join("")}</select></label><label>Choose an issue <select id="tIssue"></select></label><button class="primary" id="confirmIssue">Confirm issue</button><div id="tutorLesson"></div></div>`);function fill(){let m=modules.find(x=>x.name===$("#tTopic").value);let relevant=tutorIssues.filter((x,i)=>{let s=(x[0]+x[1]).toLowerCase();return m.id==="movement"?/source|peel/.test(s):m.id==="wwi"?/cause|gallipoli|trench/.test(s):m.id==="china"?/opium|boxer|date/.test(s):/civil|significance|peel/.test(s)});$("#tIssue").innerHTML=relevant.map(x=>`<option value="${tutorIssues.indexOf(x)}">${x[0]}</option>`).join("")}$("#tTopic").onchange=fill;fill();$("#confirmIssue").onclick=()=>{let x=tutorIssues[+$("#tIssue").value];$("#tutorLesson").innerHTML=`<div class="rule"></div><h2>${esc(x[0])}</h2><p>${esc(x[1])}</p><div class="stimulus"><b>Worked example</b><p>${esc(x[2])}</p></div><p><b>Common trap:</b> ${esc(x[3])}</p><h3>Quick check</h3><p>${esc(x[4])}</p><textarea class="field" id="tAnswer" placeholder="Write your answer...">${esc(state.tutor[x[0]]||"")}</textarea><button class="primary" id="tCheck">Check response</button><div id="tFeedback"></div>`;$("#tAnswer").oninput=e=>{state.tutor[x[0]]=e.target.value;save()};$("#tCheck").onclick=()=>{let a=$("#tAnswer").value.trim();$("#tFeedback").innerHTML=`<div class="feedback ${a.length>15?'good':'bad'}">${a.length>15?'Response recorded. Compare your answer with this key point:':'Add a little more detail, then compare with the key point.'} ${esc(x[5])}</div>`}}}
function corrections(){let ids=state.corrections.filter(i=>questions[i]);shell("Corrections","Missed practice questions stay here until you retry them correctly or mark them corrected.",ids.length?`<div class="panel">${ids.map(i=>{let q=questions[i];return `<div class="panel"><h3>${esc(q[3])}</h3><p class="muted small">${esc(q[1])}</p><p><b>Model answer:</b> ${esc(q[4+q[8]])}</p><p>${esc(q[9])}</p><button onclick="retryCorrection(${i})">Retry in practice</button><button onclick="markCorrected(${i})">Mark corrected</button></div>`}).join("")}</div>`:`<div class="panel"><h2>No open corrections</h2><p>Incorrect practice items will appear here automatically.</p></div>`)}
function retryCorrection(i){filtered=[i];practiceIndex=0;go("Practice")}
function markCorrected(i){state.corrections=state.corrections.filter(x=>x!==i);save();corrections()}
function results(){let done=Object.values(state.practice);shell("Results","Your practice history and mock exam results are kept separate. Only attempted practice questions contribute to practice accuracy.",`
<div class="grid">${statCard(done.length,"Practice attempted","Unique questions with a saved latest attempt")}${statCard(accuracy()+"%","Latest accuracy","Correct latest responses / attempted")}${statCard(state.corrections.length,"Open corrections","Questions to retry or mark corrected")}</div><div class="panel"><h2>Module performance</h2>${modules.map(m=>{let ids=questions.map((q,i)=>q[0]===m.id?i:-1).filter(i=>i>=0),a=ids.filter(i=>state.practice[i]),n=a.length,acc=n?Math.round(a.filter(i=>state.practice[i].correct).length/n*100):0;return `<p class="between"><b>${m.name}</b><span>${n}/${ids.length} attempted · ${n?acc+"%":"—"}</span></p><div class="bar"><span style="width:${acc}%"></span></div>`}).join("")}</div><div class="panel"><h2>Mock history</h2>${state.examHistory.length?state.examHistory.map((e,i)=>{let score=e.ids.reduce((s,id,j)=>s+(e.answers[j]===questions[id][8]?1:0),0);return `<p>Mock ${e.mock} · Section I: <b>${score}/30</b> · ${new Date(e.submitted).toLocaleString()}</p>`}).join(""):"No submitted mocks yet."}</div>`)}
function backup(){shell("Import & Backup","Export a portable progress backup or restore a previous backup. This studio's core assessment content is bundled in the HTML; no network connection is required.",`
<div class="panel"><h2>Export progress backup</h2><p>Includes practice attempts, Cornell notes, flashcard ratings, corrections, tutor notes and mock history.</p><button class="primary" onclick="exportBackup()">Download backup JSON</button></div><div class="panel"><h2>Restore progress backup</h2><p>Restore replaces current saved progress. Validate the file before committing.</p><input type="file" id="backupFile" accept=".json,application/json"><button id="restoreBtn">Validate and restore</button><div id="restoreStatus"></div></div><div class="panel"><h2>Import question pack</h2><p>Custom question packs use JSON. Supported schema: <code>{"version":1,"name":"Pack name","questions":[{"module":"movement","topic":"Topic","difficulty":"recall","stem":"Question","options":["A","B","C","D"],"answer":0,"explanation":"Why"}]}</code></p><textarea class="field answer" id="packText" placeholder="Paste a JSON question pack..."></textarea><button id="importPack">Validate and import</button><div id="packStatus"></div></div><div class="panel"><h2>Reset all data</h2><p>Reset practice results, notes, ratings, corrections, tutor progress and exam history to a fresh copy. Bundled content is retained.</p><button onclick="resetAll()">Reset all saved data</button></div><div class="notice">Storage is local to this browser and this file's origin. If you move to another browser or computer, export a backup first. Large embedded image/table import packs are not part of this History studio's content pack; the uploaded materials were PDFs and are represented through source-aligned notes and original practice stimuli.</div>`);$("#restoreBtn").onclick=restoreBackup;$("#importPack").onclick=importPack}
function exportBackup(){let blob=new Blob([JSON.stringify({app:"y9-history-at4",version:1,exported:new Date().toISOString(),state},null,2)],{type:"application/json"});download(blob,"year9-history-at4-backup.json")}
function download(blob,name){let a=document.createElement("a"),u=URL.createObjectURL(blob);a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function restoreBackup(){let f=$("#backupFile").files[0];if(!f){$("#restoreStatus").textContent="Choose a backup file first.";return}if(f.size>5e6){$("#restoreStatus").textContent="File exceeds the 5 MB limit.";return}let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(x.app!=="y9-history-at4"||x.version!==1||!x.state||x.state.version!==1)throw Error("Unsupported backup format.");if(!confirm("Replace all current saved progress with this backup?"))return;state=Object.assign(fresh(),x.state);save();$("#restoreStatus").textContent="Backup restored.";render()}catch(e){$("#restoreStatus").textContent="Restore rejected: "+e.message}};r.readAsText(f)}
function importPack(){let raw=$("#packText").value;try{let x=JSON.parse(raw);if(x.version!==1||!Array.isArray(x.questions)||x.questions.length>300)throw Error("Expected version 1 pack with up to 300 questions.");let accepted=[];x.questions.forEach((q,i)=>{if(!q||!modules.some(m=>m.id===q.module)||typeof q.stem!=="string"||q.stem.length>1200||!Array.isArray(q.options)||q.options.length!==4||q.options.some(o=>typeof o!=="string"||o.length>400)||!Number.isInteger(q.answer)||q.answer<0||q.answer>3)throw Error("Question "+(i+1)+" has an invalid module, stem, options or answer.");accepted.push([q.module,q.topic||"Imported",q.difficulty||"application",q.stem,...q.options,q.answer,q.explanation||"Review the evidence and explanation supplied by the pack."])});if(!accepted.length)throw Error("No questions found.");if(!confirm(`Import ${accepted.length} questions from "${x.name||"Untitled pack"}"?`))return;let start=questions.length;accepted.forEach(q=>questions.push(q));state.imports.push({name:x.name||"Untitled pack",count:accepted.length,at:Date.now(),start});save();$("#packStatus").textContent=`Imported ${accepted.length} questions. They are available in Practice.`}catch(e){$("#packStatus").textContent="Import rejected; nothing was changed. "+e.message}}
function resetAll(){if(!confirm("Reset ALL saved data? This deletes attempts, notes, ratings, corrections, tutor progress and exam history. Bundled course content remains."))return;state=fresh();save();go("Dashboard")}
nav();render();
</script></body></html>
